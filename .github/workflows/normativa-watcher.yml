name: 📰 Normativa Watcher (rassegna quotidiana + digest settimanale)

# Legge ogni giorno le FONTI PRIMARIE (albo pretorio di Genzano di Roma,
# Gazzetta Ufficiale, Normattiva, BURL Lazio, notizie del Consiglio
# regionale del Lazio) e, dal 13/10/2026, le immagini satellitari del giorno
# di EU Space (Copernicus, Commissione europea); il lunedì aggiunge la
# rassegna stampa (Google News, feed, DPC via Firecrawl). Apre una issue con
# gli atti a rilevanza diretta/indiretta: la Routine "Rassegna normativa e
# albo pretorio" (rule 10) la lavora e pubblica gli articoli fino a live.
# Dedup stateless: gli URL già comparsi nelle issue `normativa-watcher`
# vengono scartati (`--dedup-issues`), niente file di stato da committare.

on:
  schedule:
    # Ogni giorno 05:30 UTC (07:30 italiane). Lo scheduler GitHub può
    # ritardare di ore: la Routine CCR non dipende da questo run (esegue
    # lo script da sola alle 06:00 UTC) — questo è il registro e la rete
    # di sicurezza.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Finestra in giorni (default: 2; 7 per la rassegna settimanale)'
        required: false
        default: ''
      fonti:
        description: 'primarie | news | tutte | eu-space (default: primarie nei giorni feriali, tutte il lunedì)'
        required: false
        default: ''

permissions:
  issues: write
  contents: read

concurrency:
  group: normativa-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install feedparser

      - name: Decidi finestra e fonti
        id: piano
        run: |
          DAYS="${{ inputs.days }}"
          FONTI="${{ inputs.fonti }}"
          if [ "$(date -u +%u)" = "1" ]; then
            [ -z "$DAYS" ] && DAYS=7
            [ -z "$FONTI" ] && FONTI=tutte
          else
            [ -z "$DAYS" ] && DAYS=2
            [ -z "$FONTI" ] && FONTI=primarie
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "fonti=$FONTI" >> "$GITHUB_OUTPUT"
          echo "[info] finestra=$DAYS giorni, fonti=$FONTI"

      - name: Esegui la rassegna
        id: sweep
        env:
          # Se il secret FIRECRAWL_API_KEY è settato, lo script aggiunge il DPC
          # (home + Area stampa) alle fonti news (rule 08 § Firecrawl MCP).
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/normativa-watcher.py \
            --days "${{ steps.piano.outputs.days }}" \
            --fonti "${{ steps.piano.outputs.fonti }}" \
            --dedup-issues \
            --out novita.json --issue-body issue_body.md
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('novita.json'))
          print(f"totale={d['totale']}")
          print(f"primarie={d['totale_primarie']}")
          print(f"immagini={d.get('totale_immagini', 0)}")
          print(f"dirette={d['totale_dirette']}")
          print(f"errori={len(d['errori'])}")
          print(f"errori_news={len(d.get('errori_news', []))}")
          PY
          echo "[info] voci: $(python3 -c "import json; print(json.load(open('novita.json'))['totale'])")"

      - name: Crea label se mancanti
        if: steps.sweep.outputs.totale != '0' || steps.sweep.outputs.errori != '0' || steps.sweep.outputs.errori_news != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create normativa-watcher --color 0E8A16 --description "Rassegna normativa, albo pretorio, GU, BURL" 2>/dev/null || true
          gh label create automazione --color FBCA04 --description "Generato da workflow automatico" 2>/dev/null || true

      - name: Apri issue (se ci sono voci nuove)
        if: steps.sweep.outputs.totale != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(TZ=Europe/Rome date +"%d/%m/%Y")
          case "${{ steps.sweep.outputs.immagini }}" in
            0|"") IMMAGINI="" ;;
            1) IMMAGINI=", 1 immagine EU Space" ;;
            *) IMMAGINI=", ${{ steps.sweep.outputs.immagini }} immagini EU Space" ;;
          esac
          if [ "${{ steps.piano.outputs.fonti }}" = "primarie" ]; then
            TITOLO="Rassegna normativa e albo pretorio — $DATA (${{ steps.sweep.outputs.primarie }} atti${IMMAGINI}, ${{ steps.sweep.outputs.dirette }} diretti)"
          else
            TITOLO="Novità normative PC — settimana al $DATA (${{ steps.sweep.outputs.totale }} voci, ${{ steps.sweep.outputs.dirette }} dirette)"
          fi
          gh issue create \
            --title "$TITOLO" \
            --body-file issue_body.md \
            --label "normativa-watcher,automazione"

      # Una fonte che non risponde va riparata, non ignorata (istruzione
      # dell'utente del 17/10/2026): due issue `fonte-rotta` in-place, una per
      # le fonti primarie (lette ogni giorno) e una per la rassegna stampa
      # (letta il lunedì), così un giro di sole primarie non chiude per errore
      # la segnalazione di Google News. Si chiudono da sole al primo giro che
      # rilegge tutte le fonti del loro gruppo; l'ultimo step rende rosso il run.
      - name: Segnala fonti irraggiungibili (issue in-place)
        if: always() && steps.sweep.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FONTI: ${{ steps.piano.outputs.fonti }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create fonte-rotta --color B60205 --description "Una fonte esterna non risponde: da riparare" 2>/dev/null || true
          gestisci () {
            # $1 = chiave nel JSON, $2 = titolo, $3 = 1 se il giro ha letto quel gruppo
            local chiave="$1" titolo="$2" letto="$3" n
            n=$(gh issue list --state open --limit 100 --json number,title \
                  --jq ".[] | select(.title == \"$titolo\") | .number" | head -n 1)
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('novita.json')).get('$chiave') else 1)"; then
              python3 - "$chiave" > /tmp/fonti-body.md <<'PYB'
          import json, os, sys
          d = json.load(open('novita.json'))
          print('Fonti in errore nel run del ' + d['generato_il'][:16] + ' UTC:\n')
          print('- ' + '\n- '.join(d[sys.argv[1]]) + '\n')
          print("Se l'errore persiste la struttura o l'indirizzo della fonte è probabilmente cambiato: "
                "riprodurlo con `python3 scripts/normativa-watcher.py --days 2 --fonti " + os.environ['FONTI'] + "`, "
                "trovare il nuovo indirizzo sul sito dell'ente, verificarlo con una richiesta reale e aggiornare "
                "il parser o l'elenco in `scripts/normativa-watcher.py` (rule 10 § Normativa watcher). "
                "Questa issue si chiude da sola al primo giro che rilegge tutte queste fonti.\n")
          print('Run: ' + os.environ['RUN_URL'])
          PYB
              if [ -n "$n" ]; then
                gh issue edit "$n" --add-label fonte-rotta
                gh issue comment "$n" --body-file /tmp/fonti-body.md
              else
                gh issue create --title "$titolo" --body-file /tmp/fonti-body.md --label "normativa-watcher,automazione,fonte-rotta"
              fi
            elif [ -n "$n" ] && [ "$letto" = "1" ]; then
              gh issue close "$n" --comment "Tutte le fonti rispondono di nuovo (run ${{ github.run_id }})."
            fi
          }
          case "$FONTI" in primarie|tutte) P=1 ;; *) P=0 ;; esac
          case "$FONTI" in news|tutte) N=1 ;; *) N=0 ;; esac
          gestisci errori "⚠️ Normativa watcher: una o più fonti primarie non rispondono" "$P"
          gestisci errori_news "⚠️ Normativa watcher: una o più fonti della rassegna stampa non rispondono" "$N"

      - name: Log silenzioso (se zero voci)
        if: steps.sweep.outputs.totale == '0'
        run: echo "[info] Nessuna voce nuova nella finestra. Niente issue creata."

      - name: Upload risultato come artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: normativa-watcher-results
          path: |
            novita.json
            issue_body.md
          retention-days: 14

      - name: Run rosso se una fonte non risponde
        if: steps.sweep.outputs.errori != '0' || steps.sweep.outputs.errori_news != '0'
        run: |
          echo "::error::Fonti in errore: ${{ steps.sweep.outputs.errori }} primarie/EU Space, ${{ steps.sweep.outputs.errori_news }} della rassegna stampa. Elenco nella issue fonte-rotta e in novita.json."
          exit 1
