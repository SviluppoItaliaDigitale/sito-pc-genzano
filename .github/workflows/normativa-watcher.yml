name: 📰 Normativa Watcher (rassegna quotidiana + digest settimanale)

# Legge ogni giorno le FONTI PRIMARIE (albo pretorio di Genzano di Roma,
# Gazzetta Ufficiale, Normattiva, BURL Lazio) e il lunedì aggiunge la
# rassegna stampa (Google News, feed, DPC via Firecrawl). Apre una issue con
# gli atti a rilevanza diretta/indiretta: la Routine "Rassegna normativa e
# albo pretorio" (rule 10) la lavora e pubblica gli articoli fino a live.
# Dedup stateless: gli URL già comparsi nelle issue `normativa-watcher`
# vengono scartati (`--dedup-issues`), niente file di stato da committare.

on:
  schedule:
    # Ogni giorno 05:30 UTC (07:30 italiane). Lo scheduler GitHub può
    # ritardare di ore: la Routine CCR non dipende da questo run (esegue
    # lo script da sola alle 06:00 UTC) — questo è il registro e la rete
    # di sicurezza.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Finestra in giorni (default: 2; 7 per la rassegna settimanale)'
        required: false
        default: ''
      fonti:
        description: 'primarie | news | tutte (default: primarie nei giorni feriali, tutte il lunedì)'
        required: false
        default: ''

permissions:
  issues: write
  contents: read

concurrency:
  group: normativa-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install feedparser

      - name: Decidi finestra e fonti
        id: piano
        run: |
          DAYS="${{ inputs.days }}"
          FONTI="${{ inputs.fonti }}"
          if [ "$(date -u +%u)" = "1" ]; then
            [ -z "$DAYS" ] && DAYS=7
            [ -z "$FONTI" ] && FONTI=tutte
          else
            [ -z "$DAYS" ] && DAYS=2
            [ -z "$FONTI" ] && FONTI=primarie
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "fonti=$FONTI" >> "$GITHUB_OUTPUT"
          echo "[info] finestra=$DAYS giorni, fonti=$FONTI"

      - name: Esegui la rassegna
        id: sweep
        env:
          # Se il secret FIRECRAWL_API_KEY è settato, lo script aggiunge il DPC
          # (home + Area stampa) alle fonti news (rule 08 § Firecrawl MCP).
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/normativa-watcher.py \
            --days "${{ steps.piano.outputs.days }}" \
            --fonti "${{ steps.piano.outputs.fonti }}" \
            --dedup-issues \
            --out novita.json --issue-body issue_body.md
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('novita.json'))
          print(f"totale={d['totale']}")
          print(f"primarie={d['totale_primarie']}")
          print(f"dirette={d['totale_dirette']}")
          print(f"errori={len(d['errori'])}")
          PY
          echo "[info] voci: $(python3 -c "import json; print(json.load(open('novita.json'))['totale'])")"

      - name: Crea label se mancanti
        if: steps.sweep.outputs.totale != '0' || steps.sweep.outputs.errori != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create normativa-watcher --color 0E8A16 --description "Rassegna normativa, albo pretorio, GU, BURL" 2>/dev/null || true
          gh label create automazione --color FBCA04 --description "Generato da workflow automatico" 2>/dev/null || true

      - name: Apri issue (se ci sono voci nuove)
        if: steps.sweep.outputs.totale != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(TZ=Europe/Rome date +"%d/%m/%Y")
          if [ "${{ steps.piano.outputs.fonti }}" = "primarie" ]; then
            TITOLO="Rassegna normativa e albo pretorio — $DATA (${{ steps.sweep.outputs.primarie }} atti, ${{ steps.sweep.outputs.dirette }} diretti)"
          else
            TITOLO="Novità normative PC — settimana al $DATA (${{ steps.sweep.outputs.totale }} voci, ${{ steps.sweep.outputs.dirette }} dirette)"
          fi
          gh issue create \
            --title "$TITOLO" \
            --body-file issue_body.md \
            --label "normativa-watcher,automazione"

      - name: Segnala fonti irraggiungibili (issue in-place)
        if: steps.sweep.outputs.errori != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITOLO="⚠️ Normativa watcher: una o più fonti primarie non rispondono"
          CORPO=$(python3 -c "import json; d=json.load(open('novita.json')); print('Fonti in errore nel run del ' + d['generato_il'][:16] + ' UTC:\n\n- ' + '\n- '.join(d['errori']) + '\n\nSe l\'errore persiste per più giorni la struttura della pagina è probabilmente cambiata: aggiornare il parser in \`scripts/normativa-watcher.py\` (rule 10 § Normativa watcher). Questa issue si chiude da sola al primo run senza errori.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')")
          N=$(gh issue list --search "in:title \"$TITOLO\"" --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$CORPO"
          else
            gh issue create --title "$TITOLO" --body "$CORPO" --label "normativa-watcher,automazione"
          fi

      - name: Chiudi la segnalazione fonti se tutto risponde
        if: steps.sweep.outputs.errori == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITOLO="⚠️ Normativa watcher: una o più fonti primarie non rispondono"
          N=$(gh issue list --search "in:title \"$TITOLO\"" --state open --json number --jq '.[0].number // empty')
          [ -n "$N" ] && gh issue close "$N" --comment "Tutte le fonti primarie rispondono di nuovo (run ${{ github.run_id }})." || true

      - name: Log silenzioso (se zero voci)
        if: steps.sweep.outputs.totale == '0'
        run: echo "[info] Nessuna voce nuova nella finestra. Niente issue creata."

      - name: Upload risultato come artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: normativa-watcher-results
          path: |
            novita.json
            issue_body.md
          retention-days: 14
