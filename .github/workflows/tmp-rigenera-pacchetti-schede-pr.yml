name: "TEMP Rigenera pacchetti schede revisione"

on:
  push:
    branches:
      - chatgpt/revisione-disegni-didattica-20261007
    paths:
      - 'static/formazione/schede-stampabili/**'
      - '.github/workflows/tmp-rigenera-pacchetti-schede-pr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rigenera:
    if: "!contains(github.event.head_commit.message, '[skip-temp-pacchetti]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rigenera Stampa tutto
        run: python3 scripts/genera-pacchetti-schede.py
      - name: Rigenera ZIP kit scolastici
        run: python3 scripts/genera-pacchetti-kit.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/formazione/schede-stampabili/pacchetti/ static/formazione/pacchetti/ content/formazione/kit-scuola-*.md
          if git diff --staged --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "chore: rigenera pacchetti didattici revisione [skip-temp-pacchetti]"
            git push origin HEAD:chatgpt/revisione-disegni-didattica-20261007
          fi
