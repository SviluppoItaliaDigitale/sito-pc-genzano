name: Controllo settimanale delle copie

# Cerca le riprese dei nostri articoli fuori dal sito, in tre modi:
#   (1) feed RSS delle testate locali (Castelli Romani, Roma, litorale e
#       Pontino): notizie degli ultimi 14 giorni confrontate per frammenti di
#       8 parole con i nostri articoli degli ultimi 30;
#   (2) feed RSS di Google News: ricerca della frase esatta per due frasi
#       caratteristiche di ogni articolo degli ultimi 14 giorni;
#   (3) link di ricerca esatta su Google, Bing e DuckDuckGo, da aprire a mano.
# Logica, testate e filtri in scripts/controllo-copie.py.
#
# Apre o aggiorna UNA sola issue in-place (titolo stabile): il corpo si
# riscrive a ogni giro, così l'issue dice sempre lo stato della settimana e
# non accumula commenti. Non tocca il sito, non fa deploy.
# Dal 17/10/2026 i feed delle testate che non rispondono (e Google News, se
# nessuna ricerca va a buon fine) non restano in un riquadro chiuso: stanno in
# testa alla issue, finiscono in una issue `fonte-rotta` separata che si
# chiude da sola quando rispondono di nuovo, e il run diventa rosso
# (istruzione dell'utente: «gli errori 404 e simili non devono mai essere
# ignorati»).
#
# Scaglionato lunedì 07:47 UTC (fuori dagli altri controlli del lunedì).

on:
  schedule:
    - cron: '47 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controllo-copie:
    runs-on: ubuntu-latest
    # Limiti interni allo script: 45 s di feed per testata (16 testate), 15
    # minuti di pagine, 60 ricerche su Google News a 3 s l'una. 40 minuti
    # lasciano margine.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cerca le copie degli articoli recenti
        env:
          TZ: Europe/Rome
        # Lo script esce con 0 anche se una fonte non risponde: le fonti
        # rotte le elenca in /tmp/fonti-ko.md, e i passi sotto le trattano.
        id: copie
        run: |
          set -euo pipefail
          rm -f /tmp/fonti-ko.md
          python3 scripts/controllo-copie.py --issue-body /tmp/controllo-copie.md --fonti-ko /tmp/fonti-ko.md
          [ -s /tmp/fonti-ko.md ] && echo "fonti_ko=true" >> "$GITHUB_OUTPUT" || echo "fonti_ko=false" >> "$GITHUB_OUTPUT"

      - name: Apri o aggiorna l'issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Controllo settimanale delle copie degli articoli"
          # Label garantita (idempotente): senza, gh issue create fallisce
          # con "could not add label" e il job muore (audit 10/06/2026).
          gh label create "automazione" --color "ededed" \
            --description "Aperta da un workflow" 2>/dev/null || true
          gh label create "copie" --color "5319E7" \
            --description "Riprese dei nostri articoli fuori dal sito" 2>/dev/null || true
          EXISTING=$(gh issue list --label "automazione" --label "copie" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/controllo-copie.md
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/controllo-copie.md \
              --label "automazione" \
              --label "copie"
          fi

      - name: Issue per le fonti che non rispondono
        # La issue `fonte-rotta` la prende in carico la routine giornaliera
        # delle issue automatiche (rule 10): una testata che ha cambiato
        # indirizzo del feed si ripara, non si annota.
        if: always() && steps.copie.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FONTI_KO: ${{ steps.copie.outputs.fonti_ko }}
        run: |
          set -euo pipefail
          TITLE="Controllo copie: una o più fonti non rispondono"
          # Per titolo e senza la label `copie`: la issue principale si cerca
          # per automazione+copie e non deve trovare questa.
          EXISTING=$(gh issue list --label "fonte-rotta" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ "$FONTI_KO" = "true" ]; then
            {
              echo "Il controllo settimanale delle copie ($(date -u +%d/%m/%Y)) non ha potuto leggere queste fonti:"
              echo ""
              cat /tmp/fonti-ko.md
              echo ""
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              echo "## Che cosa fare"
              echo ""
              echo "1. Aprire il sito della testata e cercare il nuovo indirizzo del feed RSS (link \`rel=alternate\` nella pagina, oppure \`/feed/\` sui siti WordPress); verificarlo con una richiesta reale."
              echo "2. Aggiornare l'indirizzo in \`TESTATE\` di \`scripts/controllo-copie.py\`; se la testata ha chiuso o non ha più un feed, toglierla scrivendo il motivo nel commento dell'elenco."
              echo "3. Per Google News: riprodurre con \`python3 scripts/controllo-copie.py --dry-run\` e controllare l'indirizzo \`GOOGLE_NEWS\`."
              echo "4. Rilanciare il workflow: questa issue si chiude da sola al primo giro in cui tutte le fonti rispondono."
            } > /tmp/fonti-body.md
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file /tmp/fonti-body.md
            else
              gh label create "fonte-rotta" --color "B60205" \
                --description "Una fonte esterna non risponde: da riparare" 2>/dev/null || true
              gh issue create --title "$TITLE" --body-file /tmp/fonti-body.md \
                --label "automazione" --label "fonte-rotta"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Tutte le fonti rispondono di nuovo (run ${{ github.run_id }})."
          fi

      - name: Run rosso se una fonte non risponde
        if: steps.copie.outputs.fonti_ko == 'true'
        run: |
          echo "::error::Una o più fonti del controllo copie non hanno risposto: il controllo è incompleto (issue fonte-rotta aperta o aggiornata)."
          cat /tmp/fonti-ko.md
          exit 1
