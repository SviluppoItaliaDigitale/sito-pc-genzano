name: "🗺️ Mappe meteo professionali (Italia)"

# Elabora carte sinottiche da dati aperti (NOAA GFS, ECMWF IFS e AIFS Open Data,
# DWD ICON-EU) e le pubblica sul ramo orfano `mappe-meteo-dati`, con un solo
# commit e la storia azzerata a ogni giro. La pagina /mappe-meteo-professionali/
# legge il manifesto da raw.githubusercontent.com.
#
# Le immagini NON vanno su main: un push su main farebbe ripartire il deploy del
# sito (GitHub Pages e Aruba) e gonfierebbe il repository. Il ramo dati non è
# `main`, quindi deploy.yml (on: push: branches: [main]) non parte.
#
# A ogni giro si rielaborano solo i modelli con una corsa nuova; gli altri
# restano quelli già pubblicati.

on:
  schedule:
    # Orari UTC, minuto 52 (fuori dai quarti d'ora canonici). Ogni orario
    # aspetta che la corsa sia completa fino a +120 ore:
    #   04:52 GFS 00 e ICON-EU 00   · 08:52 ECMWF IFS e AIFS 00
    #   10:52 GFS 06                · 16:52 GFS 12, ICON-EU 12 e AIFS 12
    #   20:52 ECMWF IFS 12          · 22:52 GFS 18
    - cron: "52 4,8,10,16,20,22 * * *"
  workflow_dispatch:
    inputs:
      modelli:
        description: "Modelli (virgola): gfs, ecmwf, ecmwf-aifs, icon-eu, oppure tutti"
        required: false
        default: "tutti"
      forza:
        description: "Rielabora anche le corse già pubblicate (si/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: "mappe-meteo-professionali"
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      TQDM_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🐍 Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-mappe-meteo-pro.txt

      - name: "📦 Librerie di sistema (ecCodes, ffmpeg)"
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev ffmpeg

      - name: "📦 Dipendenze Python"
        timeout-minutes: 10
        run: pip install --quiet -r scripts/requirements-mappe-meteo-pro.txt

      - name: "♻️ Cache coste Natural Earth (Cartopy)"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-50m-mappe-pro

      - name: "📥 Carte già pubblicate (ramo mappe-meteo-dati)"
        run: |
          set -euo pipefail
          DATI="$RUNNER_TEMP/mappe-meteo-dati"
          if git ls-remote --exit-code --heads origin mappe-meteo-dati >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch mappe-meteo-dati \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$DATI"
            rm -rf "$DATI/.git"
          else
            mkdir -p "$DATI"
            echo "Ramo dati ancora assente: verrà creato."
          fi

      - name: "🗺️ Genera e pubblica le carte"
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODELLI: ${{ github.event.inputs.modelli }}
          INPUT_FORZA: ${{ github.event.inputs.forza }}
        run: |
          set -euo pipefail
          MODELLI="${INPUT_MODELLI:-tutti}"
          EXTRA=""
          if [ "${INPUT_FORZA:-no}" = "si" ]; then EXTRA="--forza"; fi
          python3 scripts/genera-mappe-meteo-professionali.py \
            --modelli "$MODELLI" \
            --domini tutti \
            --ore standard \
            --cache "$RUNNER_TEMP/mappe-meteo-cache" \
            --uscita "$RUNNER_TEMP/mappe-meteo-dati" \
            --repo "$GITHUB_WORKSPACE" \
            --svuota-cache \
            --pubblica $EXTRA

      - name: "✅ Verifica il manifesto"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, sys
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "mappe-meteo-dati" / "manifesto.json"
          if not p.is_file():
              sys.exit("Manifesto assente")
          d = json.loads(p.read_text())
          for mid, m in d.get("modelli", {}).items():
              n = sum(len(x.get("prodotti", {})) for x in m.get("domini", {}).values())
              print(f"{mid}: corsa {m.get('corsa')}, {n} carte animate")
          sys.exit(0 if d.get("modelli") else 1)
          PYEOF
