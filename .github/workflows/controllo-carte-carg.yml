name: "🗺️ Controllo carte geologiche CARG"

# Ogni lunedì confronta le copie dei PDF ISPRA in static/manuali/carg/
# (carte e note illustrative dei fogli 374, 375, 387, 388 dei Castelli
# Romani) con i record dell'archivio aperto dell'ISPRA: nuova versione del
# record o checksum del file diverso = la nostra copia è vecchia. Apre o
# aggiorna 1 issue in-place che si chiude da sola quando le copie tornano
# allineate. Non scarica né modifica nulla: la sostituzione si fa in
# sessione. Nasce il 01/10/2026 con la pubblicazione delle copie, su
# richiesta dell'utente («c'è qualcuno che controlla se aggiornano le
# cartine?»).

on:
  schedule:
    - cron: "12 7 * * 1"   # lunedì 07:12 UTC (09:12 italiane), fuori dal minuto 0
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "controllo-carte-carg"
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🗺️ Confronta le copie con l'archivio ISPRA"
        id: check
        run: |
          set -uo pipefail
          set +e
          python3 scripts/check-carte-carg.py --issue-body /tmp/corpo.md | tee /tmp/esito.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "### Controllo carte CARG"
            echo '```'
            cat /tmp/esito.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🚨 Apri/aggiorna issue se una copia è vecchia"
        if: ${{ steps.check.outputs.rc != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="🗺️ Carte geologiche CARG: l'ISPRA ha aggiornato un foglio copiato sul sito"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          BODY=$(printf '_Rilevato il %s UTC da controllo-carte-carg.yml. Issue unica, si chiude da sola quando le copie tornano allineate._\n\n%s\n[Log del run](%s)\n' "$(date -u +%Y-%m-%d\ %H:%M)" "$(cat /tmp/corpo.md)" "$RUN_URL")
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body "$BODY"
            echo "Issue #$NUM aggiornata."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label automazione --label documenti
            echo "Issue creata."
          fi

      - name: "✅ Chiudi l'issue se tutto è allineato"
        if: ${{ steps.check.outputs.rc == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="🗺️ Carte geologiche CARG: l'ISPRA ha aggiornato un foglio copiato sul sito"
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" \
              --comment "Controllo del $(date -u +%Y-%m-%d\ %H:%M) UTC: le copie in static/manuali/carg/ coincidono di nuovo con l'archivio ISPRA."
            echo "Issue #$NUM chiusa."
          else
            echo "Copie allineate, nessuna issue aperta."
          fi
