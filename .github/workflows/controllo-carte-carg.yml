name: "🗺️ Controllo carte geologiche CARG"

# Ogni lunedì confronta le copie dei PDF ISPRA in static/manuali/carg/
# (carte e note illustrative dei fogli 374, 375, 387, 388 dei Castelli
# Romani) con i record dell'archivio aperto dell'ISPRA: nuova versione del
# record o checksum del file diverso = la nostra copia è vecchia. Apre o
# aggiorna 1 issue in-place che si chiude da sola quando le copie tornano
# allineate. Cerca anche le carte NUOVE della nostra zona (fogli 374, 375,
# 387, 388 o luoghi dei Castelli nel titolo) non ancora note allo script. Non scarica né modifica nulla: la sostituzione si fa in
# sessione. Un record o una ricerca che non rispondono non sono una carta
# cambiata: finiscono nella issue `fonte-rotta`, che si chiude da sola
# quando l'archivio torna a rispondere, e il run diventa rosso. Fino al
# 17/10/2026 restavano un ::warning con il run verde (istruzione
# dell'utente: «gli errori 404 e simili non devono mai essere ignorati»).
# La issue delle novità si chiude solo dopo un giro completo senza
# segnalazioni: con una fonte giù l'esito non è «tutto allineato».
# Nasce il 01/10/2026 con la pubblicazione delle copie, su
# richiesta dell'utente («c'è qualcuno che controlla se aggiornano le
# cartine?»).

on:
  schedule:
    - cron: "12 7 * * 1"   # lunedì 07:12 UTC (09:12 italiane), fuori dal minuto 0
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "controllo-carte-carg"
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🗺️ Confronta le copie con l'archivio ISPRA"
        id: check
        run: |
          set -uo pipefail
          rm -f /tmp/corpo.md /tmp/fonti-ko.md
          set +e
          python3 scripts/check-carte-carg.py --issue-body /tmp/corpo.md --fonti-ko /tmp/fonti-ko.md | tee /tmp/esito.txt
          RC=${PIPESTATUS[0]}
          set -e
          # 0 = tutto letto e allineato, 1 = segnalazioni e/o fonti ko; altro = lo script si è fermato.
          if [ "$RC" -gt 1 ]; then
            echo "::error::check-carte-carg.py si è fermato con codice $RC: il controllo non è stato eseguito."
            exit "$RC"
          fi
          [ -s /tmp/corpo.md ] && echo "novita=true" >> "$GITHUB_OUTPUT" || echo "novita=false" >> "$GITHUB_OUTPUT"
          [ -s /tmp/fonti-ko.md ] && echo "fonti_ko=true" >> "$GITHUB_OUTPUT" || echo "fonti_ko=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Controllo carte CARG"
            echo '```'
            cat /tmp/esito.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🚨 Apri/aggiorna issue se una copia è vecchia o c'è una carta nuova"
        if: ${{ steps.check.outputs.novita == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="🗺️ Carte geologiche CARG: novità sull'archivio ISPRA per i fogli dei Castelli"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          BODY=$(printf '_Rilevato il %s UTC da controllo-carte-carg.yml. Issue unica, si chiude da sola quando le copie tornano allineate._\n\n%s\n[Log del run](%s)\n' "$(date -u +%Y-%m-%d\ %H:%M)" "$(cat /tmp/corpo.md)" "$RUN_URL")
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body "$BODY"
            echo "Issue #$NUM aggiornata."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label automazione --label documenti
            echo "Issue creata."
          fi

      - name: "✅ Chiudi l'issue se tutto è allineato"
        # Solo dopo un giro completo: con una fonte giù l'esito non è «allineato».
        if: ${{ steps.check.outcome == 'success' && steps.check.outputs.novita == 'false' && steps.check.outputs.fonti_ko == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="🗺️ Carte geologiche CARG: novità sull'archivio ISPRA per i fogli dei Castelli"
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" \
              --comment "Controllo del $(date -u +%Y-%m-%d\ %H:%M) UTC: le copie in static/manuali/carg/ coincidono di nuovo con l'archivio ISPRA."
            echo "Issue #$NUM chiusa."
          else
            echo "Copie allineate, nessuna issue aperta."
          fi

      - name: "🔌 Issue per l'archivio ISPRA che non risponde"
        # Una fonte morta va riparata, non ignorata: la issue `fonte-rotta` la
        # prende in carico la routine giornaliera delle issue automatiche.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FONTI_KO: ${{ steps.check.outputs.fonti_ko }}
          ESITO: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          TITLE="🗺️ Carte geologiche CARG: l'archivio ISPRA non risponde"
          NUM=$(gh issue list --repo "$REPO" --state open --label fonte-rotta --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ "${FONTI_KO:-}" = "true" ]; then
            {
              echo "Il controllo settimanale delle carte CARG ($(date -u +%d/%m/%Y)) non ha potuto leggere:"
              echo ""
              cat /tmp/fonti-ko.md
              echo ""
              echo "Run: ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
              echo ""
              echo "## Che cosa fare"
              echo ""
              echo "1. Riprodurre: \`python3 scripts/check-carte-carg.py\`."
              echo "2. Se l'archivio risponde 404 per un record, cercare il record sull'archivio aperto dell'ISPRA (\`openaccessrepository.it\`): se è stato spostato o sostituito, aggiornare l'id in \`FOGLI\` di \`scripts/check-carte-carg.py\`, la copia e i link nell'articolo e nell'Area Download."
              echo "3. Se è cambiata l'API (indirizzo, formato della ricerca), aggiornare \`API\`, \`API_ISPRA\` o \`RICERCHE_ZONA\` dopo averla provata con una richiesta reale."
              echo "4. Se l'archivio è giù per tutti, attendere il giro successivo: la issue si chiude da sola quando torna a rispondere."
            } > /tmp/fonti-body.md
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --repo "$REPO" --body-file /tmp/fonti-body.md
            else
              gh label create "fonte-rotta" --repo "$REPO" --color "B60205" \
                --description "Una fonte esterna non risponde: da riparare" 2>/dev/null || true
              gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/fonti-body.md \
                --label automazione --label fonte-rotta --label documenti
            fi
          elif [ -n "$NUM" ] && [ "$ESITO" = "success" ]; then
            gh issue close "$NUM" --repo "$REPO" --comment "L'archivio ISPRA risponde di nuovo per tutti i record e le ricerche (run ${{ github.run_id }})."
          fi

      - name: "❌ Run rosso se una fonte non risponde"
        if: ${{ steps.check.outputs.fonti_ko == 'true' }}
        run: |
          echo "::error::L'archivio ISPRA non ha risposto per uno o più record o ricerche: il controllo è incompleto (issue fonte-rotta aperta o aggiornata)."
          exit 1
