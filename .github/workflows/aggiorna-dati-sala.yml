# Snapshot self-hosted della Sala situazioni (/monitor/), rigenerati ogni
# 15 minuti: notizie agenzie (ANSA/Adnkronos), allerte globali GDACS e
# attivazioni Copernicus EMS. Queste fonti non espongono CORS ai browser.
# Gli script sono fail-safe (fonte giù = file invariato, exit 0) e committano
# solo se i dati cambiano davvero.
# FRESCHEZZA: la Sala situazioni legge questi JSON PRIMA da
# raw.githubusercontent.com (CORS aperto, già in CSP) — disponibili al
# commit, SENZA aspettare il deploy — con fallback sulla copia del sito.
# Freschezza effettiva ~15-20 minuti (cron 15 + cache CDN raw ~5).
name: "🖥️ Dati Sala situazioni (notizie + GDACS + EMS)"

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: aggiorna-dati-sala
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "📰🌍 Rigenera gli snapshot (fail-safe per fonte)"
        run: |
          python3 scripts/genera-notizie-agenzie.py
          python3 scripts/genera-gdacs-eventi.py
          python3 scripts/genera-ems-attivazioni.py

      - name: "💾 Commit solo se i dati sono cambiati"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/open-data/notizie-agenzie.json \
                  static/open-data/gdacs-eventi.json \
                  static/open-data/ems-attivazioni.json
          if git diff --cached --quiet; then
            echo "Snapshot invariati: nessun commit."
            exit 0
          fi
          git commit -m "[skip-dati-sala] Snapshot sala situazioni: notizie + GDACS + EMS"
          # anti non-fast-forward: altri workflow committano di frequente
          git pull --rebase origin main
          git push
