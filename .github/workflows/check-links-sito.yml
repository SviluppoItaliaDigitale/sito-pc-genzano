name: "🔗 Verifica link sito completo"

# Esegue un crawl completo del sito costruito e verifica TUTTI i link
# (interni ed esterni) per catturare drift, 404, redirect rotti.
# Complementa audit-sito.yml sezione 38 che verifica link critici normativa
# specifici con pre-pattern e messaggi dedicati. Qui invece usiamo
# lychee come catch-all completo.
#
# Gira ogni lunedì alle 10:00 UTC (dopo audit-sito delle 09:00).
# Puo essere avviato manualmente via workflow_dispatch.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔧 Setup Hugo"
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: "🏗️ Build sito produzione"
        run: hugo --minify --baseURL "https://www.protezionecivilegenzano.it/"

      - name: "💾 Restore cache lychee"
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: "🔍 Lychee link checker"
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --cache           riutilizza risultati recenti (risparmia richieste a fornitori esterni)
          # --max-cache-age   risultati validi 1 giorno
          # --accept          403 incluso (alcuni PA bloccano bot ma link funziona umani)
          # --timeout         20s per URL (PA sites sono lenti)
          # --max-retries     3 tentativi prima di dichiarare morto
          # --retry-wait-time attesa tra retry (gestisce rate-limiting)
          # --user-agent      identifichiamo chiaramente il nostro checker
          # --exclude         tel:/mailto:, anchor interni, GitHub Pages (evita self-loop)
          #                   + falsi positivi SSL/TLS del runner CI (verificati 27/07/2026,
          #                   issue #737): form.agid.gov.it (CA store runner — link OBBLIGATORIO
          #                   per la dichiarazione di accessibilità, mai rimuoverlo),
          #                   aifa.gov.it e parcocastelliromani.it (catena intermedi incompleta
          #                   lato server, i browser la risolvono via AIA), cnr.it (cifrari DHE
          #                   legacy rifiutati da OpenSSL moderno, i browser usano ECDHE).
          #                   Tutti e 4 servono regolarmente i contenuti ai browser reali.
          #                   + /pagefind/: l'indice Pagefind è generato SOLO in deploy.yml
          #                   (artefatto di build, mai committato — rule 10), quindi nella
          #                   build di questo workflow /pagefind/pagefind-ui.css non esiste:
          #                   falso positivo strutturale.
          # --require-https   segnala link http:// (sicurezza)
          # --root-dir   risolve i path assoluti (/foo/bar/) contro la root del sito buildato.
          #              Senza questo flag lychee non sa contro cosa risolvere /css/, /images/, ecc.
          #              e produce migliaia di falsi positivi "Cannot convert path to URI".
          #              NOTA: fino a luglio 2026 si usava `--base public`, ma lychee ≥0.16
          #              richiede per --base un URL completo o un path assoluto e per i path
          #              locali root-relative il nuovo flag --root-dir (assoluto).
          args: >-
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            --accept 200,201,204,206,301,302,307,308,403,429
            --timeout 20
            --max-retries 3
            --retry-wait-time 5
            --user-agent "Mozilla/5.0 (compatible; PCGenzanoLinkChecker/1.0; +https://www.protezionecivilegenzano.it/)"
            --root-dir "${{ github.workspace }}/public"
            --exclude "^tel:"
            --exclude "^mailto:"
            --exclude "^#"
            --exclude "github\.io/sito-pc-genzano"
            --exclude "localhost"
            --exclude "127\.0\.0\.1"
            --exclude "^https://form\.agid\.gov\.it"
            --exclude "^https://www\.aifa\.gov\.it"
            --exclude "^https://www\.cnr\.it"
            --exclude "^https://www\.parcocastelliromani\.it"
            --exclude "/pagefind/"
            --exclude-path "public/vendor"
            --exclude-path "public/app-shared"
            public/**/*.html
          output: ./lychee-report.md
          fail: false
          format: markdown

      - name: "🚨 Apri issue se link rotti"
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "[Automatico] Link rotti sul sito"
          content-filepath: ./lychee-report.md
          labels: |
            manutenzione
            link-rotti
            automatico
