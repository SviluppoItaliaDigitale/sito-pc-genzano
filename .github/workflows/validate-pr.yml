name: "🔍 Validate PR"

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'manuale/**'
      - 'riferimenti-interni/**'
      - 'CONTESTO-PROGETTO.md'
      - 'social-bozze/**'

permissions:
  contents: read

jobs:
  hugo-build:
    name: "Build Hugo (Aruba target)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙️ Setup Hugo"
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: "🏗️ Build di prova"
        run: |
          set -o pipefail
          hugo --minify --baseURL "https://www.protezionecivilegenzano.it/" 2>&1 | tee build.log
          # Hugo ritorna 0 anche su WARN, controllo esplicito ERROR
          if grep -E "^ERROR" build.log; then
            echo "::error::Hugo build ha prodotto errori — vedi log sopra"
            exit 1
          fi

      - name: "🧾 Valida JSON-LD (paternità/licenza inclusa)"
        # Gate sui dati strutturati: ogni blocco ld+json del campione deve
        # essere JSON parsabile e ogni pagina deve avere il blocco di
        # paternità di jsonld-copyright.html (copyrightHolder). Protegge
        # dall'incidente del doppio escape (12/05/2026) e da regressioni
        # del livello di tutela IP (agosto 2026).
        run: python3 scripts/check-jsonld.py public

      - name: "📊 Statistiche build"
        run: |
          echo "Pagine generate: $(find public -name '*.html' | wc -l)"
          echo "Dimensione public/: $(du -sh public | cut -f1)"

  menu-sync:
    name: "Coerenza menu hugo.toml ↔ site-chrome.js"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🧭 Verifica che il menu di site-chrome.js sia generato da hugo.toml"
        # Il blocco MENU-AUTOGEN di site-chrome.js è GENERATO da
        # scripts/genera-chrome-menu.py a partire da hugo.toml [[menus.main]]
        # (fonte unica del menu, audit 15/07/2026). Se qualcuno modifica il
        # menu in hugo.toml senza rigenerare (o edita a mano il blocco),
        # questo check fallisce PRIMA del merge — sostituisce l'attesa
        # dell'issue settimanale di audit-sito.yml § 41.
        run: python3 scripts/genera-chrome-menu.py --check

  yaml-syntax:
    name: "Sintassi YAML workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔬 Valida YAML di .github/workflows/"
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" \
              || { echo "::error file=$f::YAML invalido"; exit 1; }
            echo "OK: $f"
          done

  frontmatter-validity:
    name: "Frontmatter articoli modificati"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔬 Valida YAML frontmatter dei file content/ modificati"
        run: |
          # File .md modificati nella PR (rispetto a main)
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'content/**/*.md' 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "Nessun articolo modificato"
            exit 0
          fi
          fail=0
          for f in $changed; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY' || fail=1
          import sys, yaml
          path = sys.argv[1]
          with open(path) as fh:
              text = fh.read()
          parts = text.split('---', 2)
          if len(parts) < 3:
              print(f"::warning file={path}::Nessun frontmatter rilevato")
              sys.exit(0)
          try:
              fm = yaml.safe_load(parts[1])
          except yaml.YAMLError as e:
              print(f"::error file={path}::YAML frontmatter invalido: {e}")
              sys.exit(1)
          # Controllo soft draft:true (warning, non blocca)
          if isinstance(fm, dict) and fm.get('draft') is True:
              print(f"::warning file={path}::draft:true — non sarà pubblicato")
          PY
          done
          exit $fail

  italiano:
    name: "Italiano — refusi e grammatica"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔤 Setup dizionario italiano"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell-it
          pip install --quiet spylls

      - name: "📝 Controllo lingua sui file modificati"
        # WHY (19/08/2026): tre errori di italiano sono andati live superando i
        # controlli, perché audit-grammatica-italiana.py girava SOLO in
        # audit-sito.yml (ogni 6h, dopo la pubblicazione) e check-refusi.py è uno
        # spell-check di parola singola. Qui il controllo diventa un gate di PR.
        #
        # Perimetro: content/**/*.md + schede/giochi HTML statici (il punto
        # cieco grammaticale chiuso il 19/08/2026).
        # Cosa BLOCCA:
        #  - findings ERR dell'audit grammaticale (accenti, apostrofi, spaziature,
        #    elisioni) sui file modificati;
        #  - parole sospette NUOVE, cioè non già presenti sul branch base: sono
        #    quasi sempre refusi introdotti da questa PR.
        # Cosa NON blocca (per scelta, documentata):
        #  - parole sospette già presenti sul base branch: sono in stragrande
        #    maggioranza termini tecnici e inglesi legittimi (73 sul sito ad
        #    agosto 2026). Vanno in allowlist scripts/dizionario-pc.txt, non
        #    bloccano una PR che non le ha introdotte.
        #  - findings WARN (doppio spazio, parola ripetuta): spesso voluti
        #    (allineamenti di schede, figure retoriche). Restano informativi.
        # Gli errori che richiedono una LETTURA (articolo mancante, accordi,
        # reggenze) non sono intercettabili qui: se ne occupa l'agent
        # pc-revisore-linguistico, gate obbligato prima del commit.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE"...HEAD -- 'content/**/*.md' \
            'static/formazione/**/*.html' 'static/giochi/**/*.html' > /tmp/changed.txt || true
          if [ ! -s /tmp/changed.txt ]; then
            echo "Nessun contenuto modificato: niente da controllare."; exit 0
          fi
          echo "File modificati:"; cat /tmp/changed.txt
          fail=0

          echo "::group::Grammatica e tipografia (sui file modificati)"
          # Lo script accetta i file come argomenti: audita ESATTAMENTE questi,
          # senza dipendere dalla sua enumerazione interna.
          xargs -a /tmp/changed.txt python3 scripts/audit-grammatica-italiana.py > /tmp/gram.txt 2>&1 || true
          cat /tmp/gram.txt
          echo "::endgroup::"

          if awk '/^## ❌ ERR/{f=1;next} /^## ⚠️/{f=0} f' /tmp/gram.txt | grep -q '^- `'; then
            echo "::error::Errori di italiano bloccanti nei file modificati (sezione ERR)"
            awk '/^## ❌ ERR/{f=1;next} /^## ⚠️/{f=0} f' /tmp/gram.txt | grep '^- `' | head -20
            fail=1
          fi

          echo "::group::Refusi (hunspell)"
          xargs -a /tmp/changed.txt python3 scripts/check-refusi.py > /tmp/refusi.txt 2>&1 || true
          cat /tmp/refusi.txt
          echo "::endgroup::"

          # Parole sospette NUOVE = non presenti sul branch base -> refuso introdotto qui.
          git grep -h '' "$BASE" -- 'content/**/*.md' > /tmp/base.txt 2>/dev/null || true
          grep -oE '^ +- [A-Za-zÀ-ÿ]+' /tmp/refusi.txt | sed 's/^ *- //' | sort -u > /tmp/words.txt || true
          nuove=""
          while read -r w; do
            [ -n "$w" ] || continue
            if ! grep -qiw -- "$w" /tmp/base.txt; then nuove="$nuove $w"; fi
          done < /tmp/words.txt
          if [ -n "$nuove" ]; then
            echo "::error::Parole sospette NUOVE introdotte da questa PR:$nuove"
            echo "Se sono termini corretti, aggiungile a scripts/dizionario-pc.txt"
            fail=1
          fi

          if [ "$fail" = "1" ]; then
            echo ""
            echo "Riproduci in locale:"
            echo "  xargs -a <lista> python3 scripts/audit-grammatica-italiana.py"
            echo "  xargs -a <lista> python3 scripts/check-refusi.py"
            exit 1
          fi
          echo "✅ Nessun errore di italiano bloccante sui file modificati."
