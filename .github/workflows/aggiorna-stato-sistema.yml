name: "📊 Aggiorna stato del sistema"

# Aggiorna data/stato-sistema.json con lo stato dei workflow critici di
# manutenzione, letto via API GitHub (gh run list). La pagina pubblica
# /stato-sistema/ lo legge al build successivo per mostrare il cruscotto
# di trasparenza tecnica con semaforo verde/giallo/rosso.
#
# deploy.yml NON e' toccato (vincolo): questo workflow committa il file in
# data/ e ri-triggera deploy.yml esplicitamente (i push del GITHUB_TOKEN
# non auto-triggerano i workflow su push).

on:
  schedule:
    # Giornaliero alle 05:30 UTC. Orario esplicito (non */N): vedi memoria
    # feedback_github_cron_explicit_better.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: "aggiorna-stato-sistema"
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "🔎 Leggi lo stato dei workflow critici"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ts_now="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"

          stato_di() {
            # $1 = file workflow → stampa "status|conclusion|createdAt"
            gh run list --workflow="$1" --limit=1 \
              --json status,conclusion,createdAt \
              --jq '"\(.[0].status)|\(.[0].conclusion)|\(.[0].createdAt)"' 2>/dev/null || echo "unknown||"
          }

          # Mappa: status+conclusion grezzi → stato sintetico per la pagina
          sintetico() {
            local status="$1" conclusion="$2"
            if [ "$status" != "completed" ] && [ -n "$status" ] && [ "$status" != "unknown" ]; then
              echo "in_progress"
            elif [ "$conclusion" = "success" ]; then
              echo "success"
            elif [ "$conclusion" = "failure" ] || [ "$conclusion" = "timed_out" ]; then
              echo "failure"
            elif [ -n "$conclusion" ]; then
              echo "other"
            else
              echo "unknown"
            fi
          }

          riga() {
            # $1 nome  $2 file  $3 descrizione
            IFS='|' read -r st cc ca <<< "$(stato_di "$2")"
            sint="$(sintetico "$st" "$cc")"
            printf '    {\n'
            printf '      "nome": "%s",\n' "$1"
            printf '      "file": "%s",\n' "$2"
            printf '      "stato": "%s",\n' "$sint"
            printf '      "ultimo_run": "%s",\n' "$ca"
            printf '      "descrizione": "%s"\n' "$3"
            printf '    }'
          }

          {
            printf '{\n'
            printf '  "aggiornato": "%s",\n' "$ts_now"
            printf '  "nota": "File aggiornato automaticamente dal workflow aggiorna-stato-sistema.yml. Stato dei workflow critici di manutenzione del sito.",\n'
            printf '  "workflow": [\n'
            riga "Pubblicazione del sito" "deploy.yml" "Costruisce e pubblica il sito a ogni modifica approvata."
            printf ',\n'
            riga "Controllo allerta meteo" "check-allerta.yml" "Verifica i bollettini della Regione Lazio e aggiorna lo stato di allerta."
            printf ',\n'
            riga "Audit settimanale del sito" "audit-sito.yml" "Controlla contenuti, link, accessibilita e coerenza ogni lunedi."
            printf ',\n'
            riga "Verifica dopo la pubblicazione" "smoke-test-post-deploy.yml" "Controlla che le pagine principali rispondano dopo ogni pubblicazione."
            printf ',\n'
            riga "Audit prestazioni e accessibilita" "lighthouse-audit.yml" "Misura velocita, accessibilita e SEO con Lighthouse dopo ogni pubblicazione."
            printf '\n  ]\n}\n'
          } > data/stato-sistema.json

          echo "--- data/stato-sistema.json ---"
          cat data/stato-sistema.json
          python3 -c "import json; json.load(open('data/stato-sistema.json'))" && echo "JSON valido"

      - name: "🩺 Controlli di salute giornalieri (watchdog universale)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # ------------------------------------------------------------
          # 1) WATCHDOG UNIVERSALE: workflow falliti nelle ultime 24h.
          #    notifica-ci-fallita.yml copre solo 4 workflow critici in
          #    tempo reale; questo scan giornaliero copre TUTTI gli altri.
          #    Storia: 5 workflow del lunedì sono rimasti rossi per
          #    settimane senza che nessuno se ne accorgesse (10/06/2026).
          # ------------------------------------------------------------
          PROBLEMI=""
          FALLITI=$(gh run list --repo "$REPO" --status failure \
                      --created "$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S)Z..$(date -u +%Y-%m-%dT%H:%M:%S)Z" \
                      --limit 100 --json name,workflowName,url \
                      --jq '[.[] | .workflowName] | unique | .[]' 2>/dev/null || true)
          if [ -n "$FALLITI" ]; then
            PROBLEMI="${PROBLEMI}### Workflow con run falliti nelle ultime 24 ore\n\n"
            while IFS= read -r wf; do
              [ -z "$wf" ] && continue
              PROBLEMI="${PROBLEMI}- **${wf}** — controllare il log nella tab Actions\n"
            done <<< "$FALLITI"
            PROBLEMI="${PROBLEMI}\n"
          fi

          # ------------------------------------------------------------
          # 2) DEAD-MAN CHECK della catena cron-job.org → check-allerta.
          #    Se cron-job.org smette di chiamare, check-allerta degrada
          #    da ~288 a 24 run/giorno e la latenza allerta sale a ~1h
          #    senza alcun errore visibile. Attesi ~24 run in 2h.
          # ------------------------------------------------------------
          RUN_2H=$(gh run list --repo "$REPO" --workflow=check-allerta.yml \
                     --created "$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%S)Z..$(date -u +%Y-%m-%dT%H:%M:%S)Z" \
                     --limit 100 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          if [ "${RUN_2H:-0}" -lt 10 ]; then
            PROBLEMI="${PROBLEMI}### Catena allerta degradata\n\nSolo **${RUN_2H} run** di check-allerta nelle ultime 2 ore (attesi ~24 dal dispatch cron-job.org ogni 5 min). Verificare: stato di cron-job.org, validità del PAT (issue di controllo-scadenza-pat), raggiungibilità API GitHub.\n\n"
          fi

          # ------------------------------------------------------------
          # 3) SCADENZA CERTIFICATO SSL del dominio di produzione.
          #    Aruba di norma rinnova da sé, ma un rinnovo mancato su un
          #    sito di protezione civile va saputo prima dei cittadini.
          # ------------------------------------------------------------
          FINE_CERT=$(echo | timeout 20 openssl s_client -servername www.protezionecivilegenzano.it \
                        -connect www.protezionecivilegenzano.it:443 2>/dev/null \
                      | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
          if [ -n "$FINE_CERT" ]; then
            TS_CERT=$(date -u -d "$FINE_CERT" +%s 2>/dev/null || echo "")
            if [ -n "$TS_CERT" ]; then
              GIORNI=$(( (TS_CERT - $(date -u +%s)) / 86400 ))
              echo "Certificato SSL: scade fra $GIORNI giorni ($FINE_CERT)"
              if [ "$GIORNI" -lt 21 ]; then
                PROBLEMI="${PROBLEMI}### Certificato SSL in scadenza\n\nIl certificato di www.protezionecivilegenzano.it scade fra **${GIORNI} giorni** (${FINE_CERT}). Verificare il rinnovo automatico sul pannello Aruba.\n\n"
              fi
            fi
          else
            echo "::warning::Impossibile leggere il certificato SSL (rete?)"
          fi

          # ------------------------------------------------------------
          # 4) CRESCITA DEL REPO (podcast/presentazioni/pagefind in git).
          #    Sopra 3 GB va pianificata la migrazione audio→Drive già
          #    prevista, PRIMA che un limite GitHub blocchi un push
          #    durante una pubblicazione urgente.
          # ------------------------------------------------------------
          SIZE_KB=$(gh api "repos/$REPO" --jq .size 2>/dev/null || echo 0)
          SIZE_GB=$(( SIZE_KB / 1024 / 1024 ))
          echo "Dimensione repo (API GitHub): ${SIZE_GB} GB (${SIZE_KB} KB)"
          if [ "$SIZE_GB" -ge 3 ]; then
            PROBLEMI="${PROBLEMI}### Repository oltre i 3 GB\n\nIl repo pesa **${SIZE_GB} GB**. Pianificare la migrazione dei podcast su Google Drive (decisione già prevista) e valutare di smettere di committare static/pagefind/ (rigenerabile in deploy).\n\n"
          fi

          # ------------------------------------------------------------
          # Issue unica aggiornata in-place (titolo stabile).
          # ------------------------------------------------------------
          TITLE="🩺 Salute del sistema — controlli giornalieri"
          if [ -z "$PROBLEMI" ]; then
            echo "Tutti i controlli di salute OK."
            # se esiste un'issue aperta e oggi è tutto OK, chiudila
            NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                    --json number,title \
                    --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --repo "$REPO" \
                --comment "Controlli del $(date -u +%Y-%m-%d): tutto rientrato, nessun problema rilevato." || true
            fi
            exit 0
          fi
          BODY=$(printf "_Controlli del %s (aggiornati ogni giorno, issue unica in-place)._\n\n%b\n---\n_Issue del watchdog giornaliero in aggiorna-stato-sistema.yml. Si chiude da sola quando tutti i controlli tornano OK._" "$(date -u +%Y-%m-%d)" "$PROBLEMI")
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body "$BODY"
            echo "Issue #$NUM aggiornata."
          else
            gh label create "salute-sistema" --color "B60205" \
              --description "Controlli giornalieri di salute del sistema" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label automazione --label salute-sistema
            echo "Issue di salute creata."
          fi

      - name: "💾 Commit se cambiato + ri-trigger deploy"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet data/stato-sistema.json; then
            echo "Nessun cambiamento di stato — niente commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stato-sistema.json
          git commit -m "chore(stato-sistema): aggiornamento automatico stato workflow [skip-stato]"
          # Retry+rebase per evitare conflitti di concorrenza con altri workflow
          for tentativo in 1 2 3; do
            if git push 2>&1; then break; fi
            echo "Push fallito (tentativo $tentativo), rebase..."
            git pull --rebase origin main || { echo "Rebase fallito"; exit 1; }
            if [ "$tentativo" = "3" ]; then echo "Push fallito dopo 3 tentativi"; exit 1; fi
          done
          echo "Commit fatto; deploy delegato a deploy-coalescer.yml (dati non urgenti)."
