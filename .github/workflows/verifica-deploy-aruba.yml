name: "🔁 Verifica allineamento Aruba (anti-stale)"

# Guardia anti-stale, indipendente dal deploy. Dopo ogni deploy riuscito
# confronta le pagine servite da Aruba con /build-manifest.json, il
# manifesto delle impronte sha256 di ogni file della build
# (scripts/genera-manifest-build.py, scritto da deploy.yml): le pagine
# critiche, l'ultimo articolo, build-info.js e 60 pagine a caso, diverse a
# ogni giro. Un file con impronta diversa è rimasto vecchio su Aruba,
# qualunque ne sia la causa.
#
# Dal 01/10/2026 sostituisce il campionamento della meta pc-build-sha: quella
# meta costringeva a ricaricare tutte le pagine a ogni deploy (17 minuti per
# un articolo) e diceva solo «quale build», non se il contenuto fosse quello
# costruito. Il bug che cerca è quello dell'audit 01/07/2026: su Aruba
# convivevano chi-siamo di aprile, allerte-meteo di maggio e la home di
# luglio, con un semaforo di allerta vecchio — la cosa più pericolosa su un
# sito di protezione civile.
#
# La riparazione la fa già deploy.yml nello step «Verifica e ripara», subito
# dopo l'FTP, ricaricando i soli file diversi. Questo workflow è la seconda
# rete: se qualcosa resta diverso apre/aggiorna 1 ISSUE (label automazione +
# urgente), che arriva via email al proprietario e si chiude da sola al
# rientro. NON manda nulla su Telegram: quello è il canale PUBBLICO dei
# cittadini (stessa scelta di notifica-ci-fallita.yml).
#
# Rimedio quando scatta: rilanciare il deploy (Actions → Build e Deploy →
# Run workflow): lo step di riparazione ricarica i soli file diversi. MAI il
# bump dello `state-name` in deploy.yml: il re-upload integrale non completa
# e congela il sito (incidente 03/07/2026).

on:
  workflow_run:
    workflows: ["🚀 Build e Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA atteso (opzionale, solo informativo)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: "verifica-deploy-aruba"
  cancel-in-progress: false

jobs:
  verifica:
    # Solo dopo un deploy RIUSCITO (o su richiesta manuale).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔁 Confronta le pagine live con il manifesto della build"
        id: check
        run: |
          set -uo pipefail
          EXPECTED="${{ github.event.workflow_run.head_sha }}"
          EXPECTED="${EXPECTED:0:7}"
          [ -z "$EXPECTED" ] && EXPECTED="${{ github.event.inputs.sha }}"
          ARGS=""
          [ -n "$EXPECTED" ] && ARGS="--sha-atteso $EXPECTED"
          # Ritentativi ampi: assorbono la coda del caricamento FTP subito dopo il deploy.
          set +e
          python3 scripts/verifica-deploy-aruba.py $ARGS \
            --campione 60 --seme "${{ github.run_id }}" \
            --tentativi 6 --attesa 60 --ore-massime 12 \
            | tee /tmp/verifica.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "### Verifica allineamento Aruba"
            echo '```'
            cat /tmp/verifica.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🚨 Apri/aggiorna issue se c'è drift"
        if: ${{ steps.check.outputs.rc != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="🔁 Drift di deploy su Aruba — pagine stantie"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          ESITO=$(sed 's/`/´/g' /tmp/verifica.txt | tail -60)
          RIMEDIO='**Rimedio:** rilancia il deploy (Actions → «🚀 Build e Deploy» → Run workflow): lo step «Verifica e ripara» ricarica via FTPS i soli file che non coincidono con la build e li ricontrolla. Se anche così resta diverso, controlla nel log di quello step se il collegamento FTPS è riuscito (credenziali, cartella remota). In alternativa, da una sessione con le credenziali FTP: `python3 scripts/verifica-deploy-aruba.py --manifesto public/build-manifest.json --public public --ripara`. **Mai** cambiare lo `state-name` nello step FTP di `deploy.yml`: il re-upload integrale supera il timeout e congela il sito (incidente del 03/07/2026). Dopo il rientro, questa issue si chiude da sola al prossimo controllo verde.'
          BODY=$(printf '_Rilevato il %s UTC dalla guardia anti-stale (verifica-deploy-aruba.yml). Issue unica, si chiude da sola al rientro._\n\nAlcune pagine di **www.protezionecivilegenzano.it** non coincidono con la build appena pubblicata (confronto con `/build-manifest.json`): sono rimaste vecchie su Aruba.\n\n%s\n\n**Esito del controllo:**\n\n```\n%s\n```\n\n[Log completo del run](%s)\n' "$(date -u +%Y-%m-%d\ %H:%M)" "$RIMEDIO" "$ESITO" "$RUN_URL")
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --body "$BODY"
            echo "Issue #$NUM aggiornata."
          else
            gh label create "urgente" --color "B60205" --description "Da gestire subito" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label automazione --label urgente
            echo "Issue di drift creata."
          fi

      - name: "✅ Chiudi l'issue se tutto è allineato"
        if: ${{ steps.check.outputs.rc == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="🔁 Drift di deploy su Aruba — pagine stantie"
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                  --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1 || true)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" \
              --comment "Verifica del $(date -u +%Y-%m-%d\ %H:%M) UTC: le pagine controllate coincidono con la build pubblicata. Drift rientrato."
            echo "Issue #$NUM chiusa."
          else
            echo "Nessun drift e nessuna issue aperta — tutto ok."
          fi
