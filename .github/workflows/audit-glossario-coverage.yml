name: Audit glossario coverage

# Audit settimanale della copertura del glossario inline.
# Scansiona tutti gli articoli e le pagine del sito, estrae le sigle PC
# (acronimi maiuscoli 3+ caratteri), confronta con il glossario, apre
# issue automatica con elenco sigle ricorrenti NON ancora nel glossario
# (soglia: usate ≥ 3 volte nel sito).
#
# Aggiungere queste sigle al glossario attiva il popover inline automatico
# (vedi rule 03 § "Glossario inline con popover").
#
# Scaglionato lunedì 10:07 UTC.

on:
  schedule:
    - cron: '7 10 * * 1'   # Lunedì 10:07 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit-glossario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run coverage check
        id: check
        run: |
          set -uo pipefail
          # Il glossario deve esistere: senza, lo script lo leggerebbe come vuoto
          # e segnalerebbe come mancanti tutte le sigle del sito.
          if [ ! -s content/glossario/_index.md ]; then
            echo "::error::content/glossario/_index.md manca o è vuoto: il controllo non è eseguibile."
            exit 1
          fi
          # Stdout (marker + corpo della issue) separato dallo stderr (diagnostica):
          # fino al 17/10/2026 il crash dello script veniva preso per un esito
          # (`|| true`), e con `2>&1` le righe di diagnostica finivano in testa
          # all'uscita e il marker non si trovava mai.
          RC=0
          python3 scripts/check-glossario-coverage.py > /tmp/audit-out.txt 2> /tmp/audit-err.txt || RC=$?
          cat /tmp/audit-err.txt >&2
          cat /tmp/audit-out.txt
          FIRST=$(head -n 1 /tmp/audit-out.txt)
          if [ "$RC" -ne 0 ]; then
            echo "::error::scripts/check-glossario-coverage.py si è fermato con codice $RC: il controllo non è stato eseguito (non è un «nessun risultato»)."
            exit "$RC"
          fi
          if [ "$FIRST" = "OK_NO_MISSING" ]; then
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          elif [ "$FIRST" = "MISSING_SIGLE_FOUND" ]; then
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
            tail -n +2 /tmp/audit-out.txt > /tmp/issue-body.md
          else
            echo "::error::Uscita inattesa di scripts/check-glossario-coverage.py (prima riga: «$FIRST»): il controllo non è affidabile."
            exit 1
          fi

      - name: Crea/aggiorna issue
        if: steps.check.outputs.has_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Glossario: sigle ricorrenti non ancora coperte"
          # Label garantita (idempotente): senza, gh issue create fallisce
          # con "could not add label" e il job muore (audit 10/06/2026).
          gh label create "glossario" --color "1D76DB" \
            --description "Copertura glossario inline" 2>/dev/null || true
          EXISTING=$(gh issue list --label "automazione" --label "glossario" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/issue-body.md \
              --label "automazione" \
              --label "glossario"
          fi
