name: "TEMP v2 Rigenera pacchetti schede revisione"

on:
  push:
    branches:
      - chatgpt/revisione-disegni-didattica-20261007
    paths:
      - 'static/formazione/schede-stampabili/**'
      - 'content/formazione/kit-scuola-*.md'
      - '.github/workflows/tmp-rigenera-pacchetti-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "tmp-rigenera-pacchetti-v2"
  cancel-in-progress: false

jobs:
  rigenera:
    if: "!contains(github.event.head_commit.message, '[skip-temp-v2]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rigenera e pubblica output esatti
        env:
          BRANCH: chatgpt/revisione-disegni-didattica-20261007
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rigenera() {
            python3 scripts/genera-pacchetti-schede.py
            python3 scripts/genera-pacchetti-kit.py
            git add static/formazione/schede-stampabili/pacchetti/ static/formazione/pacchetti/ content/formazione/kit-scuola-*.md
          }

          rigenera
          if git diff --staged --quiet; then
            echo "Pacchetti già allineati."
            exit 0
          fi

          git commit -m "chore: rigenera pacchetti didattici esatti [skip-temp-v2]"
          if git push origin "HEAD:$BRANCH"; then
            exit 0
          fi

          echo "Branch avanzato durante la generazione: riparto dalla testa più recente."
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rigenera
          if git diff --staged --quiet; then
            echo "Pacchetti già allineati dopo il riallineamento."
            exit 0
          fi
          git commit -m "chore: rigenera pacchetti didattici esatti [skip-temp-v2]"
          git push origin "HEAD:$BRANCH"
