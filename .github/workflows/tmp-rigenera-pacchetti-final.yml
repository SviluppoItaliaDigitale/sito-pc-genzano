name: "TEMP Rigenera pacchetti finali revisione"
on:
  push:
    branches:
      - chatgpt/revisione-disegni-didattica-20261007
    paths:
      - '.github/workflows/tmp-rigenera-pacchetti-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rigenera:
    if: ${{ !contains(github.event.head_commit.message, '[skip-temp-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rigenera Stampa tutto
        run: python3 scripts/genera-pacchetti-schede.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/formazione/schede-stampabili/pacchetti/
          if git diff --staged --quiet; then
            echo "Pacchetti già allineati."
            exit 0
          fi
          git commit -m "Didattica: rigenera pacchetti finali [skip-temp-final]"
          git push origin HEAD:chatgpt/revisione-disegni-didattica-20261007
