name: "♿ Pa11y accessibilità (PR)"

# Gate di accessibilità sulle pull request: costruisce il sito, lo serve in
# locale ed esegue pa11y-ci con runner axe-core (lo stesso usato per la
# dichiarazione di accessibilità) su un campione di pagine chiave, secondo
# WCAG 2.2 AA. Obiettivo: intercettare le regressioni di accessibilità PRIMA
# del deploy, complementare a lighthouse-audit.yml (che gira post-deploy) e a
# validate-pr.yml (che fa solo build Hugo). Config in .pa11yci.json.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'manuale/**'
      - 'riferimenti-interni/**'
      - 'CONTESTO-AI.md'
      - 'social-bozze/**'
      - 'bozze/**'
  workflow_dispatch:        # esecuzione manuale on-demand (es. baseline findings)

permissions:
  contents: read
  pull-requests: write

jobs:
  pa11y:
    name: "WCAG 2.2 AA (axe) su pagine chiave"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "⚙️ Setup Hugo"
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: "🏗️ Build sito (baseURL locale per il test)"
        run: hugo --minify --baseURL "http://127.0.0.1:8080/"

      - name: "⚙️ Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 Installa http-server + axe-core + puppeteer"
        run: |
          npm install -g http-server
          npm install puppeteer axe-core

      - name: "🌐 Avvia server locale e attendi"
        run: |
          http-server public -p 8080 -s -c-1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done

      - name: "♿ Gate axe-core (fallisce solo su violazioni; incomplete informativi)"
        continue-on-error: true
        run: |
          set +e
          node scripts/axe-gate.js 2>&1 | tee axe-report.txt
          code=${PIPESTATUS[0]}
          {
            echo "## ♿ Gate accessibilità axe-core (WCAG 2.2 AA)"
            echo ''
            echo 'Fallisce SOLO sulle **violazioni confermate**. Gli *incomplete* (testo su gradiente, pseudo-elementi, sovrapposizioni) sono falsi-positivi da revisione manuale e NON bloccano.'
            echo ''
            echo '```'
            cat axe-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: "💬 Pubblica il report come commento sulla PR"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ♿ Gate accessibilità axe-core (WCAG 2.2 AA)"
            echo ''
            echo 'Solo le **violazioni confermate** bloccano. Gli *incomplete* sono informativi.'
            echo ''
            echo '```'
            head -c 60000 axe-report.txt
            echo '```'
          } > axe-body.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file axe-body.md \
            --repo "${{ github.repository }}"
