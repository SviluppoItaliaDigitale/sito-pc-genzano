name: "♿ Pa11y accessibilità (PR)"

# Gate di accessibilità sulle pull request: costruisce il sito, lo serve in
# locale ed esegue pa11y-ci con runner axe-core (lo stesso usato per la
# dichiarazione di accessibilità) su un campione di pagine chiave, secondo
# WCAG 2.2 AA. Obiettivo: intercettare le regressioni di accessibilità PRIMA
# del deploy, complementare a lighthouse-audit.yml (che gira post-deploy) e a
# validate-pr.yml (che fa solo build Hugo). Config in .pa11yci.json.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'manuale/**'
      - 'riferimenti-interni/**'
      - 'CONTESTO-AI.md'
      - 'social-bozze/**'
      - 'bozze/**'
  workflow_dispatch:        # esecuzione manuale on-demand (es. baseline findings)

permissions:
  contents: read
  pull-requests: write

jobs:
  pa11y:
    name: "WCAG 2.2 AA (axe) su pagine chiave"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "⚙️ Setup Hugo"
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.143.1'
          extended: true

      - name: "🏗️ Build sito (baseURL locale per il test)"
        run: hugo --minify --baseURL "http://127.0.0.1:8080/"

      - name: "⚙️ Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 Installa pa11y-ci + http-server"
        run: npm install -g pa11y-ci http-server

      - name: "🌐 Avvia server locale e attendi"
        run: |
          http-server public -p 8080 -s -c-1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done

      - name: "♿ Esegui pa11y-ci (report-only in fase di rollout)"
        continue-on-error: true
        run: |
          set +e
          pa11y-ci --config .pa11yci.json 2>&1 | tee pa11y-report.txt
          {
            echo "## ♿ Report accessibilità Pa11y (axe, WCAG 2.2 AA)"
            echo ''
            echo 'Fase di rollout: **report-only**, non blocca la PR.'
            echo ''
            echo '```'
            cat pa11y-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "💬 Pubblica il report come commento sulla PR"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ♿ Report accessibilità Pa11y (axe, WCAG 2.2 AA) — report-only"
            echo ''
            echo 'Gate non bloccante in fase di rollout. Findings da bonificare prima di rendere il gate obbligatorio.'
            echo ''
            echo '```'
            head -c 60000 pa11y-report.txt
            echo '```'
          } > pa11y-body.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file pa11y-body.md \
            --repo "${{ github.repository }}"
