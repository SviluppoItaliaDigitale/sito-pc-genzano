name: "📈 Dataset clima Castelli (Laboratorio meteo)"

# Rigenera mensilmente i dataset climatici pre-cotti del Laboratorio meteo
# (/laboratorio-meteo/), da dati aperti ERA5-Land (temperature) ed ERA5 (pioggia)
# via Open-Meteo con il modello era5_seamless (CC BY 4.0, nessuna chiave API):
# serie omogenea per tutti gli anni (dal 14/10/2026; senza il modello l'archivio
# passa all'IFS dal 2017). Output: static/open-data/clima-*.json + clima-manifest.json.
# Lo script calcola l'ultimo anno solare completo in automatico, così i dataset
# si estendono da soli al passare degli anni. Gli esempi mostrati nelle card del
# Laboratorio restano aggiornati senza intervento manuale.
#
# deploy.yml NON è toccato (vincolo): il workflow committa soltanto, il deploy lo
# fa deploy-coalescer.yml (dati non urgenti, rule 10 § modello di priorità).

on:
  schedule:
    # 1° del mese, minuto 41 (fuori dai quarti d'ora canonici — vedi memoria
    # feedback_github_cron_explicit_better). I dati climatici cambiano lentamente.
    - cron: "41 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "clima-castelli"
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: "📊 Genera dataset clima"
        run: |
          set -euo pipefail
          python3 scripts/genera-clima-castelli.py
          for f in clima-manifest clima-anno-temperature-genzano clima-pioggia-annuale-genzano clima-luglio-temperature-genzano clima-giorni-30-gradi-genzano clima-giorni-molto-caldi-genzano; do
            python3 -c "import json; json.load(open('static/open-data/$f.json'))" \
              || { echo "::error::$f.json non valido"; exit 1; }
            echo "$f.json valido"
          done

      - name: "💾 Commit se cambiato"
        run: |
          set -euo pipefail
          # git status vede anche i file nuovi, che git diff ignora.
          if [ -z "$(git status --porcelain -- 'static/open-data/clima-*.json')" ]; then
            echo "Nessun cambiamento nei dataset clima — niente commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/open-data/clima-*.json
          git commit -m "chore(clima): dataset Laboratorio meteo aggiornati [skip-clima]"
          for tentativo in 1 2 3; do
            if git push 2>&1; then break; fi
            echo "Push fallito (tentativo $tentativo), rebase..."
            git pull --rebase origin main || { echo "Rebase fallito"; exit 1; }
            if [ "$tentativo" = "3" ]; then echo "Push fallito dopo 3 tentativi"; exit 1; fi
          done
          echo "Commit fatto; deploy delegato a deploy-coalescer.yml (dati non urgenti)."
