name: "⏰ Sveglia della pubblicazione social"

# Sveglia la pubblicazione su Instagram e Facebook, che vive nel repository
# privato social-pc-genzano.
#
# I post devono uscire INSIEME agli articoli del sito, non a un orario fisso
# (istruzione dell'utente del 21/09/2026). L'innesco principale e' quindi un
# evento, non un orario: appena le bozze social di un articolo nuovo sono
# pronte, o appena un articolo calendarizzato diventa online, questo workflow
# chiama la pubblicazione.
#
# Restano due giri a orario come rete di sicurezza, per i casi in cui un
# evento si perde. Chiamare il workflow privato quando ha gia' pubblicato non
# fa danno: la coda segna le voci come pubblicate, e una voce non esce finche'
# la sua pagina non risponde davvero sul sito. Per questo non c'e' nessun
# controllo preliminare.

on:
  workflow_run:
    # L'innesco che conta: le bozze social di un articolo nuovo sono pronte,
    # oppure il rebuild del mattino ha portato online un articolo
    # calendarizzato.
    workflows:
      - "📱 Genera bozze social automatiche"
      - "🗓️ Pubblicazione programmata articoli"
    types: [completed]
  schedule:
    # Rete di sicurezza, se un evento si perde.
    - cron: '35 8 * * *'
    - cron: '35 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sveglia-social
  cancel-in-progress: false

jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📣 Chiama la pubblicazione nel repository privato
        # Su workflow_run gira anche se il workflow chiamante è fallito: le
        # bozze potrebbero essere state generate lo stesso, e un giro in più
        # non pubblica nulla che non sia pronto.
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SOCIAL_REPO_PAT non configurato: sveglia saltata."
            exit 0
          fi
          REPO="SviluppoItaliaDigitale/social-pc-genzano"
          gh workflow run "pubblica-social-auto.yml" --repo "$REPO"
          echo "Pubblicazione richiesta a $REPO."
          echo "Se il suo cron ha gia' pubblicato, questo giro non trova voci mature e non fa nulla."
