name: "⏰ Sveglia della pubblicazione social"

# Sveglia la pubblicazione su Instagram e Facebook, che vive nel repository
# privato social-pc-genzano.
#
# I post escono INSIEME agli articoli del sito (istruzione dell'utente del
# 21/09/2026), e la sveglia che conta la dà genera-social-bozze.yml: gira al
# termine di ogni deploy, prepara il materiale degli articoli appena andati
# online (calendarizzati compresi) e chiama il repository privato appena la
# pagina risponde davvero sul sito.
#
# Qui restano due giri a orario, come rete di sicurezza per ciò che quella
# sveglia non vede: voci rimaste in coda, un evento perso, un giro fallito.
# Chiamare il workflow privato quando ha già pubblicato non fa danno: la
# coda segna le voci come pubblicate.
#
# 22/09/2026: tolti gli inneschi a evento (fine delle bozze social, rebuild
# del mattino). Da quando le bozze si generano anche dopo ogni deploy, cioè
# decine di volte al giorno, quegli inneschi avrebbero chiamato il repository
# privato a ogni giro, consumando i suoi minuti senza pubblicare niente di più.
#
# Modalità `attendi` (22/09/2026). Quando più articoli escono insieme il
# repository privato li distanzia di mezz'ora, e in quegli istanti non accade
# nessun evento che lo richiami: il secondo post aspettava ore, fino al primo
# giro programmato. genera-social-bozze.yml lancia allora questo workflow con
# attendi=true, che resta sveglio (fino a 100 minuti, minuti gratuiti) e
# chiama la pubblicazione ogni volta che una voce in coda matura
# (scripts/social-pronti.py attendi).

on:
  schedule:
    - cron: '35 8 * * *'
    - cron: '35 18 * * *'
  workflow_dispatch:
    inputs:
      attendi:
        description: "Resta sveglio e chiama la pubblicazione quando le voci in coda maturano (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: sveglia-social
  cancel-in-progress: false

jobs:
  sveglia:
    if: ${{ github.event.inputs.attendi != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📣 Chiama la pubblicazione nel repository privato
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SOCIAL_REPO_PAT non configurato: sveglia saltata."
            exit 0
          fi
          REPO="SviluppoItaliaDigitale/social-pc-genzano"
          gh workflow run "pubblica-social-auto.yml" --repo "$REPO"
          echo "Pubblicazione richiesta a $REPO."
          echo "Se ha gia' pubblicato, questo giro non trova voci mature e non fa nulla."

  attendi:
    if: ${{ github.event.inputs.attendi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: "📥 Checkout (script, articoli e materiale social)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            content/comunicazioni
            social-bozze
          sparse-checkout-cone-mode: true

      - name: "⏳ Chiama la pubblicazione quando le voci maturano"
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_PAT: ${{ secrets.SOCIAL_REPO_PAT }}
        run: python3 scripts/social-pronti.py attendi --max-min 100
