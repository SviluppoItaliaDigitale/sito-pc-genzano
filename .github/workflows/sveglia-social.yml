name: "⏰ Sveglia della pubblicazione social"

# Seconda rete per la pubblicazione automatica su Instagram e Facebook, che
# vive nel repository privato social-pc-genzano.
#
# Perche' esiste (21/09/2026): quel repository e' nato il 20 settembre e il
# giorno dopo lo scheduler di GitHub non aveva ancora prodotto un solo run del
# suo cron — il post del mattino sarebbe rimasto in coda. E' lo stesso motivo
# per cui l'allerta meteo ha un doppio innesco (rule 10): su questo progetto lo
# scheduler ritarda e a volte salta, quindi le cose che devono accadere ogni
# giorno hanno due sveglie invece di una.
#
# Qui il cron gira in un repository con decine di workflow attivi, dove lo
# scheduler e' "caldo". Chiamare il workflow privato quando ha gia' pubblicato
# non fa danno: la coda segna le voci come pubblicate e un secondo giro non
# trova nulla di maturo. Per questo non c'e' nessun controllo preliminare.

on:
  schedule:
    # Un'ora dopo gli slot del repository privato (07:05 e 17:05 UTC), per
    # lasciargli la precedenza quando il suo cron funziona.
    - cron: '5 8 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sveglia-social
  cancel-in-progress: false

jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📣 Chiama la pubblicazione nel repository privato
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SOCIAL_REPO_PAT non configurato: sveglia saltata."
            exit 0
          fi
          REPO="SviluppoItaliaDigitale/social-pc-genzano"
          gh workflow run "pubblica-social-auto.yml" --repo "$REPO"
          echo "Pubblicazione richiesta a $REPO."
          echo "Se il suo cron ha gia' pubblicato, questo giro non trova voci mature e non fa nulla."
