name: "Rigenera ZIP kit revisione didattica"

on:
  push:
    branches:
      - chatgpt/revisione-disegni-didattica-20261007
    paths:
      - '.github/workflows/rigenera-kit-revisione.yml'

permissions:
  contents: write

jobs:
  rigenera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chatgpt/revisione-disegni-didattica-20261007
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Genera ZIP kit
        run: python3 scripts/genera-pacchetti-kit.py
      - name: Commit ZIP e metadati kit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/formazione/pacchetti/ content/formazione/kit-scuola-*.md
          if git diff --staged --quiet; then
            echo "Kit già allineati."
          else
            git commit -m "Didattica: rigenera ZIP kit scolastici [skip-pacchetti]"
            git push origin HEAD:chatgpt/revisione-disegni-didattica-20261007
          fi
