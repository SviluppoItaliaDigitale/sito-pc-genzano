# Conservazione permanente dei contenuti (istruzione del 18/10/2026).
# Gli allegati si archiviano e si verificano; le immagini social si elencano
# soltanto. Nessuna cancellazione automatica e nessuna modifica al sito.
name: "📦 Archiviazione conservativa del repository"

on:
  push:
    branches: ["chatgpt/alleggerimento-*"]
    paths:
      - "scripts/immagini-meteo-release.py"
      - "scripts/test-allegati-permanenti.py"
      - ".github/workflows/pulizia-periodica.yml"
  schedule:
    - cron: "43 4 1 * *"
  workflow_dispatch:
    inputs:
      giorni:
        description: "Elenca soltanto le immagini degli articoli usciti da più di N giorni"
        default: "60"

permissions:
  contents: write

concurrency:
  group: "pulizia-periodica"
  cancel-in-progress: false

jobs:
  conserva:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: "🧪 Verifica le protezioni degli allegati"
        run: python3 scripts/test-allegati-permanenti.py

      - name: "💾 Conserva e verifica gli allegati permanenti"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/immagini-meteo-release.py carica-permanenti

      - name: "🔎 Immagini social: sola verifica, nessuna cancellazione"
        env:
          GIORNI: ${{ github.event.inputs.giorni || '60' }}
        run: python3 scripts/pulisci-social-bozze.py --giorni "$GIORNI" --dry-run
