name: Aggiorna video recenti (feed RSS) + cross-match

# Complemento SETTIMANALE della scansione mensile del catalogo video
# (aggiorna-video-correlati.yml, 1° del mese via yt-dlp): legge i feed
# RSS/Atom ufficiali di YouTube dei canali monitorati (ultimi ~15 video
# per canale, nessuna API key, nessun yt-dlp), aggiunge al catalogo i video
# nuovi e rigenera la mappa pagina→video_correlati.
#
# Perché (02/09/2026): un video Geopop sul crollo del ghiacciaio in Nepal,
# uscito poche ore dopo la scansione mensile, è rimasto invisibile al
# cross-match mentre l'articolo del 27/08 era senza video. Con il feed
# settimanale i video freschi entrano entro pochi giorni.
#
# Lunedì 10:23 UTC (finestra di manutenzione, fuori dai quarti d'ora).
# Deploy coalescato da deploy-coalescer.yml (nessun trigger diretto).

on:
  schedule:
    - cron: '23 10 * * 1'   # lunedì 10:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiorna-video
  cancel-in-progress: false

jobs:
  feed-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Video recenti dai feed RSS dei canali
        id: feed
        run: |
          set -uo pipefail
          # Codice 3 = almeno un canale non ha risposto: lo script ha già
          # scritto i dati buoni (i video nuovi degli altri canali), quindi si
          # prosegue col commit; la issue `fonte-rotta` e il run rosso
          # arrivano negli ultimi step (istruzione del 17/10/2026).
          RC=0
          python3 scripts/aggiorna-catalogo-video-feed.py > /tmp/stdout.txt || RC=$?
          cat /tmp/stdout.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 3 ]; then
            echo "fonti_ko=true" >> "$GITHUB_OUTPUT"
            grep "^FONTI_IN_ERRORE: " /tmp/stdout.txt | sed 's/^FONTI_IN_ERRORE: //' | sed 's/; /\n/g' > /tmp/fonti-ko.txt || true
            { echo "## Canali che non rispondono"; echo ""; sed 's/^/- /' /tmp/fonti-ko.txt; } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" -ne 0 ]; then
            echo "::error::Lo script è terminato con codice $RC (errore inatteso, vedi il log)."
            exit "$RC"
          fi

      - name: Genera mappa video correlati
        # Stessi default della scansione mensile (fonte unica di verità
        # nello script: soglie, filtri, curatela FORCE_MATCHES/DENY_*).
        run: python3 scripts/genera-video-correlati.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Verifica build Hugo
        run: hugo --quiet --minify

      - name: Check diff
        id: diff
        run: |
          if git diff --quiet data/video_dpc_catalogo.yaml data/video_correlati.yaml; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nessun video nuovo nei feed: catalogo e mappa invariati."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            CAT=$(python3 -c "import yaml; print(len(yaml.safe_load(open('data/video_dpc_catalogo.yaml'))['video']))")
            PAG=$(python3 -c "import yaml; print(len(yaml.safe_load(open('data/video_correlati.yaml'))['pagine']))")
            echo "cat_count=$CAT" >> "$GITHUB_OUTPUT"
            echo "pag_count=$PAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit modifiche
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/video_dpc_catalogo.yaml data/video_correlati.yaml
          git commit -m "[skip-video-feed] Video recenti dai feed RSS dei canali + mappa correlati

          Aggiornamento settimanale: video nuovi letti dai feed RSS ufficiali
          dei canali YouTube monitorati e rigenerazione della mappa
          pagina→video_correlati.

          - Video totali nel catalogo: ${{ steps.diff.outputs.cat_count }}
          - Pagine del sito con video correlati: ${{ steps.diff.outputs.pag_count }}

          Generato dal workflow aggiorna-video-feed.yml (cron settimanale).
          I falsi positivi si correggono nel generatore (DENY_VIDEO_IDS,
          DENY_PAGE_VIDEO), mai solo nel YAML."
          for tentativo in 1 2 3; do
            if git push origin main 2>&1; then break; fi
            echo "Push fallito (tentativo $tentativo), rebase..."
            git pull --rebase origin main || { echo "Rebase fallito"; exit 1; }
            if [ "$tentativo" = "3" ]; then echo "Push fallito dopo 3 tentativi"; exit 1; fi
          done
          echo "Mappa video aggiornata nel repo; deploy delegato a deploy-coalescer.yml."

      - name: Issue per i canali che non rispondono
        # Un canale morto va riparato, non ignorato (istruzione dell'utente
        # del 17/10/2026): la issue `fonte-rotta` la prende in carico la
        # routine giornaliera delle issue automatiche (rule 10). Si chiude
        # da sola al primo run in cui tutti i canali rispondono.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FONTI_KO: ${{ steps.feed.outputs.fonti_ko }}
          RC: ${{ steps.feed.outputs.rc }}
        run: |
          set -euo pipefail
          TITLE="Video: una o più fonti non rispondono (aggiorna-video-feed)"
          EXISTING=$(gh issue list --label "fonte-rotta" --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ "${FONTI_KO:-}" = "true" ]; then
            {
              echo "L'aggiornamento settimanale dai feed RSS dei canali non ha potuto leggere questi canali YouTube:"
              echo ""
              sed 's/^/- /' /tmp/fonti-ko.txt 2>/dev/null || echo "- (vedi il log)"
              echo ""
              echo "I loro video **non sono stati tolti** dal catalogo: restano quelli dell'ultima lettura riuscita."
              echo ""
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              echo "## Che cosa fare"
              echo ""
              echo "1. Riprodurre l'errore: \`python3 scripts/aggiorna-catalogo-video-feed.py --dry-run\`."
              echo "2. Verificare l'ID del canale (\`CHANNEL_IDS\` in \`scripts/aggiorna-catalogo-video-feed.py\`) con una richiesta reale a \`https://www.youtube.com/feeds/videos.xml?channel_id=<ID>\`; se è cambiato, ricavare quello nuovo dal campo \`externalId\` della pagina del canale."
              echo "3. Se il canale non esiste più e non ha sostituti, toglierlo da \`CANALI\` in \`scripts/scrape-catalogo-video.py\` e da \`CHANNEL_IDS\` in \`scripts/aggiorna-catalogo-video-feed.py\`, e documentarlo in \`manuale/parte-32\`."
              echo "4. Rilanciare il workflow: la issue si chiude da sola al primo run in cui tutti i canali rispondono."
            } > /tmp/fonti-body.md
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file /tmp/fonti-body.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/fonti-body.md \
                --label "automazione" --label "fonte-rotta"
            fi
          elif [ -n "$EXISTING" ] && [ "${RC:-}" = "0" ]; then
            gh issue close "$EXISTING" --comment "Tutti i canali rispondono di nuovo (run ${{ github.run_id }})."
          fi

      - name: Segnala i canali che non rispondono
        if: steps.feed.outputs.fonti_ko == 'true'
        run: |
          echo "::error::Uno o più canali YouTube non hanno risposto: dati aggiornati solo per gli altri. Dettagli nel riepilogo del run."
          exit 1
