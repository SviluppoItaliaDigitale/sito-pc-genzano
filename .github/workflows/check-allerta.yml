name: "⛈️ Aggiornamento Allerta Meteo"

on:
  schedule:
    # Cron GitHub interno come FAIL-SAFE minimale: 1 run/h al minuto 17
    # (fuori dai quarti d'ora canonici 0/15/30/45 che sono i picchi di
    # carico GitHub Actions, per ridurre il drift).
    # Frequenza nominale: 1 run/h, 24 run/giorno.
    # NON è il trigger primario — quello è cron-job.org che fa il polling
    # ogni 5 minuti puntuale. Questo cron interviene SOLO se cron-job.org
    # va giù: nel peggiore dei casi il sito ricontrolla DPC entro 1 ora.
    - cron: '17 * * * *'
  # Trigger esterno PRIMARIO: cron-job.org chiama workflow_dispatch ogni
  # 5 minuti via API GitHub (Personal Access Token fine-grained con
  # permessi Actions: write sul solo sito-pc-genzano). Latenza end-to-end
  # osservata al cambio livello DPC: ~15 secondi.
  #
  # Configurazione cron-job.org gestita dall'utente su:
  # https://console.cron-job.org/jobs
  #
  # Architettura "doppio trigger" (FAIL-SAFE):
  # - cron-job.org primary: SLA 99.9%, garantisce ogni 5 min puntuale
  # - GitHub schedule: ridondanza se cron-job.org va giù (drift accettabile
  #   come secondario)
  # Lo script anti-spam interno (soglia stale_check 5h45min) impedisce
  # commit duplicati anche se i due trigger sparano ravvicinati.
  workflow_dispatch:

permissions:
  contents: write
  # actions: write serve anche a cancellare la copia vecchia dello stato dei
  # guasti (gh cache delete); issues: write alla issue `fonte-rotta`.
  actions: write
  issues: write

# Con 12 run/ora (cron-job.org ogni 5 min) due run possono sovrapporsi
# sul commit/push. In coda, non cancellati: un run di allerta non si
# uccide mai (potrebbe essere quello che rileva il cambio livello).
concurrency:
  group: check-allerta
  cancel-in-progress: false

jobs:
  check-allerta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      # Guasti delle fonti (17/10/2026, istruzione dell'utente: «gli errori 404
      # e simili non devono mai essere ignorati»). I tre script annotano in
      # $FONTI_KO_FILE ogni fonte che non hanno letto («fonte<TAB>motivo») e
      # lasciano intatti i dati in vigore. Lo stato fra un giro e l'altro (da
      # quando e per quanti giri di fila una fonte è giù) sta nella cache di
      # Actions, non in un file del repository: un commit ogni 5 minuti per un
      # contatore riempirebbe la storia e farebbe partire il coalescer.
      - name: "♻️ Stato dei guasti delle fonti (giro precedente)"
        id: stato_restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/stato-fonti
          key: allerta-fonti-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allerta-fonti-

      - name: "🗒️ Registro dei guasti di questo giro"
        run: |
          echo "FONTI_KO_FILE=$RUNNER_TEMP/fonti-ko.txt" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/fonti-ko.txt"

      - name: "🛠️ Setup pdftotext (per fallback PDF Regione Lazio)"
        # pdftotext serve SOLO al fallback PDF Regione Lazio (il percorso primario
        # è il CSV opendatasicilia). `apt-get update` prima dell'install evita il
        # 404 sul .deb stantio dell'immagine runner; se l'install fallisce comunque,
        # il job prosegue (warning) anziché bloccare l'intera verifica allerta.
        run: |
          if command -v pdftotext >/dev/null 2>&1; then exit 0; fi
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends poppler-utils \
            || echo "::warning::poppler-utils non installato: fallback PDF Regione Lazio disattivato per questo run (resta attivo il percorso CSV primario)."

      - name: "🔍 Verifica livello allerta DPC per Genzano di Roma"
        id: check
        run: python3 scripts/check-allerta.py


      - name: "🌬️ Check avvisi meteo avversi (vento, neve, calore)"
        id: avvisi
        run: python3 scripts/check-avvisi-meteo.py

      - name: "🔥 Check rischio incendi boschivi (AIB Regione Lazio)"
        id: incendi
        run: python3 scripts/check-rischi-incendi.py

      - name: "📝 Commit e push se allerta/avviso/incendi cambiato"
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/allerta.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica a data/allerta.json: skip commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Messaggio commit combinato: descrive cosa è cambiato
          MSG_PARTS=()
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            MSG_PARTS+=("${{ steps.check.outputs.motivo }}")
          fi
          if [ "${{ steps.avvisi.outputs.changed }}" = "true" ]; then
            if [ -n "${{ steps.avvisi.outputs.tipo }}" ]; then
              MSG_PARTS+=("avviso meteo: ${{ steps.avvisi.outputs.tipo }} ${{ steps.avvisi.outputs.livello }}")
            else
              MSG_PARTS+=("avviso meteo cessato")
            fi
          fi
          if [ "${{ steps.incendi.outputs.changed }}" = "true" ]; then
            if [ -n "${{ steps.incendi.outputs.livello_aib }}" ]; then
              MSG_PARTS+=("rischio incendi: ${{ steps.incendi.outputs.livello_aib }}")
            else
              MSG_PARTS+=("rischio incendi cessato")
            fi
          fi
          MSG_HEAD=$(IFS=' + '; echo "${MSG_PARTS[*]}")
          [ -z "$MSG_HEAD" ] && MSG_HEAD="aggiornamento periodico"
          # Cambio SOSTANZIALE = livello oggi, pre-allerta domani, avviso
          # meteo o rischio incendi. Il solo heartbeat di `ultimo_controllo`
          # (check-allerta.py, ogni ≥5h45') si committa ma NON merita un
          # deploy urgente: ogni dispatch urgent annulla l'upload FTP in
          # corso (concurrency di deploy.yml) e lasciava il sito a pezzi
          # ~4 volte al giorno senza che nulla fosse cambiato per il
          # cittadino (audit 25/09/2026, F19). Lo raccoglie deploy-coalescer.yml.
          SOSTANZIALE=false
          if [ "${{ steps.check.outputs.sostanziale }}" = "true" ] \
             || [ "${{ steps.avvisi.outputs.changed }}" = "true" ] \
             || [ "${{ steps.incendi.outputs.changed }}" = "true" ]; then
            SOSTANZIALE=true
          fi
          echo "sostanziale=$SOSTANZIALE" >> "$GITHUB_OUTPUT"
          git commit -m "Allerta meteo: $MSG_HEAD" \
                     -m "Aggiornamento automatico da bollettino DPC (opendatasicilia), avvisi meteo e bollettino AIB Regione Lazio."
          # Retry+rebase per evitare conflitti di concorrenza con altri workflow
          for tentativo in 1 2 3; do
            if git push 2>&1; then break; fi
            echo "Push fallito (tentativo $tentativo), rebase..."
            git pull --rebase origin main || { echo "Rebase fallito"; exit 1; }
            if [ "$tentativo" = "3" ]; then echo "Push fallito dopo 3 tentativi"; exit 1; fi
          done
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Deploy URGENTE (preempta l'upload in corso) SOLO al cambio di stato:
      # livello, pre-allerta domani, avviso meteo, rischio incendi. Latenza
      # invariata (~15 s dal bollettino DPC al dispatch).
      - name: "🚀 Avvia deploy urgente (solo al cambio di stato)"
        if: steps.commit.outputs.committed == 'true' && steps.commit.outputs.sostanziale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy workflow..."
          gh workflow run deploy.yml --ref main -f priority=urgent

      # Heartbeat (solo `ultimo_controllo` aggiornato): nessun dispatch.
      # deploy-coalescer.yml vede il commit non deployato e lancia un deploy
      # `background` che si accoda senza annullare nulla (entro ~30 min).
      - name: "💤 Heartbeat: nessun deploy urgente"
        if: steps.commit.outputs.committed == 'true' && steps.commit.outputs.sostanziale != 'true'
        run: |
          echo "Commit di solo controllo periodico: il deploy lo raccoglie deploy-coalescer.yml (priorità background)."

      # I push fatti con il GITHUB_TOKEN NON auto-triggerano i workflow `push`:
      # notifica-telegram.yml ascolta su push -> data/allerta.json, ma non si
      # sveglia da solo per i commit automatici di questo workflow. Va avviato
      # esplicitamente, come deploy.yml qui sopra. notifica-telegram.py ha la
      # sua logica di de-duplica (confronta con HEAD~1, invia solo se il
      # livello e' davvero cambiato): chiamarlo a ogni commit e' sicuro.
      - name: "📲 Avvia notifica Telegram"
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering notifica-telegram workflow..."
          gh workflow run notifica-telegram.yml --ref main

      # Trigger ORARIO affidabile della cartina meteo Lazio.
      # meteo-lazio.yml dipendeva dal solo cron nativo GitHub (8 * * * *), che
      # ritarda e SCARTA i run schedulati nelle ore di carico: la cartina
      # restava ferma anche 5-7 ore (incidente 25/05/2026, ferma alle 06:48).
      # Questo workflow invece gira ogni 5 min puntuale via cron-job.org: nel
      # run che cade nei primi 5 minuti dell'ora lanciamo meteo-lazio.yml ->
      # esattamente 1 rigenerazione/ora sul trigger affidabile. Il cron interno
      # di meteo-lazio.yml (:08) resta come ulteriore fail-safe. Stesso pattern
      # "doppio trigger" delle allerte. Indipendente dal commit allerta: la
      # cartina va aggiornata anche quando il livello DPC non cambia.
      - name: "🌤️ Rigenera cartina meteo Lazio (una volta all'ora)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN=$(date -u +%-M)
          if [ "$MIN" -lt 5 ]; then
            echo "Minuto $MIN < 5: avvio meteo-lazio.yml (rigenerazione oraria)."
            gh workflow run meteo-lazio.yml --ref main
          else
            echo "Minuto $MIN: salto (la cartina si rigenera solo nei primi 5 min dell'ora)."
          fi

      # Una fonte giù per un giro è rumore (CDN, rete del runner); giù per tre
      # giri di fila o da oltre 30 minuti è un guasto da riparare: si apre UNA
      # issue in-place, si commenta al massimo ogni 6 ore e si chiude da sola
      # al primo giro in cui tutte e tre le verifiche leggono le loro fonti.
      # Il run resta verde: i dati letti dalle altre fonti sono già stati
      # committati, e la issue `fonte-rotta` la lavora la routine giornaliera.
      # Questi passi stanno in fondo al job perché il deploy urgente e la
      # notifica non aspettino le chiamate alle API di issue e cache.
      - name: "🩺 Valuta i guasti delle fonti"
        id: guasti
        if: always()
        env:
          ESITI: "${{ steps.check.outcome }} ${{ steps.avvisi.outcome }} ${{ steps.incendi.outcome }}"
        run: |
          mkdir -p "$RUNNER_TEMP/stato-fonti"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          tmp = os.environ["RUNNER_TEMP"]
          stato_path = os.path.join(tmp, "stato-fonti", "stato.json")
          ko_path = os.environ.get("FONTI_KO_FILE", os.path.join(tmp, "fonti-ko.txt"))
          adesso = datetime.now(timezone.utc)
          try:
              stato = json.load(open(stato_path, encoding="utf-8"))
          except Exception:
              stato = {}
          ko = {}
          if os.path.exists(ko_path):
              for riga in open(ko_path, encoding="utf-8"):
                  if "\t" in riga:
                      fonte, motivo = riga.rstrip("\n").split("\t", 1)
                      ko[fonte] = motivo
          completo = os.environ.get("ESITI", "").split() == ["success"] * 3
          nuovo = {}
          for fonte, motivo in ko.items():
              prec = stato.get(fonte, {})
              nuovo[fonte] = {"dal": prec.get("dal", adesso.isoformat()),
                              "giri": prec.get("giri", 0) + 1, "motivo": motivo}
          if not completo:
              # Uno script si è interrotto: le fonti che non ha controllato
              # conservano il loro stato, senza contare un giro in più.
              for fonte, voce in stato.items():
                  nuovo.setdefault(fonte, voce)
          json.dump(nuovo, open(stato_path, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          persistenti = {f: v for f, v in nuovo.items()
                         if v["giri"] >= 3 or (adesso - datetime.fromisoformat(v["dal"])).total_seconds() >= 1800}
          righe = []
          for fonte, v in sorted(persistenti.items()):
              dal = datetime.fromisoformat(v["dal"]).astimezone(ZoneInfo("Europe/Rome")).strftime("%d/%m/%Y alle %H:%M, ora italiana")
              righe.append(f"- **{fonte}** — giù da {v['giri']} giri di fila (dal {dal}): {v['motivo']}")
          with open(os.path.join(tmp, "fonti-elenco.md"), "w", encoding="utf-8") as f:
              f.write("\n".join(righe) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"persistenti={len(persistenti)}\n")
              f.write(f"tutto_ok={'true' if completo and not ko else 'false'}\n")
          print(f"Fonti in errore in questo giro: {len(ko)}; guasti persistenti: {len(persistenti)}")
          for r in righe:
              print(r)
          PY

      - name: "🚨 Issue «Allerta: una o più fonti non rispondono»"
        if: always() && steps.guasti.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSISTENTI: ${{ steps.guasti.outputs.persistenti }}
          TUTTO_OK: ${{ steps.guasti.outputs.tutto_ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Allerta: una o più fonti non rispondono"
          MARKER="<!-- allerta-fonti -->"
          EXISTING=$(gh issue list --label "fonte-rotta" --state open --limit 50 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ "${PERSISTENTI:-0}" -gt 0 ]; then
            {
              echo "$MARKER"
              echo "Le verifiche dell'allerta (\`check-allerta.yml\`, ogni 5 minuti) non riescono a leggere queste fonti:"
              echo ""
              cat "$RUNNER_TEMP/fonti-elenco.md"
              echo ""
              echo "Ultimo run: $RUN_URL"
              echo ""
              echo "**I dati in vigore non sono stati toccati**: un guasto di lettura non cambia né cancella allerta, avviso meteo o rischio incendi, e non rinnova la data dell'ultimo controllo mostrata sul sito. Finché il guasto dura, però, il sito non vede i cambi di livello di quella fonte."
              echo ""
              echo "## Che cosa fare"
              echo ""
              echo "1. Riprodurre in locale: \`python3 scripts/check-allerta.py\`, \`python3 scripts/check-avvisi-meteo.py\`, \`python3 scripts/check-rischi-incendi.py\` (servono rete e \`pdftotext\`)."
              echo "2. Aprire la fonte nel browser: se è cambiato l'indirizzo, il nome dei PDF o l'impaginazione, aggiornare lo script con l'indirizzo o il formato nuovi verificati con una richiesta reale."
              echo "3. Se è un disservizio dell'ente, annotarlo qui e aspettare: la issue si chiude da sola al primo giro in cui tutte le fonti rispondono."
              echo "4. Mai togliere la segnalazione del guasto per far tornare verde il controllo."
            } > "$RUNNER_TEMP/fonti-body.md"
            if [ -z "$EXISTING" ]; then
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/fonti-body.md" \
                --label "automazione" --label "fonte-rotta" --label "urgente"
            else
              ULTIMO=$(gh issue view "$EXISTING" --json createdAt,comments \
                --jq "[.createdAt] + [.comments[] | select(.body | contains(\"$MARKER\")) | .createdAt] | max")
              ETA=$(( $(date -u +%s) - $(date -u -d "$ULTIMO" +%s) ))
              if [ "$ETA" -ge 21600 ]; then
                gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/fonti-body.md"
              else
                echo "Issue #$EXISTING aggiornata da meno di 6 ore: nessun commento."
              fi
            fi
          elif [ "${TUTTO_OK:-false}" = "true" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "$MARKER
          Tutte le fonti dell'allerta rispondono di nuovo ($RUN_URL)."
          else
            echo "Nessuna issue da aprire o chiudere."
          fi

      - name: "💾 Salva lo stato dei guasti"
        if: always() && steps.guasti.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/stato-fonti
          key: allerta-fonti-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "🧹 Togli la copia vecchia dello stato"
        if: always() && steps.stato_restore.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECCHIA: ${{ steps.stato_restore.outputs.cache-matched-key }}
        run: |
          gh cache delete "$VECCHIA" --repo "${{ github.repository }}" || echo "Copia $VECCHIA già rimossa."
