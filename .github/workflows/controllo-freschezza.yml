name: Controllo freschezza contenuti

# Sweep settimanale di freschezza dei contenuti, su DUE estremi:
#   (1) check-freshness.py — articoli GIÀ PUBBLICATI e "anziani" (>18/30 mesi)
#       che contengono informazioni che invecchiano (telefoni, norme, link esterni).
#   (2) check-articoli-programmati.py — articoli PROGRAMMATI in uscita imminente
#       (prossimi 14 giorni) che citano norme o telefoni: contenuto congelato alla
#       stesura ma che va live "fresco" per data → riverificare PRIMA del deploy.
# Apre/aggiorna 1 sola issue con entrambi gli elenchi; la riparazione si fa in
# sessione con gli agent `pc-content-freshness` e `pc-normative-verifier`.
# Non tocca il sito, non fa deploy.
#
# È volutamente SILENZIOSO finché non c'è nulla da segnalare: su un sito giovane
# (1) non apre nulla e si attiva col tempo; (2) apre solo se in coda ci sono
# articoli imminenti che citano norme/telefoni.
#
# Scaglionato lunedì 11:07 UTC (slot libero tra i vari audit del lunedì).

on:
  schedule:
    - cron: '7 11 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  controllo-freschezza:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rileva articoli da riverificare
        id: scan
        run: |
          set +e
          python3 scripts/check-freshness.py > /tmp/freschezza.md
          OLD=$?
          python3 scripts/check-articoli-programmati.py > /tmp/programmati.md
          SOON=$?
          set -e
          # Report combinato: vecchi (1) + in uscita imminente (2).
          : > /tmp/report-freschezza.md
          if [ "$OLD" -ne 0 ]; then
            cat /tmp/freschezza.md >> /tmp/report-freschezza.md
          fi
          if [ "$SOON" -ne 0 ]; then
            if [ "$OLD" -ne 0 ]; then
              printf "\n\n---\n\n" >> /tmp/report-freschezza.md
            fi
            cat /tmp/programmati.md >> /tmp/report-freschezza.md
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "soon=$SOON" >> "$GITHUB_OUTPUT"
          echo "total=$((OLD + SOON))" >> "$GITHUB_OUTPUT"
          echo "----- report -----"
          cat /tmp/report-freschezza.md

      - name: Apri/aggiorna issue se ci sono articoli da riverificare
        if: steps.scan.outputs.total != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Freschezza contenuti: ${{ steps.scan.outputs.old }} vecchi + ${{ steps.scan.outputs.soon }} in uscita da riverificare"
          # Label garantita (idempotente): senza, gh issue create fallisce
          # con "could not add label" e il job muore (audit 10/06/2026).
          gh label create "freschezza" --color "FBCA04" \
            --description "Freschezza contenuti" 2>/dev/null || true
          EXISTING=$(gh issue list --label "automazione" --label "freschezza" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE"
            gh issue comment "$EXISTING" --body-file /tmp/report-freschezza.md
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/report-freschezza.md \
              --label "automazione" \
              --label "freschezza"
          fi

      - name: Nessun articolo da riverificare
        if: steps.scan.outputs.total == '0'
        run: echo "✓ Nessun articolo da riverificare (né vecchi né in uscita imminente con norme/telefoni)."
