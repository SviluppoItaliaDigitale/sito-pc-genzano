name: "📅 Data di uscita degli articoli programmati"

# Ogni sera controlla gli articoli che usciranno nei prossimi 10 giorni: se il
# titolo, la descrizione o il primo paragrafo raccontano al presente una data
# lontana dal giorno di uscita («15 ottobre: si chiude…» pubblicato il 28
# settembre), apre un'issue urgente con l'elenco e la richiude da sola quando
# la coda è pulita. Logica in scripts/check-data-uscita.py; la correzione si fa
# con l'agente pc-calendario-editoriale.
#
# Nasce il 28/09/2026. validate-pr.yml blocca già le PR che toccano un articolo
# incoerente; questo controllo copre ciò che arriva su main senza PR (push dal
# PC) e gira di sera, prima che la mezzanotte metta online gli articoli del
# giorno dopo.

on:
  schedule:
    - cron: "23 17 * * *"   # 19:23 italiane (ora legale), prima della mezzanotte
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: controllo-data-uscita
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📅 Controlla gli articoli in uscita nei prossimi 10 giorni"
        id: controllo
        shell: bash
        run: |
          set +e
          python3 scripts/check-data-uscita.py --giorni 10 > /tmp/data-uscita.txt
          n=$?
          cat /tmp/data-uscita.txt
          echo "segnalati=$n" >> "$GITHUB_OUTPUT"

      - name: "🚨 Apri, aggiorna o chiudi l'issue"
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/data-uscita.txt', 'utf-8');
            const segnalati = parseInt('${{ steps.controllo.outputs.segnalati }}', 10) || 0;
            const title = '[Automatico] Articoli programmati con la data di uscita incoerente';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automazione', per_page: 100
            });
            const issue = existing.data.find(i => i.title === title);
            const body = [
              'Questi articoli usciranno nei prossimi 10 giorni ma raccontano al presente una data lontana dal giorno di uscita: pubblicati così, direbbero al cittadino che una cosa accade oggi quando non è vero.',
              '',
              '**Come si corregge** (agente `pc-calendario-editoriale`): si sposta `date:` vicino al fatto annunciato, oppure si riscrivono titolo, descrizione e attacco al futuro («si chiuderà il…», «fino al…»). Se la data va cambiata, si controlla anche che nello stesso giorno non ci siano altri articoli (formato data per più articoli al giorno, rule 02).',
              '',
              '```', report.trim(), '```',
              '',
              '---', '*Issue generata dal workflow `controllo-data-uscita.yml`; si chiude da sola quando la coda è pulita.*'
            ].join('\n');
            if (segnalati > 0) {
              if (issue) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['automazione', 'urgente'] });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: 'La coda dei prossimi 10 giorni è pulita: chiudo automaticamente.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
