name: "🧲 Deploy coalescer (dati non urgenti)"

# Raggruppa i deploy degli aggiornamenti di SFONDO (cartine meteo, ECMWF, clima,
# video correlati, stato-sistema, QR, pacchetti, indice ricerca) in UN SOLO deploy
# periodico, invece di farne uno per ogni commit automatico.
#
# Modello di priorità del deploy (vedi rule 10-automazioni-github-actions.md):
#   🔴 Urgente   → check-allerta, pubblica-programmata: deploy immediato (-f priority=urgent)
#   🟦 Contenuti → merge PR articoli: deploy immediato (evento push, preempta)
#   ⬜ Sfondo    → questo coalescer: un deploy ogni ~30 min (-f priority=background, cede)
#
# I workflow di sfondo committano soltanto (niente più "gh workflow run deploy.yml"):
# qui si controlla se main è avanti rispetto all'ultimo deploy e, se sì, si lancia
# un singolo deploy a priorità background (che non preempta mai allerta/contenuti).

on:
  schedule:
    # 2×/ora, orari espliciti scaglionati fuori dai quarti d'ora canonici
    # (memory: i cron espliciti battono i pattern */N su GitHub Actions).
    # NB: lo scheduler GitHub può ritardare/saltare gli slot anche per ore
    # (incidente 11/06/2026: 6 slot saltati, cartina meteo live ferma 5 ore).
    # Il cron resta come fallback; il trigger puntuale è workflow_run qui sotto.
    - cron: "13,43 * * * *"
  # Trigger puntuale e affidabile: appena un workflow di sfondo frequente
  # completa (e ha eventualmente committato), il coalescer parte subito.
  # workflow_run non subisce i ritardi dello scheduler; la catena è ancorata
  # al trigger esterno cron-job.org che lancia i workflow meteo ogni ora.
  # Il check HEAD-vs-ultimo-deploy sotto evita comunque deploy ridondanti.
  workflow_run:
    workflows:
      - "🌤️ Cartina meteo Lazio + riquadro Genzano"
      - "🗺️ Cartine meteo extra (animazione Lazio + sinottica Italia)"
      - "🌍 Carte ECMWF OpenCharts (Meteo Europa)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: "deploy-coalescer"
  cancel-in-progress: false

jobs:
  coalesce:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "🧲 Deploy se main è avanti rispetto all'ultimo deploy"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          # Guardia anti-accavallamento: se c'è GIÀ un deploy in corso o in coda,
          # NON lanciarne un altro. Senza questa guardia i deploy di sfondo si
          # accavallano e — soprattutto durante un upload integrale lungo — si
          # cancellano a catena, così nessuno completa (incidente 03/07/2026).
          # Un deploy in corso porterà comunque live lo stato più recente di main.
          ACTIVE="$(gh run list --workflow=deploy.yml --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)"
          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "→ C'è già un deploy attivo (in corso/in coda): skip per non accavallare."
            exit 0
          fi
          # headSha dell'ultimo run di deploy.yml (qualsiasi stato): se coincide
          # con HEAD, un deploy per questo commit è già partito/concluso → skip.
          LAST_SHA="$(gh run list --workflow=deploy.yml --limit=1 --json headSha -q '.[0].headSha' 2>/dev/null || echo "")"
          echo "HEAD main      = $HEAD_SHA"
          echo "ultimo deploy  = ${LAST_SHA:-<nessuno>}"
          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" != "$HEAD_SHA" ]; then
            echo "→ Ci sono commit non ancora deployati: lancio un deploy (priorità background)."
            gh workflow run deploy.yml --ref main -f priority=background
          else
            echo "→ Nessun commit nuovo da deployare. Skip (niente deploy ridondante)."
          fi
