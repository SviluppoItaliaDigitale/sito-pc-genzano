name: "Prepara copertina meteo spaziale"
on:
  push:
    branches:
      - chatgpt/meteo-spaziale-ingv-20261027
    paths:
      - .github/workflows/prepara-copertina-meteo-spaziale.yml
permissions:
  contents: write
concurrency:
  group: copertina-meteo-spaziale-20261027
  cancel-in-progress: false
jobs:
  copertina:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepara i file necessari
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.githooks/
            /content/comunicazioni/2026-10-27-meteo-spaziale-sala-monitoraggio-ingv.md
            /static/images/logo-pc-genzano.png
            /static/vendor/bootstrap-italia/fonts/Titillium_Web/
      - name: Installa il motore grafico
        run: python3 -m pip install --quiet Pillow==12.3.0
      - name: Genera la copertina istituzionale
        run: python3 scripts/genera-cover.py content/comunicazioni/2026-10-27-meteo-spaziale-sala-monitoraggio-ingv.md
      - name: Conserva la copertina nel ramo di lavoro
        run: |
          bash scripts/imposta-identita-git.sh
          git add -- static/images/2026-10-27-meteo-spaziale-sala-monitoraggio-ingv.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Aggiunge la copertina della notizia sul meteo spaziale"
          git push origin HEAD:refs/heads/chatgpt/meteo-spaziale-ingv-20261027
