name: "🚀 Build e Deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      priority:
        description: "Origine del deploy: urgent (allerta, pubblicazione del mattino, lancio a mano) | background (coalescer). Dall'11/11/2026 decide solo la copia d'archivio: la fila del caricamento è una sola."
        required: false
        default: "urgent"

# Permessi minimi a livello di workflow; ogni job chiede i suoi.
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────
# Un solo percorso, veloce, in un'unica fila (11/11/2026)
#
# Richiesta di Alessandro: online in 1-2 minuti dall'unione, come gli altri
# siti; nessuna corsia speciale (Allerta ed Emergenza seguono lo stesso
# percorso, con gli stessi controlli). Il 11/11/2026 un deploy durava 13-18
# minuti: 5 in coda, 49 s di checkout, 6,5 minuti di caricamento FTP su un
# solo collegamento (587 file), 4 minuti di verifica, 1 minuto di GitHub
# Pages nello stesso job. Da qui:
#
#  - job `aruba`: build + caricamento + verifica, in un'unica fila
#    (`concurrency` del job, MAI annullato: un caricamento iniziato arriva in
#    fondo). GitHub tiene un solo giro in attesa, sempre l'ultimo: un'unione
#    nuova prende il posto di quella ancora in attesa, che non serve più
#    perché la nuova costruisce `main` con tutto dentro. Fino all'11/11/2026
#    i dispatch urgent (allerta meteo, pubblicazione del mattino) annullavano
#    il deploy in corso: con un caricamento da un minuto non serve più, e un
#    caricamento interrotto è proprio ciò che lasciava il sito a pezzi;
#  - il caricamento lo fa scripts/carica-aruba.py: solo i file cambiati, più
#    collegamenti in parallelo, nome provvisorio e rinomina, ricontrollo di
#    ogni file, cartelle nuove prima e cancellazioni dopo, lucchetto sul
#    server (mai due caricamenti insieme). L'azione FTP-Deploy resta come
#    ripiego solo se lo script non è riuscito a toccare nulla;
#  - job `pages`: la copia di anteprima su GitHub Pages si costruisce su
#    un'altra macchina, in parallelo, senza tenere occupata la fila di Aruba.
#
# Storia della concurrency, in breve: fino al 02/07/2026 ogni push annullava
# il deploy in corso e con push fitti nessun deploy completava (7 ore di
# deploy annullati, pagine nuove a 403 per cartelle vuote); dall'08/10/2026
# anche i push di contenuti si accodavano e annullavano solo i dispatch
# urgent (tre unioni in cinque minuti avevano lasciato il sito servito a
# pezzi). Dall'11/11/2026 non annulla più nessuno.
# ─────────────────────────────────────────────────────────────────────────

jobs:
  aruba:
    name: "Build e caricamento su Aruba"
    runs-on: ubuntu-latest
    concurrency:
      group: aruba-caricamento
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write  # per chiamare genera-social-bozze.yml e archivia-wayback.yml a fine caricamento
    # 60 minuti: un caricamento normale dura un paio di minuti; il margine
    # serve al giro che, senza file di stato sul server, deve ricaricare
    # tutto l'indice di ricerca. Un job ucciso dal tempo riceve SIGINT e
    # SIGTERM: lo script lascia il lucchetto e l'elenco dei file in sospeso,
    # e il giro successivo riparte da lì.
    timeout-minutes: 60
    steps:
      - name: "📥 Checkout"
        # La storia serve a enableGitInfo (data di ultima modifica). Con
        # `filter: blob:none` arrivano commit e cartelle di tutta la storia ma
        # solo i contenuti dei file di adesso: Hugo legge le date con
        # `git log --name-only` e `diff.renames=0` (bep/gitmap), che non
        # chiede i contenuti vecchi. Fino all'11/11/2026 `fetch-depth: 0`
        # scaricava tutto in 49 s.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: "🧭 La storia di git c'è tutta (date di ultima modifica)"
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          echo "Commit nella storia: $(git rev-list --count HEAD)"

      - name: "🏗️ Prepara e costruisci per Aruba"
        uses: ./.github/actions/prepara-build
        with:
          base-url: "https://www.protezionecivilegenzano.it/"
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📅 Date di ultima modifica uguali a quelle servite"
        continue-on-error: true
        run: python3 scripts/controlla-lastmod.py public/sitemap.xml

      - name: "📜 Manifesto della build e manifesto servito prima del caricamento"
        # build-manifest.json = impronta sha256 di ogni file di public/
        # (scripts/genera-manifest-build.py). Quello servito adesso dal sito
        # è il riferimento del caricamento insieme al file di stato: un file
        # che il manifesto servito dà diverso dalla build si ricarica anche
        # se il file di stato lo crede uguale.
        run: |
          set -euo pipefail
          python3 scripts/genera-manifest-build.py public
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' \
            "https://www.protezionecivilegenzano.it/build-manifest.json?cb=$RANDOM$RANDOM" \
            -o /tmp/manifesto-precedente.json \
            && python3 -c "import json; m=json.load(open('/tmp/manifesto-precedente.json')); print('Manifesto live precedente: build', m.get('sha'), m.get('time'))" \
            || { echo "::notice::Nessun manifesto precedente sul sito: il riferimento è il solo file di stato."; rm -f /tmp/manifesto-precedente.json; }

      - name: "📤 Caricamento su Aruba (solo i file cambiati, in parallelo)"
        id: carica
        # Uscite (scripts/carica-aruba.py): ok · ripiego (nulla toccato: si
        # può usare l'azione) · rosso (caricamento iniziato e non completo:
        # manifesto e stato del server restano quelli di prima e il giro
        # successivo ricarica tutto ciò che è ancora diverso) · blocca (né
        # stato né manifesto leggibili) · occupato (lucchetto di un altro
        # caricamento oltre l'attesa).
        # 🔴 `--stato-nome` è lo `state-name` di sempre: NON cambiarlo
        # (03/07/2026: un nome nuovo = ricaricare tutto il sito, ore, sito
        # congelato per un giorno). Mai documenti/, gestita a mano sul server.
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: /www.protezionecivilegenzano.it/
        run: |
          set -uo pipefail
          ARGS=()
          if [ -s /tmp/manifesto-precedente.json ]; then ARGS=(--manifesto-servito /tmp/manifesto-precedente.json); fi
          python3 scripts/carica-aruba.py --public public \
            --stato-nome .ftp-deploy-sync-state-2026-06-09.json \
            --connessioni 4 "${ARGS[@]}" | tee /tmp/carica-aruba.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### Caricamento su Aruba"
            echo '```'
            grep -v '^  ' /tmp/carica-aruba.txt | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: "📤 Ripiego: azione FTP-Deploy (solo se il caricamento non ha toccato nulla)"
        # Legge lo stesso file di stato che carica-aruba.py scrive nel suo
        # formato (provato con l'azione vera l'11/11/2026: dopo un
        # caricamento dello script vede zero differenze), quindi riparte da
        # dove lo script è arrivato. Solo con l'esito «ripiego»: dopo un
        # caricamento iniziato e fallito si ferma tutto in rosso, perché
        # l'azione non ricontrolla i file e aggiornerebbe il manifesto.
        if: ${{ steps.carica.outcome == 'failure' && steps.carica.outputs.esito == 'ripiego' }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS esplicito (audit 25/09/2026, rilievo F01).
          protocol: ftps
          local-dir: ./public/
          server-dir: /www.protezionecivilegenzano.it/
          dangerous-clean-slate: false
          # 🔴 NON bumpare `state-name` (incidente 03/07/2026, vedi sopra).
          state-name: .ftp-deploy-sync-state-2026-06-09.json
          timeout: 60000
          log-level: standard
          exclude: |
            **/documenti/**

      - name: "🛑 Caricamento non completo"
        if: ${{ steps.carica.outcome == 'failure' && steps.carica.outputs.esito != 'ripiego' }}
        env:
          ESITO: ${{ steps.carica.outputs.esito }}
        run: |
          echo "::error::Caricamento su Aruba non completo (esito: ${ESITO:-interrotto}). Manifesto e stato del server non sono stati aggiornati: il prossimo deploy ricarica tutto ciò che è ancora diverso. Dettagli nel riepilogo del run."
          exit 1

      - name: "📣 Materiale social per gli articoli appena online"
        # Ogni articolo che esce sul sito esce anche sui social (21/09/2026).
        # workflow_dispatch perché `workflow_run` non parte per i run lanciati
        # col GITHUB_TOKEN (22/09/2026). Non blocca mai il deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genera-social-bozze.yml --repo "$GITHUB_REPOSITORY" --ref main -f recupero=true \
            || echo "::warning::Chiamata al materiale social non riuscita: ci pensa il giro orario."

      - name: "🗄️ Copia d'archivio degli articoli appena online"
        # Solo per i deploy di contenuti (unioni, pubblicazione programmata,
        # lanci a mano): quelli di sfondo del coalescer arrivano ogni mezz'ora.
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.priority != 'background') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run archivia-wayback.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::Chiamata alla copia d'archivio non riuscita: ci pensa il giro giornaliero."

      - name: "🔁 Verifica il sito servito contro la build"
        # Guardia anti-stale dal lato del visitatore (01/10/2026): build-info.js,
        # pagine critiche, ultimo articolo e 30 pagine a caso, scaricate dal
        # sito senza cache e confrontate col manifesto; un file diverso si
        # ricarica via FTPS. Dall'11/11/2026 i file cambiati li ha già
        # ricontrollati il caricamento sul server uno per uno, quindi qui non
        # si ripetono, e le richieste vanno 8 alla volta: da 4 minuti a
        # pochi secondi. Resta nel job (dentro la fila) perché una riparazione
        # non deve mai incrociare il caricamento del giro dopo.
        # Non ferma il deploy: verifica-deploy-aruba.yml rifà il controllo e
        # apre l'issue.
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: /www.protezionecivilegenzano.it/
        run: |
          set -uo pipefail
          python3 scripts/verifica-deploy-aruba.py \
            --manifesto public/build-manifest.json --public public \
            --sha-atteso "${GITHUB_SHA:0:7}" \
            --campione 30 --seme "$GITHUB_RUN_ID" --paralleli 8 \
            --tentativi 2 --attesa 10 --ripara | tee /tmp/verifica-deploy.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### Verifica del sito servito contro la build"
            echo '```'
            tail -40 /tmp/verifica-deploy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error::Alcuni file su Aruba non coincidono con la build anche dopo la riparazione: vedi il riepilogo. verifica-deploy-aruba.yml aprirà l'issue."
          fi
          exit "$rc"

  pages:
    name: "Build per GitHub Pages"
    runs-on: ubuntu-latest
    # Copia di anteprima: conta solo l'ultima, quindi un giro nuovo annulla
    # quello in corso. È su un'altra macchina: Aruba non si tocca mai da qui.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: "🏗️ Prepara e costruisci per GitHub Pages"
        uses: ./.github/actions/prepara-build
        with:
          base-url: "https://sviluppoitaliadigitale.github.io/sito-pc-genzano/"
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🪶 Alleggerisci la copia per GitHub Pages (Aruba non si tocca)"
        # 06/11/2026 e 10/11/2026: la copia completa pesava ~1,9 GB (limite
        # GitHub 1 GB) e la pubblicazione si interrompe a 10 minuti
        # (MAX_TIMEOUT di actions/deploy-pages, non alzabile; issue #1724,
        # run 42785262755 e 42785886025). Dalla sola copia escono video,
        # audio, presentazioni, ZIP, PDF e PNG/JPEG oltre 2 MB; tetto 500 MB.
        # Lo script si ferma (uscita 2) se la cartella è la build per Aruba
        # (sì di Alessandro del 06/11/2026: «i files sul server Aruba non
        # vengano toccati»); dall'11/11/2026 gira anche su un'altra macchina.
        run: python3 scripts/alleggerisci-copia-pages.py public --tetto-mb 500

      - name: "📜 Manifesto della build (GitHub Pages)"
        run: python3 scripts/genera-manifest-build.py public

      - name: "📦 Upload artifact GitHub Pages"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy-pages:
    needs: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-pubblicazione
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 45
    steps:
      - name: "🌐 Deploy GitHub Pages"
        id: deployment
        # Il timeout dell'azione è al massimo 10 minuti (600000 ms): vedi il
        # passo di alleggerimento.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
