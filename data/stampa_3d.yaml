      - ["Scritte di un altro colore", "le scritte sono l'ultimo millimetro del pezzo con il nominativo. Per averle di un colore diverso dal fondo, nel programma di stampa aggiungi un cambio di colore all'altezza di 10,8 mm, cioè dopo lo strato 54 con strati da 0,2 mm: la stampante si ferma, cambi il filo e finisce le scritte con il secondo colore"]
