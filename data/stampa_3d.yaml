  - id: "appendiabiti"
    nome: "Appendiabiti da armadietto"
    articolo: "l'appendiabiti"
    descrizione: "Gancio robusto per giacca, zaino o casco, con la piastra del nominativo, la bandiera italiana e «Protezione Civile Genzano di Roma». Il gancio è largo quanto la piastra. Si fissa nell'armadietto con due viti o con nastro biadesivo."
    categoria: "sede"
    breve: "Gancio per giacca, zaino o casco, da avvitare o incollare nell'armadietto."
    sorgente: "ganci-nominativo.scad"
    anteprima: &gancio
      base: "#1d4f9a"
      rilievo: "#f07d00"
      rilievo_mm: 1.0
      bandiera: [-36.5, 1.75, -23.75, 10.25]
      vista_3d: true
      fianco: -40   # si stampa in piedi sul lato sinistro (x = -40), senza supporti
      nome: {zona: [-37, -29.5, 37, -22.5], lato: "fronte"}   # riga di nome e cognome (static/js/stampa3d-nome-core.js)
    parametri:
      tipo: "appendiabiti"
      parte: "tutto"
    misure: "8 × 6,3 cm, sporge 3,3 cm"
    lunghezza_mm: 80
    peso_g: 71
    scheda:
      - ["Ingombro", "80 × 63 mm, sporge 33 mm dalla parete"]
      - ["Peso", "circa 71 g"]
      - ["Piastra", "spessa 5 mm, scritte in rilievo di 1 mm"]
      - ["Gancio", "largo 80 mm; braccio spesso 10 mm, punta alta 7 mm; 21 mm liberi fra la piastra e la punta; rinforzo a 45 gradi alla base"]
      - ["Fori", "2 per viti a testa svasata da 4 mm (foro 4,4 mm, svasatura 8,8 mm: la testa di una vite per legno da 4 mm è larga 8 mm e resta a filo), a 66 mm l'uno dall'altro"]
      - ["Scritte di un altro colore", "per come il pezzo è girato sul piatto di stampa, le scritte non sono l'ultimo strato: un cambio di filo non basta a colorarle. Per metterle in evidenza, a pezzo finito ripassa il rilievo con un pennarello a vernice a punta fine. Provalo prima su un pezzo di scarto dello stesso filo: la tenuta dipende dal materiale"]
      - ["Posizione di stampa", "in piedi sul lato sinistro, già orientato nel file, senza supporti"]
    materiale: "PETG"
    colore: "blu"
    occorrente:
      - "per il muro: due viti per legno o truciolare a testa svasata piana da 4 mm, lunghe 40 mm, e due tasselli per viti da 4 mm; la confezione dei tasselli dice quale punta del trapano usare"
      - "per il legno o un pannello: due viti dello stesso tipo lunghe 20 mm, senza tasselli"
      - "per la lamiera (armadietto di metallo, pannello del mezzo): due viti M4 a testa svasata lunghe 16 mm, due rondelle M4 e due dadi M4 autobloccanti; il foro nella lamiera è da 4,5 mm e la rondella va dietro la lamiera, sotto il dado"
      - "in alternativa alle viti: nastro biadesivo di montaggio per esterni"
      - "trapano, cacciavite e, per i dadi, una chiave da 7 mm"
    montaggio:
