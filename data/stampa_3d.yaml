      - ["Altezza delle lettere", "nominativo 9 mm; righe piccole 4,5 mm"]
      - ["Scritte di un altro colore", "le scritte sono in rilievo di 1 mm: per averle di un altro colore, nel programma di stampa aggiungi un cambio di filo al primo strato delle scritte, cioè dopo lo strato 15 con strati da 0,2 mm (altezza 3,2 mm). Cambiano colore con le scritte anche la cornice e la bandiera, che sono in rilievo alla stessa altezza"]
