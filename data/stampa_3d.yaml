      - "Appoggia il braccio destro sul davanti: le sue due linguette coprono quelle del pezzo con il nominativo, sulle spalle e sulla barra."
      - "Metti le quattro viti dal davanti e stringile a mano, senza forzare: le teste devono restare sotto la superficie e le punte non devono uscire dal retro."
      - "Passa un dito sulle giunzioni e sui bordi: se senti un filo di plastica, toglilo con carta abrasiva fine, così non tira i tessuti."
      - "Appendi la giacca sulle spalle e i pantaloni sulla barra. Non usarla per zaini, borse o attrezzatura."

