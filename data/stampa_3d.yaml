      - "Infila prima la parte in basso, con la porta USB-C, poi spingi in dentro il bordo in alto, un angolo alla volta."
      - "Premi i tasti attraverso i cuscinetti: devono rispondere senza sforzo. Se un tasto non risponde, non usare la cover."
