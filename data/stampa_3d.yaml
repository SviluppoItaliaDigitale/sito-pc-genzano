      - "per la lamiera (armadietto di metallo, pannello del mezzo): tre viti M4 a testa svasata lunghe 16 mm, tre rondelle M4 e tre dadi M4 autobloccanti; il foro nella lamiera è da 4,5 mm e la rondella va dietro la lamiera, sotto il dado"
