  # Cover rinforzate per il telefono (24/11/2026): misure dai disegni dimensionali che Apple pubblica per chi
  # progetta accessori (developer.apple.com, Accessory Design Guidelines, disegni del 09/09/2025, del 19/09/2024
  # per iPhone 16 e del 09/03/2026 per iPhone 17e), consultati il 24/11/2026. iPhone è un marchio di Apple Inc.:
  # si usa solo nella forma «per iPhone …», mai come nome dell'oggetto né con loghi Apple. Scritte incise sul retro
  # a specchio («incise» nell'anteprima): la cover si stampa con il retro sul piano.
  - id: "cover-iphone-17"
    nome: "Cover rinforzata per iPhone 17"
    articolo: "la cover"
    descrizione: "Cover dall'aspetto robusto, con gli angoli rinforzati, il bordo rialzato sopra lo schermo e righe in rilievo sui fianchi per la presa. Sul retro porta incisi la bandiera italiana, il nominativo e «Protezione Civile Genzano di Roma». Le misure vengono dai disegni che Apple pubblica per chi progetta accessori. Si stampa in TPU, una plastica gommosa: non è una protezione certificata contro le cadute. Non protegge il vetro della fotocamera, copre il carrellino della SIM e non va con le basi di ricarica. Prima stampane una e prova che il telefono entri e che i tasti funzionino. iPhone è un marchio di Apple Inc.: questa cover non è un prodotto Apple e Apple non l'ha approvata."
    categoria: "telefono"
    breve: "Cover gommosa con angoli rinforzati e il nominativo inciso sul retro."
    sorgente: "cover-nominativo.scad"
    anteprima:
      base: "#30363d"
      rilievo: "#f07d00"
      rilievo_mm: 0.6
      incise: true
      bandiera: [16.71, -31.31, 27.21, -24.31]
      nome: { zona: [-28, -58.31, 28, -51.31], lato: "retro" }
    parametri:
      tipo: "iphone17"
      parte: "tutto"
    misure: "15,6 × 7,8 cm, alta 1,1 cm"
    lunghezza_mm: 155.9
    peso_g: 34
    scheda:
      - ["Telefono", "iPhone 17: 71.45 × 149.61 mm, spesso 7,95 mm, dai disegni di Apple"]
      - ["Ingombro", "155,9 × 77,8 mm agli angoli, alta 11,15 mm"]
      - ["Pareti", "2 mm sui fianchi, 3 mm agli angoli; gioco di 0,3 mm per lato fra telefono e cover"]
      - ["Retro", "2 mm, sotto i 2,1 mm che Apple indica perché ricarica senza fili e MagSafe funzionino; nessun pezzo di metallo"]
      - ["Bordo sullo schermo", "1,2 mm più alto del vetro; copre 0,6 mm del telaio e non tocca il vetro"]
      - ["Aperture", "due fotocamere e flash in alto a sinistra (vista dal retro); porta USB-C in basso, con un'asola per altoparlante e microfoni e un foro a parte per il microfono più esterno; il Controllo fotocamera resta scoperto, come chiede Apple; azione, volume e tasto laterale coperti da cuscinetti da premere, con una tasca interna perché i tasti sporgono 0,45 mm dal telaio"]
      - ["Scritte", "incise 0,6 mm sul retro: nominativo alto 7 mm, righe piccole 4,5 mm"]
      - ["Spazio per nome e cognome", "fascia di 56 × 7 mm in basso sul retro, incisa"]
      - ["Limiti", "non protegge il vetro della fotocamera; copre il carrellino della SIM, che si raggiunge togliendo la cover; il fondo non entra nelle basi di ricarica; non è dichiarata conforme alle linee guida di Apple per gli accessori"]
      - ["Scritte di un altro colore", "le scritte sono incise sul retro, che sta sul piatto di stampa: un cambio di filo non le colora. Per metterle in evidenza, a pezzo finito passa nei solchi un pennarello a vernice a punta fine e togli subito con un panno ciò che resta fuori. Provalo prima su un pezzo di scarto dello stesso filo: la tenuta dipende dal materiale"]
      - ["Posizione di stampa", "con il retro sul piano, già orientata nel file, senza supporti"]
    materiale: "TPU 95A"
    colore: "nero"
    occorrente:
      - "nessun pezzo in più"
    montaggio:
      - "Prima di ordinarne altre, stampane una e prova il telefono: deve entrare con una leggera pressione e restare fermo."
      - "Infila prima la parte in basso, con la porta USB-C, poi spingi in dentro il bordo in alto, un angolo alla volta."
      - "Premi i tasti attraverso i cuscinetti: devono rispondere senza sforzo. Se un tasto non risponde, non usare la cover."
      - "La fotocamera resta più alta del retro della cover: appoggia il telefono sullo schermo, protetto dal bordo rialzato, e non sul dorso."
      - "Per toglierla spingi il telefono da dietro attraverso l'apertura della fotocamera e sfila prima un angolo in alto."

