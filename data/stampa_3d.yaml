# Oggetti da stampare in 3D con il nominativo dei volontari: catalogo in /stampa-3d/ e una pagina per
# oggetto in /stampa-3d/<id>/ (content/stampa-3d/_content.gotmpl), con i suoi file nella stessa cartella.
# Per un oggetto nuovo: aggiungi una voce in «oggetti» con la sua «categoria» (se serve un tipo nuovo,
# anche nel modello di partenza in scripts/stampa-3d/) e crea i file con «python3 scripts/genera-stampa-3d.py».
# Catalogo e pagina si aggiornano da soli.
# Regole dei file: quelle di Craftcloud per la stampa FDM (un pezzo per file, millimetri,
# pareti e tratti delle lettere dentro i minimi), controllate dallo script.
# «bandiera» = riquadro del tricolore nel modello [x0, y0, x1, y1], per colorarlo nelle anteprime.
# Materiale consigliato: PETG, più resistente agli urti e al caldo del PLA (in auto d'estate il PLA si deforma).

nominativi:
  prefisso: "ALFA"
  primo: 1
  ultimo: 100

servizio:
  nome: "Craftcloud"
  indirizzo: "https://craftcloud3d.com/"
  verificato: "2026-11-23"

# Gruppi del catalogo, nell'ordine in cui compaiono
categorie:
  - id: "natale"
    titolo: "Per Natale"
  - id: "giubbetto"
    titolo: "Sul giubbetto e in tasca"
  - id: "radio"
    titolo: "Per la radio"
  - id: "attrezzatura"
    titolo: "Zaino, casco e attrezzatura"
  - id: "intervento"
    titolo: "In intervento e sul mezzo"
  - id: "campo"
    titolo: "Al campo e in mensa"
  - id: "kit"
    titolo: "Kit, pile e schede"
  - id: "sede"
    titolo: "In sede e in sala operativa"
  - id: "telefono"
    titolo: "Per il telefono"

oggetti:
  # --- Serie di Natale (25/11/2026): quattro oggetti piatti di targhetta-nominativo.scad, tipi addobbo, stella, pacco, segnaposto
  - id: "addobbo-natale"
    nome: "Addobbo per l'albero"
    articolo: "l'addobbo"
    descrizione: "Disco blu da appendere all'albero di Natale, con «Buon Natale» fra due stelline, la bandiera italiana, il nominativo e «Protezione Civile Genzano di Roma». Ha un occhiello per il nastro. Sul retro, liscio, puoi aggiungere nome e cognome."
    categoria: "natale"
    breve: "Disco da appendere all'albero, con «Buon Natale» e il nominativo."
    sorgente: "targhetta-nominativo.scad"
    anteprima:
      base: "#1d4f9a"
      rilievo: "#f07d00"
      rilievo_mm: 1.0
      bandiera: [-33.0, 0.0, -21.0, 8.0]
      nome: {zona: [-25, -3.5, 25, 3.5], lato: "retro"}
    parametri:
      tipo: "addobbo"
      parte: "tutto"
      riga0: "BUON NATALE"
    misure: "7,6 × 8,5 cm, spesso 3,4 mm"
    lunghezza_mm: 76
    peso_g: 15
    scheda:
      - ["Ingombro", "disco di 76 mm, alto 85 mm con l'occhiello, spesso 3,4 mm (2,4 mm di base e 1 mm di scritte)"]
      - ["Peso", "circa 15 g"]
      - ["Occhiello", "foro da 4,5 mm per un nastro o uno spago"]
      - ["Altezza delle lettere", "nominativo 8 mm; righe piccole 4,5 mm"]
      - ["Scritte di un altro colore", "le scritte sono in rilievo di 1 mm: per averle di un altro colore, nel programma di stampa aggiungi un cambio di filo al primo strato delle scritte, cioè dopo lo strato 12 con strati da 0,2 mm (altezza 2,6 mm). Cambiano colore con le scritte anche la cornice, la bandiera e le due stelline, che sono in rilievo alla stessa altezza"]
      - ["Posizione di stampa", "in piano, già orientato nel file, senza supporti"]
      - ["Da sapere", "Si appende lontano da candele, stufe e lampadine che scaldano: il PETG comincia a deformarsi a 68 gradi. Con le luci a LED non c'è problema. Non è un giocattolo: tienilo fuori dalla portata dei bambini piccoli"]
    materiale: "PETG"
    colore: "blu"
    occorrente:
      - "un nastro o uno spago lungo circa 20 cm"
    montaggio:
      - "Infila il nastro nell'occhiello e annodalo ad anello."
      - "Appendilo a un ramo robusto, lontano dalle fonti di calore."

