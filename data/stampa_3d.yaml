  # --- Vassoio in tre pezzi avvitati, con targhetta, clip e piedini (25/11/2026, vassoio-nominativo.scad).
  # Il pezzo con il nominativo è la targhetta; «altri_pezzi» elenca gli altri file; «insieme» con «parte» è il
  # vassoio montato, fatto solo per le anteprime.
  - id: "vassoio"
    nome: "Vassoio porta piatto, bicchiere e posate"
    articolo: "il vassoio"
    descrizione: "Vassoio con due manici in cui piatto e bicchiere si infilano in un foro più stretto del loro bordo: restano appesi e non scivolano. La bottiglietta d'acqua da mezzo litro scende in un pozzetto e le posate stanno ferme sotto una clip a molla. Accanto a ogni posto una scritta appena incisa dice che cosa ci va. È rialzato su dodici piedini ed è fatto di tre pezzi che si avvitano o, a scelta, si uniscono a incastro senza viti, così ogni pezzo entra in una stampante da tavolo. Sopra porta una targhetta con la bandiera italiana, il nominativo e «Protezione Civile Genzano di Roma», che si stampa a parte e può avere le scritte di un altro colore."
    categoria: "campo"
    breve: "Piatto e bicchiere si infilano nei fori e non scivolano; pozzetto per la bottiglietta, clip per le posate, tre pezzi avvitati o a incastro."
    sorgente: "vassoio-nominativo.scad"
    anteprima:
      base: "#1d4f9a"
      rilievo: "#f07d00"
      rilievo_mm: 1.0
      bandiera: [-30.99, 10.0, -18.99, 18.0]
      vista_3d: true
      quota_scritte: 3.6
      sagoma_z: -1.6   # contorno letto dentro il piano del vassoio, sotto la targhetta
      camera: { da: [-0.35, -0.75, 0.6], su: [0, 0, 1] }
      insieme: { file: "vassoio-montato.stl", parte: "montato", incisioni_z: -0.4 }   # nelle anteprime il vassoio è montato
      nome: { zona: [-31, -0.5, 31, 6.5], lato: "fronte" }
    parametri:
      tipo: "vassoio"
      parte: "tutto"
    secondo_pezzo:
      parte: "sinistra180"
      file: "vassoio-pezzo-sinistro-foro-180.stl"
      nome: "il pezzo sinistro, con metà del foro del piatto"
      peso_g: 175
    altri_pezzi:
      - { parte: "destra", file: "vassoio-pezzo-destro.stl", nome: "il pezzo destro, con il foro del bicchiere e il pozzetto della bottiglietta", peso_g: 272 }
      - { parte: "clip", file: "vassoio-clip-posate.stl", nome: "la clip per le posate", peso_g: 4 }
      - { parte: "centro180", file: "vassoio-pezzo-centrale-foro-180.stl", nome: "il pezzo centrale con il foro da 180 mm", peso_g: 241, variante: "Seconda versione, con il foro del piatto da 180 mm: scarica questi due file al posto del pezzo sinistro e del pezzo centrale." }
      - { parte: "sinistra180_i", file: "vassoio-incastro-pezzo-sinistro-foro-180.stl", nome: "il pezzo sinistro a incastro", peso_g: 178, variante: "Versione a incastro, senza viti: questi tre pezzi prendono il posto dei tre pezzi con le viti e si uniscono con le cinque chiavette. Non è stata provata in stampa: stampa prima il provino." }
      - { parte: "centro180_i", file: "vassoio-incastro-pezzo-centrale-foro-180.stl", nome: "il pezzo centrale a incastro", peso_g: 243, variante: "Versione a incastro, senza viti: questi tre pezzi prendono il posto dei tre pezzi con le viti e si uniscono con le cinque chiavette. Non è stata provata in stampa: stampa prima il provino." }
      - { parte: "destra_i", file: "vassoio-incastro-pezzo-destro.stl", nome: "il pezzo destro a incastro", peso_g: 271, variante: "Versione a incastro, senza viti: questi tre pezzi prendono il posto dei tre pezzi con le viti e si uniscono con le cinque chiavette. Non è stata provata in stampa: stampa prima il provino." }
      - { parte: "farfalle", file: "vassoio-chiavette.stl", nome: "le cinque chiavette a farfalla", peso_g: 23, variante: "Versione a incastro, senza viti: questi tre pezzi prendono il posto dei tre pezzi con le viti e si uniscono con le cinque chiavette. Non è stata provata in stampa: stampa prima il provino." }
      - { parte: "provino", file: "vassoio-provino-incastro.stl", nome: "il provino: una sede e una chiavetta corta", peso_g: 4, variante: "Versione a incastro, senza viti: questi tre pezzi prendono il posto dei tre pezzi con le viti e si uniscono con le cinque chiavette. Non è stata provata in stampa: stampa prima il provino." }
      - { parte: "sinistra", file: "vassoio-pezzo-sinistro.stl", nome: "il pezzo sinistro con il foro da 200 mm", peso_g: 163, variante: "Versione con il foro del piatto da 200 mm, solo per piatti rigidi con il bordo da 215 a 228 mm: scarica questi due file al posto del pezzo sinistro e del pezzo centrale." }
      - { parte: "centro", file: "vassoio-pezzo-centrale.stl", nome: "il pezzo centrale con il foro da 200 mm", peso_g: 226, variante: "Versione con il foro del piatto da 200 mm, solo per piatti rigidi con il bordo da 215 a 228 mm: scarica questi due file al posto del pezzo sinistro e del pezzo centrale." }
      - { parte: "sinistra_i", file: "vassoio-incastro-pezzo-sinistro.stl", nome: "il pezzo sinistro a incastro con il foro da 200 mm", peso_g: 165, variante: "Versione a incastro con il foro del piatto da 200 mm, solo per piatti rigidi: questi due file prendono il posto del pezzo sinistro e del pezzo centrale a incastro." }
      - { parte: "centro_i", file: "vassoio-incastro-pezzo-centrale.stl", nome: "il pezzo centrale a incastro con il foro da 200 mm", peso_g: 227, variante: "Versione a incastro con il foro del piatto da 200 mm, solo per piatti rigidi: questi due file prendono il posto del pezzo sinistro e del pezzo centrale a incastro." }
      - { parte: "rivetti_targhetta", file: "vassoio-rivetti-targhetta.stl", nome: "i due rivetti per la targhetta", peso_g: 1, variante: "Rivetti stampati al posto delle viti e dei dadi: entrano negli stessi fori. Tengono fermo il pezzo con un po' di gioco e, una volta scattati, si tolgono solo rompendoli. Non sono stati provati in stampa." }
    misure: "45,6 × 24 cm montato, alto 4,8 cm"
    lunghezza_mm: 76
    peso_g: 709
    scheda:
      - ["Ingombro", "montato 456 × 240 mm, con il piano a 48 mm dal tavolo; pezzo sinistro 148 × 240 mm, pezzo centrale 182 × 240 mm, pezzo destro 130 × 240 mm, tutti alti 48 mm; targhetta 76 × 50 mm, spessa 3,6 mm (4,6 mm con le scritte)"]
      - ["Peso", "circa 709 g in tutto: 175 g il pezzo sinistro, 241 g il centrale, 272 g il destro, 17 g la targhetta, 4 g la clip; con il foro da 200 mm il pezzo sinistro pesa 163 g e il centrale 226 g. I pezzi a incastro pesano 178, 243 e 271 g (165 e 227 g con il foro da 200 mm) e le cinque chiavette 23 g in tutto"]
      - ["Foro del piatto", "180 mm, con il bordo smussato: è più stretto del piatto di 4 cm, così il piatto non può passare dal foro e cadere, nemmeno se è sottile, molle o molto pieno. Tiene un piatto piano usa e getta «da 22 cm» (225 mm in alto, 165 mm alla base) e un piatto fondo «da 22 cm» (220 mm in alto, 145 mm alla base): la base scende nel foro, la parete si appoggia sul bordo del foro e sotto il bordo del piatto restano 22 mm di vassoio per parte con il piatto piano e 20 mm con il fondo. Va bene per piatti con il bordo da 195 a 228 mm: sotto i 185 mm il piatto passa attraverso il foro, fra 185 e 195 mm appoggia su pochi millimetri, oltre i 228 mm tocca la clip. Le misure dei piatti vengono dalle schede dei produttori, non da una prova: misura il tuo piatto prima di stampare"]
      - ["Versione con il foro da 200 mm", "il pezzo sinistro e il pezzo centrale esistono anche con il foro del piatto da 200 mm, in cui il piatto scende di più: circa 13 mm sotto il piano il piatto piano, contro i 6 mm del foro da 180 mm (calcolo con la parete diritta, contando lo smusso di 1,5 mm del foro). Sotto il bordo del piatto restano però solo 12 mm di vassoio per parte con il piatto piano e 10 mm con il fondo: va bene solo per piatti rigidi con il bordo da 215 a 228 mm, e un piatto sottile o molle, se è pieno, può piegarsi e passare. Si scaricano al posto dei due pezzi con il foro da 180 mm; il resto è uguale"]
      - ["Foro del bicchiere", "56 mm. Un bicchiere usa e getta da 200 ml (46 mm alla base, 70 mm alla bocca, alto 97 mm) scende di circa 4 cm e si ferma, a 6 mm dal tavolo. Va bene per bicchieri con la base fra 45 e 56 mm: con la base più stretta il bicchiere scende fino a toccare il tavolo, con la base più larga non entra e si appoggia sul piano"]
      - ["Bottiglietta d'acqua", "un pozzetto largo 70 mm e profondo 44 mm, fra il bicchiere e la targhetta. Una bottiglietta tonda da mezzo litro (68 mm di diametro, alta 17 cm) scende di circa 35 mm e si ferma su un cono, a qualche millimetro dal tavolo. Va bene per bottiglie larghe da 56 a 69 mm: una più larga non entra, una più stretta di 55 mm passerebbe dal fondo, che è aperto. Il pozzetto tiene solo la parte bassa della bottiglia: non la regge se inclini il vassoio"]
      - ["Scritte dei posti", "«Piatto», «Posate», «Bicchiere» e «Bottiglia», alte 5 mm e incise di 0,4 mm sul piano, accanto a ogni posto: si vedono appena, e vengono meglio su un piatto di stampa liscio. Per farle risaltare ci sono due modi. Con il cambio di filo: i pezzi si stampano capovolti e le scritte sono i primi due strati, quindi stampa i primi due strati di un colore e cambia filo dopo lo strato 2 (strati da 0,2 mm); il piano resta del primo colore e in fondo alle lettere si vede il secondo; dal terzo strato in su tutto il resto, cioè i bordi del piano, le pareti dei fori, le nervature, le pareti di giunzione e i piedini, viene del secondo colore. Il cambio vale per tutti e tre i pezzi. Oppure, a pezzo finito, passa nei solchi un pennarello a vernice a punta fine e togli subito con un panno ciò che resta fuori, dopo averlo provato su un pezzo di scarto. Abbiamo scelto le parole e non i disegni perché per piatto e bicchiere non c'è un simbolo che tutti leggono allo stesso modo, e a questa misura un disegno inciso si confonde"]
      - ["Terza versione", "nel catalogo c'è anche il «Vassoio con le sedi sagomate»: le stoviglie appoggiano sul fondo, dentro sedi con la loro forma, e il vassoio non ha piedini"]
      - ["Posate", "corsia libera larga 5 cm e lunga quanto il vassoio; una clip a molla le tiene appoggiate al piano: sotto il ponte restano 6 mm e la molla, da libera, scende a circa 1 mm. Le posate si infilano sempre nel loro tovagliolo o nella loro bustina, mai libere: la parte che va in bocca non deve toccare la plastica stampata"]
      - ["Piedini", "dodici, alti 45 mm: quattro per pezzo. Servono perché piatto e bicchiere scendono sotto il piano"]
      - ["Manici", "un'asola di 92 × 22 mm per le dita su ogni lato corto"]
      - ["Giunzioni", "due: i pezzi si accostano lungo due pareti alte 23 mm, con una costola che entra in una scanalatura e li tiene allineati; si stringono con cinque viti M4 × 10 a testa svasata e cinque dadi M4. Altre due viti con due dadi fissano la targhetta"]
      - ["Altezza delle lettere", "nominativo 8 mm; righe piccole 4 mm"]
      - ["Spazio per nome e cognome", "fascia libera di 62 × 7 mm sotto il nominativo, sulla targhetta"]
      - ["Scritte di un altro colore", "la targhetta si stampa da sola, con le scritte in alto. Per averle di un colore diverso dal fondo, nel programma di stampa aggiungi un cambio di colore al primo strato delle scritte, cioè dopo lo strato 18 con strati da 0,2 mm (altezza 3,8 mm); oppure stampa la targhetta con un filo di un altro colore rispetto al vassoio"]
      - ["Posizione di stampa", "cinque file, già orientati, senza supporti: i tre pezzi del vassoio sono capovolti, con il piano sul piatto di stampa, la clip è coricata su un fianco; serve un piatto di stampa di almeno 25 × 20 cm (non entra nelle stampanti da 22 × 22 cm). I pezzi sono lunghi 24 cm: se serve, ruotali nel programma di stampa lungo il lato lungo del piatto, senza capovolgerli"]
      - ["Precisione", "la clip, le sedi dei dadi e le costole di allineamento sono disegnate per una stampante da tavolo ben regolata. Se ordini la stampa a un servizio, che può scostarsi di mezzo millimetro, la clip può non agganciare: in quel caso si lima il dente o si allarga la fessura"]
      - ["Da sapere", "il vassoio porta le stoviglie, non è un oggetto per alimenti: fra gli strati della plastica stampata restano solchi che non si puliscono a fondo. Pane, frutta e cibo stanno sempre nel piatto, mai appoggiati sul vassoio. Si lava a mano con acqua tiepida subito dopo l'uso: il PETG comincia a deformarsi a 68 gradi, quindi niente lavastoviglie e niente piatti o bevande bollenti. È pensato per circa 1,5 kg fra stoviglie e contenuto: è una stima di calcolo, non una prova di carico. Portalo con due mani"]
      - ["Senza viti di metallo", "il vassoio si può fare tutto di plastica stampata. Per le giunzioni ci sono i pezzi «a incastro»: al posto dei fori hanno cinque sedi a coda di rondine, a cavallo delle giunzioni, alte quanto la parete. In ogni sede si preme da sotto una chiavetta a farfalla (collo di 6 mm, ali di 12 mm); un dente lungo la giunzione entra in una gola del pezzo accanto e tiene i pezzi alla stessa altezza. Per la targhetta ci sono due rivetti, che entrano negli stessi fori delle viti. I pezzi a incastro non hanno i fori per le viti: scegli prima di stampare. Le chiavette sono tenute dall'attrito e lasciano un po' di gioco: sotto carico la giunzione può aprirsi di qualche decimo di millimetro e il vassoio flette più che con le viti. Incastro e rivetti sono calcolati, non provati in stampa né sotto carico: stampa prima il provino, che trovi fra i file, e per un uso di tutti i giorni o per carichi vicini al limite usa le viti"]
    materiale: "PETG"
    colore: "blu"
    occorrente:
      - "circa 730 g di filo PETG per tutti i pezzi"
      - "7 viti M4 lunghe 10 mm a testa svasata e 7 dadi esagonali M4 (si trovano in ferramenta); non servono rondelle: le teste entrano nelle svasature e i dadi nelle loro sedi"
      - "una chiave a brugola da 2,5 mm, oppure un cacciavite a croce se le viti hanno la testa a croce"
      - "oppure, senza comprare nulla: i tre pezzi a incastro con le cinque chiavette e i due rivetti della targhetta, che trovi fra i file da scaricare (circa 25 g di filo in più)"
    montaggio:
      - "Stampa i cinque file: la targhetta con il tuo nominativo, i tre pezzi del vassoio e la clip."
      - "Appoggia i tre pezzi capovolti su un tavolo, con i piedini in alto, e accostali: le costole del pezzo centrale e del pezzo destro entrano nelle scanalature del pezzo accanto."
      - "Lascia cadere un dado in ognuna delle cinque asole delle pareti più spesse."
      - "Dall'altra parte infila le cinque viti e stringile a mano fino a fermarti, senza forzare, con la chiave corta e circa mezzo giro dopo che la testa tocca: le teste devono restare sotto la superficie. Dopo qualche giorno ricontrolla che siano ancora strette."
      - "Gira il vassoio. Appoggia la targhetta sul pezzo destro, sopra i due fori, tieni un dado nella sede esagonale sotto il piano e stringi le due viti dall'alto."
      - "Spingi le due gambe della clip in una coppia di fessure della corsia delle posate, finché i denti scattano sotto il piano. Le coppie di fessure sono due: scegli quella più comoda per le tue posate."
      - "Infila il piatto, il bicchiere e la bottiglietta nei loro posti e fai scorrere le posate sotto la clip, dal manico."
      - "Per togliere la clip, da sotto avvicina le due gambe finché i denti escono dalle fessure."
      - "Versione a incastro: stampa prima il provino e prova a premere la chiavetta corta nella sua sede. Deve entrare con la forza del pollice e restare ferma: se è troppo dura lima un poco i cordoncini sui fianchi, se balla fermala con una goccia di colla istantanea. Poi stampa i tre pezzi a incastro e le cinque chiavette, che escono in piedi sulla loro base, unite da una barretta da tagliare a filo. Accosta i pezzi capovolti, con il dente di ogni giunzione nella gola del pezzo accanto. Premi una chiavetta in ogni sede, con la parte stretta in avanti, finché la base tocca la parete: deve entrare a pressione. Per toglierla, fai leva con un cacciavite sotto la linguetta della base."
      - "Rivetti della targhetta, al posto delle due viti: taglia a filo la barretta che li unisce, appoggia la targhetta, infila i due rivetti dall'alto e premi su ogni testa con un oggetto tondo largo circa 8 mm finché i denti scattano sotto il piano."

