      - "Pulisci la zona solo con il detergente indicato dal libretto del casco e lasciala asciugare: altri prodotti possono rovinare la calotta."
      - "Metti il biadesivo in schiuma su tutto il retro dell'etichetta, appoggiala e premi bene per un minuto, partendo dal centro."

  - id: "righello-coordinate"
    nome: "Righello per le coordinate"
    articolo: "il righello"
    categoria: "attrezzatura"
    breve: "Per leggere coordinate e distanze sulle carte in scala 1:25.000, 1:50.000 e 1:10.000."
    descrizione: "Righello piatto per leggere le coordinate e misurare le distanze sulle carte topografiche, con la bandiera italiana, il nominativo e «Protezione Civile Genzano di Roma». Negli angoli in alto ha due squadrette graduate, per le carte in scala 1:25.000 e 1:50.000, con una tacca ogni 100 metri; lungo il bordo basso una scala 1:10.000 da 0 a 1 km, con una tacca ogni 50 metri."
    sorgente: "strumenti-nominativo.scad"
    anteprima:
      base: "#1d4f9a"
      rilievo: "#f07d00"
      rilievo_mm: 1.0
      bandiera: [-27.2, 8.5, -16.7, 15.5]
      nome: {zona: [-59, -16.5, 59.2, -9.5], lato: "fronte"}   # riga di nome e cognome (static/js/stampa3d-nome-core.js)
    parametri:
      tipo: "righello"
      parte: "tutto"
    misure: "12 × 7 cm, spesso 3,5 mm"
    lunghezza_mm: 120
    peso_g: 28
    scheda:
      - ["Ingombro", "120 × 70 mm, spesso 3,5 mm (2,5 mm di base e 1 mm di tacche e scritte)"]
      - ["Peso", "circa 28 g"]
      - ["Angolo in alto a destra", "scala 1:25.000: tacche ogni 4 mm (100 m) per 40 mm (1 km), sul bordo alto e sul bordo destro"]
      - ["Angolo in alto a sinistra", "scala 1:50.000: tacche ogni 2 mm (100 m) per 20 mm (1 km), sul bordo alto e sul bordo sinistro"]
      - ["Bordo basso", "scala 1:10.000: tacche ogni 5 mm (50 m) per 100 mm (1 km)"]
      - ["Tacche", "larghe 0,8 mm, lunghe 6 mm ogni 500 m e 3,5 mm le altre; angoli in alto vivi"]
      - ["Scritte di un altro colore", "le scritte sono in rilievo di 1 mm in cima, l'ultimo millimetro del pezzo: per averle di un colore diverso dal fondo, nel programma di stampa aggiungi un cambio di filo al primo strato delle scritte, cioè dopo lo strato 13 con strati da 0,2 mm (altezza 2,8 mm). Con le scritte cambiano colore anche le tacche e i numeri, che sono in rilievo alla stessa altezza"]
      - ["Posizione di stampa", "in piano, già orientato nel file, senza supporti"]
    materiale: "PETG"
    colore: "blu"
    occorrente:
      - "niente"
    montaggio:
      - "Trova sulla carta il quadrato del reticolo chilometrico in cui sta il punto da leggere."
      - "Con una carta in scala 1:25.000 usa l'angolo in alto a destra: metti lo spigolo esattamente sul punto, con i bordi del righello paralleli alle linee del reticolo."
      - "Sul bordo alto leggi quanto dista il punto dalla linea verticale del reticolo alla sua sinistra; sul bordo destro quanto dista dalla linea orizzontale sotto. Ogni tacca vale 100 metri."
      - "Aggiungi le due distanze ai valori delle due linee del reticolo, scritti sul bordo della carta: hai le coordinate del punto."
      - "Con una carta in scala 1:50.000 usa l'angolo in alto a sinistra, dopo aver girato il righello di un quarto di giro in senso orario: lo spigolo va sul punto e si legge allo stesso modo."
      - "Il bordo basso misura le distanze sulle carte in scala 1:10.000: ogni tacca vale 50 metri."

