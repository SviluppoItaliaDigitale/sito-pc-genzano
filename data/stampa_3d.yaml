    colore: "blu"
    occorrente:
      - "niente"
    montaggio:
      - "Trova sulla carta il quadrato del reticolo chilometrico in cui sta il punto da leggere."
      - "Con una carta in scala 1:25.000 usa l'angolo in alto a destra: metti lo spigolo esattamente sul punto, con i bordi del righello paralleli alle linee del reticolo."
      - "Sul bordo alto leggi quanto dista il punto dalla linea verticale del reticolo alla sua sinistra; sul bordo destro quanto dista dalla linea orizzontale sotto. Ogni tacca vale 100 metri."
      - "Aggiungi le due distanze ai valori delle due linee del reticolo, scritti sul bordo della carta: hai le coordinate del punto."
      - "Con una carta in scala 1:50.000 usa l'angolo in alto a sinistra, dopo aver girato il righello di un quarto di giro in senso orario: lo spigolo va sul punto e si legge allo stesso modo."
      - "Il bordo basso misura le distanze sulle carte in scala 1:10.000: ogni tacca vale 50 metri."

