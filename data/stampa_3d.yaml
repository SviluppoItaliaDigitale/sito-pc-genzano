# Oggetti da stampare in 3D con il nominativo dei volontari: catalogo in /stampa-3d/ e una pagina per
# oggetto in /stampa-3d/<id>/ (content/stampa-3d/_content.gotmpl), con i suoi file nella stessa cartella.
# Per un oggetto nuovo: aggiungi una voce in «oggetti» con la sua «categoria» (se serve un tipo nuovo,
# anche nel modello di partenza in scripts/stampa-3d/) e crea i file con «python3 scripts/genera-stampa-3d.py».
# Catalogo e pagina si aggiornano da soli.
# Regole dei file: quelle di Craftcloud per la stampa FDM (un pezzo per file, millimetri,
# pareti e tratti delle lettere dentro i minimi), controllate dallo script.
# «bandiera» = riquadro del tricolore nel modello [x0, y0, x1, y1], per colorarlo nelle anteprime.
# Materiale consigliato: PETG, più resistente agli urti e al caldo del PLA (in auto d'estate il PLA si deforma).

nominativi:
  prefisso: "ALFA"
  primo: 1
  ultimo: 100

servizio:
  nome: "Craftcloud"
  indirizzo: "https://craftcloud3d.com/"
  verificato: "2026-11-23"

# Gruppi del catalogo, nell'ordine in cui compaiono
categorie:
  - id: "giubbetto"
    titolo: "Sul giubbetto e in tasca"
  - id: "radio"
    titolo: "Per la radio"
  - id: "attrezzatura"
    titolo: "Zaino, casco e attrezzatura"
  - id: "intervento"
    titolo: "In intervento e sul mezzo"
  - id: "campo"
    titolo: "Al campo e in mensa"
  - id: "kit"
    titolo: "Kit, pile e schede"
  - id: "sede"
    titolo: "In sede e in sala operativa"
  - id: "telefono"
    titolo: "Per il telefono"

oggetti:
  - id: "targhetta-petto"
    nome: "Targhetta da petto"
    articolo: "la targhetta"
    descrizione: "Targhetta blu con la bandiera italiana, il nominativo in grande e, sotto, «Protezione Civile Genzano di Roma». Si appunta sulla divisa con una spilla da balia."
    categoria: "giubbetto"
    breve: "Si appunta sulla divisa con una spilla da balia."
    sorgente: "targhetta-nominativo.scad"
    anteprima:
      base: "#1d4f9a"
      rilievo: "#f07d00"
      rilievo_mm: 1.0
      bandiera: [-36.5, 1.75, -23.75, 10.25]
      nome: {zona: [-38, -13.1, 38, -6.1], lato: "retro"}   # riga di nome e cognome (static/js/stampa3d-nome-core.js)
    parametri:
      tipo: "petto"
      parte: "tutto"
      fissaggio: "balia"
    misure: "8 × 3 cm, spessa 3,4 mm"
    lunghezza_mm: 80
    peso_g: 8
    scheda:
      - ["Ingombro", "80 × 30 mm, spessa 3,4 mm (2,4 mm di base e 1 mm di scritte)"]
      - ["Peso", "circa 8 g"]
      - ["Scritte e cornice", "in rilievo di 1 mm; cornice larga 1,2 mm"]
      - ["Altezza delle lettere", "nominativo 8,5 mm; righe piccole 4,5 mm, tratto più sottile 0,7 mm"]
      - ["Fissaggio", "scanalatura sul retro larga 1,6 mm e profonda 1,3 mm per una spilla da balia lunga 45 mm; due incavi da 6,5 × 6,5 mm, profondi 1,4 mm"]
      - ["Posizione di stampa", "in piano, già orientata nel file, senza supporti"]
    materiale: "PETG"
    colore: "blu"
    occorrente:
      - "una spilla da balia di metallo lunga 4,5 cm (si trova in merceria)"
      - "colla istantanea in gel per plastica e metallo"
    montaggio:
      - "Gira la targhetta: sul retro c'è una scanalatura con due incavi quadrati alle estremità."
      - "Chiudi la spilla da balia e appoggiala nella scanalatura: la molla e la testa entrano nei due incavi, la punta resta verso l'esterno."
      - "Apri la spilla e metti due gocce di colla nella scanalatura, sotto la parte che non si apre."
      - "Premi per un minuto, poi lascia asciugare per un'ora prima di usarla."
    retro: "Retro della targhetta da petto: una scanalatura orizzontale nella parte alta, con un incavo quadrato a ciascuna estremità."
    didascalia_retro: "Il retro: nella scanalatura va la spilla, negli incavi quadrati la molla e la testa."

