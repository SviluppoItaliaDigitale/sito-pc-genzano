      - ["Peso", "circa 591 g in tutto: 141 g il pezzo sinistro, 217 g il centrale, 212 g il destro, 17 g la targhetta, 4 g la clip. I pezzi a incastro pesano 142, 218 e 213 g e le cinque chiavette 11 g in tutto"]
      - ["Sede del piatto", "una conca larga 168 mm sul fondo, chiusa da un anello alto 8 mm che si allarga verso l'alto più della parete del piatto: il piatto tocca il fondo e non può scivolare. Tiene un piatto piano usa e getta «da 22 cm» (225 mm in alto, 165 mm alla base) e un piatto fondo «da 22 cm» (220 mm in alto, 145 mm alla base), che dentro la conca si sposta di un centimetro per parte. Va bene per piatti con la base fino a 166 mm e il bordo fino a 230 mm. Alla prima giunzione le pareti passano sotto il bordo del piatto e sono tagliate per lasciargli 2,5 mm: il conto è fatto su un piatto con la parete diritta fra base e bordo, perché il profilo vero non è nelle schede. Misura il tuo piatto prima di stampare e provalo sul vassoio montato"]
      - ["Sede del bicchiere", "un bicchierino alto 45 mm, largo 49 mm in basso e 61 mm in alto. Un bicchiere usa e getta da 200 ml (46 mm alla base, 70 mm alla bocca, alto 97 mm) appoggia sul fondo ed esce per metà, così si prende bene. Un bicchiere con la base più larga di 49 mm si ferma più in alto e resta tenuto per meno"]
      - ["Sede della bottiglietta", "un anello largo 70 mm e alto 45 mm, per una bottiglietta tonda da mezzo litro (68 mm di diametro, alta 17 cm). Va bene per bottiglie larghe fino a 69 mm; una più stretta ci sta, ma balla. L'anello tiene solo la parte bassa della bottiglia: non la regge se inclini il vassoio"]
      - ["Posate", "appoggiano su due ponticelli alti 9 mm, a 8 cm l'uno dall'altro, così i manici restano sollevati e si prendono bene. La clip a molla si aggancia a uno dei due ponticelli: sotto il ponte restano 6 mm e la molla, da libera, scende a circa 1 mm. Le posate si infilano sempre nel loro tovagliolo o nella loro bustina, mai libere: la parte che va in bocca non deve toccare la plastica stampata"]
      - ["Scritte dei posti", "«Piatto» e «Posate» sul fondo, davanti al loro posto; «Bicchiere» e «Bottiglia» sul fondo della loro sede, perché fra due sedi alte non si vedrebbero. Sono alte 5 mm e incise di 0,4 mm: si vedono appena. Per farle risaltare ci sono due modi. Con il cambio di filo: il fondo è spesso 2,4 mm e le lettere scendono fino a 2 mm, quindi cambia filo dopo lo strato 10 (strati da 0,2 mm); in fondo alle lettere si vede il primo colore, mentre il piano e tutto ciò che sta sopra, bordi e sedi compresi, prendono il secondo. Oppure, a pezzo finito, passa nei solchi un pennarello a vernice a punta fine e togli subito con un panno ciò che resta fuori, dopo averlo provato su un pezzo di scarto. Abbiamo scelto le parole e non i disegni perché per piatto e bicchiere non c'è un simbolo che tutti leggono allo stesso modo, e a questa misura un disegno inciso si confonde"]
      - ["Manici", "i due lati corti salgono inclinati verso l'esterno per 17 mm: sotto il bordo entra la punta delle dita, quanto basta per sollevare il vassoio dal tavolo e poi prenderlo meglio"]
      - ["Giunzioni", "due: i pezzi si accostano lungo pareti alte 16 mm e si stringono con cinque viti M4 × 10 a testa svasata e cinque dadi M4, che si lasciano cadere dall'alto in un'asola. La prima giunzione passa per il centro del piatto: lì le pareti stanno fuori dall'anello, due tratti da 2 cm con una vite ciascuno. Altre due viti con due dadi fissano la targhetta: i dadi entrano di lato nei due appoggi"]
      - ["Altezza delle lettere", "nominativo 8 mm; righe piccole 4 mm"]
      - ["Spazio per nome e cognome", "fascia libera di 62 × 7 mm sotto il nominativo, sulla targhetta"]
      - ["Scritte di un altro colore", "la targhetta si stampa da sola, con le scritte in alto. Per averle di un colore diverso dal fondo, nel programma di stampa aggiungi un cambio di colore al primo strato delle scritte, cioè dopo lo strato 18 con strati da 0,2 mm (altezza 3,8 mm); oppure stampa la targhetta con un filo di un altro colore rispetto al vassoio"]
      - ["Posizione di stampa", "cinque file, già orientati, senza supporti: i tre pezzi del vassoio sono diritti, con il fondo sul piatto di stampa, la clip è coricata su un fianco; serve un piatto di stampa di almeno 25 × 20 cm (non entra nelle stampanti da 22 × 22 cm). I pezzi sono lunghi 24 cm: se serve, ruotali nel programma di stampa lungo il lato lungo del piatto, senza capovolgerli. Con pezzi così larghi e sottili conviene un bordo di adesione di qualche millimetro"]
      - ["Precisione", "la clip e i canali dei dadi sono disegnati per una stampante da tavolo ben regolata. Se ordini la stampa a un servizio, che può scostarsi di mezzo millimetro, la clip può non agganciare: in quel caso si lima il dente o si allarga la fessura"]
      - ["Differenze dall'altro vassoio", "nel «Vassoio porta piatto, bicchiere e posate» le stoviglie restano appese in fori più stretti del loro bordo e il vassoio sta su dodici piedini; qui appoggiano sul fondo e il vassoio è basso. Questo ha il fondo chiuso: se si rovescia un po' d'acqua resta nel vassoio"]
      - ["Da sapere", "il vassoio porta le stoviglie, non è un oggetto per alimenti: fra gli strati della plastica stampata restano solchi che non si puliscono a fondo. Pane, frutta e cibo stanno sempre nel piatto, mai appoggiati sul vassoio. Si lava a mano con acqua tiepida subito dopo l'uso: il PETG comincia a deformarsi a 68 gradi, quindi niente lavastoviglie e niente piatti o bevande bollenti. Tienilo intorno a 1 kg fra stoviglie e contenuto: il fondo è sottile e non è stato provato sotto carico. Portalo con due mani, una per manico, e tienilo in piano: la bottiglietta è tenuta solo per i primi 4 cm"]
      - ["Senza viti di metallo", "il vassoio si può fare tutto di plastica stampata. Per le giunzioni ci sono i pezzi «a incastro»: al posto dei fori hanno cinque sedi a coda di rondine, a cavallo delle giunzioni, aperte in alto. In ogni sede si preme dall'alto una chiavetta a farfalla (collo di 6 mm, ali di 12 mm): due basse vicino al piatto, perché lì la parete è tagliata sotto il suo bordo, e tre alte. Un dente lungo la giunzione entra in una gola del pezzo accanto e tiene i pezzi alla stessa altezza. Sotto ogni sede c'è un foro di 3 mm nel fondo, che serve a spingere fuori la chiavetta e che la chiavetta stessa chiude. Per la targhetta ci sono due rivetti, che entrano negli stessi fori delle viti. I pezzi a incastro non hanno i fori per le viti: scegli prima di stampare. Le chiavette sono tenute dall'attrito e lasciano un po' di gioco: sotto carico la giunzione può aprirsi di qualche decimo di millimetro e il vassoio flette più che con le viti. Incastro e rivetti sono calcolati, non provati in stampa né sotto carico: stampa prima il provino, che trovi fra i file, e per un uso di tutti i giorni o per carichi vicini al limite usa le viti"]
    materiale: "PETG"
    colore: "blu"
