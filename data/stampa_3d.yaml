      - "Lascia cadere un dado in ognuna delle cinque asole aperte in alto, nelle pareti più spesse."
      - "Dall'altra parte infila le cinque viti e stringile a mano fino a fermarti, senza forzare, con la chiave corta e circa mezzo giro dopo che la testa tocca: le teste devono restare sotto la superficie. Dopo qualche giorno ricontrolla che siano ancora strette."
      - "Spingi un dado di lato in ognuno dei due appoggi rettangolari della targhetta, fino in fondo. Appoggia la targhetta sui quattro appoggi e stringi le due viti dall'alto."
      - "Spingi le due gambe della clip nelle fessure di uno dei due ponticelli, finché i denti scattano."
      - "Metti il piatto, il bicchiere e la bottiglietta nelle loro sedi e fai scorrere le posate sotto la clip, dal manico."
      - "Per togliere la clip, infila un cacciavite piccolo nelle finestrelle ai due lati del ponticello e spingi i denti verso l'interno, uno alla volta, mentre tiri la clip verso l'alto."
      - "Versione a incastro: stampa prima il provino e prova a premere la chiavetta corta nella sua sede. Deve entrare con la forza del pollice e restare ferma: se è troppo dura lima un poco i cordoncini sui fianchi, se balla fermala con una goccia di colla istantanea. Poi stampa i tre pezzi a incastro e le cinque chiavette, due basse e tre alte, unite da una barretta da tagliare a filo. Accosta i pezzi sul tavolo, con il dente di ogni giunzione nella gola del pezzo accanto. Premi dall'alto le due chiavette basse nelle sedi ai lati del piatto e le tre alte nelle altre, con la parte stretta in avanti, cioè capovolte rispetto a come escono dalla stampante, fino in fondo: devono entrare a pressione. Poi appoggia un piatto vero e controlla che il bordo non tocchi le due chiavette basse. Per toglierle, gira il vassoio e spingile fuori dal foro che hanno sotto, con una chiave a brugola da 3 mm o un chiodo."
      - "Rivetti della targhetta, al posto delle due viti: taglia a filo la barretta che li unisce e appoggia la targhetta sui quattro appoggi. Infila i due rivetti dall'alto, con la testa girata per il lato corto della targhetta, e premi su ogni testa con un oggetto tondo largo circa 8 mm finché i denti scattano nel canale del dado."

