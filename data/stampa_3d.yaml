      - ["Peso", "circa 240 g in tutto: 158 g il pezzo con il nominativo, 82 g il braccio destro"]
      - ["Gancio", "occhio di 40 mm e apertura di 36 mm, per tubi appendiabiti fino a 33 mm; un tubo ovale per armadi misura 30 × 15 mm. Se il tuo tubo è più grosso, misuralo prima di stampare"]
      - ["Spalle e barra", "bracci alti da 22 a 18 mm, con tutti gli spigoli smussati di 2 mm; una tacca larga 7 mm su ogni braccio per spalline e passanti; barra per i pantaloni alta 14 mm, con piccoli incavi che li tengono fermi"]
      - ["Giunzioni", "due, a mezzo spessore: una sulle spalle e una a metà della barra, ognuna con due viti M4 × 10 a testa svasata e due dadi M4. Le teste restano sotto la superficie sul davanti, i dadi entrano in sedi esagonali sul retro"]
      - ["Carico", "giacca e pantaloni della divisa, fino a circa 3 kg. È un valore di calcolo, non una prova di carico: non appenderci zaini, borse o attrezzatura"]
      - ["Altezza delle lettere", "nominativo 8 mm; righe piccole 4 mm"]
      - ["Spazio per nome e cognome", "fascia libera di 68 × 7 mm sotto il nominativo"]
