# Cronistoria dell'anno: le voci curate a mano.
#
# La pagina /cronistoria/ (layout themes/flavour-pcgenzano/layouts/cronistoria/
# list.html) mette in fila, giorno per giorno, queste voci e gli articoli del
# sito, che entrano da soli alla loro data. Qui stanno ricorrenze, eventi
# nazionali di protezione civile, norme, atti del Comune di Genzano e notizie
# di stampa sul Gruppo.
#
# Regole per ogni voce (rule qualita.md, 02, 06):
# - data: il giorno a cui il fatto si riferisce, nel formato "AAAA-MM-GG".
#   Per una norma o un atto, la data dell'atto (il testo dice quando è uscito in
#   Gazzetta o sul Bollettino); per un evento, il giorno dell'evento; per una
#   notizia di stampa, il giorno del fatto raccontato. Una voce con data futura
#   compare da sola quando arriva il suo giorno.
# - tipo: ricorrenza | nazionale | norma | comune | stampa
# - titolo: breve, informativo, senza enfasi (al massimo 80 caratteri).
# - testo: una o due frasi, con parole nostre e solo fatti che la fonte dice.
#   Le cifre (vittime, magnitudo, orari) sono quelle della fonte e coincidono
#   con data/dati_canonici.yaml; dove le fonti non concordano, la cifra non si
#   scrive. Un collegamento interno si scrive in Markdown: [testo](/pagina/).
# - fonte e url: la fonte primaria, aperta e letta il giorno della verifica.
# - verificato_il: il giorno in cui la fonte è stata riletta.
# - articolo (facoltativo): il nome del file dell'articolo del sito, in
#   content/comunicazioni/ senza «.md», che racconta lo stesso fatto.
#   * In una voce di stampa, la voce non compare da sola: la testata va sotto
#     l'articolo, come «Ne ha scritto anche». Bastano titolo, fonte e url.
#   * In ogni altra voce, l'articolo compare dentro la voce («Sul nostro
#     sito») e non una seconda volta da solo nello stesso elenco.
#   Se l'articolo non esiste nella build, la voce compare da sola e la build
#   lo segnala con un avviso.
# - nota (facoltativa, non pubblicata): per chi mantiene la pagina.
# Le notizie di stampa che raccontano da sole un'attività del Gruppo (senza
# «articolo») si confrontano con il registro interventi prima di pubblicarle
# (rule 10 § Rassegna normativa, punto 5-bis): la nota lo ricorda.

