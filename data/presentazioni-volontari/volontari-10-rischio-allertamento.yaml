slide:
  - titolo: "Pericolosità, vulnerabilità, esposizione"
    punti:
      - "Pericolosità: quanto è probabile un fenomeno di una certa intensità in un luogo."
      - "Vulnerabilità: quanto un edificio o una persona può subire danni."
      - "Esposizione: persone, beni e attività presenti nell'area."
      - "Il rischio nasce dalla combinazione dei tre."
    pittogramma: "arasaac/pericolo"
    nota: "È la formula R = P × V × E spiegata nel capitolo 4 del Manuale di Protezione Civile del sito. Esempio: lo stesso temporale fa poco danno in un campo e molto danno in una strada piena di auto in sosta. Chiedi al gruppo su quale dei tre fattori lavora un volontario quando informa la popolazione."
    fonte: "/manuale/41-modello-del-rischio/"
  - titolo: "Dove si può agire"
    punti:
      - "Sul fenomeno naturale si può fare poco: un terremoto non si ferma."
      - "Sulla vulnerabilità si agisce: edifici più robusti, persone preparate."
      - "Sull'esposizione si agisce: tenere le persone lontane dalle aree pericolose."
    pittogramma: "arasaac/casa"
    nota: "È la conseguenza pratica della formula, come la spiega il Manuale: prevenzione e pianificazione lavorano su vulnerabilità ed esposizione. Esempio: con un'allerta per temporali non si ferma la pioggia, ma si evita di parcheggiare nei sottopassi. Chiedi al gruppo un esempio di riduzione dell'esposizione a Genzano."
    fonte: "/manuale/41-modello-del-rischio/"
  - titolo: "I rischi di protezione civile"
    punti:
      - "Sismico, vulcanico, maremoto, idraulico, idrogeologico."
      - "Fenomeni meteo avversi, deficit idrico, incendi boschivi."
      - "Con le competenze di altri enti: chimico, nucleare, radiologico, industriale."
      - "Anche tecnologico, da trasporti, ambientale, igienico-sanitario, rientro di oggetti spaziali."
    pittogramma: "arasaac/attenzione"
    nota: "È l'articolo 16 del Codice. I primi otto sono i rischi su cui il Servizio nazionale agisce in particolare. Per gli altri restano le competenze degli enti di settore: per esempio, gli stabilimenti industriali hanno i loro piani. Chiedi al gruppo quali di questi rischi riguardano il nostro territorio."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Naturali, tecnologici, causati dall'uomo"
    punti:
      - "Naturali: terremoti, alluvioni, frane, eruzioni."
      - "Tecnologici: un incidente in un impianto, una nube tossica."
      - "Un evento naturale può innescare un incidente tecnologico."
      - "Il terrorismo è materia di sicurezza pubblica, non dell'articolo 16."
    pittogramma: "arasaac/emergenza"
    nota: "Il Codice parla di eventi «di origine naturale o derivanti dall'attività dell'uomo» (articolo 7). Il caso di un incidente innescato da un evento naturale si chiama NaTech: ne parla il dossier del sito «Quando l'industria fa paura». Negli eventi di sicurezza pubblica decidono le forze dell'ordine: il volontario segue solo le indicazioni ricevute."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Previsione"
    punti:
      - "Studia gli scenari di rischio possibili."
      - "Serve all'allertamento e alla pianificazione."
      - "Si fa con la comunità scientifica: INGV, CNR, ISPRA, Fondazione CIMA."
    pittogramma: "arasaac/vedere"
    nota: "Definizione dell'articolo 2, comma 2, del Codice. I Centri di competenza (articolo 21) forniscono dati e modelli. Il Manuale riassume la catena: conoscenza, modello, bollettino, allerta, azione. Chiedi al gruppo chi produce i bollettini che leggiamo ogni giorno per il Lazio."
    fonte: "/manuale/41-modello-del-rischio/"
  - titolo: "Prevenzione strutturale e non strutturale"
    punti:
      - "Strutturale: opere che riducono il rischio, come argini o rinforzi."
      - "Non strutturale: allertamento, pianificazione, formazione."
      - "Non strutturale anche: informazione ai cittadini ed esercitazioni."
    pittogramma: "arasaac/proteggere-testa"
    nota: "Sono i commi 3, 4 e 5 dell'articolo 2 del Codice. Quasi tutto ciò che fa il volontariato fuori dall'emergenza è prevenzione non strutturale: formazione, esercitazioni, informazione alla popolazione, incontri nelle scuole. Chiedi al gruppo quale attività del Gruppo dell'ultimo mese è stata prevenzione."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "L'allerta è una probabilità"
    punti:
      - "Il codice colore indica la criticità attesa sul territorio, non l'intensità del fenomeno."
      - "Giallo: ordinaria. Arancione: moderata. Rosso: elevata."
      - "Un'allerta non accaduta non era sbagliata."
    pittogramma: "arasaac/temporale"
    nota: "Per il Lazio i bollettini li emette il Centro Funzionale Regionale; Genzano è nella Zona F. Il capitolo 4 del Manuale spiega perché un'allerta è una probabilità: giustifica la prudenza, non annuncia un disastro sicuro. Chiedi al gruppo che cosa rispondere a chi dice «avevano dato l'allerta e non è successo niente»."
    fonte: "/allerte-meteo/"
  - titolo: "Allarme pubblico: IT-alert"
    punti:
      - "Messaggi sui telefoni presenti nell'area di una grave emergenza."
      - "Arriva con il cell broadcast: non è un SMS e non serve un'app."
      - "Oggi per dighe, vulcani campani e Vulcano, nucleare, incidenti industriali."
      - "Non si usa per i terremoti né per le allerte meteo."
    pittogramma: "arasaac/telefono"
    nota: "Sono i rischi in esercizio dal 13 febbraio 2024. Per maremoto e Stromboli la sperimentazione è prorogata al 31 dicembre 2026; per le piogge intense la direttiva del 12 febbraio 2026 sceglie un'applicazione dedicata. Lo spiega l'articolo del sito del 12 febbraio 2026."
    fonte: "/comunicazioni/2026-02-12-it-alert-proroga-sperimentazione/"
  - titolo: "Comunicare il rischio"
    punti:
      - "Informazioni solo da fonti ufficiali: Centro funzionale, Dipartimento, Comune."
      - "Parole semplici, tono calmo, mai allarmismi."
      - "Dire che cosa fare, non solo che cosa succede."
      - "Una voce falsa non si rilancia: si risponde con la fonte ufficiale."
    pittogramma: "arasaac/informazione"
    nota: "L'informazione alla popolazione è prevenzione non strutturale (articolo 2, comma 4, lettera f). La campagna nazionale «Io non rischio» del Dipartimento spiega i comportamenti corretti per ogni rischio. In emergenza parla una sola voce ufficiale: il volontario non diffonde notizie proprie sui social."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - tipo: "domanda"
    domanda: "Su che cosa agisce la prevenzione?"
    punti:
      - "Sulla pericolosità del fenomeno naturale."
      - "Sulla vulnerabilità di persone e edifici."
      - "Sull'esposizione di persone e beni."
    nota: "Sono giuste la seconda e la terza. Sulla pericolosità di un fenomeno naturale si può fare poco: si può però conoscerla meglio, con la previsione. È questo il messaggio della formula del rischio."
    fonte: "/manuale/41-modello-del-rischio/"
ricorda:
  - "Il rischio è la combinazione di pericolosità, vulnerabilità ed esposizione."
  - "Previsione e prevenzione lavorano prima dell'evento; l'allerta è una probabilità."
  - "Si comunica solo ciò che dicono le fonti ufficiali, con parole semplici."
