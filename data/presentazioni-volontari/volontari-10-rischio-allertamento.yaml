# Presentazione per i volontari: rischio, previsione, prevenzione e allertamento.
# Testi dal Manuale di Protezione Civile del sito (capitolo 4, il modello del rischio),
# dal testo vigente del D.Lgs. 2 gennaio 2018, n. 1 (artt. 2 e 16, Normattiva) e dalle
# pagine del sito su allerte meteo e IT-alert. Il generatore è
# scripts/genera-presentazioni-lim.py: chi cambia un testo rigenera i file nello stesso lavoro.
pubblico: "volontari"
corso: "Riferimenti per la formazione regionale"
ordine: 10
file: "2026-11-20-volontari-10-rischio-allertamento"
tema: "volontari-10-rischio-allertamento"
titolo: "Rischio, previsione e allertamento"
sottotitolo: "Riferimenti per la formazione regionale"
