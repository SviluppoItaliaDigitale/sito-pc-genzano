slide:
  - titolo: "Il volontario è tutelato come un lavoratore"
    punti:
      - "Il D.Lgs. 81/2008 tutela salute e sicurezza nei luoghi di lavoro."
      - "Il volontario di protezione civile è equiparato al lavoratore."
      - "L'equiparazione vale solo per le attività previste dal regime speciale."
    pittogramma: "arasaac/aiutare"
    nota: "Spiega che chi protegge gli altri ha diritto a essere protetto. Il Testo Unico non si applica al volontariato tale e quale come a un'azienda: si adatta alle attività di soccorso. Chiedi: secondo voi, che cosa cambia tra un ufficio e un intervento in emergenza?"
    fonte: "/manuale/31-sicurezza-del-volontario/"
  - titolo: "Il regime speciale del 2011"
    punti:
      - "L'art. 3, comma 3-bis, del D.Lgs. 81/2008 rinvia a un decreto dedicato."
      - "È il decreto interministeriale 13 aprile 2011."
      - "Tiene conto dell'urgenza e dell'imprevedibilità degli scenari."
    pittogramma: "arasaac/documenti"
    nota: "Il decreto è pubblicato nella Gazzetta Ufficiale n. 159 dell'11 luglio 2011. Due punti da sottolineare: le sedi e i luoghi di intervento, formazione ed esercitazione non sono considerati luoghi di lavoro; le regole di sicurezza non possono ritardare o impedire i soccorsi. La tutela del volontario resta comunque sostanziale."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/decreto-del-capo-dipartimento-del-12-gennaio-2012-intesa-tra-il-dipartimento-della-protezione-civile-e-le-regioni-e-province-autonome-sulla-0"
  - titolo: "Il decreto del 12 gennaio 2012"
    punti:
      - "Il Capo del Dipartimento ha adottato indirizzi comuni per tutta Italia."
      - "Allegato 1: scenari di rischio e compiti dei volontari."
      - "Allegato 2: formazione, informazione e addestramento."
      - "Allegato 3: controllo sanitario."
    pittogramma: "arasaac/informazione"
    nota: "Il decreto è pubblicato nella Gazzetta Ufficiale n. 82 del 6 aprile 2012. Gli allegati 1 e 3 sono stati sostituiti dal decreto del Capo del Dipartimento n. 2206 del 24 luglio 2025, pubblicato nella Gazzetta Ufficiale n. 250 del 27 ottobre 2025. Mostra al gruppo la pagina del Dipartimento con i testi in vigore."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/decreto-del-capo-dipartimento-n-2206-del-24-luglio-2025/"
  - titolo: "Formazione, informazione, addestramento"
    punti:
      - "L'organizzazione cura la formazione, l'informazione e l'addestramento del volontario."
      - "I contenuti dipendono dagli scenari di rischio e dai compiti svolti."
      - "Le Regioni disciplinano nel dettaglio i piani formativi."
    pittogramma: "arasaac/scuola"
    nota: "Collega la slide al corso che stanno seguendo: è la prima parte di questo obbligo. Per un gruppo comunale l'organizzazione è il Comune, di cui il Gruppo fa parte. Chiedi: quali attività del Gruppo richiedono un addestramento in più rispetto al corso base?"
    fonte: "/manuale/31-sicurezza-del-volontario/"
  - titolo: "Ognuno opera per ciò che sa fare"
    punti:
      - "La preparazione si misura sull'attività svolta davvero."
      - "Chi fa logistica ha bisogno di una formazione diversa da chi opera sul campo."
      - "Si lavora secondo la formazione ricevuta, le istruzioni e le procedure."
    pittogramma: "iso7010/consultare-istruzioni"
    nota: "Il decreto del 2011 chiede di adattare formazione e tutela agli scenari e ai compiti di ciascuno. Esempio concreto: per lo spegnimento degli incendi boschivi valgono requisiti e DPI specifici, fissati dall'accordo in Conferenza Unificata del 25 luglio 2002. Chiedete al gruppo di elencare tre compiti del Gruppo e la preparazione che ciascuno richiede."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/decreto-del-capo-dipartimento-del-12-gennaio-2012-intesa-tra-il-dipartimento-della-protezione-civile-e-le-regioni-e-province-autonome-sulla-0"
  - titolo: "I dispositivi di protezione individuale"
    punti:
      - "L'organizzazione fornisce DPI adatti allo specifico impiego."
      - "Il volontario è formato e addestrato a usarli."
      - "Si usano come indica il fabbricante e non si modificano."
    pittogramma: "iso7010/casco-protettivo"
    nota: "I DPI non si comprano da soli: per un gruppo comunale la dotazione è a carico del Comune. Mostra i DPI del Gruppo e fai provare a indossarli correttamente. Ricorda che un DPI danneggiato o scaduto si segnala e si sostituisce."
    fonte: "/comunicazioni/2026-10-22-abbigliamento-tecnico-volontario/"
  - titolo: "Controllo e sorveglianza sanitaria"
    punti:
      - "Il controllo sanitario riguarda accertamenti medici di base sulla salute."
      - "La sorveglianza sanitaria riguarda chi è esposto a rischi oltre le soglie."
      - "L'organizzazione individua i volontari da sottoporre a sorveglianza."
    pittogramma: "iso7010/medico"
    nota: "Distingui le due cose: il controllo sanitario è una misura generale di prevenzione, la sorveglianza sanitaria è svolta dal medico competente per rischi specifici. I dati sanitari sono riservati. Per le modalità pratiche rimanda al responsabile del Gruppo e alle indicazioni regionali."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/decreto-del-capo-dipartimento-del-12-gennaio-2012-intesa-tra-il-dipartimento-della-protezione-civile-e-le-regioni-e-province-autonome-sulla-0"
  - titolo: "Il kit personale"
    punti:
      - "DPI: caschetto, scarpe S3, guanti, occhiali, mascherina, pettorina del Gruppo."
      - "Cibo e acqua per almeno 72 ore di missione."
      - "Torcia frontale, antipioggia, due cambi, sacco a pelo, kit igiene."
      - "Copia dei documenti e tessera del Gruppo."
    pittogramma: "arasaac/zaino"
    nota: "Sul posto manca di tutto: non si parte pensando di trovare qualcosa lì. Esercizio: ogni volontario prepara la lista del proprio kit con la check-list del Manuale da campo e la confronta con quella di un compagno. Aggiungete i capi per i climi freddi o caldi."
    fonte: "/formazione/manuale-campo/scouting/"
  - titolo: "L'abbigliamento tecnico"
    punti:
      - "La divisa è ad alta visibilità, con bande catarifrangenti."
      - "Protegge, rende visibili anche di notte e identifica il Gruppo."
      - "Si lava come indica il produttore e i danni si segnalano."
      - "Fuori servizio, nella vita privata, la divisa non si indossa."
    pittogramma: "iso7010/alta-visibilita"
    nota: "Un volontario non identificato rischia di essere scambiato per personale non autorizzato. Controllate insieme lo stato delle bande catarifrangenti: se sono sbiadite, il capo va sostituito. Ricorda che la divisa richiede un comportamento serio anche nei gesti."
    fonte: "/comunicazioni/2026-10-22-abbigliamento-tecnico-volontario/"
  - titolo: "Autotutela: prima la tua sicurezza"
    punti:
      - "Ogni volontario si prende cura della propria sicurezza e di quella degli altri."
      - "Nessun soccorso giustifica un rischio non necessario per chi soccorre."
      - "Si interviene solo con attivazione formale e con i DPI."
      - "Pause e fine turno servono a restare lucidi."
    pittogramma: "iso7010/obbligo-generico"
    nota: "Il dovere di prendersi cura di sé e degli altri è scritto nel decreto del 2011. Parla dei turni lunghi e del sonno irregolare: presenta il Kit calamità per i volontari, con le schede su stress e fine turno. Le schede non sostituiscono un supporto professionale quando serve."
    fonte: "/formazione/kit-calamita-volontari-pc/"
  - tipo: "domanda"
    domanda: "Quali di queste affermazioni sono corrette?"
    punti:
      - "I DPI li fornisce l'organizzazione di appartenenza."
      - "In emergenza la formazione ricevuta non conta."
      - "Un DPI danneggiato si segnala e si sostituisce."
    nota: "Le risposte giuste sono la prima e la terza. La seconda è sbagliata: il volontario opera proprio secondo la formazione, le istruzioni e i DPI ricevuti, anche quando c'è fretta. Chiedi a chi ha scelto la seconda di spiegare il perché e discutetene."
    fonte: "/manuale/31-sicurezza-del-volontario/"
ricorda:
  - "La sicurezza del volontario viene prima di ogni intervento."
  - "Formazione, DPI e controllo sanitario sono diritti e doveri."
  - "Prepara il kit personale prima, non durante l'emergenza."
