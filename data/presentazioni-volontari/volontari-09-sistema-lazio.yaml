slide:
  - titolo: "Che cosa sono queste slide"
    punti:
      - "La Regione organizza corsi per i volontari del sistema regionale."
      - "Queste slide non sostituiscono i corsi della Regione."
      - "Ogni dato rimanda a una fonte ufficiale da consultare."
    pittogramma: "arasaac/informazione"
    nota: "Chiarisci subito che il Gruppo non riproduce i corsi della Regione: offre i riferimenti sul sistema regionale. Chi vuole conoscere i programmi ufficiali può scrivere alla Direzione regionale all'indirizzo formazione.protezionecivile@regione.lazio.it, pubblicato sulla pagina regionale della formazione."
    fonte: "https://regione.lazio.it/protezione-civile/formazione"
  - titolo: "La legge regionale 2/2014"
    punti:
      - "La legge regionale 26 febbraio 2014, n. 2 regola la protezione civile nel Lazio."
      - "Istituisce il Sistema integrato regionale di protezione civile (art. 1)."
      - "Ne fanno parte Regione, province, comuni, Roma Capitale e volontariato (art. 4)."
    pittogramma: "arasaac/documenti"
    nota: "Il testo coordinato è sul sito del Consiglio regionale del Lazio: arriva fino all'articolo 39, in sette capi, e alcuni articoli sono abrogati. La legge regionale 8/2020 l'ha adeguata al Codice della protezione civile. L'articolo 3 elenca le attività: previsione, prevenzione, preparazione, soccorso, superamento dell'emergenza e mitigazione del rischio."
    fonte: "https://www.consiglio.regione.lazio.it/?vw=leggiregionalidettaglio&id=9264&sv=vigente"
  - titolo: "Il volontariato nella legge"
    punti:
      - "Le organizzazioni di volontariato sono parte del Sistema integrato (art. 10)."
      - "I Comuni possono istituire gruppi comunali che aiutano il Sindaco."
      - "Su richiesta delle autorità, un gruppo comunale opera anche fuori dal Comune."
      - "La Regione promuove formazione e aggiornamento dei volontari (art. 33)."
    pittogramma: "arasaac/volontario"
    nota: "Leggi insieme il comma 4 dell'articolo 10: il gruppo comunale coadiuva il Sindaco e lavora sotto la direzione delle autorità competenti. L'articolo 33 istituisce anche la Scuola di alta formazione di protezione civile, il cui regolamento è in vigore dall'8 maggio 2026."
    fonte: "https://www.consiglio.regione.lazio.it/?vw=leggiregionalidettaglio&id=9264&sv=vigente"
  - titolo: "L'elenco territoriale"
    punti:
      - "La Regione tiene l'elenco territoriale delle organizzazioni di volontariato."
      - "Possono iscriversi anche i gruppi comunali e intercomunali."
      - "L'iscrizione consente l'attivazione da parte delle autorità di protezione civile."
    nota: "La Regione ha istituito l'elenco con la DGR 109 del 2013; i requisiti sono nel Regolamento regionale 18/2019. L'iscrizione dà accesso ai benefici degli articoli 39 e 40 del Codice della protezione civile. Le organizzazioni gestiscono documenti, mezzi e volontari sulla piattaforma regionale MGO."
    fonte: "https://www.regione.lazio.it/protezione-civile/elenco-territoriale-MGO"
  - titolo: "Direzione e Sala operativa"
    punti:
      - "La Direzione regionale Emergenza, Protezione civile e NUE 112 guida il sistema."
      - "La Sala operativa regionale coordina gli interventi in tutto il Lazio, 24 ore su 24."
      - "Dal 15 giugno al 30 settembre la Sala diventa SOUP, per gli incendi boschivi."
    pittogramma: "arasaac/ufficio"
    nota: "SOUP significa Sala operativa unificata permanente: in quel periodo ci lavorano anche Vigili del fuoco, Carabinieri forestali e due unità del volontariato per le comunicazioni radio. La Sala attiva le organizzazioni di volontariato; i volontari inviano informazioni e immagini con l'app AlerTeam. I compiti della Direzione sono nell'articolo 20 della legge regionale, la SOUP nell'articolo 26."
    fonte: "https://www.regione.lazio.it/protezione-civile/sala-operativa-regionale"
  - titolo: "Il 112 nel Lazio"
    punti:
      - "Per ogni emergenza, nel Lazio, si chiama il 112."
      - "Risponde la Centrale unica di risposta, che coinvolge l'ente giusto."
      - "Nel Lazio il 112 è partito il 18 novembre 2015."
      - "L'803 555 della Sala operativa regionale serve per segnalazioni non urgenti."
    pittogramma: "arasaac/112"
    nota: "Le centrali uniche di risposta del Lazio sono due, entrambe a Roma: la seconda, inaugurata nel settembre 2021, copre le province di Viterbo, Rieti, Frosinone e Latina. La legge regionale disciplina il servizio all'articolo 26 ter. Ricorda che i cittadini non attivano il Gruppo: lo attivano le autorità."
    fonte: "https://regione.lazio.it/notizie/Inaugurata-nuova-sala-numero-unico-emergenza-112"
  - titolo: "Centro funzionale e bollettini"
    punti:
      - "Il Centro funzionale regionale valuta gli effetti attesi delle previsioni meteo."
      - "Ogni giorno pubblica il bollettino di criticità idrogeologica e idraulica."
      - "Genzano è nella zona di allerta F, Bacini Costieri Sud."
      - "Giallo: criticità ordinaria. Arancione: moderata. Rosso: elevata."
    pittogramma: "arasaac/pioggia"
    nota: "Il Lazio è diviso in sette zone di allerta; la tabella dei Comuni è allegata alla DGR 865/2019. Con allerta almeno gialla il Centro funzionale emette anche l'allertamento del sistema regionale. Il colore dice che cosa può succedere: le fasi operative del Comune le decide il Sindaco."
    fonte: "https://www.regione.lazio.it/protezione-civile/centro-funzionale-regionale"
  - titolo: "Campagna AIB e zone incendi"
    punti:
      - "Durante la campagna AIB esce il bollettino di pericolosità incendi boschivi."
      - "Il bollettino valuta la pericolosità per zone di allerta AIB."
      - "Genzano di Roma è nella zona AIB 9."
    pittogramma: "arasaac/incendio"
    nota: "Mostra la tabella regionale dei Comuni per zona AIB, allegata alla pagina dei bollettini: Genzano è nella zona 9. Nel 2026 il periodo di massima pericolosità è andato dal 15 giugno al 15 ottobre. Le norme di comportamento AIB sono allegate alla stessa pagina."
    fonte: "https://www.regione.lazio.it/protezione-civile/centro-funzionale-regionale/bollettini-rischi-incendi"
  - tipo: "domanda"
    domanda: "Il bollettino dà allerta arancione per la zona F. Che cosa significa?"
    punti:
      - "È prevista una criticità moderata nella zona di Genzano."
      - "Il Gruppo esce da solo per un sopralluogo."
      - "Il volontario chiama l'803 555 per sapere se uscire."
    nota: "È giusta la prima. Il Gruppo opera quando lo attivano le autorità competenti, non di propria iniziativa. L'803 555 serve per le segnalazioni non urgenti: il volontario segue le indicazioni del Responsabile del Gruppo."
    fonte: "/allerte-meteo/cosa-significa-a-genzano/"
  - titolo: "La formazione regionale"
    punti:
      - "La Direzione regionale progetta e realizza corsi per il volontariato."
      - "Con la cascata formativa, volontari esperti formati dalla Regione insegnano ai nuovi."
      - "I formatori sono iscritti da almeno due anni a un'organizzazione dell'elenco."
      - "Alla fine del corso i partecipanti vengono valutati."
    pittogramma: "arasaac/aiutare"
    nota: "La Regione ha avviato la cascata formativa nel marzo 2025. I formatori seguono un corso regionale organizzato con il Centro di servizio per il volontariato e ricevono un attestato. Secondo la pagina regionale della formazione, aggiornata il 28/01/2026 e letta il 20/11/2026, nel Lazio i volontari sono circa 16.000."
    fonte: "https://www.regione.lazio.it/notizie/protezione-civile/cascata-formativa-nuovi-Volontari-Protezione-Civile-ponte-esperienza-nuovi-Volontari"
  - titolo: "Corsi AIB e BLSD"
    punti:
      - "Il corso base AIB unisce teoria e prove pratiche sul campo."
      - "I corsi AIB si svolgono con il Corpo nazionale dei Vigili del fuoco."
      - "I corsi BLSD insegnano la rianimazione cardiopolmonare e l'uso del defibrillatore."
      - "La Regione li organizza con ARES 118 e Croce Rossa Italiana."
    pittogramma: "iso7010/defibrillatore-dae"
    nota: "La teoria AIB comprende norme, fisica della combustione, cause degli incendi, tecniche di spegnimento e procedure; la pratica simula il lavoro di squadra con le attrezzature e i DPI. I corsi BLSD gratuiti del 2025 si sono svolti dal 17 settembre al 29 ottobre. Nel marzo 2026 la Regione ha consegnato 100 defibrillatori ad associazioni e gruppi comunali, fra cui il nostro."
    fonte: "https://www.regione.lazio.it/protezione-civile/formazione/antincedio-boschivo"
ricorda:
  - "Il programma del corso base lo comunica la Regione agli iscritti."
  - "In emergenza, nel Lazio, si chiama sempre il 112."
  - "Il Gruppo opera quando lo attivano le autorità, mai di propria iniziativa."
