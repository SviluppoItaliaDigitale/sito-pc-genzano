# programma del corso: queste slide non lo riproducono e lo dicono nella prima.
# Testi verificati il 20/11/2026 sulle pagine indicate in «fonte» di ogni slide;
# articoli della L.R. 2/2014 controllati sul testo coordinato del Consiglio regionale.
