# Presentazione per il corso base dei volontari: comunicazioni radio in emergenza.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide. Nessuna
# frequenza o canale assegnato al Gruppo: si verificano con il Responsabile.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
pubblico: "volontari"
corso: "Corso base del Gruppo"
ordine: 6
file: "2026-11-20-volontari-06-radio"
tema: "volontari-06-radio"
titolo: "Le comunicazioni radio in emergenza"
sottotitolo: "Corso base per i volontari — modulo 6"
fascia: "Nuovi volontari del Gruppo (corso base)"
durata: "60-75 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Perché la radio"
    punti:
      - "In un'emergenza le reti telefoniche possono rompersi o saturarsi."
      - "Due apparati radio comunicano senza antenne telefoniche né cavi."
      - "Con batterie o pannelli solari funzionano anche senza corrente."
    pittogramma: "arasaac/radio"
    nota: "Spiega che nei primi minuti di un evento grave il traffico telefonico supera la capacità della rete, che smette di funzionare per tutti. Ricorda che IT-alert avvisa la popolazione, mentre la radio tiene in piedi il coordinamento degli operatori. Chiedi al gruppo se ha vissuto un blackout dei telefoni durante un evento."
    fonte: "/conoscere/telecomunicazioni-emergenza/"
  - titolo: "Chi può trasmettere"
    punti:
      - "Sulle bande radioamatoriali trasmette solo chi ha patente e autorizzazione generale."
      - "Senza patente si usano solo apparati e canali del Comune, secondo le procedure."
      - "Chi non è autorizzato ascolta e segue la maglia."
    pittogramma: "arasaac/ascoltare-radio"
    nota: "La patente di operatore si ottiene con l'esame del Ministero delle Imprese e del Made in Italy; questo modulo non la sostituisce. Il volontario della funzione telecomunicazioni non comanda: riferisce al Responsabile della funzione nel COC, che riferisce al Sindaco. Frequenze e canali si verificano sempre con il Responsabile del Gruppo prima dell'attivazione."
    fonte: "/formazione/radiocomunicazioni-emergenza/"
  - titolo: "Reti e canali"
    punti:
      - "Scegli il canale in base al messaggio: destinatari, precisione, urgenza."
      - "VHF e UHF servono in zona, l'HF sulle lunghe distanze."
      - "I messaggi lunghi o complessi si mandano per scritto."
      - "Per i messaggi critici usa più canali insieme."
    nota: "Il compito è far arrivare il messaggio, non usare per forza la radio: se un telefono funziona ancora, si usa il telefono. Mostra la matrice di scelta della pagina. Esercizio: una lista di 50 sfollati con i dati anagrafici, su quale canale la mandereste e perché?"
    fonte: "/formazione/radiocomunicazioni-emergenza/reti-canali/"
  - titolo: "Disciplina di rete"
    punti:
      - "In maglia diretta si trasmette solo con il permesso del controllo, salvo emergenze."
      - "Ascolta prima di trasmettere e pensa prima di premere il PTT."
      - "Voce normale e calma, frasi brevi, un argomento per volta."
      - "Niente gergo, sigle o battute che non tutti capiscono."
    pittogramma: "arasaac/ascoltare"
    nota: "Dopo aver premuto il PTT lascia un istante di silenzio, così la prima sillaba non si perde sui ripetitori. Il microfono va vicino alla guancia, di lato alla bocca. Fai ascoltare due trasmissioni, una improvvisata e una preparata, e chiedi al gruppo quale si capisce meglio."
    fonte: "/formazione/radiocomunicazioni-emergenza/tecniche-operative/"
  - titolo: "Come è fatto un messaggio"
    punti:
      - "Intestazione: numero, precedenza, stazione, data e ora."
      - "Destinatario, poi il testo, breve e chiaro."
      - "Firma di chi ha scritto il messaggio, non di chi lo trasmette."
      - "Ogni messaggio va nel modulo e nel registro di stazione."
    nota: "Il modulo messaggio si compila in duplice copia: una resta in stazione, l'altra accompagna la consegna. Il numero progressivo del modulo è lo stesso del registro di stazione, che permette di ricostruire tutta l'attività radio. Distribuisci un modulo vuoto e fai compilare un messaggio di prova."
    fonte: "/formazione/manuale-campo/moduli-radio/"
  - titolo: "Le priorità dei messaggi"
    punti:
      - "Emergenza: una vita umana in pericolo immediato."
      - "Priorità: richieste urgenti delle autorità."
      - "Routine: messaggi ordinari, che aspettano il proprio turno."
    pittogramma: "arasaac/urgente"
    nota: "Il controllo di maglia fa passare prima le emergenze, poi le priorità, poi la routine. Sul modulo messaggio del Gruppo la qualifica PA indica la salvaguardia della vita e interrompe ogni trasmissione inferiore. Usarla a sproposito impegna risorse e può ritardare un'emergenza vera."
    fonte: "/formazione/radiocomunicazioni-emergenza/gestione-messaggi/"
  - titolo: "L'alfabeto fonetico"
    punti:
      - "Di' la parola intera, poi annuncia che la compiti."
      - "Compita lettera per lettera con l'alfabeto NATO."
      - "Detta i numeri una cifra alla volta."
    nota: "Il Gruppo adotta l'alfabeto NATO in tutte le comunicazioni di servizio: niente fonetiche inventate, che in condizioni difficili si fraintendono. Esempio: Genzano si compita Golf, Echo, November, Zulu, Alfa, November, Oscar. Esercizio a coppie: ognuno compita il proprio cognome e l'altro lo trascrive."
    fonte: "/formazione/radiocomunicazioni-emergenza/tecniche-operative/"
  - titolo: "Il controllo di maglia"
    punti:
      - "Il controllo di maglia apre e chiude la rete con una formula fissa."
      - "Riceve le stazioni che entrano e autorizza chi trasmette."
      - "Tiene il registro di tutto il traffico."
      - "Ha sempre un sostituto pronto a subentrare."
    nota: "Le stazioni si chiamano con nominativi tattici legati alla funzione o al luogo, come «COC Genzano» o «Logistica»: al cambio turno cambia l'operatore, non il nominativo. Leggi ad alta voce la formula di apertura della pagina e poi fai aprire la maglia a turno a due volontari."
    fonte: "/formazione/radiocomunicazioni-emergenza/gestione-messaggi/"
  - titolo: "Attivazione ed equipaggiamento"
    punti:
      - "Verifica che l'attivazione arrivi dalla catena nota e conferma la disponibilità."
      - "Avvisa la famiglia e controlla che le batterie siano cariche."
      - "Porta cuffia, moduli messaggio, registro e scheda dell'alfabeto."
      - "All'arrivo ascolta il canale prima di entrare in maglia."
    pittogramma: "arasaac/zaino"
    nota: "Il kit personale si prepara per 72 ore di autonomia. All'arrivo ci si presenta al capo squadra, si raggiunge la postazione assegnata e si entra in maglia con nominativo personale e tattico. Chiedi al gruppo di elencare a memoria che cosa c'è nel proprio zaino."
    fonte: "/formazione/radiocomunicazioni-emergenza/attivazione-equipaggiamento/"
  - titolo: "La sicurezza dell'operatore"
    punti:
      - "Famiglia e casa prima della missione."
      - "Scegli una postazione con via di fuga, mai in posizioni senza uscita."
      - "Bevi prima di avere sete, mangia e rispetta i turni."
      - "Dopo 24 ore senza sonno chiedi il cambio."
    pittogramma: "arasaac/attenzione"
    nota: "Un operatore esausto o disidratato sbaglia e diventa un peso per il gruppo. I cavi vanno fissati e tenuti lontani dal passaggio di persone e mezzi. Esempio: una postazione in una cantina con una sola uscita va spostata. Chiedi chi ha già concordato in famiglia che cosa fare se viene attivato."
    fonte: "/formazione/radiocomunicazioni-emergenza/sicurezza-sopravvivenza/"
  - tipo: "domanda"
    domanda: "Sei in maglia diretta e hai notizia di un ferito grave. Che cosa fai?"
    punti:
      - "Chiamo il controllo di maglia dichiarando «emergenza»."
      - "Aspetto che gli altri finiscano, per non disturbare."
      - "Registro il messaggio con il suo numero progressivo."
    nota: "Le risposte giuste sono la prima e la terza. Il traffico di emergenza ha la precedenza assoluta e può interrompere la maglia; aspettare fa perdere tempo prezioso. Ogni messaggio, anche urgente, va annotato nel registro di stazione con il numero del modulo."
    fonte: "/formazione/radiocomunicazioni-emergenza/gestione-messaggi/"
ricorda:
  - "Ascolta prima di trasmettere e pensa prima di premere il PTT."
  - "Chi non è autorizzato non trasmette: ascolta e segue la maglia."
  - "Messaggi brevi, un argomento per volta, sempre registrati."
