file: "2026-11-20-volontari-05-primo-soccorso"
tema: "volontari-05-primo-soccorso"
titolo: "Nozioni di primo soccorso per il volontario"
sottotitolo: "Corso base per i volontari — modulo 5"
fascia: "Nuovi volontari del Gruppo (corso base)"
durata: "60-75 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cosa fa il volontario"
    punti:
      - "Compie i gesti di primo soccorso alla portata di ogni cittadino."
      - "Fa solo ciò che sa fare bene."
      - "Resta fino all'arrivo dei soccorsi e riferisce ciò che ha visto e fatto."
      - "Queste slide non sostituiscono un corso BLSD certificato."
    pittogramma: "arasaac/aiutare"
    nota: "Chiarisci subito il perimetro: il volontario non sanitario non fa diagnosi e non somministra farmaci, compie i gesti del cittadino formato. Le manovre si imparano solo con esercitazione pratica su manichino in un corso BLSD certificato. Chiedi al gruppo chi ha già frequentato un corso e quando."
    fonte: "/formazione/primo-soccorso/"
  - titolo: "Prima la sicurezza"
    punti:
      - "Controlla la scena: traffico, cavi elettrici, fiamme, strutture pericolanti."
      - "Non mettere in pericolo te stesso."
      - "Se puoi, indossa guanti monouso prima di toccare sangue o ferite."
    pittogramma: "arasaac/pericolo"
    nota: "Un soccorritore che si ferisce diventa un secondo paziente. Fai un esempio concreto: una persona a terra sul bordo di una strada trafficata. Chiedi al gruppo quali pericoli guarderebbe prima di avvicinarsi e come si renderebbe visibile."
    fonte: "/formazione/primo-soccorso/riconoscere-arresto/"
  - titolo: "Chiama il 112"
    punti:
      - "Nel Lazio, per ogni emergenza sanitaria, si chiama il 112."
      - "Di' dove sei, che cosa è successo e quante persone sono coinvolte."
      - "Metti il vivavoce e non riagganciare finché non te lo dice l'operatore."
    pittogramma: "arasaac/telefonare"
    nota: "Ricorda che il Gruppo non si chiama direttamente per un'emergenza medica in corso: prima il 112. L'operatore può guidare a voce il massaggio cardiaco e indicare il DAE più vicino. Esercizio a coppie: uno chiama, l'altro fa l'operatore e pone le domande della pagina."
    fonte: "/formazione/primo-soccorso/riconoscere-arresto/"
  - titolo: "Riconoscere l'arresto cardiaco"
    punti:
      - "La persona non risponde e non respira normalmente."
      - "Controlla il respiro per non più di 10 secondi."
      - "Il respiro agonico, rumoroso e irregolare, non è respiro normale."
    pittogramma: "arasaac/emergenza"
    nota: "Mostra la sequenza: chiamare ad alta voce, scuotere delicatamente le spalle, inclinare la testa all'indietro sollevando il mento, guardare, ascoltare e sentire il respiro. Insisti sul respiro agonico, che inganna molti testimoni. Domanda per il gruppo: perché si perde meno tempo a iniziare che ad aspettare?"
    fonte: "/formazione/primo-soccorso/riconoscere-arresto/"
  - titolo: "Il massaggio cardiaco"
    punti:
      - "Mani al centro del torace, sulla metà inferiore dello sterno."
      - "Comprimi da 5 a 6 cm, da 100 a 120 volte al minuto."
      - "Lascia risalire il torace e interrompi il meno possibile."
      - "In due, datevi il cambio ogni 2 minuti."
    nota: "Braccia tese e peso del corpo, non la forza delle braccia. Se la persona è su un letto non va spostata a terra: si comincia lì premendo più a fondo. Se c'è un manichino, fai provare a turno due minuti di compressioni e chiedi come cala la qualità con la fatica."
    fonte: "/formazione/primo-soccorso/massaggio-cardiaco/"
  - titolo: "Solo compressioni o 30 e 2"
    punti:
      - "Se non sei addestrato, fai solo compressioni continue."
      - "Se sei addestrato, alterna 30 compressioni e 2 ventilazioni."
      - "Per le ventilazioni usa una mascherina da rianimazione, se c'è."
    nota: "Una RCP imperfetta è molto meglio di nessuna RCP. Chi non si sente sicuro delle ventilazioni passa alle sole compressioni senza esitare. Il massaggio continua finché arrivano i soccorsi, il DAE chiede di fermarsi, la persona riprende a respirare normalmente o il soccorritore è esausto senza cambio."
    fonte: "/formazione/primo-soccorso/massaggio-cardiaco/"
  - titolo: "Il defibrillatore (DAE)"
    punti:
      - "Manda qualcuno a cercarlo e continua il massaggio."
      - "Accendilo e segui le istruzioni vocali."
      - "Durante analisi e scarica nessuno tocca la persona."
      - "Dopo la scarica riprendi subito il massaggio."
    pittogramma: "iso7010/defibrillatore-dae"
    nota: "Chiunque può usare un DAE: decide da solo se la scarica serve. Le piastre vanno sotto la clavicola destra e sul fianco sinistro, sotto l'ascella, come nei disegni. Chiedi al gruppo dove si trova il DAE più vicino alla sede e chi sa riconoscere il cartello."
    fonte: "/formazione/primo-soccorso/defibrillatore-dae/"
  - titolo: "Soffocamento nell'adulto"
    punti:
      - "Se tossisce o parla, incoraggiala a tossire con forza."
      - "Se non respira, alterna 5 colpi tra le scapole e 5 compressioni addominali."
      - "Se perde conoscenza, chiama il 112 e inizia la RCP."
    nota: "Nell'ostruzione parziale non si interviene con colpi o manovre. Nel lattante sotto l'anno la tecnica è diversa: niente compressioni addominali, si alternano colpi sulla schiena e compressioni toraciche con due dita. Non si cerca il corpo estraneo con le dita se non si vede."
    fonte: "/formazione/primo-soccorso/soffocamento-disostruzione/"
  - titolo: "Fermare un'emorragia"
    punti:
      - "Premi forte sulla ferita con garze o un panno pulito."
      - "Mantieni la pressione almeno 10 minuti, senza sollevare il tampone."
      - "Se il sangue passa, aggiungi garze sopra le prime."
      - "Il laccio emostatico solo se sei stato formato."
    pittogramma: "iso7010/cassetta-primo-soccorso"
    nota: "Ricorda i segni dello shock: pallore, pelle fredda e umida, respiro veloce, confusione. In quel caso si fa sdraiare la persona, la si copre e si chiama subito il 112. Mostra dove si trovano guanti e garze nella cassetta del mezzo."
    fonte: "/formazione/primo-soccorso/emorragie-ustioni-traumi/"
  - titolo: "Ustioni"
    punti:
      - "Raffredda con acqua corrente fresca, non gelata, per almeno 20 minuti."
      - "Niente ghiaccio, niente rimedi casalinghi, non rompere le bolle."
      - "Copri con una garza sterile e chiama il 112 se è grave."
    pittogramma: "arasaac/acqua"
    nota: "Il 112 serve se l'ustione è più grande del palmo della mano della persona, se riguarda viso, mani, piedi, genitali o grandi articolazioni, se colpisce un bambino piccolo o un anziano, se è elettrica o chimica. I vestiti incollati alla pelle non si tolgono. Chiedi al gruppo quali rimedi casalinghi hanno sentito consigliare."
    fonte: "/formazione/primo-soccorso/emorragie-ustioni-traumi/"
  - tipo: "domanda"
    domanda: "Una persona a terra non risponde e fa respiri rumorosi e irregolari. Che cosa fai?"
    punti:
      - "Chiamo il 112 e inizio il massaggio cardiaco."
      - "Aspetto: sta ancora respirando."
      - "Mando qualcuno a cercare un DAE."
    nota: "Le risposte giuste sono la prima e la terza. I respiri rumorosi e irregolari sono respiro agonico, che non è respiro normale: chi non risponde e non respira normalmente è in arresto cardiaco. Aspettare fa perdere i minuti in cui RCP e DAE possono salvare la vita."
    fonte: "/formazione/primo-soccorso/riconoscere-arresto/"
ricorda:
  - "Prima la tua sicurezza, poi il soccorso."
  - "Chi non risponde e non respira normalmente: 112, massaggio e DAE."
  - "Le manovre si imparano in un corso BLSD certificato."
