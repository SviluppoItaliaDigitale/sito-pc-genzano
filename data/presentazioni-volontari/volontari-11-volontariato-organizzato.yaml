# Presentazione per i volontari: il volontariato organizzato di protezione civile.
# Testi dalla pagina del sito sulla storia della protezione civile, dalla pagina Chi siamo
# e dal testo vigente su Normattiva del D.Lgs. 3 luglio 2017, n. 117 (artt. 5, 17, 32,
# 45, 102) e del D.Lgs. 2 gennaio 2018, n. 1 (artt. 13, 32-35, 48), verificati il
# 20/11/2026. Il generatore è scripts/genera-presentazioni-lim.py.
pubblico: "volontari"
corso: "Riferimenti per la formazione regionale"
ordine: 11
file: "2026-11-20-volontari-11-volontariato-organizzato"
tema: "volontari-11-volontariato-organizzato"
titolo: "Il volontariato organizzato di protezione civile"
sottotitolo: "Riferimenti per la formazione regionale"
fascia: "Volontari del Gruppo (corso base e aggiornamento)"
durata: "60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Dal soccorso spontaneo al sistema"
    punti:
      - "Firenze 1966 e Belìce 1968: soccorsi lenti e disorganizzati."
      - "Friuli 1976: centri di coordinamento con Regione, Comuni e volontariato locale."
      - "Irpinia 1980: i ritardi portano al Dipartimento, nel 1982."
    pittogramma: "arasaac/calendario"
    nota: "È la storia raccontata nella pagina del sito sulla storia della protezione civile. Il metodo di Giuseppe Zamberletti in Friuli mise insieme per la prima volta istituzioni e volontariato vicino ai luoghi colpiti. Chiedi al gruppo se qualcuno ha in famiglia il ricordo di una di queste emergenze."
    fonte: "/conoscere/storia-della-protezione-civile/"
  - titolo: "Dal 1992 al Codice del 2018"
    punti:
      - "La legge 225 del 1992 crea il Servizio nazionale, un sistema diffuso."
      - "Il volontariato ne fa parte accanto a Stato, Regioni, Comuni e strutture operative."
      - "Il Codice del 2018 riunisce le regole in un solo testo."
    pittogramma: "arasaac/documenti"
    nota: "Il Codice (D.Lgs. 1/2018) ha abrogato fra l'altro il regolamento del 2001 sulla partecipazione del volontariato (d.P.R. 194/2001, articolo 48 del Codice). Oggi il volontariato organizzato iscritto nell'Elenco nazionale è una struttura operativa del Servizio nazionale (articolo 13)."
    fonte: "/conoscere/storia-della-protezione-civile/"
  - titolo: "Chi è il volontario"
    punti:
      - "Sceglie liberamente di agire per la comunità e il bene comune."
      - "Opera in modo personale, spontaneo e gratuito."
      - "Non può essere retribuito, nemmeno da chi riceve l'aiuto."
      - "Gli possono essere rimborsate solo le spese effettive e documentate."
    pittogramma: "arasaac/aiutare"
    nota: "È l'articolo 17 del Codice del Terzo settore (D.Lgs. 117/2017), che vale per tutti i volontari; il Codice della protezione civile riprende la stessa definizione all'articolo 32. Chiedi al gruppo perché la gratuità è una garanzia anche per chi riceve l'aiuto."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2017-07-03;117"
  - titolo: "Il Terzo settore"
    punti:
      - "Il Codice del Terzo settore del 2017 ha sostituito la legge sul volontariato del 1991."
      - "La protezione civile è una delle attività di interesse generale."
      - "Gli enti si iscrivono al Registro unico nazionale del Terzo settore (RUNTS)."
    pittogramma: "arasaac/ufficio"
    nota: "Sono gli articoli 102 (abrogazione della legge 266/1991), 5, comma 1, lettera y (protezione civile) e 45 (RUNTS) del D.Lgs. 117/2017. Il RUNTS è tenuto dal Ministero del lavoro con gli uffici regionali."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2017-07-03;117"
  - titolo: "Le organizzazioni di volontariato"
    punti:
      - "Sono associazioni di almeno sette persone o tre organizzazioni."
      - "Lavorano soprattutto a favore di altri."
      - "Si reggono in prevalenza sull'attività gratuita dei loro associati."
      - "Se gli associati scendono sotto il minimo, vanno reintegrati entro un anno."
    pittogramma: "arasaac/famiglia"
    nota: "È l'articolo 32 del Codice del Terzo settore. Le organizzazioni di volontariato (OdV) che operano in protezione civile devono anche iscriversi all'Elenco nazionale del volontariato di protezione civile (articolo 34 del Codice della protezione civile)."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2017-07-03;117"
  - titolo: "I Gruppi comunali"
    punti:
      - "Li promuove il Comune, con cittadini che scelgono di aderire."
      - "Sono enti del Terzo settore in forma specifica."
      - "La costituzione la delibera il Consiglio comunale."
      - "Per entrare nel Servizio nazionale si iscrivono all'elenco territoriale della Regione."
    pittogramma: "arasaac/piazza"
    nota: "È l'articolo 35 del Codice della protezione civile, che richiama l'articolo 4, comma 2, del Codice del Terzo settore. Possono nascere anche gruppi intercomunali o provinciali (comma 3)."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Il nostro Gruppo"
    punti:
      - "È un'articolazione del Comune di Genzano di Roma."
      - "Costituito nella forma attuale con la delibera del Consiglio comunale n. 31 del 31 luglio 2023."
      - "Iscritto al RUNTS, sezione «Altri enti del Terzo settore», dal 2024."
      - "Ha Statuto e Regolamento propri."
    pittogramma: "arasaac/volontario"
    nota: "I dati sono nella pagina Chi siamo, con la delibera da scaricare: l'iscrizione al RUNTS è la determina G14230 del 28 ottobre 2024. Chiedi al gruppo dove si trovano Statuto e Regolamento e chi li può consultare."
    fonte: "/chi-siamo/"
  - titolo: "Coordinamenti e reti"
    punti:
      - "Le organizzazioni si riuniscono in coordinamenti territoriali."
      - "Il nostro Gruppo aderisce al Coordinamento FE.PI.VOL."
      - "I coordinamenti uniscono mezzi e persone nelle maxi emergenze."
    pittogramma: "arasaac/aiuto"
    nota: "Il ruolo dei coordinamenti nelle colonne mobili è spiegato nell'articolo del sito sulle maxi emergenze. A livello nazionale il volontariato è rappresentato nel Comitato nazionale del volontariato di protezione civile (articolo 42 del Codice)."
    fonte: "/comunicazioni/2026-04-12-maxi-emergenze-colonne-mobili-coordinamenti-fepivol-lazio/"
  - tipo: "domanda"
    domanda: "Che cosa serve a un Gruppo comunale per entrare nel Servizio nazionale?"
    punti:
      - "Una delibera del Consiglio comunale che lo costituisce."
      - "L'iscrizione all'elenco territoriale della Regione."
      - "Un numero minimo di mezzi antincendio."
    nota: "Sono giuste la prima e la seconda: il Consiglio comunale delibera la costituzione e il Gruppo si iscrive all'elenco territoriale (articolo 35, commi 1 e 2, del Codice). Il Codice non chiede un numero minimo di mezzi."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
ricorda:
  - "Il volontariato di protezione civile è nato dalle grandi emergenze ed è parte del Servizio nazionale."
  - "Il volontario agisce gratis; si possono rimborsare solo le spese documentate."
  - "OdV e Gruppi comunali sono enti del Terzo settore e si iscrivono agli elenchi di protezione civile."
