slide:
  - titolo: "Che cos'è il Piano"
    punti:
      - "Il Piano organizza i soccorsi del Comune in caso di calamità."
      - "Indica rischi, aree di emergenza, procedure e chi coordina."
      - "Fa fede il testo pubblicato dal Comune di Genzano di Roma."
    pittogramma: "arasaac/documenti"
    nota: "Mostra il PDF del Piano dal sito del Comune e fai vedere com'è organizzato. Spiega che l'impianto segue il Codice della protezione civile (D.Lgs. 1/2018) e le direttive del Dipartimento. Chiedi al gruppo: quali rischi del nostro territorio vi aspettate di trovare nel Piano?"
    fonte: "/piano-emergenza/"
  - titolo: "Chi coordina: il Sindaco e il COC"
    punti:
      - "Il Sindaco è la prima autorità comunale di protezione civile."
      - "Quando serve, attiva il Centro Operativo Comunale (COC)."
      - "Il Piano indica due sedi: Palazzetto Gino Cesaroni e Polizia Locale."
    pittogramma: "arasaac/ufficio"
    nota: "Il Piano non dice quale delle due sedi sia la principale. Esempio concreto: per l'Infiorata 2026 l'ordinanza n. 12 del 3 giugno 2026 ha collocato il COC al Comando della Polizia Locale, in via Roma 31/A. Ricorda anche il 14° COI Castelli Romani Sud per le emergenze che coinvolgono più Comuni."
    fonte: "/piano-emergenza/"
  - titolo: "Le funzioni di supporto del COC"
    punti:
      - "Il COC lavora per funzioni, ognuna con un referente."
      - "Tecnica e pianificazione, sanità e assistenza sociale, volontariato."
      - "Materiali e mezzi, telecomunicazioni, servizi essenziali, censimento danni."
      - "Strutture operative e viabilità, assistenza alla popolazione."
    pittogramma: "arasaac/informazione"
    nota: "Leggi con il gruppo l'elenco delle funzioni previste dal Piano comunale. Chiedi: con quale funzione parla di solito il Gruppo? La funzione volontariato del COC è tra le autorità che possono attivarlo. Fai notare che la viabilità sta con le strutture operative locali, non con il volontariato."
    fonte: "/piano-emergenza/"
  - titolo: "Le aree di attesa (AA)"
    punti:
      - "Sono i primi punti di raccolta, all'aperto, dopo un evento."
      - "Qui la popolazione viene censita e riceve le prime informazioni."
      - "A Genzano sono dieci, da AA1 ad AA10."
    pittogramma: "iso7010/punto-raccolta"
    nota: "Alcuni esempi: AA1 Palazzo Sforza Cesarini in piazza Tommaso Frasconi, AA6 Palazzetto dello Sport nel parcheggio di via G. di Vittorio, AA10 Landi nel piazzale della frazione. Esercizio: ogni volontario trova sulla pagina Aree di attesa l'area più vicina a casa e il percorso a piedi."
    fonte: "/aree-attesa/"
  - titolo: "Aree di ricovero e di ammassamento"
    punti:
      - "Le aree di ricovero (AR) ospitano chi non può rientrare a casa."
      - "Le aree di ammassamento (AS) accolgono soccorritori e mezzi da fuori."
      - "A Genzano ci sono quattro aree AR e due aree AS."
    pittogramma: "iso7010/rifugio-temporaneo"
    nota: "Aree di ricovero: AR1 area esterna del Palazzetto dello Sport, AR2 campo sportivo di via Sicilia, AR3 campo sportivo di via Sardegna, AR4 campo Don Bosco dei Salesiani. Ammassamento: AS1 via del Lavoro, AS2 viale G. Mazzini. Per gli indirizzi fanno fede i cartelli sul territorio: in alcuni punti il PDF del Piano riporta indirizzi diversi."
    fonte: "/cartografia/"
  - titolo: "I codici colore dell'allerta"
    punti:
      - "Giallo: criticità ordinaria."
      - "Arancione: criticità moderata."
      - "Rosso: criticità elevata."
      - "Il colore riguarda gli effetti al suolo, non il tempo previsto."
    pittogramma: "arasaac/attenzione"
    nota: "Spiega la differenza tra previsione meteo e allerta: il colore dipende dagli effetti attesi, come allagamenti o frane. Ricorda che verde non vuol dire rischio zero. Chiedi: con allerta gialla possono esserci danni? Sì, alcuni eventi possono produrne."
    fonte: "/allerte-meteo/"
  - titolo: "Chi emette l'allerta"
    punti:
      - "Il Centro Funzionale Regionale del Lazio emette il bollettino."
      - "Genzano è nella Zona di allerta F, Bacini Costieri Sud."
      - "Il bollettino esce ogni giorno."
    pittogramma: "arasaac/calendario"
    nota: "Né il Comune né il Gruppo emettono allerte: il Gruppo le comunica ai cittadini. Mostra la barra in cima alla homepage del sito, che legge il bollettino regionale. Apri insieme la pagina dei bollettini della Regione Lazio."
    fonte: "/allerte-meteo/"
  - titolo: "Le fasi operative del Comune"
    punti:
      - "Attenzione, preallarme e allarme: le decide il Sindaco."
      - "Con allerta gialla o arancione, almeno la fase di attenzione."
      - "Con allerta rossa, almeno la fase di preallarme."
      - "Il Sindaco può passare a una fase superiore anche senza un'allerta più alta."
    pittogramma: "arasaac/allarme"
    nota: "Il colore dice che cosa può succedere, la fase dice che cosa fa l'amministrazione. La corrispondenza è solo minima e viene dalle indicazioni operative del Dipartimento del 10 febbraio 2016."
    fonte: "/allerte-meteo/cosa-significa-a-genzano/"
  - titolo: "Quando scatta un'allerta"
    punti:
      - "Il Comune riceve il bollettino e valuta se attivare il COC."
      - "L'attivazione non è automatica: decide il Sindaco."
      - "Con il COC attivo, il Gruppo può essere convocato per i presidi."
    pittogramma: "arasaac/sirena"
    nota: "Ripercorri la catena: Dipartimento, Centro Funzionale Regionale, Comune, COC, Gruppo. Esempio: un'allerta arancione su tutta la zona può portare all'attivazione, un giallo localizzato può non richiederla. Chiedi: chi avvisa il volontario che deve presentarsi in sede?"
    fonte: "/cosa-succede-quando-scatta-allerta/"
  - titolo: "Il ruolo del Gruppo"
    punti:
      - "Il Gruppo non si attiva da solo né su chiamata dei cittadini."
      - "Lo attivano Sindaco, funzione volontariato del COC o Sala operativa regionale."
      - "La chiamata arriva dal Capo Gruppo; si lavora a turni."
      - "Chiusure delle strade e traffico spettano alla Polizia Locale."
    pittogramma: "arasaac/aiutare"
    nota: "Su attivazione il Gruppo presidia la sede, segnala al COC le strade pericolose, supporta l'evacuazione, assiste la popolazione e tiene attiva la rete radio. Solo un'attivazione formale garantisce assicurazione, copertura del posto di lavoro e rimborso spese. Il volontariato non regola il traffico: lo prevede la Circolare del Dipartimento del 6 agosto 2018."
    fonte: "/cosa-succede-quando-scatta-allerta/"
  - tipo: "domanda"
    domanda: "Arriva un'allerta arancione. Che cosa fa il volontario?"
    punti:
      - "Attende la chiamata di attivazione del Capo Gruppo."
      - "Va da solo a chiudere una strada allagata."
      - "Controlla il bollettino e tiene pronto il kit personale."
    nota: "Le risposte giuste sono la prima e la terza. La seconda è sbagliata due volte: il volontario non interviene senza attivazione, e la chiusura delle strade spetta alla Polizia Locale e alle Forze dell'ordine. Se vede un pericolo, lo segnala attraverso i canali previsti."
    fonte: "/cosa-succede-quando-scatta-allerta/"
ricorda:
  - "Il Piano dice chi fa che cosa, dove e con quali risorse."
  - "L'allerta la emette la Regione, le fasi operative le decide il Sindaco."
  - "Il Gruppo interviene solo se lo attivano le autorità competenti."
