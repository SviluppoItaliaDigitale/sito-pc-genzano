# Presentazione per il corso base dei volontari: il comportamento in scenario.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide e sulla
# Circolare del Dipartimento della protezione civile del 6 agosto 2018
# (verifica del 20/11/2026). Il generatore è scripts/genera-presentazioni-lim.py:
# chi cambia un testo rigenera i file nello stesso lavoro.
pubblico: "volontari"
corso: "Corso base del Gruppo"
ordine: 7
file: "2026-11-20-volontari-07-scenario"
tema: "volontari-07-scenario"
titolo: "Il comportamento in scenario"
sottotitolo: "Corso base per i volontari — modulo 7"
fascia: "Nuovi volontari del Gruppo (corso base)"
durata: "60-75 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Si parte solo con l'attivazione"
    punti:
      - "Il volontario non si attiva da solo."
      - "L'attivazione la dispone l'autorità: Sindaco, Prefettura, Regione o Dipartimento."
      - "Il Gruppo lavora sotto il coordinamento del centro operativo attivato."
      - "Non sostituisce mai le strutture istituzionali."
    pittogramma: "arasaac/volontario"
    nota: "Mostra lo schema della catena di comando del Manuale da Campo: dal Dipartimento al Sindaco, poi COC e Gruppo. Ricorda che i cittadini in difficoltà chiamano il 112: il Gruppo non si attiva su chiamata dei privati. Chiedi al gruppo che cosa risponderebbe a un vicino che telefona per un albero caduto nel suo giardino."
    fonte: "/formazione/manuale-campo/struttura-organizzativa/"
  - titolo: "A chi rispondi"
    punti:
      - "Sul campo ricevi istruzioni dal tuo referente."
      - "Il referente può essere il responsabile del Gruppo o il Capo Campo."
      - "Il Capo Missione risponde all'autorità che ha attivato la missione."
      - "Le informazioni salgono, le direttive scendono."
    pittogramma: "arasaac/ascoltare"
    nota: "Spiega la differenza fra Capo Missione, che cura gli obiettivi e i rapporti con le istituzioni, e Capo Campo, che organizza la vita quotidiana del campo. Esempio: un ospite chiede di cambiare tenda; il volontario non decide da sé, riferisce al Capo Campo. Chiedi chi, nel Gruppo, è il riferimento durante un turno ordinario."
    fonte: "/formazione/manuale-campo/funzioni-servizio/"
  - titolo: "Prima di partire: il briefing"
    punti:
      - "Sai chi ha attivato l'intervento e chi coordina sul campo."
      - "Conosci il tuo compito, il luogo, la durata e il rientro."
      - "Hai mezzi e DPI previsti, canale radio e numeri di riferimento."
      - "Se un punto non è chiaro, chiedi prima di partire."
    pittogramma: "arasaac/zaino"
    nota: "Il Manuale da Campo elenca sette domande: chi non ha una risposta chiara a ciascuna non è pronto a partire. Fai compilare a coppie le sette risposte per uno scenario di allerta temporali in serata. Ricorda che anche il turno ordinario del sabato comincia con una breve riunione informativa del Capo Gruppo."
    fonte: "/formazione/manuale-campo/struttura-organizzativa/"
  - titolo: "In squadra e in sicurezza"
    punti:
      - "Si lavora sempre in squadra, mai da soli."
      - "Prima viene la tua sicurezza: i DPI sono obbligatori."
      - "Ogni attività si annota: chi, che cosa, dove, quando, con quali mezzi."
      - "Alla radio: frasi brevi e nessun dato personale in chiaro."
    pittogramma: "iso7010/casco-protettivo"
    nota: "Il volontario che esce da solo mette a rischio sé stesso e i compagni. Ripassa i DPI della prima check-list del Manuale da Campo: caschetto, scarpe antinfortunistiche, guanti, occhiali, mascherina, pettorina del Gruppo. Esercizio: due volontari si scambiano un messaggio radio su un sopralluogo senza citare nomi o indirizzi delle persone."
    fonte: "/diventa-volontario/"
  - titolo: "Con la popolazione"
    punti:
      - "Presentati, parla con calma e usa frasi semplici."
      - "Guarda, ascolta, collega la persona a familiari e servizi."
      - "Non chiedere dettagli dolorosi e non forzare il racconto."
      - "Non fare promesse che non puoi mantenere."
    pittogramma: "arasaac/aiutare"
    nota: "Chi riceve assistenza è già in una condizione di vulnerabilità: tono, parole e sguardo contano. Leggi le frasi da evitare della pagina Psicologia dell'emergenza, come «devi essere forte» o «poteva andare peggio». Gioco di ruolo: un volontario accoglie una persona appena evacuata, gli altri osservano e commentano."
    fonte: "/formazione/psicologia-emergenza/"
  - titolo: "Persone con necessità specifiche"
    punti:
      - "Anziani soli, persone con disabilità, bambini piccoli, malati cronici."
      - "Chiedi alla persona di che cosa ha bisogno e rispetta le sue scelte."
      - "Ausili, farmaci e apparecchi salvavita partono con lei."
      - "Non lasciare mai soli i bambini."
    pittogramma: "arasaac/anziano"
    nota: "Nell'elenco della pagina rientrano anche le donne in gravidanza, chi dipende da apparecchiature elettromedicali e chi non parla l'italiano. Usa sempre parole rispettose, come «persona con disabilità». Chiedi al gruppo come aiuterebbe a evacuare una persona in carrozzina che vive al secondo piano."
    fonte: "/rischi-prevenzione/persone-necessita-specifiche/"
  - titolo: "Che cosa il volontario non fa"
    punti:
      - "Non regola il traffico e non usa palette dirigitraffico."
      - "Non svolge servizi di polizia stradale."
      - "Informa sui percorsi solo se decisi dalle autorità e dopo un briefing."
      - "Non sostituisce Vigili del Fuoco, forze di polizia e sanitari."
    pittogramma: "iso7010/divieto-generico"
    nota: "Il divieto viene dagli articoli 11 e 12 del Codice della strada ed è ribadito dalla Circolare del Dipartimento del 6 agosto 2018 sulle manifestazioni pubbliche. Chiusure, deviazioni e regolazione del traffico spettano alla Polizia Locale e alle forze dell'ordine. Chiedi al gruppo che cosa fare se un automobilista chiede di passare da una strada chiusa."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/circolare-del-6-agosto-2018-manifestazioni-pubbliche-precisazioni-sullattivazione-e-limpiego-del-volontariato-di-protezione-civile/"
  - tipo: "domanda"
    domanda: "Durante una festa in piazza, che cosa può fare il volontario del Gruppo?"
    punti:
      - "Fermare le auto all'incrocio con la paletta."
      - "Informare i pedoni sul percorso deciso dalla Polizia Locale, dopo il briefing."
      - "Segnalare al referente una persona anziana che si sente male."
    nota: "Sono giuste la seconda e la terza. La prima è vietata: la regolazione del traffico e la paletta spettano alla polizia stradale. L'informazione sui percorsi è ammessa solo se le autorità li hanno decisi e dopo un briefing; davanti a un malore si avvisa il referente e, se serve, si chiama il 112."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/circolare-del-6-agosto-2018-manifestazioni-pubbliche-precisazioni-sullattivazione-e-limpiego-del-volontariato-di-protezione-civile/"
  - titolo: "Riservatezza"
    punti:
      - "Niente foto o video di persone soccorse o in difficoltà."
      - "Niente post personali sull'intervento."
      - "Ciò che ascolti dalle persone resta riservato."
      - "I comunicati li autorizza il Capo Gruppo o il Comune."
    pittogramma: "arasaac/no"
    nota: "Anche sullo sfondo una persona soccorsa non deve essere riconoscibile, e così targhe, indirizzi e documenti. Nei racconti pubblici delle esercitazioni il Gruppo non scrive i nomi dei volontari né la posizione dei mezzi. Chiedi al gruppo che cosa fare se un passante riprende con il telefono una persona soccorsa."
    fonte: "/social-media-policy/"
  - titolo: "Lo stress di chi aiuta"
    punti:
      - "Fai pause, bevi, mangia e dormi con regolarità."
      - "Non accumulare turni troppo lunghi."
      - "Parla con il responsabile o con un collega di fiducia."
      - "Se un intervento ti resta addosso per giorni, chiedi supporto."
    pittogramma: "arasaac/calma"
    nota: "Stanchezza, irritabilità e difficoltà a dormire dopo un intervento pesante sono reazioni comuni anche fra i soccorritori. Ricorda che nelle emergenze lunghe si lavora a turni, anche di notte. Chiedi a ciascuno quale segnale di stanchezza riconosce per primo in sé."
    fonte: "/formazione/psicologia-emergenza/"
  - titolo: "Chiusura, debriefing, esercitazioni"
    punti:
      - "A fine attività si ripristinano mezzi e attrezzature."
      - "Si archiviano le schede e si segnalano le situazioni rimaste aperte."
      - "Nel debriefing si dice che cosa ha funzionato e che cosa no."
      - "Le esercitazioni allenano le stesse procedure."
    pittogramma: "arasaac/documenti"
    nota: "Il confronto dopo l'intervento, anche breve, serve a capire che cosa è successo e se qualcuno ha bisogno di supporto. Il Gruppo si addestra durante i turni e nelle esercitazioni programmate con Comune, Regione e coordinamenti: antincendio, sisma, rischio idrogeologico, radio, logistica. Proponi un debriefing di cinque minuti su questa lezione: una cosa chiara, una da ripassare."
    fonte: "/esercitazioni/"
ricorda:
  - "Si parte solo con l'attivazione e si risponde al proprio referente."
  - "Il volontario non regola il traffico e non usa la paletta."
  - "Niente foto né post di persone in difficoltà."
