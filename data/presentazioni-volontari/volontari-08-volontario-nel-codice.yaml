# Presentazione per i volontari: il volontario nel Codice della protezione civile.
# Articoli e tutele verificati sul testo vigente del D.Lgs. 2 gennaio 2018, n. 1
# (Normattiva, vigenza al 20/11/2026) e, per l'assicurazione, sull'art. 18 del
# D.Lgs. 3 luglio 2017, n. 117. Il generatore è scripts/genera-presentazioni-lim.py:
# chi cambia un testo rigenera i file nello stesso lavoro.
pubblico: "volontari"
