tema: "volontari-08-volontario-nel-codice"
titolo: "Il volontario nel Codice della protezione civile: diritti, doveri, tutele"
sottotitolo: "Riferimenti per la formazione regionale"
fascia: "Volontari del Gruppo (corso base e aggiornamento)"
durata: "60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Chi è il volontario di protezione civile"
    punti:
      - "Sceglie liberamente di dedicare tempo e capacità alla comunità."
      - "Opera in modo personale, spontaneo e gratuito, senza fini di lucro."
      - "Si forma dentro un'organizzazione di volontariato."
    pittogramma: "arasaac/volontario"
    nota: "È la definizione dell'articolo 32, comma 1, del Codice (D.Lgs. 1/2018). Ricorda che il volontariato organizzato iscritto nell'Elenco nazionale è una delle strutture operative del Servizio nazionale (articolo 13). Chiedi al gruppo che differenza c'è fra un rimborso spese e un compenso."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Come partecipa il volontariato"
    punti:
      - "Attraverso enti del Terzo settore, compresi i Gruppi comunali."
      - "Le organizzazioni che operano in protezione civile si iscrivono all'Elenco nazionale."
      - "Il Codice del Terzo settore si applica in quanto compatibile."
    pittogramma: "arasaac/documenti"
    nota: "Fai riferimento agli articoli 32, comma 3, e 33 del Codice. Il nostro Gruppo è iscritto al RUNTS fra gli altri enti del Terzo settore e al registro regionale del volontariato di protezione civile: lo dice la pagina Chi siamo. Chiedi al gruppo se sa a quale elenco è iscritto il Gruppo."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "L'Elenco nazionale"
    punti:
      - "È formato dagli elenchi territoriali delle Regioni e dall'elenco centrale del Dipartimento."
      - "Senza iscrizione non si partecipa alle attività di protezione civile."
      - "L'iscrizione serve anche per formazione e addestramento."
    pittogramma: "arasaac/carta-identita"
    nota: "Lo prevede l'articolo 34, commi 2 e 3. Le regole per iscriversi le fissa una direttiva; fino alla sua adozione restano valide le iscrizioni fatte con le norme precedenti (comma 5). Esempio: un gruppo non iscritto non può essere attivato per un'emergenza, anche se ha mezzi e volontari."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "I gruppi comunali"
    punti:
      - "Li costituisce il Consiglio comunale, con cittadini che aderiscono volontariamente."
      - "Il Comune cura la gestione amministrativa del Gruppo e ne risponde."
      - "Il coordinatore operativo dei volontari si sceglie con metodo democratico."
      - "Il Gruppo si iscrive all'elenco territoriale della Regione."
    pittogramma: "arasaac/ufficio"
    nota: "È l'articolo 35 del Codice. Il nostro Gruppo è stato costituito nella forma attuale con la delibera del Consiglio comunale n. 31 del 31 luglio 2023, in attuazione di quell'articolo. Mostra la delibera, scaricabile dalla pagina Chi siamo, e chiedi chi è oggi il coordinatore."
    fonte: "/chi-siamo/"
  - titolo: "Pianificazione e formazione"
    punti:
      - "Il volontariato partecipa a preparare e attuare i piani di protezione civile."
      - "Può chiedere copia degli studi pubblici sui rischi."
      - "Il Dipartimento e le Regioni promuovono corsi per i volontari."
      - "I contributi del Dipartimento possono finanziare mezzi, addestramento e formazione."
    pittogramma: "arasaac/mappa"
    nota: "Fai riferimento agli articoli 38 e 37 del Codice. Il corso base del Gruppo affronta struttura del sistema, rischi, DPI, procedure, radio, primo soccorso e comportamento in scenario. Chiedi al gruppo che cosa contiene il Piano di protezione civile del Comune e dove si consulta."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Tutele per il volontario che lavora"
    punti:
      - "Conservi il posto di lavoro, pubblico o privato."
      - "Conservi il trattamento economico e previdenziale."
      - "Serve la comunicazione di attivazione della Regione o del Dipartimento."
      - "La richiesta può partire anche dal Sindaco."
    pittogramma: "arasaac/ufficio"
    nota: "È l'articolo 39, comma 1, del Codice: le tutele valgono per i volontari di soggetti iscritti all'Elenco nazionale e per il periodo di effettivo impiego. Esempio: un volontario dipendente attivato per un'allerta resta assente dal lavoro senza perdere stipendio e contributi. Chiedi al gruppo che cosa serve consegnare al datore di lavoro dopo l'attivazione."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Per quanti giorni"
    punti:
      - "Soccorso e assistenza: fino a 30 giorni di fila e 90 nell'anno."
      - "Emergenza nazionale, con autorizzazione del Dipartimento: fino a 60 e 180."
      - "Pianificazione, addestramento, formazione e divulgazione: fino a 10 di fila e 30 nell'anno."
    pittogramma: "arasaac/calendario"
    nota: "Sono i commi 1, 2 e 3 dell'articolo 39. Per le attività del comma 3 valgono il posto di lavoro e il trattamento economico, purché promosse o autorizzate con comunicazione di attivazione. L'aumento a 60 e 180 giorni è concesso caso per caso, solo per effettiva necessità."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Rimborsi"
    punti:
      - "Il datore di lavoro può chiedere il rimborso di quanto ha pagato al volontario."
      - "Il lavoratore autonomo può chiedere il rimborso del mancato guadagno, fino a 120,55 euro al giorno."
      - "L'organizzazione può chiedere il rimborso delle spese autorizzate."
      - "Le domande vanno all'ente che ha attivato, entro due anni."
    pittogramma: "arasaac/soldi"
    nota: "Articolo 39, commi 4 e 5, e articolo 40. Per gli autonomi il limite giornaliero è oggi di 120,55 euro, fissato dal decreto del 22 settembre 2023, e si rivede ogni tre anni. Il rimborso al datore di lavoro può arrivare anche come credito d'imposta. Chiedi al gruppo chi deve conservare i giustificativi delle spese."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Assicurazione"
    punti:
      - "Copre infortuni e malattie legati all'attività di volontariato."
      - "Copre la responsabilità civile verso terzi."
      - "Per emergenze nazionali lunghe o all'estero si possono aggiungere polizze integrative."
    pittogramma: "iso7010/cassetta-primo-soccorso"
    nota: "L'articolo 39, comma 1, lettera c), del Codice rinvia all'articolo 18 del Codice del Terzo settore, che obbliga gli enti ad assicurare i propri volontari. La copertura vale per le attività svolte con il Gruppo: un intervento fatto per conto proprio non è un'attività del Gruppo. Chiedi al gruppo che cosa fare subito dopo un infortunio in servizio."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2017-07-03;117"
  - tipo: "domanda"
    domanda: "In quali casi valgono le tutele dell'articolo 39?"
    punti:
      - "Il volontario interviene di sua iniziativa, con la divisa del Gruppo."
      - "La Regione ha attivato il Gruppo per un'allerta, su richiesta del Sindaco."
      - "Un'esercitazione è stata autorizzata con comunicazione di attivazione."
    nota: "Sono giuste la seconda e la terza: le tutele richiedono la comunicazione di attivazione della Regione o del Dipartimento. La prima no. L'articolo 41 consente i primi interventi solo a chi si trova sul posto e non può avvisare le autorità, con l'obbligo di informarle subito."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "In emergenza"
    punti:
      - "Il volontariato interviene su richiesta dell'autorità di protezione civile."
      - "Segue quanto previsto dal piano di protezione civile."
      - "Per gli iscritti agli elenchi regionali coordina la Regione."
      - "Chi è sul posto e non può avvisare presta i primi interventi e informa subito."
    pittogramma: "arasaac/emergenza"
    nota: "È l'articolo 41 del Codice. Il volontariato è rappresentato anche nel Comitato nazionale del volontariato di protezione civile (articolo 42), con una commissione nazionale e una territoriale. Chiedi al gruppo come comunicherebbe un primo intervento fatto prima dell'attivazione."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
ricorda:
  - "Il volontario opera gratuitamente, dentro un'organizzazione iscritta all'Elenco nazionale."
  - "Posto di lavoro, stipendio e rimborsi valgono solo con la comunicazione di attivazione."
  - "Si interviene su richiesta dell'autorità, salvo i primi interventi di chi è già sul posto."
