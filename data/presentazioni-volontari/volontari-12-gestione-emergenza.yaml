# Presentazione per i volontari: gestione dell'emergenza, logistica, colonna mobile,
# assistenza alla popolazione ed eventi a rilevante impatto locale.
# Testi dal Manuale di Protezione Civile del sito (capitolo 5), dalla pagina Chi siamo,
# dagli articoli del sito sulle colonne mobili e sulla cucina da campo, dal testo vigente
# del D.Lgs. 2 gennaio 2018, n. 1 (artt. 2, 7, 16; Normattiva) e dalla Circolare DPC del
# 6 agosto 2018. Il generatore è scripts/genera-presentazioni-lim.py.
pubblico: "volontari"
corso: "Riferimenti per la formazione regionale"
ordine: 12
file: "2026-11-20-volontari-12-gestione-emergenza"
tema: "volontari-12-gestione-emergenza"
titolo: "La gestione dell'emergenza e l'assistenza alla popolazione"
sottotitolo: "Riferimenti per la formazione regionale"
fascia: "Volontari del Gruppo (corso base e aggiornamento)"
durata: "60-75 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cosa vuol dire gestire un'emergenza"
    punti:
      - "Soccorrere e assistere le persone colpite, e anche gli animali."
      - "Ridurre l'impatto dell'evento con interventi urgenti."
      - "Informare la popolazione mentre l'emergenza è in corso."
    pittogramma: "arasaac/emergenza"
    nota: "È la definizione dell'articolo 2, comma 6, del Codice. Il superamento dell'emergenza, che viene dopo, serve a ripristinare servizi e condizioni di vita (comma 7). Chiedi al gruppo che differenza c'è fra il primo giorno di un'alluvione e il primo mese."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Chi coordina, livello per livello"
    punti:
      - "Comune: Centro operativo comunale (COC), con il Sindaco."
      - "Area colpita: Centro operativo misto (COM)."
      - "Provincia: Centro coordinamento soccorsi (CCS), con il Prefetto."
      - "Grandi emergenze nazionali: DiComaC, con il Dipartimento."
    pittogramma: "arasaac/mappa"
    nota: "È la tabella del capitolo 5 del Manuale di Protezione Civile del sito. Dentro ogni centro si lavora per funzioni di supporto, secondo la Direttiva del 30 aprile 2021: fra queste ci sono assistenza alla popolazione, logistica, telecomunicazioni e volontariato. Il volontario risponde sempre al centro che lo ha attivato."
    fonte: "/manuale/51-modello-di-intervento/"
  - titolo: "La logistica"
    punti:
      - "Persone, mezzi e materiali nel posto giusto al momento giusto."
      - "Rifornimenti: acqua, viveri, carburante, ricambi."
      - "Aree di ammassamento per raccogliere soccorritori e risorse."
      - "Tutto si registra: chi parte, che cosa esce, che cosa rientra."
    pittogramma: "arasaac/camion-pompieri"
    nota: "La logistica è una delle funzioni di supporto della Direttiva 2021. Le aree di ammassamento sono previste dal Piano comunale, come spiega il modulo 3. Esempio: un generatore che parte senza carburante di scorta resta fermo dopo poche ore. Chiedi al gruppo che cosa si controlla prima di caricare un mezzo."
    fonte: "/manuale/51-modello-di-intervento/"
  - titolo: "I mezzi e le dotazioni del Gruppo"
    punti:
      - "Autobotte Mercedes Actros da 14.000 litri, anche per l'acqua potabile."
      - "Pickup e fuoristrada 4x4 con moduli antincendio."
      - "Tenda sociale da 35 metri quadrati per l'assistenza alla popolazione."
      - "Idrovora carrellata della Regione Lazio per locali allagati."
    pittogramma: "arasaac/camion-pompieri"
    nota: "L'elenco completo, con i nomi tecnici, è nella pagina Chi siamo, sezione «Mezzi e attrezzature principali»: è la fonte da usare quando si parla dei nostri mezzi. La scritta sul fianco di un mezzo indica il sistema di cui fa parte, non il modello. Chiedi al gruppo quale patente serve per guidare ciascun mezzo."
    fonte: "/chi-siamo/"
  - titolo: "La colonna mobile"
    punti:
      - "Mezzi e volontari che partono verso una regione colpita."
      - "Pronta a partire entro 6 ore dall'attivazione."
      - "Autonoma sul posto per almeno 72 ore."
      - "Il contenuto cambia con l'evento: terremoto o alluvione."
    pittogramma: "arasaac/strada"
    nota: "È spiegata nell'articolo del sito sulle maxi emergenze e le colonne mobili: si porta con sé da dormire, i pasti dei primi giorni, carburante e attrezzature. Le colonne si formano con i coordinamenti regionali. Chiedi al gruppo che cosa mettere nello zaino per tre giorni fuori casa."
    fonte: "/comunicazioni/2026-04-12-maxi-emergenze-colonne-mobili-coordinamenti-fepivol-lazio/"
  - titolo: "Assistenza alla popolazione"
    punti:
      - "Aree di attesa: il primo punto sicuro, per poche ore."
      - "Aree e strutture di ricovero: per chi non può tornare a casa."
      - "Pasti, acqua, coperte, informazioni."
      - "Attenzione per anziani, bambini, persone con disabilità e animali."
    pittogramma: "iso7010/punto-raccolta"
    nota: "Le aree di Genzano sono nel Piano comunale e nella pagina Aree di attesa. In un campo di accoglienza la cucina segue regole precise di igiene e formazione: lo spiegano gli articoli del sito sulla cucina da campo. Chiedi al gruppo come si accoglie una persona che arriva confusa in un'area di attesa."
    fonte: "/aree-attesa/"
  - titolo: "Che cosa insegnano le emergenze recenti"
    punti:
      - "Centro Italia 2016: decine di migliaia di sfollati, volontari al lavoro per settimane."
      - "Emilia-Romagna 2023: colonne mobili da tutta Italia."
      - "Toscana 2023: migliaia di volontari per togliere acqua e fango."
      - "Servono turni, cambi, rifornimenti: l'emergenza dura a lungo."
    pittogramma: "arasaac/alluvione"
    nota: "Sono raccontate negli articoli di anniversario del sito su Amatrice 2016, sull'Emilia-Romagna e su Campi Bisenzio 2023. Il messaggio per il volontario: un'emergenza grande non si fa in un giorno, e chi parte deve sapere che darà il cambio e riceverà il cambio."
    fonte: "/comunicazioni/2026-05-17-emilia-romagna-2023-alluvione-maggio/"
  - titolo: "Eventi programmati"
    punti:
      - "Feste, gare, concerti: eventi programmati non sono emergenze."
      - "Il volontariato può dare supporto organizzativo e di assistenza alla popolazione."
      - "Serve sempre la richiesta dell'autorità di protezione civile."
    pittogramma: "arasaac/calendario"
    nota: "È l'articolo 16, comma 3, del Codice: gli interventi per eventi programmati o programmabili non rientrano nell'azione di protezione civile, ma il sistema può dare il suo supporto, limitato agli aspetti organizzativi e all'assistenza alla popolazione, su richiesta delle autorità."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1"
  - titolo: "Eventi a rilevante impatto locale"
    punti:
      - "Eventi in un solo Comune con afflusso eccezionale o vie di fuga insufficienti."
      - "Il Comune attiva il piano di protezione civile e il COC."
      - "Solo così può attivare il volontariato iscritto all'elenco territoriale."
      - "Il volontario informa, assiste, dà supporto organizzativo."
    pittogramma: "arasaac/piazza"
    nota: "È il paragrafo 2.3.1 della Direttiva del 9 novembre 2012, ancora in vigore in via transitoria (articolo 15, comma 5, del Codice). La Regione può autorizzare i benefici di legge, oggi gli articoli 39 e 40 del Codice, solo nei casi necessari. A Genzano il COC è stato attivato, per esempio, per l'Infiorata 2026 con l'ordinanza n. 12 del 3 giugno."
    fonte: "/comunicazioni/2026-11-20-eventi-rilevante-impatto-locale-volontariato/"
  - titolo: "Che cosa il volontario non fa"
    punti:
      - "Non regola il traffico e non usa palette."
      - "Non svolge servizi di polizia stradale."
      - "Non controlla accessi, borse o persone: è sicurezza pubblica."
      - "Fuori dagli incendi boschivi, l'antincendio è dei Vigili del Fuoco."
    pittogramma: "iso7010/divieto-generico"
    nota: "Lo dice la Circolare del Dipartimento del 6 agosto 2018, paragrafo 2.2, con gli articoli 11 e 12 del Codice della strada. Sul traffico al volontario restano solo limitati compiti di informazione alla popolazione, dopo un briefing e sempre a supporto della Polizia Locale."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/circolare-del-6-agosto-2018-manifestazioni-pubbliche-precisazioni-sullattivazione-e-limpiego-del-volontariato-di-protezione-civile/"
  - tipo: "domanda"
    domanda: "In una festa di piazza con il COC attivo, che cosa può fare il volontario?"
    punti:
      - "Informare il pubblico sui percorsi pedonali e sulle aree dedicate."
      - "Fermare le auto all'incrocio con la paletta."
      - "Assistere una persona anziana che non trova l'uscita."
    nota: "Sono giuste la prima e la terza. Fermare le auto è regolazione del traffico: la Circolare del 6 agosto 2018 lo esclude espressamente per il volontariato di protezione civile."
    fonte: "https://www.protezionecivile.gov.it/it/normativa/circolare-del-6-agosto-2018-manifestazioni-pubbliche-precisazioni-sullattivazione-e-limpiego-del-volontariato-di-protezione-civile/"
ricorda:
  - "In emergenza si lavora dentro una catena di coordinamento: COC, COM, CCS, DiComaC."
  - "Logistica e assistenza alla popolazione si preparano prima, con turni e rifornimenti."
  - "Negli eventi pubblici il volontario informa e assiste, non regola il traffico."
