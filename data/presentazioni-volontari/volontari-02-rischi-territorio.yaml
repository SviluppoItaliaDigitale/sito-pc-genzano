slide:
  - titolo: "Conoscere il territorio in cui operiamo"
    punti:
      - "Rischio vuol dire pericolosità, vulnerabilità ed esposizione insieme."
      - "Genzano sorge sul vulcano dei Colli Albani, sul bordo del cratere di Nemi."
      - "Ogni rischio ha i suoi segnali e i suoi comportamenti corretti."
    pittogramma: "arasaac/mappa"
    nota: "Presenta la formula concettuale R = P × V × E: non serve a calcolare, serve a ragionare su dove si può agire. Esempio: non possiamo fermare un terremoto, ma possiamo rendere gli edifici più sicuri e preparare le persone. Chiedi al gruppo quali rischi conosce già, per esperienza diretta."
    fonte: "/conoscere/le-quattro-fasi/"
  - titolo: "Rischio sismico"
    punti:
      - "Genzano è in zona sismica 2, sottozona 2B."
      - "L'accelerazione attesa è fra 0,15 e 0,20 g."
      - "Per il Dipartimento, in zona 2 forti terremoti sono possibili."
      - "Il terremoto non si può prevedere: ci si prepara prima."
    pittogramma: "arasaac/terremoto"
    nota: "La classificazione viene dalla DGR Lazio 387/2009. Esempio storico: nel terremoto dei Colli Albani del 26 agosto 1806, magnitudo stimata 5,6, Genzano ebbe intensità VIII e gravi danni. Esercizio: ognuno indica il punto più sicuro della stanza in cui ci troviamo."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Il vulcano dei Colli Albani"
    punti:
      - "È un vulcano quiescente: le ultime eruzioni risalgono a circa 36.000 anni fa."
      - "Lo sorveglia l'Istituto nazionale di geofisica e vulcanologia."
      - "Oggi si osservano piccoli terremoti e emissioni di gas dal sottosuolo."
    pittogramma: "arasaac/vulcano"
    nota: "Quiescente significa in pausa: il sistema profondo dà ancora segnali, con sciami sismici, lente deformazioni del suolo e attività idrotermale. Per i Colli Albani il Dipartimento non ha definito livelli di allerta vulcanica, come invece per il Vesuvio. Domanda: perché i laghi di Albano e di Nemi sono crateri?"
    fonte: "/conoscere/rischio-vulcanico-colli-albani/"
  - titolo: "Il gas dal sottosuolo"
    punti:
      - "L'anidride carbonica è incolore, inodore e più pesante dell'aria."
      - "Si accumula in cantine, pozzi, scantinati e fossi profondi."
      - "Segnali: animali morti in una conca, piante secche a macchie, capogiro."
      - "Non si entra a controllare: ci si allontana e si avvisa."
    pittogramma: "arasaac/attenzione"
    nota: "A Cava dei Selci, nel Comune di Marino, il gas ha ucciso animali nel 1999 e nel 2000 e un uomo nel dicembre 2000. Genzano non è fra i principali punti di emissione indicati da Dipartimento e INGV, ma la prudenza vale per tutti i Castelli."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Rischio idrogeologico"
    punti:
      - "Versanti ripidi e terreni vulcanici favoriscono frane e smottamenti."
      - "Con piogge intense si allagano le zone basse e i fossi si gonfiano."
      - "Genzano è nella zona di allerta F, Bacini costieri sud."
      - "Segnali: acqua dai tombini, terreno che si crepa, alberi che si inclinano."
    pittogramma: "arasaac/alluvione"
    nota: "I fossi si gonfiano molto più in fretta dei grandi fiumi, e asfalto e tetti fanno scorrere l'acqua verso i punti bassi: sottopassi, cantine, garage. Esercizio: il gruppo elenca i punti di Genzano che conosce come soggetti ad allagamento e li confronta con il Piano di emergenza comunale."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Incendi boschivi"
    punti:
      - "Parte del territorio è nel Parco regionale dei Castelli Romani."
      - "Quasi tutti gli incendi nascono da comportamenti umani."
      - "Nel 2026 i divieti di Genzano sono andati dal 17 giugno al 15 ottobre."
      - "Chi vede fumo o fiamme chiama il 112 e indica il luogo preciso."
    pittogramma: "iso7010/vietato-fuochi"
    nota: "Il periodo viene dall'ordinanza sindacale n. 14 del 17 giugno 2026; la campagna antincendio regionale 2026 è andata dal 15 giugno al 15 ottobre. Genzano è nella zona di allerta AIB 9. Segnali da riconoscere: fumo denso, odore di bruciato portato dal vento, cenere che cade, animali che fuggono in una direzione."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Temporali e vento forte"
    punti:
      - "Ai Castelli i temporali intensi sono frequenti fra maggio e ottobre."
      - "Possono provocare allagamenti improvvisi nelle zone più basse."
      - "Il vento fa cadere rami e alberi, anche su strade e linee elettriche."
      - "Un cavo elettrico a terra non si tocca mai."
    pittogramma: "arasaac/temporale"
    nota: "Le previsioni indicano dove è probabile la pioggia forte su un'area vasta, non su quale strada: per questo l'allerta vale per tutta la zona F. Con il terreno inzuppato le alberature storiche cedono più facilmente. Domanda: dove parcheggiamo il mezzo durante un'allerta per vento?"
    fonte: "/rischi-prevenzione/temporali-intensi/"
  - titolo: "Caldo intenso e blackout"
    punti:
      - "Le ondate di calore colpiscono soprattutto anziani, bambini piccoli e malati cronici."
      - "Il Ministero della Salute pubblica un bollettino sulle ondate di calore."
      - "Alberi e rami sulle linee elettriche causano spesso interruzioni di corrente."
      - "Chi usa apparecchi salvavita è il primo a cui pensare."
    pittogramma: "arasaac/caldo"
    nota: "Nelle ondate di calore si consiglia di evitare le ore dalle 11 alle 18. Il bollettino del Ministero copre alcune città: per Genzano il più vicino è quello di Roma. In un blackout le candele si evitano perché possono causare un incendio; il 112 si chiama per un pericolo reale, come una persona bloccata in ascensore."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "I colori dell'allerta meteo"
    punti:
      - "Giallo: criticità ordinaria."
      - "Arancione: criticità moderata."
      - "Rosso: criticità elevata."
      - "Nel Lazio i bollettini li emette il Centro funzionale regionale."
    pittogramma: "arasaac/informazione"
    nota: "Distingui allerta ed emergenza: l'allerta dice che un evento è previsto, l'emergenza che è in corso. Il colore va sempre letto insieme al tipo di rischio e alla zona. Esercizio: mostra la pagina Allerte meteo del sito e fai leggere al gruppo il livello di oggi per la zona F."
    fonte: "/allerte-meteo/"
  - titolo: "Che cosa osserva un volontario"
    punti:
      - "Il monitoraggio è un compito del Gruppo, sul mandato del Sindaco."
      - "Annota dove e che cosa vedi: fossi, tombini, crepe, alberi, fumo."
      - "Un pericolo immediato si segnala subito al 112."
      - "Non entrare in cantine, pozzi o acqua che scorre per guardare meglio."
    pittogramma: "arasaac/vedere"
    nota: "L'osservazione è utile se dice luogo, ora e che cosa si vede, senza interpretazioni. Il volontario non si mette in pericolo per osservare: 15 centimetri di acqua in movimento possono far cadere un adulto. Esercizio: a coppie, scrivete una segnalazione di due righe su una frana immaginaria."
    fonte: "/conoscere/le-quattro-fasi/modello-di-intervento/"
  - tipo: "domanda"
    domanda: "Quali di queste frasi su Genzano sono corrette?"
    punti:
      - "È in zona sismica 2, sottozona 2B."
      - "Per un incendio si telefona alla sede del Gruppo."
      - "Con l'allerta gialla sono possibili allagamenti e smottamenti."
    nota: "Le risposte giuste sono la prima e la terza. La seconda è sbagliata: per un incendio si chiama il 112, che manda vigili del fuoco e squadre antincendio; il Gruppo lo attivano le autorità. Sull'allerta gialla, ricorda che criticità ordinaria non vuol dire assenza di pericolo."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
ricorda:
  - "Genzano è in zona sismica 2B e sorge su un vulcano quiescente."
  - "Pioggia, vento, fuoco e caldo hanno segnali che si imparano a riconoscere."
  - "Chi osserva non si mette in pericolo e segnala subito al 112 un pericolo immediato."
