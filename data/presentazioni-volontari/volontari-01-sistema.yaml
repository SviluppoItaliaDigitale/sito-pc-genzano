# Corso base per i volontari, modulo 1: il Servizio nazionale della protezione civile.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide e, per i numeri
# degli articoli, sul testo vigente del D.Lgs. 1/2018 su Normattiva (20/11/2026).
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
pubblico: "volontari"
corso: "Corso base del Gruppo"
ordine: 1
file: "2026-11-20-volontari-01-sistema"
tema: "volontari-01-sistema"
titolo: "Il Servizio nazionale della protezione civile"
sottotitolo: "Corso base per i volontari — modulo 1"
fascia: "Nuovi volontari del Gruppo (corso base)"
durata: "60-90 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Un servizio, non un ente"
    punti:
      - "La protezione civile è un sistema di soggetti pubblici e privati con regole comuni."
      - "Tutela vita, beni, insediamenti, animali e ambiente dagli eventi calamitosi."
      - "Gli eventi possono essere naturali o causati dall'attività dell'uomo."
    pittogramma: "arasaac/aiutare"
    nota: "Il Servizio nazionale nasce con la legge 225 del 1992; oggi la norma di riferimento è il Codice della protezione civile, D.Lgs. 1/2018, articolo 1. Chiedi al gruppo di nominare tre soggetti che secondo loro fanno parte del sistema, poi confrontali con le slide successive."
    fonte: "/conoscere/servizio-nazionale/"
  - titolo: "Le quattro attività"
    punti:
      - "Previsione: studiare gli scenari di rischio possibili."
      - "Prevenzione e mitigazione: ridurre i danni prima dell'evento."
      - "Gestione dell'emergenza e superamento: agire durante e dopo l'evento."
    pittogramma: "arasaac/calendario"
    nota: "Le attività sono elencate nell'articolo 2 del Codice. La legge del 1992 parlava di soccorso; il Codice del 2018 usa «gestione delle emergenze», che comprende anche assistenza e informazione alla popolazione. Esercizio: per ogni fase, il gruppo indica un'attività che il Gruppo comunale svolge davvero."
    fonte: "/conoscere/le-quattro-fasi/"
  - titolo: "Prima dell'evento"
    punti:
      - "La previsione serve all'allertamento e alla pianificazione."
      - "La prevenzione strutturale riguarda opere ed edifici."
      - "Quella non strutturale riguarda piani, informazione, formazione ed esercitazioni."
      - "Il volontariato lavora soprattutto nella prevenzione non strutturale."
    pittogramma: "arasaac/vedere"
    nota: "Previsione e prevenzione sono definite dall'articolo 2, commi 2-5. Nella previsione il Gruppo non prevede nulla in proprio: riceve, legge e diffonde le allerte ufficiali. Esempio concreto: un incontro in una scuola o un'esercitazione sono prevenzione non strutturale."
    fonte: "/conoscere/le-quattro-fasi/prevenzione/"
  - titolo: "Durante e dopo l'evento"
    punti:
      - "La gestione dell'emergenza assicura soccorso e assistenza alla popolazione colpita."
      - "Il superamento rimuove gli ostacoli al ritorno alla vita normale."
      - "Ripristina i servizi essenziali e riduce il rischio residuo."
    pittogramma: "arasaac/casa"
    nota: "Le definizioni sono nell'articolo 2, commi 6 e 7. Dopo l'evento il Gruppo può supportare l'assistenza nelle aree di accoglienza e la logistica, sempre sotto il coordinamento delle autorità. Le verifiche di agibilità degli edifici le compilano tecnici qualificati, non i volontari."
    fonte: "/conoscere/le-quattro-fasi/superamento/"
  - titolo: "Le autorità di protezione civile"
    punti:
      - "Il Presidente del Consiglio dei ministri è l'autorità nazionale."
      - "I Presidenti delle Regioni e delle Province autonome sono autorità territoriali."
      - "Anche i Sindaci e i Sindaci metropolitani sono autorità territoriali."
    pittogramma: "arasaac/informazione"
    nota: "Le autorità sono elencate nell'articolo 3, comma 1, del Codice; l'articolo 6 descrive le responsabilità delle autorità territoriali. Chiedi al gruppo chi è l'autorità di protezione civile a Genzano di Roma: la risposta è il Sindaco."
    fonte: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1~art3"
  - titolo: "Componenti e strutture operative"
    punti:
      - "Componenti: Stato, Regioni, Province autonome ed enti locali."
      - "Vigili del fuoco: per il Codice, «componente fondamentale» del Servizio."
      - "Strutture operative: Forze armate, Forze di polizia, sanità, ricerca, volontariato organizzato."
      - "Ne fanno parte anche Croce Rossa e Soccorso alpino e speleologico."
    pittogramma: "arasaac/vigile-fuoco"
    nota: "Le componenti sono nell'articolo 4, le strutture operative nell'articolo 13. L'elenco completo comprende anche INGV e CNR, il Sistema nazionale per la protezione dell'ambiente e i servizi meteorologici nazionali. Domanda per il gruppo: con quali di queste strutture abbiamo già lavorato a Genzano?"
    fonte: "/conoscere/servizio-nazionale/"
  - titolo: "Tre tipi di evento"
    punti:
      - "Tipo a: lo affrontano i singoli enti competenti, con mezzi ordinari."
      - "Tipo b: serve l'intervento coordinato di più enti, secondo le norme regionali."
      - "Tipo c: emergenza di rilievo nazionale, con mezzi e poteri straordinari."
    pittogramma: "arasaac/pericolo"
    nota: "La classificazione è nell'articolo 7 del Codice. Per gli eventi di tipo c il Consiglio dei ministri delibera lo stato di emergenza di rilievo nazionale (articolo 24). Esercizio: il gruppo classifica tre esempi, come un albero caduto su una strada, una frana in più Comuni e un forte terremoto nell'Appennino."
    fonte: "/conoscere/da-piramide-a-rete/"
  - titolo: "Sussidiarietà: la risposta parte dal Comune"
    punti:
      - "Si interviene al livello più vicino al cittadino."
      - "I livelli superiori arrivano quando l'evento supera le capacità di quello inferiore."
      - "Comune, Regione e Dipartimento della protezione civile lavorano in rete."
    pittogramma: "arasaac/mappa"
    nota: "Il principio è scritto nell'articolo 118 della Costituzione dalla riforma del 2001. Nel Lazio il livello regionale comprende la Sala operativa e il Centro funzionale, che emette le allerte meteo. Racconta perché una rete regge meglio di una piramide: chi è sul posto conosce il territorio e c'è già nei primi minuti."
    fonte: "/conoscere/da-piramide-a-rete/"
  - titolo: "Il Sindaco e il Comune"
    punti:
      - "Pianificazione e direzione dei primi soccorsi sono funzione fondamentale dei Comuni."
      - "Il Sindaco attua il piano comunale, attiva il COC e informa la popolazione."
      - "Se l'evento supera i mezzi del Comune, chiede aiuto a Regione e Prefetto."
    pittogramma: "arasaac/piazza"
    nota: "La funzione dei Comuni è nell'articolo 12 del Codice, che affida al Comune anche l'impiego del volontariato di protezione civile a livello comunale. Mostra dove si trova il Piano di emergenza comunale sul sito e fai cercare al gruppo l'area di attesa più vicina a casa."
    fonte: "/conoscere/servizio-nazionale/"
  - titolo: "Il volontariato organizzato"
    punti:
      - "È una struttura operativa del Servizio nazionale, se iscritto nell'elenco nazionale."
      - "Partecipa tramite enti del Terzo settore, compresi i Gruppi comunali."
      - "Il Gruppo lavora a supporto del Sindaco e non si attiva da solo."
      - "Non regola il traffico e non sostituisce soccorsi sanitari o forze dell'ordine."
    pittogramma: "arasaac/aiutare"
    nota: "Riferimenti: articolo 13, comma 1, lettera e, e articolo 32 del Codice; il volontario sceglie liberamente e opera in modo gratuito, dopo una formazione adeguata. La regolazione del traffico spetta alle Forze dell'ordine e alla Polizia locale (Codice della strada, articoli 11 e 12; Circolare del Dipartimento del 6 agosto 2018). I cittadini in emergenza chiamano il 112."
    fonte: "/normativa/testo-unico-protezione-civile/capo-5-volontariato/"
  - tipo: "domanda"
    domanda: "Chi può attivare il Gruppo comunale in un'emergenza?"
    punti:
      - "Il Sindaco, anche tramite il Centro operativo comunale."
      - "Un cittadino che telefona alla sede del Gruppo."
      - "La Sala operativa della Regione Lazio."
    nota: "Le risposte giuste sono la prima e la terza: il Gruppo opera sul mandato delle autorità, attraverso il Comune e il sistema regionale. La seconda è sbagliata: il cittadino in emergenza chiama il 112, e la Centrale unica di risposta manda il soccorso adatto."
    fonte: "/conoscere/le-quattro-fasi/modello-di-intervento/"
ricorda:
  - "La protezione civile è una rete: Stato, Regioni, Comuni, strutture operative e cittadini."
  - "Il Sindaco è l'autorità di protezione civile del Comune."
  - "Il Gruppo comunale opera a supporto del Sindaco e non si attiva da solo."
