# Versione in italiano semplice (livello A2) del libro 3D «Il libro che si esplora».
# Fonte dei contenuti: data/libro_3d.yaml. Stessi capitoli, stesso ordine, stesse chiavi.
# Se cambia data/libro_3d.yaml (testi, indicazioni, fonti), va riallineato anche questo file.
# chiave = nome della scena 3D in libro-3d.js: non cambiarla.
aggiornato: '2026-11-01'
capitoli:
- chiave: sisma
  occhiello: 'Capitolo 1 · Terremoto'
  titolo: 'La scossa'
  intro: 'Sei in casa. Senti una scossa di terremoto. Hai pochi secondi per scegliere dove stare.'
  domanda: 'Dove ti ripari durante la scossa?'
  opzioni:
  - testo: 'Sotto il tavolo robusto'
    giusta: true
  - testo: 'Vicino alla finestra'
    perche: 'I vetri e gli specchi possono rompersi. Durante la scossa stai lontano.'
  - testo: 'Giù per le scale, verso l’uscita'
    perche: 'Durante la scossa non correre fuori. Non usare le scale e l’ascensore.'
  risposta: 'Vai sotto un tavolo robusto, o vicino a un muro portante. Proteggi la testa con le braccia o con un cuscino. Durante la scossa non uscire di corsa. Non usare scale e ascensore. Stai lontano da finestre, vetri, specchi e mobili pesanti.'
  breve: 'A · Sotto il tavolo robusto. Proteggi la testa. Stai lontano da finestre e mobili pesanti. Non usare scale e ascensore.'
  fonti:
  - titolo: 'Rischio sismico: cosa fare durante la scossa'
    url: '/rischi-prevenzione/rischio-sismico/#cosa-fare-durante'
- chiave: alluvione
  occhiello: 'Capitolo 2 · Alluvione'
  titolo: 'L’acqua sale'
  intro: 'Piove da ore. L’acqua entra in casa dal basso. Prima riempie i locali sotto il livello della strada.'
  domanda: 'L’acqua entra in casa. Dove vai?'
  opzioni:
  - testo: 'In cantina, a mettere al sicuro le cose'
    perche: 'Le cantine sono i primi posti che si riempiono d’acqua. Durante l’allagamento non scendere.'
  - testo: 'Al piano più alto della casa'
    giusta: true
  - testo: 'In garage, a spostare l’auto'
    perche: 'Anche i garage si riempiono per primi. L’acqua può bloccare la porta. Puoi sostituire l’auto, non una persona.'
  risposta: 'Vai ai piani alti della casa. Non usare l’ascensore. Durante l’allagamento non scendere in cantina o in garage. Non scendere nei locali sotto il livello della strada. Chiudi il gas e stacca la corrente solo se non rischi. Non toccare gli impianti con mani o piedi bagnati.'
  breve: 'B · Vai al piano più alto, senza ascensore. Non scendere in cantina o in garage. Chiudi gas e corrente solo se non rischi.'
  fonti:
  - titolo: 'Rischio idrogeologico: cosa fare durante l’evento'
    url: '/rischi-prevenzione/rischio-idrogeologico/#cosa-fare-durante'
- chiave: sottopasso
  occhiello: 'Capitolo 3 · Strade allagate'
  titolo: 'Il sottopassaggio'
  intro: 'Sei in auto. La strada scende in un sottopassaggio. Il fondo è coperto d’acqua. Da qui non vedi quanto è profonda.'
  domanda: 'Il sottopassaggio davanti a te è allagato. Cosa fai?'
  opzioni:
  - testo: 'Passo piano: l’acqua sembra bassa'
    perche: 'Bastano pochi centimetri d’acqua per perdere aderenza o spegnere il motore.'
  - testo: 'Passo veloce, così non mi fermo'
    perche: 'Non sai cosa c’è sotto l’acqua. L’auto può perdere il controllo o spegnersi.'
  - testo: 'Torno indietro e cerco un’altra strada'
    giusta: true
  risposta: 'Non attraversare mai un sottopassaggio o una strada allagata. Bastano pochi centimetri d’acqua per perdere aderenza o spegnere il motore. Sotto l’acqua possono esserci buche o tombini aperti. Se l’auto si ferma e puoi uscire senza entrare nella corrente, lasciala. Vai a piedi in un punto più alto. Se la corrente è forte, resta nell’auto. Chiama il 112, il numero unico per le emergenze.'
  breve: 'C · Torna indietro. Non attraversare mai un sottopassaggio allagato: sotto l’acqua possono esserci buche o tombini aperti.'
  fonti:
  - titolo: 'Rischio idrogeologico: se sei in auto'
    url: '/rischi-prevenzione/rischio-idrogeologico/#cosa-fare-durante'
- chiave: incendio
  occhiello: 'Capitolo 4 · Incendi nei boschi'
  titolo: 'Il vento e il fumo'
  intro: 'Dal bosco vicino a casa sale una colonna di fumo. Il vento la spinge verso di te. Per prima cosa chiami il 112, il numero unico per le emergenze.'
  domanda: 'Puoi allontanarti in sicurezza. Da che parte vai?'
  opzioni:
  - testo: 'Verso il fumo, per capire cosa succede'
    perche: 'Nel fumo non si vede più niente, e succede in fretta. Non restare nelle strade dove c’è il fumo.'
  - testo: 'Dalla parte opposta al fumo e al fuoco'
    giusta: true
  - testo: 'Verso le fiamme, per provare a spegnerle'
    perche: 'Non avvicinarti alle fiamme. Non provare a spegnere l’incendio da solo.'
  risposta: 'Chiama subito il 112. Di’ dove sei e da che parte va il fumo. Se puoi allontanarti in sicurezza, vai subito dalla parte opposta al fumo e al fuoco. Non avvicinarti alle fiamme. Non provare a spegnere l’incendio da solo. Non scappare in salita davanti al fuoco. Se sei un bambino, chiama subito un adulto.'
  breve: 'B · Chiama il 112 e vai dalla parte opposta al fumo e al fuoco. Non avvicinarti alle fiamme.'
  fonti:
  - titolo: 'Rischio incendio: cosa fare durante l’incendio'
    url: '/rischi-prevenzione/rischio-incendio/#cosa-fare-durante'
- chiave: allerta
  occhiello: 'Capitolo 5 · Allerte meteo'
  titolo: 'I colori dell’allerta'
  intro: 'I bollettini usano quattro colori. Ogni colore dice quanto i fenomeni previsti possono essere forti e diffusi.'
  domanda: 'Per domani è prevista l’allerta arancione. Cosa fai?'
  opzioni:
  - testo: 'Niente di diverso: è solo pioggia'
    perche: 'L’arancione indica fenomeni che possono essere diffusi e pericolosi. Devi prepararti.'
  - testo: 'Limito gli spostamenti e tengo pronto il kit'
    giusta: true
  - testo: 'Vado a vedere il torrente che si gonfia'
    perche: 'Non stare vicino ai corsi d’acqua. I fossi si gonfiano molto in fretta.'
  risposta: 'Con l’allerta arancione esci solo se è necessario. Metti al sicuro le cose che sono in cantina. Fai lo stesso nei locali sotto il livello della strada. Tieni pronto il kit di emergenza. Segui le indicazioni delle autorità.'
  breve: 'B · Esci solo se è necessario. Metti al sicuro le cose in cantina. Tieni pronto il kit. Segui le autorità.'
  fonti:
  - titolo: 'Allerte meteo e codici colore'
    url: '/allerte-meteo/'
- chiave: kit
  occhiello: 'Capitolo 6 · Kit di emergenza'
  titolo: 'Lo zaino pronto'
  intro: 'È uno zaino leggero. Lo tieni vicino all’uscita. Lo prendi subito quando devi lasciare casa in pochi minuti.'
  domanda: 'Quale di questi oggetti NON va nello zaino?'
  opzioni:
  - testo: 'La torcia elettrica'
    perche: 'La torcia serve: fa luce in modo sicuro quando manca la corrente.'
  - testo: 'La candela'
    giusta: true
  - testo: 'Il fischietto'
    perche: 'Il fischietto serve: aiuta gli altri a trovarti se sei bloccato.'
  risposta: 'La candela resta fuori. Per fare luce usa una torcia elettrica, perché le candele possono provocare un incendio. Nello zaino metti documenti, farmaci, telefono con caricabatterie e torcia. Metti anche fischietto, acqua e cibo che dura a lungo.'
  breve: 'B · La candela. Per fare luce usa la torcia: le candele possono provocare un incendio.'
  fonti:
  - titolo: 'Kit di emergenza: lo zaino da prendere al volo'
    url: '/rischi-prevenzione/kit-emergenza/#kit-vai'
  - titolo: 'Blackout: torcia elettrica, non candele'
    url: '/rischi-prevenzione/blackout/#cosa-fare-durante'
- chiave: caldo
  occhiello: 'Capitolo 7 · Caldo forte'
  titolo: 'Il sole di mezzogiorno'
  intro: 'C’è un’ondata di calore. Devi uscire per una commissione. Puoi scegliere l’ora.'
  domanda: 'A che ora esci?'
  opzioni:
  - testo: 'All’una, così faccio prima'
    perche: 'Le ore più calde sono dalle 11 alle 18. In quelle ore non uscire e non fare sforzi.'
  - testo: 'Prima delle 11 o dopo le 18'
    giusta: true
  - testo: 'Alle tre, con il cappello va bene'
    perche: 'Il cappello aiuta. Ma dalle 11 alle 18 è meglio stare al fresco.'
  risposta: 'Non uscire nelle ore più calde, dalle 11 alle 18. Bevi molta acqua, anche se non hai sete. Metti vestiti leggeri e chiari, il cappello e gli occhiali da sole. Abbassa le tapparelle quando il sole entra in casa. Non lasciare mai persone o animali in auto al sole.'
  breve: 'B · Prima delle 11 o dopo le 18. Bevi spesso, abbassa le tapparelle, mai persone o animali in auto al sole.'
  fonti:
  - titolo: 'Ondate di calore: cosa fare durante'
    url: '/rischi-prevenzione/ondate-di-calore/#cosa-fare-durante'
- chiave: temporale
  occhiello: 'Capitolo 8 · Temporali forti'
  titolo: 'Il fulmine'
  intro: 'Sei in un prato aperto. Arriva un temporale con i fulmini. Vicino a te ci sono un albero isolato, una tettoia leggera, un’auto e una casa in muratura.'
  domanda: 'Dove ti ripari?'
  opzioni:
  - testo: 'Sotto l’albero isolato'
    perche: 'I fulmini colpiscono spesso gli alberi isolati. Allontanati.'
  - testo: 'Sotto la tettoia leggera'
    perche: 'Le tettoie leggere non proteggono. Non ripararti lì.'
  - testo: 'Nella casa in muratura o in auto con i finestrini chiusi'
    giusta: true
  risposta: 'Entra in un edificio solido, o in auto con i finestrini chiusi. Allontanati da alberi isolati, pali di metallo, tralicci e recinzioni di metallo. Non ripararti sotto tettoie o strutture leggere. In casa stacca gli apparecchi elettrici. Stai lontano da finestre e porte finestre.'
  breve: 'C · In un edificio solido o in auto con i finestrini chiusi. Mai sotto alberi isolati o tettoie.'
  fonti:
  - titolo: 'Temporali intensi: cosa fare durante'
    url: '/rischi-prevenzione/temporali-intensi/#cosa-fare-durante'
- chiave: vento
  occhiello: 'Capitolo 9 · Vento forte'
  titolo: 'Le raffiche'
  intro: 'Cammini per strada. Il vento soffia a raffiche fortissime. Intorno a te ci sono un cartellone, un’impalcatura, un albero e un palazzo.'
  domanda: 'Che cosa fai?'
  opzioni:
  - testo: 'Mi fermo sotto il cornicione del palazzo'
    perche: 'Non fermarti sotto i cornicioni o sotto cose sospese. Possono cadere dei pezzi.'
  - testo: 'Entro in un edificio e sto lontano dalle finestre'
    giusta: true
  - testo: 'Mi riparo dietro il cartellone'
    perche: 'Da cartelloni, impalcature, alberi e pali della luce devi stare lontano.'
  risposta: 'Se puoi, resta in casa. Stai lontano da finestre e vetrate. Tieni chiuse porte e finestre. Se sei fuori, stai lontano da alberi, pali della luce, impalcature e cartelloni. Non fermarti sotto cornicioni o cose sospese.'
  breve: 'B · Entra in un edificio, lontano dalle finestre. Fuori stai lontano da alberi, impalcature, cartelloni e cornicioni.'
  fonti:
  - titolo: 'Vento forte: cosa fare durante'
    url: '/rischi-prevenzione/vento-forte/#cosa-fare-durante'
- chiave: blackout
  occhiello: 'Capitolo 10 · Blackout'
  titolo: 'Al buio'
  intro: 'È sera. Va via la corrente in tutto il quartiere. In casa è buio.'
  domanda: 'Che cosa fai per prima cosa?'
  opzioni:
  - testo: 'Accendo le candele'
    perche: 'Le candele possono provocare un incendio. Per fare luce usa la torcia elettrica.'
  - testo: 'Prendo la torcia e scollego gli elettrodomestici'
    giusta: true
  - testo: 'Apro il frigorifero per controllare il cibo'
    perche: 'Tieni chiusi il frigorifero e il congelatore. Il cibo resta buono per molte ore se non li apri.'
  risposta: 'Resta calmo: di solito il blackout dura poco. Usa la torcia elettrica, non le candele. Stacca gli elettrodomestici. Lascia accesa una sola lampada, così vedi quando torna la corrente. Tieni chiusi il frigorifero e il congelatore. Non usare i generatori a combustibile in locali chiusi.'
  breve: 'B · Torcia elettrica, non candele. Stacca gli elettrodomestici e tieni chiusi frigorifero e congelatore.'
  fonti:
  - titolo: 'Blackout: cosa fare durante'
    url: '/rischi-prevenzione/blackout/#cosa-fare-durante'
- chiave: gas
  occhiello: 'Capitolo 11 · Vulcano e gas'
  titolo: 'Il gas che non si vede'
  intro: 'In alcune zone dei Colli Albani il suolo può liberare anidride carbonica (CO₂), un gas. Non si vede e non ha odore. È più pesante dell’aria. Si raccoglie in cantine, pozzi e scantinati con poca aria.'
  domanda: 'Entri in cantina e ti gira la testa. Vedi un animale a terra, immobile. Cosa fai?'
  opzioni:
  - testo: 'Scendo a prendere l’animale'
    perche: 'Non entrare per aiutare in un posto chiuso dove qualcuno è a terra. Diventeresti la seconda vittima.'
  - testo: 'Esco subito all’aria aperta e chiamo il 112'
    giusta: true
  - testo: 'Resto a controllare meglio che cosa succede'
    perche: 'Non restare a controllare. Esci subito all’aria aperta.'
  risposta: 'Esci subito all’aria aperta. Non tornare indietro. Chiama il 112, il numero unico per le emergenze. Di’: «sospetto di gas in spazio confinato». Arrivano i Vigili del Fuoco con gli apparecchi per respirare. Non entrare per aiutare chi è a terra: non hai l’attrezzatura e l’addestramento. Tieni lontane le altre persone. Se sei un bambino, esci e chiama subito un adulto.'
  breve: 'B · Esci subito all’aria aperta e chiama il 112. Non entrare ad aiutare: arrivano i Vigili del Fuoco con gli apparecchi per respirare.'
  fonti:
  - titolo: 'Rischio vulcanico: sospetto di accumulo di CO₂'
    url: '/rischi-prevenzione/rischio-vulcanico/#durante-co2'
- chiave: maremoto
  occhiello: 'Capitolo 12 · Maremoto'
  titolo: 'Il mare si ritira'
  intro: 'Sei al mare, sulla costa del Lazio. All’improvviso il mare si ritira. Resta scoperto un tratto di spiaggia insolitamente grande.'
  domanda: 'Cosa fai?'
  opzioni:
  - testo: 'Vado a vedere da vicino'
    perche: 'Non andare verso il mare per guardare o fare foto. Ogni minuto conta.'
  - testo: 'Aspetto un avviso ufficiale'
    perche: 'Se vedi questi segnali naturali, non aspettare la conferma. Vai via subito.'
  - testo: 'Mi allontano a piedi verso un punto alto'
    giusta: true
  risposta: 'Allontanati subito dalla spiaggia a piedi. Vai in un punto alto. Non aspettare un messaggio ufficiale. Se non puoi, sali ai piani alti di un edificio solido. Non usare l’auto: le strade vicino al mare si bloccano. Resta in alto fino al cessato allarme. La prima onda può non essere la più grande.'
  breve: 'C · A piedi verso un punto alto, subito. Non aspettare l’avviso. Dopo la prima onda non tornare in spiaggia.'
  fonti:
  - titolo: 'Maremoto: segnali e cosa fare'
    url: '/rischi-prevenzione/maremoto/#segnali'
- chiave: industriale
  occhiello: 'Capitolo 13 · Incidente in una fabbrica'
  titolo: 'La nube'
  intro: 'C’è un incidente in un impianto vicino. Esce una nube di sostanze pericolose. Le autorità chiedono alla popolazione di proteggersi.'
  domanda: 'Cosa fai?'
  opzioni:
  - testo: 'Scappo a piedi attraversando la nube'
    perche: 'Non attraversare la nube, né a piedi né in auto. Stare al chiuso è quasi sempre più sicuro.'
  - testo: 'Entro in casa, chiudo porte e finestre e spengo la ventilazione'
    giusta: true
  - testo: 'Corro a prendere i bambini a scuola'
    perche: 'La scuola segue il suo piano di emergenza. Se li porti fuori, li esponi alla nube.'
  risposta: 'Entra nell’edificio chiuso più vicino. Chiudi porte e finestre. Spegni ventilazione, condizionatori e caldaie. Chiudi gli spifferi con panni bagnati. Sali ai piani alti. Ascolta i canali ufficiali. Esci solo se le autorità ordinano l’evacuazione.'
  breve: 'B · Resta al chiuso: porte e finestre chiuse, ventilazione spenta, piani alti. Segui i canali ufficiali.'
  fonti:
  - titolo: 'Rischio industriale: cosa fare durante'
    url: '/rischi-prevenzione/rischio-industriale/#cosa-fare-durante'
- chiave: radiologico
  occhiello: 'Capitolo 14 · Emergenza radiologica'
  titolo: 'Il riparo al chiuso'
  intro: 'C’è un’emergenza radiologica. Le autorità dicono alla popolazione della zona di restare al chiuso.'
  domanda: 'Cosa fai?'
  opzioni:
  - testo: 'Prendo l’auto e mi allontano'
    perche: 'Se le autorità dicono di restare al chiuso, mettersi in viaggio è più rischioso.'
  - testo: 'Resto in casa, chiudo tutto e seguo i canali ufficiali'
    giusta: true
  - testo: 'Prendo lo iodio che ho in casa'
    perche: 'Lo iodio si prende solo quando le autorità sanitarie lo dicono. Da soli è inutile o fa male.'
  risposta: 'Segui le indicazioni delle autorità. Resta in casa e chiudi porte e finestre. Spegni ventilazione e condizionatori. Se puoi, stai in una stanza interna. Se eri all’aperto, togli i vestiti esterni, mettili in un sacchetto e fai una doccia. Prendi lo iodio solo se le autorità sanitarie lo dicono. Non ripetere notizie non verificate.'
  breve: 'B · Resta in casa con porte e finestre chiuse e ventilazione spenta. Iodio solo se lo dicono le autorità sanitarie.'
  fonti:
  - titolo: 'Rischio nucleare e radiologico: cosa fare durante'
    url: '/rischi-prevenzione/rischio-nucleare-radiologico/#cosa-fare-durante'
- chiave: siccita
  occhiello: 'Capitolo 15 · Poca acqua'
  titolo: 'L’acqua che manca'
  intro: 'Non piove da mesi. Il Comune ha emesso un’ordinanza per la crisi idrica. L’acqua potabile va risparmiata.'
  domanda: 'Cosa fai?'
  opzioni:
  - testo: 'Lavo l’auto lo stesso: è poca acqua'
    perche: 'Le ordinanze di solito vietano di lavare l’auto, riempire le piscine e annaffiare i prati.'
  - testo: 'Rispetto i divieti e riduco i consumi'
    giusta: true
  - testo: 'Bevo dalla fontanella di campagna non controllata'
    perche: 'Non bere acqua di pozzi, sorgenti o fontane non controllati. Se l’acqua manca, non diventa sicura.'
  risposta: 'Rispetta le ordinanze del Comune. L’acqua risparmiata serve per bere. Fai docce più brevi. Chiudi il rubinetto mentre ti lavi i denti. Riusa l’acqua delle verdure per le piante. Se l’acqua manca a certe ore, riempi contenitori puliti e tienili coperti. Controlla che le persone fragili del vicinato abbiano acqua.'
  breve: 'B · Rispetta le ordinanze e consuma meno acqua. Non usare l’acqua potabile per usi non essenziali.'
  fonti:
  - titolo: 'Siccità: cosa fare durante'
    url: '/rischi-prevenzione/siccita/#cosa-fare-durante'
