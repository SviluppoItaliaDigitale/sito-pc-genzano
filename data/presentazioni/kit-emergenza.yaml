# Presentazione per la classe: il kit di emergenza.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-04-17-kit-emergenza"
tema: "kit-emergenza"
titolo: "Il kit di emergenza della famiglia"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Perché preparare un kit"
    punti:
      - "Un kit non serve a vivere nella paura."
      - "Contiene le cose essenziali quando la normalità si interrompe."
      - "Per esempio dopo un terremoto, un'alluvione o un blackout."
    nota: "Chiedi alla classe: se domani mattina mancassero luce e acqua per tre giorni, che cosa vi servirebbe? Scrivi le risposte alla lavagna e confrontale con le slide che seguono."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Tre kit per tre situazioni"
    punti:
      - "Kit evacuazione rapida: devi uscire di casa in pochi minuti."
      - "Kit casa 72 ore: resti in casa, ma i servizi non funzionano."
      - "Kit auto: resti bloccato in strada o nel traffico."
    nota: "Non tutte le emergenze richiedono la stessa risposta: a volte si esce, a volte si resta in casa senza corrente, acqua o negozi aperti."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Il kit evacuazione rapida"
    punti:
      - "È lo zaino da prendere al volo: leggero e facile da portare."
      - "Dentro: documenti, farmaci, telefono, torcia e fischietto."
      - "Tienilo vicino all'uscita, in un punto noto a tutta la famiglia."
    pittogramma: "arasaac/zaino"
    nota: "Il fischietto serve a farsi sentire. Le copie dei documenti e le schede sanitarie sono dati personali: non si fotografano, non si mandano in chat e non si pubblicano sui social."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Quanto pesa lo zaino"
    punti:
      - "Non oltre il 15-20% del peso di chi lo porta."
      - "Se non riesci a portarlo per mezz'ora a piedi, riducilo."
      - "Le cinghie su torace e fianchi distribuiscono meglio il peso."
    nota: "Per un ragazzo di 40 chili il limite indicativo è di 6-8 chili. Se avete una bilancia, pesate uno zaino di scuola e confrontatelo."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Il kit casa 72 ore"
    punti:
      - "Acqua e cibo a lunga conservazione, che non serve cuocere."
      - "Radio a pile, torce, pile di ricambio e power bank."
      - "Kit di primo soccorso, farmaci e ricette."
    pittogramma: "arasaac/torcia"
    nota: "Serve se puoi restare in casa ma mancano acqua, corrente, gas, telefono o negozi. Non dimenticare l'apriscatole manuale e i prodotti per l'igiene."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Quanta acqua serve"
    punti:
      - "Circa 4 litri a persona al giorno, per 3 giorni."
      - "Per una famiglia di 4 persone: circa 48 litri."
      - "Con caldo intenso, bambini piccoli o malattia ne serve di più."
    nota: "Attività: ognuno calcola i litri per la propria famiglia, moltiplicando 4 litri per le persone e per 3 giorni. Il sito ha un calcolatore della scorta per 72 ore."
    fonte: "/calcolatore-scorta/"
  - titolo: "I farmaci: una scorta a parte"
    punti:
      - "Tieni i farmaci abituali per almeno 7 giorni."
      - "Conserva con i farmaci anche le ricette."
      - "Per le terapie salvavita chiedi al medico quanto tenerne."
    pittogramma: "arasaac/farmaci"
    nota: "Acqua e cibo si calcolano per 3 giorni, i farmaci per almeno 7: sono due scorte diverse. Per le terapie salvavita la scheda dedicata del sito consiglia 7-14 giorni."
    fonte: "/calcolatore-scorta/"
  - titolo: "Il kit auto"
    punti:
      - "Acqua, snack, torcia e coperta termica."
      - "Giubbotto ad alta visibilità e piccolo kit di primo soccorso."
      - "Non lasciare a lungo farmaci e cibi delicati nell'auto al caldo."
    nota: "Il kit auto serve se si resta bloccati in strada, nel traffico o durante il maltempo. In inverno si aggiungono guanti pesanti, cappello e una coperta in più."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Pensa a tutta la famiglia"
    punti:
      - "Aggiungi ciò che serve a bambini, anziani e persone con disabilità."
      - "Ricorda occhiali di riserva, apparecchi acustici e ausili personali."
      - "Non dimenticare cibo e acqua per gli animali."
    pittogramma: "arasaac/famiglia"
    nota: "Per i più piccoli si può aggiungere un oggetto rassicurante. Chiedi alla classe: nella vostra famiglia c'è qualcuno che ha bisogno di qualcosa in più?"
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - tipo: "domanda"
    domanda: "Quale di questi oggetti metti nel kit evacuazione rapida?"
    punti:
      - "Il fischietto."
      - "Il televisore di casa."
      - "Una pila di libri di scuola."
    nota: "La risposta giusta è la prima. Lo zaino deve essere leggero: il fischietto pesa poco e serve a farsi sentire."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Controllalo due volte l'anno"
    punti:
      - "Controlla le scadenze di acqua, cibo e farmaci."
      - "Verifica pile, torce e power bank carico."
      - "Fallo ai cambi dell'ora, a marzo e a ottobre."
    pittogramma: "arasaac/calendario"
    nota: "I cambi dell'ora legale e solare cadono l'ultima domenica di marzo e l'ultima domenica di ottobre: due promemoria che il calendario ricorda da solo."
    fonte: "/rischi-prevenzione/kit-emergenza/"
ricorda:
  - "In emergenza chiama il 112: uno, uno, due."
  - "Tieni il kit evacuazione vicino all'uscita di casa."
  - "Controlla il kit due volte l'anno, ai cambi dell'ora."
