# Presentazione per la classe: alluvioni, allagamenti e frane.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-04-08-rischio-idrogeologico"
tema: "rischio-idrogeologico"
titolo: "Alluvioni e frane: come proteggersi"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è il rischio idrogeologico"
    punti:
      - "Riguarda alluvioni, allagamenti, frane e smottamenti."
      - "Piogge forti e lunghe possono causarli anche in poche ore."
      - "In un'alluvione l'acqua può salire di uno o due metri in pochi minuti."
    pittogramma: "arasaac/alluvione"
    nota: "Chiedi alla classe la differenza tra un allagamento in strada e una frana. Annota le risposte: torneranno utili quando si parla dei segnali."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Perché anche a Genzano"
    punti:
      - "Genzano sta sul bordo di un antico cratere, sopra il lago di Nemi."
      - "Sui pendii ripidi l'acqua scende veloce."
      - "Su asfalto e tetti la pioggia non filtra e corre in strada."
    nota: "In autunno e in primavera, dopo giorni di pioggia, il terreno è già pieno d'acqua e ne assorbe poca. I fossi si gonfiano molto più in fretta dei grandi fiumi."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "I segnali da riconoscere"
    punti:
      - "Acqua che esce da tombini e caditoie."
      - "Fossi che salgono in fretta."
      - "Terreno che si crepa sui pendii, alberi che si inclinano."
      - "Se li vedi, allontanati e, se c'è un pericolo, chiama il 112."
    pittogramma: "arasaac/pericolo"
    nota: "Anche i rumori insoliti dal sottosuolo possono indicare una frana. Mostra il video in 3D sulle frane della pagina, poco più di un minuto."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Prima: prepararsi"
    punti:
      - "Libera dalle foglie le caditoie davanti a casa."
      - "Non tenere oggetti di valore in cantina o in garage."
      - "Con l'allerta, non dormire nei seminterrati."
    pittogramma: "arasaac/casa"
    nota: "Ricorda di seguire le allerte sulla pagina Allerte meteo e di tenere pronto il kit di emergenza. Chiedi: a casa vostra qual è la zona più sicura? Di solito sono i piani alti."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Durante: se sei in casa"
    punti:
      - "Sali ai piani alti, senza usare l'ascensore."
      - "Non scendere mai in cantina o in garage."
      - "Se puoi farlo senza rischi, chiudi il gas e stacca la corrente."
    pittogramma: "arasaac/salire-scale"
    nota: "Gli impianti non si toccano con mani o piedi bagnati. Aiuta familiari e vicini, come gli anziani e le persone con disabilità del palazzo, solo se puoi farlo senza esporti a pericoli."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Durante: se sei all'aperto"
    punti:
      - "Allontanati da fiumi, fossi, ponti e zone basse."
      - "Raggiungi un punto più alto, lontano da pendii che possono franare."
      - "Non attraversare strade allagate: possono nascondere buche."
    nota: "Per la velocità con cui scorre, anche pochi centimetri d'acqua possono far cadere una persona. Sotto l'acqua non si vedono buche e tombini aperti."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Se sei in auto"
    punti:
      - "Non attraversare mai un sottopasso o una strada allagata."
      - "Pochi centimetri d'acqua possono spegnere il motore."
      - "Se puoi uscire senza entrare nella corrente, lascia l'auto."
    nota: "Dopo aver lasciato l'auto si sale a piedi in un punto più alto. Se la corrente è forte e non si può uscire senza entrare nell'acqua, si resta dentro e si chiama il 112. Ne parlino anche a casa, con chi guida."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - tipo: "domanda"
    domanda: "Piove forte e il garage si allaga. Che cosa fai?"
    punti:
      - "Scendo a salvare la bicicletta."
      - "Salgo ai piani alti e resto lì."
      - "Apro la porta del garage per far uscire l'acqua."
    nota: "La risposta giusta è la seconda. Cantine e garage si allagano per primi e la spinta dell'acqua può bloccare la porta: le cose si sostituiscono, una persona no."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Le idee sbagliate"
    punti:
      - "«Sono pochi centimetri, passo»: falso, l'acqua nasconde buche."
      - "«Allerta gialla, non è niente»: falso, sono possibili allagamenti."
      - "«Non abito vicino a un fiume»: falso, si allagano anche le strade."
    nota: "Leggi ogni frase e chiedi alla classe se è vera o falsa prima di mostrare la risposta. Un temporale forte allaga strade e sottopassi anche lontano dai fiumi."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
  - titolo: "Dopo l'evento"
    punti:
      - "Rientra in casa solo quando lo dicono le autorità."
      - "Bevi l'acqua del rubinetto solo se il Comune non lo vieta."
      - "Non mangiare cibi toccati dall'acqua dell'alluvione."
    nota: "Le strade allagate possono nascondere buche, tombini aperti e cavi elettrici. Fotografare i danni prima di pulire aiuta la segnalazione al Comune."
    fonte: "/rischi-prevenzione/rischio-idrogeologico/"
ricorda:
  - "In emergenza chiama il 112: uno, uno, due."
  - "Se l'acqua sale, vai in alto: mai in cantina o in garage."
  - "Non attraversare strade allagate, né a piedi né in auto."
