# Presentazione per la classe: il 112.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-29-nue-112"
tema: "nue-112"
titolo: "Il 112, il numero unico per le emergenze"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è un'emergenza"
    punti:
      - "Una persona è in pericolo di vita o sta male in modo grave."
      - "C'è un incendio, un incidente o un reato in corso."
      - "Serve aiuto subito e non si può aspettare."
    pittogramma: "arasaac/pericolo"
    nota: "Chiedi alla classe: un rubinetto che perde è un'emergenza? E una persona che non respira? Aiutali a distinguere un problema da un pericolo per la vita."
    fonte: "/dossier/112-tre-cifre-per-salvarsi/"
  - titolo: "Un solo numero: 112"
    punti:
      - "Nel Lazio, in ogni emergenza, si chiama il 112."
      - "Non devi decidere se servono ambulanza, pompieri o polizia."
      - "La centrale del 112 manda il soccorso giusto."
    pittogramma: "arasaac/112"
    nota: "Spiega che prima c'erano numeri diversi per ogni servizio. Dal 18 novembre 2015 a Roma e provincia, quindi anche a Genzano, basta ricordare tre cifre, le stesse in tutta l'Unione europea."
    fonte: "/dossier/112-tre-cifre-per-salvarsi/"
  - titolo: "Che cosa succede quando chiami"
    punti:
      - "Risponde un operatore della Centrale unica di risposta."
      - "Capisce dove sei e che cosa è successo."
      - "Passa la chiamata all'ente che deve intervenire."
    pittogramma: "arasaac/telefonare"
    nota: "Racconta che l'operatore filtra anche gli scherzi e gli errori: ogni chiamata inutile tiene occupata la linea per chi ha davvero bisogno."
    fonte: "/dossier/112-tre-cifre-per-salvarsi/"
  - titolo: "Che cosa dire al telefono"
    punti:
      - "Chi sei."
      - "Dove sei: via, numero civico, un punto di riferimento."
      - "Che cosa è successo e se ci sono feriti."
    pittogramma: "arasaac/attenzione"
    nota: "Fai una prova a coppie: uno fa l'operatore, l'altro chiama. Vince chi riesce a dire dove si trova in modo chiaro."
    fonte: "/numeri-utili/"
  - titolo: "Non riattaccare"
    punti:
      - "Rispondi alle domande dell'operatore."
      - "Riattacca solo quando te lo dice lui."
      - "Mentre parli, il soccorso spesso è già in viaggio."
    pittogramma: "arasaac/aspettare"
    nota: "Molti chiudono la telefonata appena hanno spiegato. Sottolinea che le domande servono a mandare l'aiuto più adatto."
    fonte: "/dossier/112-tre-cifre-per-salvarsi/"
  - titolo: "Funziona sempre"
    punti:
      - "Da qualsiasi telefono, anche senza credito."
      - "Anche con la tastiera del telefono bloccata."
      - "Lo smartphone può inviare la posizione da solo."
    pittogramma: "arasaac/telefono"
    nota: "Mostra dove si trova la chiamata di emergenza sulla schermata di blocco di un telefono. Ricorda che la posizione automatica aiuta chi non sa dire dove si trova."
    fonte: "/dossier/112-tre-cifre-per-salvarsi/"
  - titolo: "Chi non può parlare o sentire"
    punti:
      - "C'è l'app ufficiale Where Are U."
      - "Manda la posizione e permette la chiamata silenziosa."
      - "Si installa prima, con calma, non durante l'emergenza."
    pittogramma: "arasaac/aiutare"
    nota: "Collega il tema all'inclusione: chi è sordo o non riesce a parlare deve poter chiedere aiuto come tutti."
    fonte: "/numeri-utili/"
  - tipo: "domanda"
    domanda: "Quale di queste situazioni è un'emergenza da 112?"
    punti:
      - "Un compagno è caduto e non risponde."
      - "Il Wi-Fi di casa non funziona."
      - "Vedi del fumo uscire da un bosco."
    nota: "Le risposte giuste sono la prima e la terza. Chiedi perché il Wi-Fi non lo è, e a chi ci si rivolge in quel caso."
    fonte: "/numeri-utili/"
  - titolo: "Quando non è un'emergenza"
    punti:
      - "Per le cure non urgenti c'è il 116117, gratuito, 24 ore su 24."
      - "Per segnalazioni di protezione civile non urgenti c'è l'803 555."
      - "Per un pericolo immediato resta sempre il 112."
    pittogramma: "arasaac/informazione"
    nota: "Il 116117 è il numero europeo per le cure mediche non urgenti; l'803 555 è la Sala operativa della Protezione civile della Regione Lazio."
    fonte: "/numeri-utili/"
  - titolo: "E i volontari di protezione civile?"
    punti:
      - "Il Gruppo comunale non si chiama direttamente dai cittadini."
      - "Lo attivano le autorità competenti, quando serve."
      - "Il cittadino chiama il 112."
    pittogramma: "arasaac/aiuto"
    nota: "Spiega che i volontari arrivano perché le autorità li attivano. Il cittadino chiama il 112: a smistare la richiesta ci pensa il sistema."
    fonte: "/numeri-utili/"
ricorda:
  - "In emergenza chiama il 112: uno, uno, due."
  - "Di' chi sei, dove sei e che cosa è successo."
  - "Non riattaccare finché non te lo dice l'operatore."
fonti:
