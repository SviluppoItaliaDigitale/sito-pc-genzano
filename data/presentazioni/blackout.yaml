# Presentazione per la classe: il blackout.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-30-blackout"
tema: "blackout"
titolo: "Blackout: che cosa fare quando manca la corrente"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è un blackout"
    punti:
      - "È un'interruzione della corrente elettrica."
      - "Può durare anche ore."
      - "Le cause più frequenti sono maltempo forte, guasti e sovraccarichi."
    pittogramma: "arasaac/lampada"
    nota: "Chiedi alla classe: chi è rimasto al buio in casa per più di un'ora? Fate insieme l'elenco degli oggetti che smettono di funzionare senza corrente."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Perché succede a Genzano"
    punti:
      - "Le linee elettriche attraversano boschi e colline."
      - "Con il maltempo intenso, alberi e rami cadono sulle linee."
      - "Per questo le interruzioni sono frequenti."
    pittogramma: "arasaac/vento"
    nota: "Collega il blackout al vento forte: un albero caduto su un filo può lasciare al buio un intero quartiere."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Prima: torcia, radio e power bank"
    punti:
      - "Tieni a portata di mano una torcia con le pile di scorta."
      - "Tieni una radio a pile per ascoltare le comunicazioni ufficiali."
      - "Carica telefono e power bank quando sono previste allerte."
    pittogramma: "arasaac/torcia"
    nota: "Fai alzare la mano a chi ha una torcia in casa. Poi chiedi: sapresti trovarla al buio? Il compito per stasera è scegliere con la famiglia un posto fisso."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Prima: la scorta di casa"
    punti:
      - "Il kit «Casa 72 ore» ti rende autonomo per 3 giorni."
      - "Tieni circa 4 litri d'acqua a persona al giorno, per 3 giorni."
      - "Aggiungi cibi che non vanno cotti e un apriscatole manuale."
    pittogramma: "iso7010/acqua-potabile"
    nota: "Fate il calcolo insieme: per una famiglia di 4 persone servono circa 48 litri d'acqua per 3 giorni. Con il caldo, i bambini piccoli o gli animali ne serve di più."
    fonte: "/rischi-prevenzione/kit-emergenza/"
  - titolo: "Chi usa apparecchi medici"
    punti:
      - "Chi usa apparecchi elettromedicali rischia di più senza corrente."
      - "Con il medico si prepara un piano per le ore senza corrente."
      - "Serve anche una batteria di riserva."
    nota: "Spiega che alcune persone usano a casa apparecchi che funzionano con la corrente. Se un apparecchio salvavita resta senza corrente è un pericolo reale: si chiama il 112."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Durante: le prime cose da fare"
    punti:
      - "Di solito i blackout sono temporanei: resta con un adulto."
      - "Scollega gli elettrodomestici."
      - "Lascia accesa una sola lampada per capire quando torna la corrente."
    pittogramma: "arasaac/calma"
    nota: "Se il buio fa un po' di paura è normale: la torcia e un adulto vicino aiutano. Spiega gli sbalzi di tensione: quando la corrente torna, gli apparecchi lasciati collegati possono rovinarsi."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Frigorifero e congelatore chiusi"
    punti:
      - "Tieni chiusi frigorifero e congelatore."
      - "Se non li apri, il cibo si conserva per molte ore."
      - "Un congelatore tenuto chiuso conserva il cibo fino a 24 ore."
    pittogramma: "arasaac/cibo"
    nota: "Chiedi alla classe che cosa c'è nel congelatore di casa e quanto potrebbe durare senza corrente, se resta chiuso."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Torcia sì, candele no"
    punti:
      - "Per fare luce usa la torcia, non le candele."
      - "Una candela può causare un incendio."
      - "Al chiuso non usare generatori, barbecue o fornelli da campeggio."
    pittogramma: "iso7010/vietato-fuochi"
    nota: "Soffermati sul monossido di carbonio: un gas che non ha odore ed è letale. Lo producono generatori e fornelli a combustibile usati in locali chiusi."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Bloccato in ascensore"
    punti:
      - "Premi il pulsante di allarme."
      - "Aspetta i soccorsi senza tentare di uscire."
      - "Non forzare le porte."
    pittogramma: "arasaac/ascensore"
    nota: "Le persone bloccate in ascensore sono un caso in cui si chiama il 112. Fai ripetere alla classe i tre passi nell'ordine giusto."
    fonte: "/rischi-prevenzione/blackout/"
  - titolo: "Dopo: quando la corrente torna"
    punti:
      - "Riaccendi gli elettrodomestici uno alla volta."
      - "Così eviti di sovraccaricare l'impianto."
      - "Se senti odore di bruciato o vedi bruciature, chiama il 112."
    nota: "Chiedi alla classe che cosa succederebbe accendendo tutto insieme: l'impianto riceve troppo carico in un colpo solo."
    fonte: "/rischi-prevenzione/blackout/"
  - tipo: "domanda"
    domanda: "Manca la corrente ed è buio. Che cosa usi per fare luce?"
    punti:
      - "Una candela accesa."
      - "Una torcia elettrica."
      - "Un fornello da campeggio acceso in casa."
    nota: "La risposta giusta è la seconda. La candela può causare un incendio; un fornello a combustibile in casa produce monossido di carbonio."
    fonte: "/rischi-prevenzione/blackout/"
ricorda:
  - "Se c'è un pericolo reale, chiama il 112."
  - "Al buio usa la torcia, non le candele."
  - "Tieni pronti torcia, radio a pile, power bank e acqua."
fonti:
