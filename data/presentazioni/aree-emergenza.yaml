# Presentazione per la classe: le aree di emergenza di Genzano di Roma.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Nomi e indirizzi delle aree solo come in data/aree_emergenza.yaml.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-30-aree-emergenza"
tema: "aree-emergenza"
titolo: "Le aree di emergenza di Genzano"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Il Piano di emergenza comunale"
    punti:
      - "Il Comune ha un piano per organizzare i soccorsi."
      - "Indica i rischi, le aree di emergenza e chi coordina."
      - "A te serve sapere soprattutto dove andare."
    nota: "Spiega che il Piano è un documento tecnico, ma per il cittadino le informazioni principali sono poche. Oggi ci concentriamo sulle aree di emergenza."
    fonte: "/piano-emergenza/"
  - titolo: "Tre tipi di aree"
    punti:
      - "Aree di attesa (AA): qui si raduna la popolazione."
      - "Aree di ricovero (AR): qui si allestisce l'alloggio temporaneo."
      - "Aree di ammassamento (AS): qui arrivano soccorritori e mezzi."
    nota: "Le aree di ammassamento non sono per la popolazione: servono ai soccorsi che arrivano da fuori Comune. Il cittadino va nelle aree di attesa."
    fonte: "/piano-emergenza/"
  - titolo: "Che cos'è un'area di attesa"
    punti:
      - "È un luogo sicuro all'aperto, lontano da edifici."
      - "Ci vai dopo un terremoto o in caso di evacuazione."
      - "Qui vieni censito e ricevi le prime informazioni."
    pittogramma: "iso7010/punto-raccolta"
    nota: "Mostra il segnale verde del punto di raccolta e chiedi se qualcuno l'ha già visto, per esempio a scuola, nella prova di evacuazione."
    fonte: "/aree-attesa/"
  - titolo: "Le 10 aree di attesa di Genzano"
    punti:
      - "A Genzano ci sono 10 aree di attesa, da AA1 ad AA10."
      - "Ogni area ha un cartello con il suo codice."
      - "Il cartello è all'ingresso del parcheggio o del piazzale."
    nota: "Leggi qualche esempio dall'elenco del sito: AA1 Palazzo Sforza Cesarini, in piazza Tommaso Frasconi; AA6 Palazzetto dello Sport, parcheggio di via G. di Vittorio; AA10 Landi, piazzale della frazione Landi."
    fonte: "/aree-attesa/"
  - titolo: "Trova la tua area adesso"
    punti:
      - "Cerca l'area più vicina a casa, non durante l'emergenza."
      - "Ricorda il suo codice, per esempio AA1."
      - "Impara il percorso a piedi per arrivarci."
    pittogramma: "arasaac/mappa"
    nota: "Attività: apri la pagina «Aree di attesa» e cercate insieme l'area più vicina alla scuola. Per compito ognuno trova, con un adulto, quella più vicina a casa."
    fonte: "/aree-attesa/"
  - titolo: "Quando ci vai"
    punti:
      - "Dopo un terremoto, a scossa finita."
      - "Quando le autorità indicano di andarci."
      - "Se devi lasciare un edificio che non è sicuro."
      - "Se puoi, porta con te il kit di emergenza."
    pittogramma: "arasaac/camminare"
    nota: "Ricorda che ci si va a piedi e con calma. Il kit di emergenza è lo zaino preparato prima, a casa, con acqua, torcia, farmaci e documenti."
    fonte: "/piano-emergenza/"
  - titolo: "Quando arrivi nell'area"
    punti:
      - "Resta nell'area finché non ti dicono che cosa fare."
      - "Fatti censire dai volontari o dal personale del Comune."
      - "Non intralciare i mezzi di soccorso in arrivo."
    pittogramma: "arasaac/aspettare"
    nota: "Chiedi: perché è importante farsi censire? Serve a sapere chi è al sicuro e chi manca ancora all'appello."
    fonte: "/aree-attesa/"
  - titolo: "Aiuta e informati bene"
    punti:
      - "Aiuta chi è in difficoltà, se puoi farlo in sicurezza."
      - "Segui solo le fonti ufficiali: Comune, Protezione civile, 112."
      - "Non far girare voci o messaggi non verificati."
    pittogramma: "arasaac/aiutare"
    nota: "Collega il tema alle chat: in emergenza girano messaggi falsi. Chiedi alla classe come si riconosce una fonte ufficiale."
    fonte: "/aree-attesa/"
  - tipo: "domanda"
    domanda: "Sei arrivato nell'area di attesa. Che cosa fai?"
    punti:
      - "Torno a casa a prendere il telefono."
      - "Resto lì e aspetto le indicazioni."
      - "Vado a vedere il luogo dell'emergenza."
    nota: "La risposta giusta è la seconda. Non si rientra in casa finché le autorità non lo dicono, e andare a vedere per curiosità intralcia i soccorsi."
    fonte: "/aree-attesa/"
  - titolo: "Dopo l'emergenza"
    punti:
      - "Non rientrare in casa finché le autorità non lo dicono."
      - "Segui le comunicazioni ufficiali."
      - "Usa il telefono solo per necessità urgenti."
    pittogramma: "arasaac/telefono"
    nota: "Spiega che telefonare per curiosità intasa le linee: chi ha davvero bisogno di aiuto deve trovarle libere."
    fonte: "/piano-emergenza/"
  - titolo: "Chi coordina l'emergenza"
    punti:
      - "Nel Comune la prima autorità di protezione civile è il Sindaco."
      - "Il Sindaco può attivare il Centro operativo comunale."
      - "I volontari li attivano gli enti, non i cittadini: tu chiami il 112."
    pittogramma: "arasaac/112"
    nota: "Il Gruppo Comunale Volontari di Protezione Civile lavora dentro questa catena. In caso di pericolo immediato si chiama il 112, non le squadre o i singoli volontari."
    fonte: "/piano-emergenza/"
ricorda:
  - "In pericolo chiama il 112: uno, uno, due."
  - "Trova adesso l'area di attesa più vicina a casa tua."
  - "Nell'area resta e aspetta le indicazioni."
fonti:
