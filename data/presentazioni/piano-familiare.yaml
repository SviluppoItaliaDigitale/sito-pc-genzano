# Presentazione per la classe: il piano di emergenza familiare.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-29-piano-familiare"
tema: "piano-familiare"
titolo: "Il piano di emergenza della mia famiglia"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Perché serve un piano"
    punti:
      - "In un'emergenza potresti non essere con la tua famiglia."
      - "Se avete deciso prima che cosa fare, agire è più facile."
      - "Il piano si compila insieme, a casa, con calma."
    pittogramma: "arasaac/famiglia"
    nota: "Chiedi alla classe: dove siete di solito alle 10 del mattino? E i vostri genitori? Fai notare che in molti momenti della giornata la famiglia è divisa."
    fonte: "/piano-familiare/"
  - titolo: "Le domande del piano"
    punti:
      - "Dove ci troviamo e chi chiamiamo?"
      - "Che cosa portiamo con noi?"
      - "Chi ha bisogno di aiuto e che cosa facciamo prima di uscire?"
    pittogramma: "arasaac/informazione"
    nota: "Il piano del sito risponde a cinque domande: le vediamo una alla volta nelle prossime slide. Scrivile alla lavagna e lasciale lì fino alla fine dell'ora."
    fonte: "/piano-familiare/"
  - titolo: "Dove ci troviamo"
    punti:
      - "Scegliete un punto di ritrovo vicino casa."
      - "Scegliete anche un punto di ritrovo lontano da casa."
      - "Provate a raggiungerlo insieme, come in un gioco."
    pittogramma: "arasaac/piazza"
    nota: "Il punto vicino casa può essere un'area di attesa del Comune, per esempio AA1, in piazza Tommaso Frasconi. L'elenco delle 10 aree è nella pagina «Aree di attesa» del sito."
    fonte: "/piano-familiare/"
  - titolo: "Chi chiamiamo"
    punti:
      - "Scegliete un contatto che vive fuori città o fuori zona."
      - "Ditegli che il vostro piano esiste."
      - "Salvate i numeri importanti nei telefoni di tutti."
    pittogramma: "arasaac/telefono"
    nota: "Chiedi: chi è la persona fuori città che la vostra famiglia potrebbe scegliere? Un nonno, una zia, un amico di famiglia. Ognuno ci pensa e ne parla a casa."
    fonte: "/piano-familiare/"
  - titolo: "Che cosa devi sapere a memoria"
    punti:
      - "Il tuo nome completo e il tuo indirizzo."
      - "Almeno un numero di telefono da chiamare."
      - "Il suono dell'allarme e l'adulto da seguire."
    pittogramma: "arasaac/bambino"
    nota: "Attività breve: ognuno scrive su un foglietto nome, cognome, via e un numero di telefono, senza guardare. Il foglietto resta a lui, non si consegna: sono dati personali."
    fonte: "/piano-familiare/"
  - titolo: "Che cosa portiamo: lo zaino"
    punti:
      - "Acqua: circa 4 litri a persona al giorno, per 3 giorni."
      - "Cibo a lunga conservazione, torcia e radio a pile."
      - "Farmaci per almeno 7 giorni e copia dei documenti."
    pittogramma: "arasaac/zaino"
    nota: "Fai calcolare l'acqua per la propria famiglia: 4 litri per persona per 3 giorni. In una famiglia di quattro persone sono 48 litri. Sul sito c'è il calcolatore dello zaino delle 72 ore."
    fonte: "/piano-familiare/"
  - titolo: "Chi ha bisogno di aiuto"
    punti:
      - "Pensate a bambini, anziani e persone con disabilità."
      - "Segnate nel piano terapie e ausili, come gli occhiali."
      - "Ricordate gli animali: cibo, guinzaglio, trasportino."
    pittogramma: "arasaac/aiutare"
    nota: "Spiega che ogni famiglia è diversa: c'è chi usa apparecchi acustici, chi un bastone, chi ha un cane. Il piano serve proprio a non dimenticare nessuno."
    fonte: "/piano-familiare/"
  - titolo: "Prima di uscire di casa"
    punti:
      - "Chiudi gas e acqua e stacca il quadro elettrico."
      - "Prendi documenti, farmaci e chiavi."
      - "Indossa scarpe chiuse e robuste."
      - "Fai queste cose solo se puoi farle in sicurezza."
    pittogramma: "arasaac/chiavi"
    nota: "Compito per casa: chiedere a un adulto dove sono il rubinetto del gas, quello dell'acqua e il quadro elettrico. Non si toccano da soli: basta sapere dove sono."
    fonte: "/piano-familiare/"
  - tipo: "domanda"
    domanda: "Dove conviene tenere il piano stampato?"
    punti:
      - "In un posto che i familiari conoscono, ma protetto."
      - "Appeso fuori dalla porta di casa."
      - "Nel cassetto del banco a scuola."
    nota: "La risposta giusta è la prima. Il piano contiene dati personali e sanitari: deve essere facile da trovare per la famiglia, ma non alla vista di tutti."
    fonte: "/piano-familiare/"
  - titolo: "Quando aggiornare il piano"
    punti:
      - "Rileggetelo insieme almeno una volta l'anno."
      - "Aggiornatelo se cambiano casa, scuola, numeri o farmaci."
      - "Ogni 6 mesi controllate le scorte: l'acqua va cambiata."
    pittogramma: "arasaac/calendario"
    nota: "Proponi di scegliere una data fissa in famiglia, per esempio il primo giorno di scuola, per rileggere il piano e controllare lo zaino."
    fonte: "/piano-familiare/"
  - titolo: "Il piano si fa sul sito"
    punti:
      - "Lo compili e lo stampi dalla pagina «Piano familiare»."
      - "I dati restano sul tuo computer: non vanno al sito."
      - "In emergenza chiama il 112."
    pittogramma: "arasaac/112"
    nota: "Se c'è la connessione, mostra la pagina del piano senza compilarla in classe. Il piano si compila a casa, con la famiglia: in classe non si raccolgono dati."
    fonte: "/piano-familiare/"
ricorda:
  - "In emergenza chiama il 112: uno, uno, due."
  - "Decidi con la famiglia dove ritrovarvi e chi chiamare."
  - "Rileggete il piano insieme almeno una volta l'anno."
fonti:
  - nome: "Piano di emergenza familiare"
    url: "/piano-familiare/"
  - nome: "Aree di attesa di Genzano di Roma"
    url: "/aree-attesa/"
