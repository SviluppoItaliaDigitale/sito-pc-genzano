# Presentazione per la classe: il terremoto.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-03-21-rischio-sismico"
tema: "rischio-sismico"
titolo: "Il terremoto: che cosa fare prima, durante e dopo"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Il terremoto non si può prevedere"
    punti:
      - "Non esistono segnali premonitori affidabili."
      - "Non fidarti di chi dice di saper prevedere un terremoto."
      - "L'unica difesa è prepararsi prima."
    pittogramma: "arasaac/terremoto"
    nota: "Chiedi alla classe se ha mai sentito dire che un terremoto «arriverà» in un certo giorno. Spiega che nessuno può saperlo: per questo ci si prepara quando tutto è tranquillo."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Perché la terra trema"
    punti:
      - "La parte esterna della Terra è divisa in grandi placche che si muovono."
      - "L'Italia sta tra la placca africana e quella euroasiatica."
      - "Quando una faglia si rompe di colpo, la terra trema."
    nota: "Usa l'immagine della molla: per secoli la roccia si deforma e si carica di energia; quando l'attrito non regge più, la faglia si rompe e i blocchi scattano. La pagina ha un video in 3D che lo mostra."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Genzano è in zona sismica 2"
    punti:
      - "Genzano di Roma è in zona sismica 2, sottozona 2B."
      - "In zona 2 forti terremoti sono possibili."
      - "Ai Colli Albani le scosse sono di solito piccole, a volte avvertite."
    nota: "Spiega che l'Italia è divisa in zone sismiche dalla 1, la più pericolosa, alla 4, e che in tutte si costruisce con le norme antisismiche. Ricorda che il vulcano dei Colli Albani è quiescente, non spento."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Magnitudo e intensità"
    punti:
      - "La magnitudo misura l'energia liberata dal terremoto."
      - "L'intensità misura gli effetti su persone ed edifici."
      - "Ogni terremoto ha una sola magnitudo, ma tante intensità."
    nota: "L'intensità si misura con la scala Mercalli-Cancani-Sieberg, di dodici gradi, ed è più alta vicino all'epicentro. Chi sente una scossa può rispondere al questionario «Hai sentito il terremoto?» dell'INGV."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Prima: una casa più sicura"
    punti:
      - "Fissa alle pareti mobili alti, librerie e scaffali."
      - "Allontana gli oggetti pesanti dai letti e dai divani."
      - "Individua i punti sicuri della casa e le vie di fuga."
    pittogramma: "arasaac/casa"
    nota: "Attività: ognuno disegna la pianta della propria camera e segna con una croce gli oggetti che potrebbero cadere e con un cerchio il punto sicuro."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Prima: kit e piano familiare"
    punti:
      - "Tieni pronto il kit con torcia, radio a pile, acqua e medicinali."
      - "Scopri dov'è l'area di attesa più vicina."
      - "Compila il Piano familiare con tutta la famiglia."
    pittogramma: "arasaac/zaino"
    nota: "Le aree di attesa di Genzano sono nella pagina Cartografia del sito. Chiedi alla classe: sapete dove andrebbe la vostra famiglia dopo una scossa?"
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Durante: in un luogo chiuso"
    punti:
      - "Riparati sotto un tavolo robusto o vicino a un muro portante."
      - "Proteggi la testa con le braccia o con un cuscino."
      - "Non correre fuori durante la scossa. Niente scale né ascensore."
    pittogramma: "arasaac/nascondersi-tavolo"
    nota: "I tre gesti sono: abbassati, copriti, tieniti. Spiega che a ferire sono soprattutto i crolli e gli oggetti che cadono, per questo durante la scossa non si corre fuori. A scuola si segue l'insegnante e il piano di evacuazione. Provate insieme i tre gesti sotto i banchi."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Durante: all'aperto"
    punti:
      - "Allontanati da edifici, alberi, lampioni e linee elettriche."
      - "Cerca un'area aperta e aspetta la fine della scossa."
      - "Non fermarti sotto ponti o cavalcavia."
    nota: "Chiedi alla classe di pensare al cortile della scuola o alla piazza vicino casa: dov'è il punto più lontano da muri, alberi e pali?"
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Se hai difficoltà a muoverti"
    punti:
      - "Proteggi testa e collo e non muoverti, se spostarti è rischioso."
      - "In sedia a rotelle blocca le ruote e piegati in avanti."
      - "A letto resta lì e proteggi la testa con il cuscino."
    pittogramma: "arasaac/proteggere-testa"
    nota: "Collega il tema all'inclusione: i gesti si adattano alla persona. Chi assiste una persona con fragilità protegge prima la sua testa, poi la propria."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - tipo: "domanda"
    domanda: "Durante la scossa sei in casa. Che cosa fai?"
    punti:
      - "Corro subito fuori di casa."
      - "Mi riparo sotto un tavolo robusto."
      - "Prendo l'ascensore per scendere."
    nota: "La risposta giusta è la seconda. Correre fuori espone a calcinacci e oggetti che cadono; l'ascensore può bloccarsi e lasciarti intrappolato."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - titolo: "Dopo la scossa"
    punti:
      - "Controlla che chi è con te stia bene."
      - "Esci con prudenza, con le scarpe ai piedi."
      - "Raggiungi l'area di attesa più vicina."
      - "Non rientrare finché le autorità non lo consentono."
    pittogramma: "iso7010/punto-raccolta"
    nota: "Le scarpe servono perché per terra possono esserci vetri e calcinacci. Ricorda di usare il telefono solo per una vera emergenza, per non intasare le linee, e di seguire solo le notizie ufficiali."
    fonte: "/rischi-prevenzione/rischio-sismico/"
ricorda:
  - "In emergenza chiama il 112: uno, uno, due."
  - "Durante la scossa: abbassati, copriti, tieniti."
  - "Dopo la scossa esci con le scarpe e vai all'area di attesa."
