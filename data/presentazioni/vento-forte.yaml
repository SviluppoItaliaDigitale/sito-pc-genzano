# Presentazione per la classe: il vento forte.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-30-vento-forte"
tema: "vento-forte"
titolo: "Vento forte: che cosa fare prima, durante e dopo"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Il vento forte da noi"
    punti:
      - "Il vento forte colpisce spesso i Castelli Romani."
      - "Succede soprattutto in autunno e in inverno."
      - "Le raffiche possono abbattere alberi, rami e tegole."
    pittogramma: "arasaac/vento"
    nota: "Chiedi alla classe: avete mai visto un ramo caduto dopo una giornata di vento? Dove?"
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "Perché a Genzano"
    punti:
      - "Genzano è in collina, in una zona esposta ai venti."
      - "Lungo le strade e nei parchi ci sono alberi storici."
      - "Con il terreno inzuppato dalla pioggia, il rischio di caduta cresce."
    nota: "Fai nominare alla classe strade o piazze alberate che conosce, vicino alla scuola o a casa."
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "Le allerte meteo"
    punti:
      - "Controlla l'allerta sul sito o sul Bollettino regionale."
      - "Gli avvisi li dà il Centro Funzionale della Regione Lazio."
      - "Non ignorarle: il vento può essere più pericoloso di quanto sembri."
    pittogramma: "arasaac/informazione"
    nota: "Mostra la pagina delle allerte del sito. Spiega i colori: giallo vuol dire criticità ordinaria, arancione criticità moderata, rosso criticità elevata."
    fonte: "/allerte-meteo/"
  - titolo: "Prima: balconi e terrazzi"
    punti:
      - "Metti al riparo o fissa vasi, sedie e oggetti leggeri."
      - "Fate controllare tende da sole, persiane e antenne."
      - "Falle prima che arrivi il vento, non durante."
    nota: "Il compito per casa: guardare il balcone con la famiglia e trovare gli oggetti che il vento potrebbe portare via."
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "L'auto e il vento"
    punti:
      - "Parcheggia lontano da alberi, impalcature e strutture precarie."
      - "In auto rallenta e fai attenzione agli oggetti portati dal vento."
      - "Evita le strade alberate."
    nota: "Questi consigli valgono per chi guida: i ragazzi possono ricordarli in famiglia quando arriva un'allerta."
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "Durante: resta in casa"
    punti:
      - "Se puoi, resta in casa."
      - "Stai lontano da finestre e vetrate."
      - "Tieni chiuse porte e finestre."
    pittogramma: "arasaac/chiudere-finestra"
    nota: "Fai indicare a ciascuno, nella propria casa, una stanza lontana da finestre e vetrate."
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "Durante: se sei all'aperto"
    punti:
      - "Allontanati da alberi, pali della luce e impalcature."
      - "Stai lontano anche dai cartelloni."
      - "Non fermarti sotto cornicioni o strutture sospese."
    nota: "Ripercorrete insieme il tragitto da casa a scuola: dove ci sono alberi, impalcature o cartelloni?"
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "Gli errori da non fare"
    punti:
      - "Non uscire solo per curiosità durante le raffiche."
      - "Non provare a riparare antenne o tetti mentre c'è vento forte."
      - "Durante l'allerta non parcheggiare sotto gli alberi."
    pittogramma: "arasaac/no"
    nota: "Parla di chi esce per filmare le raffiche: si mette nello stesso pericolo che vuole riprendere."
    fonte: "/rischi-prevenzione/vento-forte/"
  - titolo: "Dopo: cavi e alberi caduti"
    punti:
      - "Non toccare cavi elettrici caduti o danneggiati."
      - "Segnala al 112 alberi caduti sulle strade e cavi a terra."
      - "Fai controllare a un adulto tetto, grondaie e parti esterne."
    pittogramma: "iso7010/pericolo-elettrico"
    nota: "Chiedi alla classe che cosa farebbe vedendo un cavo a terra: non si tocca, si segnala al 112. Dopo il vento si seguono gli aggiornamenti sui canali ufficiali."
    fonte: "/rischi-prevenzione/vento-forte/"
  - tipo: "domanda"
    domanda: "C'è vento fortissimo e un ramo è caduto sulla strada. Che cosa fai?"
    punti:
      - "Vado a vedere da vicino."
      - "Resto lontano e lo segnalo al 112."
      - "Esco per fare un video da mettere online."
    nota: "La risposta giusta è la seconda. Un albero caduto su una strada è una situazione di pericolo da segnalare al 112; uscire per curiosità ti espone alle raffiche."
    fonte: "/rischi-prevenzione/vento-forte/"
ricorda:
  - "Alberi o cavi caduti sulla strada? Segnalali al 112."
  - "Con il vento forte, se puoi, resta in casa lontano dalle finestre."
  - "All'aperto stai lontano da alberi, impalcature e cartelloni."
