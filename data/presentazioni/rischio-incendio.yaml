# Presentazione per la classe: gli incendi boschivi.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-18-rischio-incendio"
tema: "rischio-incendio"
titolo: "Gli incendi boschivi: prevenirli e proteggersi"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è un incendio boschivo"
    punti:
      - "È un fuoco che brucia boschi, macchia e terreni incolti."
      - "Corre veloce con il vento, la siccità e l'erba secca."
      - "Quasi sempre lo accende una persona."
    pittogramma: "arasaac/fuoco"
    nota: "Chiedi alla classe chi ha mai visto del fumo salire da un bosco o da un campo d'estate. Raccogli i ricordi senza drammatizzare."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Che cosa serve al fuoco"
    punti:
      - "Qualcosa che brucia, come erba secca, foglie e rami."
      - "L'ossigeno dell'aria."
      - "Una fonte di calore. Se ne togli una, il fuoco si spegne."
    nota: "Disegna alla lavagna il triangolo del fuoco. Chiedi: che cosa togliamo quando puliamo un terreno dall'erba secca? E quando i pompieri usano l'acqua?"
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Perché ci riguarda"
    punti:
      - "Genzano è in parte nel Parco Regionale dei Castelli Romani."
      - "Intorno a noi ci sono boschi e macchia mediterranea."
      - "Il periodo più pericoloso va da giugno a settembre."
    pittogramma: "arasaac/bosco"
    nota: "Chiedi quali boschi conoscono vicino a casa o alla scuola. Racconta che il Gruppo partecipa alle campagne antincendio boschivo (AIB)."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Come comincia, di solito"
    punti:
      - "Un mozzicone o un fiammifero gettato ancora acceso."
      - "Sterpaglie bruciate o un fuoco lasciato acceso."
      - "Un'auto parcheggiata sull'erba secca: la marmitta scotta."
    nota: "Le cause naturali, come i fulmini, sono molto rare: il video in 3D della pagina dice appena il 2%. Fai notare che quasi tutti gli incendi nascono da comportamenti umani."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Come si evita"
    punti:
      - "Non gettare mai mozziconi o fiammiferi accesi."
      - "Il fuoco lo accende solo un adulto, dove è permesso, e lo spegne bene."
      - "Con il vento non accendere mai fuochi."
    pittogramma: "iso7010/vietato-fuochi"
    nota: "Nel periodo di massimo rischio non si accendono fuochi nei boschi o vicino a essi. Tenere puliti da sterpaglie i terreni di proprietà è anche un obbligo di legge. Chiedi: chi ha un giardino o un orto in famiglia?"
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Se vedi fumo o fiamme"
    punti:
      - "Chiama subito il 112, anche se vedi solo fumo."
      - "Non pensare che l'abbia già fatto qualcun altro."
      - "Di' il Comune, il luogo preciso e dove va il fumo."
    pittogramma: "arasaac/112"
    nota: "Nel Lazio il 112 attiva vigili del fuoco, forestali e, se serve, il soccorso sanitario. L'incendio non è uno spettacolo: chi si ferma lungo la strada a guardare intralcia i soccorsi."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Se sei piccolo"
    punti:
      - "Allontanati e avvisa subito un adulto."
      - "Se sei solo e il pericolo è vero, chiama tu il 112."
      - "Non avvicinarti e non provare a spegnere il fuoco."
    nota: "Fai una prova a coppie: uno chiama il 112 e spiega dove si trova il fumo, l'altro fa l'operatore e chiede il luogo preciso."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Se il fuoco è vicino"
    punti:
      - "Allontanati verso una strada o un corso d'acqua."
      - "Non andare dove soffia il vento e non scappare in salita."
      - "Se non puoi allontanarti, stenditi a terra dove non c'è erba."
    nota: "Spiega perché: in salita le fiamme corrono più veloci di una persona, e stando a terra si respira meno fumo, perché il fumo sale. Il fumo non va mai sottovalutato."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Se il fuoco minaccia la casa"
    punti:
      - "Se puoi farlo in sicurezza, allontanati dal fumo e dal fuoco."
      - "Se non puoi, entra e chiudi porte, finestre e prese d'aria."
      - "Metti panni bagnati sotto le porte."
    pittogramma: "arasaac/chiudere-finestra"
    nota: "Ricorda di seguire sempre le indicazioni delle squadre di soccorso. Chiedi alla classe di immaginare quali sono le finestre e le porte da chiudere nella propria casa."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - tipo: "domanda"
    domanda: "Vedi del fumo salire da un bosco. Che cosa fai?"
    punti:
      - "Ti avvicini per guardare meglio."
      - "Chiami il 112 o avvisi subito un adulto."
      - "Aspetti: qualcuno l'avrà già segnalato."
    nota: "La risposta giusta è la seconda. Avvicinarsi è pericoloso, e pensare che abbia già chiamato qualcun altro fa perdere minuti preziosi."
    fonte: "/rischi-prevenzione/rischio-incendio/"
  - titolo: "Dopo l'incendio"
    punti:
      - "Non entrare nella zona bruciata."
      - "Sotto la cenere ci possono essere braci ancora accese."
      - "Se vedi il fuoco riprendere, chiama il 112."
    nota: "Nella zona bruciata ci possono essere anche tronchi che stanno per cadere. Il fuoco spento non vuol dire che il pericolo è finito."
    fonte: "/rischi-prevenzione/rischio-incendio/"
ricorda:
  - "Se vedi fumo o fiamme, chiama subito il 112."
  - "Non avvicinarti al fuoco e non provare a spegnerlo."
  - "Mai mozziconi o fiammiferi accesi nell'erba o nel bosco."
