# Presentazione per la classe: dopo l'emergenza.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-30-dopo-emergenza"
tema: "dopo-emergenza"
titolo: "Dopo l'emergenza: che cosa fare quando è passata"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Il pericolo non sempre è finito"
    punti:
      - "Dopo un terremoto, un'alluvione o un incendio serve ancora attenzione."
      - "Gli edifici possono essere indeboliti e gli impianti danneggiati."
      - "Intanto circolano in fretta notizie false."
    pittogramma: "arasaac/pericolo"
    nota: "Chiedi alla classe: secondo voi, che cosa succede un minuto dopo la fine di un terremoto o di un'alluvione? Raccogli le risposte alla lavagna."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Prima di tutto, le persone"
    punti:
      - "Controlla che le persone con te stiano bene."
      - "Fai attenzione a bambini, anziani e persone con fragilità."
      - "Metti scarpe chiuse e guanti: a terra ci sono vetri e detriti."
    pittogramma: "arasaac/aiutare"
    nota: "Spiega che il primo errore è avere fretta di tornare alla normalità. Chiedi perché servono le scarpe chiuse dopo un evento."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Lontano da ciò che può cadere"
    punti:
      - "Non entrare in un edificio danneggiato senza il via libera."
      - "Stai lontano da muri lesionati, cornicioni e alberi inclinati."
      - "Non avvicinarti alle linee elettriche cadute."
    nota: "Dopo un terremoto sono i tecnici a decidere, con un sopralluogo, se una casa è sicura. Nessuno deve deciderlo da solo."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Rientrare in casa"
    punti:
      - "Rientra solo quando le autorità dicono che si può."
      - "Guarda soffitti, pareti e scale prima di muoverti."
      - "Fotografa i danni prima di pulire."
    pittogramma: "arasaac/casa"
    nota: "Le foto servono per segnalare i danni al Comune di Genzano di Roma, che raccoglie le segnalazioni non urgenti. Per un pericolo immediato si chiama il 112."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Se senti odore di gas"
    punti:
      - "Niente luci, fiamme, interruttori né telefoni nel locale."
      - "Apri porte e finestre; chiudi il gas solo se lo raggiungi senza rischi."
      - "Esci e chiama il 112 da fuori."
    pittogramma: "arasaac/gas"
    nota: "Fai ripetere la sequenza nell'ordine giusto: prima niente luci né telefoni, poi aria, poi fuori. Solo da fuori si chiama il 112. I bambini escono subito e avvisano un adulto."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Corrente e acqua"
    punti:
      - "Non toccare gli interruttori con le mani bagnate."
      - "Dopo un'alluvione bevi dal rubinetto solo se il Comune non lo vieta."
      - "Non mangiare cibi toccati dall'acqua dell'alluvione."
    pittogramma: "arasaac/acqua"
    nota: "L'interruttore generale si stacca solo se si può farlo in sicurezza, senza toccare l'acqua. Dopo un allagamento, prima di riaccendere luce e gas, può servire il parere di un tecnico."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Ritrovarsi e comunicare"
    punti:
      - "Usa SMS o chat invece delle chiamate: occupano meno la rete."
      - "Avvisa i familiari che stai bene con un messaggio breve."
      - "Raggiungi il punto di ritrovo scelto nel piano familiare."
    pittogramma: "arasaac/famiglia"
    nota: "Chiedi: la vostra famiglia ha un punto di ritrovo? Il compito per casa è sceglierlo insieme con il piano familiare del sito."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Gli animali di casa"
    punti:
      - "Tieni gli animali al guinzaglio o nel trasportino."
      - "Controlla che non si siano feriti con vetri o detriti."
      - "Dai loro acqua pulita e un posto tranquillo."
    nota: "Anche gli animali sono spaventati quando l'evento è finito e possono scappare. Chiedi chi ha un animale e che cosa metterebbe nel suo kit."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Attenzione alle notizie false"
    punti:
      - "Fidati solo delle fonti ufficiali, come Comune e Protezione Civile."
      - "Non condividere audio o foto di cui non conosci l'origine."
      - "Le notizie false rallentano i soccorsi."
    pittogramma: "arasaac/informazione"
    nota: "Leggi un messaggio inventato e allarmante e chiedi come verificarlo prima di inoltrarlo. Le fonti ufficiali sono il Dipartimento della Protezione Civile, il Comune e il Centro Funzionale Regionale del Lazio."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "Ritrovare la calma"
    punti:
      - "Dopo un evento difficile è normale sentirsi scossi o stanchi."
      - "Parlane con le persone vicine: condividere aiuta."
      - "Torna appena puoi alle abitudini: pasti, sonno, scuola."
    pittogramma: "arasaac/calma"
    nota: "I bambini a volte reagiscono qualche giorno dopo. Se il malessere è forte o dura nel tempo, o se se ne sente il bisogno, se ne parla con il medico o con i servizi della ASL Roma 6."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - tipo: "domanda"
    domanda: "Senti odore di gas in casa. Che cosa fai?"
    punti:
      - "Accendo la luce per vedere meglio."
      - "Apro le finestre, esco e chiamo il 112 da fuori."
      - "Telefono subito dalla cucina."
    nota: "La risposta giusta è la seconda. Con odore di gas non si accendono luci e non si usano telefoni nel locale: si chiama solo dopo essere usciti."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
ricorda:
  - "Per un pericolo immediato chiama il 112."
  - "Rientra in casa solo dopo il via libera."
  - "Credi solo alle fonti ufficiali e non inoltrare voci."
fonti:
  - nome: "Dopo l'emergenza: cosa fare quando l'evento è passato"
    url: "/rischi-prevenzione/dopo-emergenza/"
  - nome: "Piano familiare"
    url: "/piano-familiare/"
