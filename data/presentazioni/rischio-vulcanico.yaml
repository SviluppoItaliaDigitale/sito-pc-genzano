# Presentazione per la classe: il vulcano dei Colli Albani.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-23-rischio-vulcanico"
tema: "rischio-vulcanico"
titolo: "Il vulcano dei Colli Albani"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Un vulcano sotto i Castelli"
    punti:
      - "I Castelli Romani sorgono sul Vulcano Laziale dei Colli Albani."
      - "Le sue eruzioni hanno costruito il paesaggio che vediamo."
      - "I laghi di Albano e di Nemi occupano due suoi crateri."
    pittogramma: "arasaac/vulcano"
    nota: "Mostra la foto dei due laghi vista dalla Stazione Spaziale Internazionale, sulla pagina del sito. Chiedi: avevate mai pensato che il lago di Nemi fosse un cratere?"
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Quiescente vuol dire…"
    punti:
      - "Il vulcano non è in eruzione, ma non è spento."
      - "La sua ultima fase eruttiva risale a circa 36.000 anni fa."
      - "Ha ancora attività: piccole scosse, suolo che si alza, gas."
    nota: "Spiega la parola «quiescente»: un vulcano che riposa. Per i Colli Albani il Dipartimento della Protezione Civile non ha definito livelli di allerta, che esistono per Vesuvio, Campi Flegrei, Etna, Stromboli e Vulcano."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Chi lo sorveglia"
    punti:
      - "Lo sorveglia l'INGV, Istituto Nazionale di Geofisica e Vulcanologia."
      - "Misura le scosse, i movimenti del suolo e i gas."
      - "Le notizie giuste arrivano dall'INGV, non dai social."
    nota: "Nessuna fonte ufficiale consultata indica una ripresa eruttiva imminente: il vulcano è sorvegliato proprio perché non è estinto. Chiedi come si riconosce una notizia falsa."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Che cosa succede oggi"
    punti:
      - "Ci sono piccole scosse di terremoto, spesso a sciami."
      - "Dal sottosuolo esce gas, soprattutto anidride carbonica."
      - "Genzano è in zona sismica 2, sottozona 2B."
    nota: "Sono i due fenomeni che il cittadino può incontrare davvero. Le scosse del Vulcano Laziale sono di solito di bassa magnitudo, ma vanno prese sul serio."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Un gas che non si vede"
    punti:
      - "L'anidride carbonica non ha colore e non ha odore."
      - "È più pesante dell'aria e si ferma in basso."
      - "In un luogo chiuso toglie l'ossigeno e può soffocare."
    nota: "Racconta che a Cava dei Selci, nel Comune di Marino, il gas ha ucciso animali e, nel 2000, una persona. Genzano non è fra i principali punti di emissione, ma la prudenza vale per tutti i Castelli."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Dove si accumula"
    punti:
      - "Nelle cantine e negli scantinati poco aerati."
      - "Nei pozzi, nei fossi profondi e nelle buche del terreno."
      - "All'aperto, dove l'aria si muove, non è un problema."
    pittogramma: "arasaac/pericolo"
    nota: "Un segnale da notare sono animali morti senza motivo in una stessa zona bassa, o macchie di piante secche in mezzo al verde. Chiedi chi ha una cantina o un garage interrato."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Le buone abitudini"
    punti:
      - "Le cantine chiuse da tempo si aerano prima di entrarci."
      - "Non entrare mai in un pozzo."
      - "Le cantine non aerate restano chiuse a bambini e animali."
    pittogramma: "arasaac/aprire-finestra"
    nota: "In un pozzo il pericolo può essere un gas, non solo l'acqua: ci entra solo personale specializzato con gli strumenti di misura. Anche caldaie e scaldabagni a gas vanno tenuti ben ventilati."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Se ti manca l'aria"
    punti:
      - "In un luogo chiuso ti gira la testa o manca l'aria? Esci subito."
      - "Non tornare indietro a controllare."
      - "Avvisa un adulto e chiamate il 112."
    pittogramma: "arasaac/uscire"
    nota: "Al 112 si dice «sospetto di gas in spazio confinato». Se in casa senti un odore strano, apri le finestre ed esci: potrebbe essere monossido di carbonio di una caldaia, anche quello pericoloso."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Non entrare a soccorrere"
    punti:
      - "Se qualcuno è svenuto in una cantina o in un pozzo, non entrare."
      - "Chiama il 112: arrivano i Vigili del Fuoco con gli autorespiratori."
      - "Tieni lontani i curiosi: nessuno deve entrare."
    pittogramma: "arasaac/112"
    nota: "Chi entra senza attrezzatura rischia di diventare la seconda vittima. Chiedi alla classe perché è difficile non correre ad aiutare, e perché in questo caso aiuta di più chiamare."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
  - titolo: "Se c'è una scossa"
    punti:
      - "Non correre fuori durante la scossa."
      - "Riparati sotto un tavolo robusto e proteggi la testa."
      - "Dopo, vai in un'area aperta, lontano da edifici e alberi."
    pittogramma: "arasaac/nascondersi-tavolo"
    nota: "I comportamenti sono quelli del rischio sismico: rimanda alla pagina dedicata. Fai una prova in classe: al segnale, tutti sotto il banco proteggendo la testa."
    fonte: "/rischi-prevenzione/rischio-sismico/"
  - tipo: "domanda"
    domanda: "In cantina ti gira la testa e manca l'aria. Che cosa fai?"
    punti:
      - "Resti un po' per capire che cosa succede."
      - "Esci subito all'aperto e avvisi un adulto."
      - "Scendi ancora più in basso a controllare."
    nota: "La risposta giusta è la seconda. La CO₂ non si vede e non si sente, e si accumula in basso: restare o scendere fa respirare ancora meno ossigeno."
    fonte: "/rischi-prevenzione/rischio-vulcanico/"
ricorda:
  - "Se in un luogo chiuso ti manca l'aria, esci e chiama il 112."
  - "Il vulcano dei Colli Albani è quiescente e sorvegliato dall'INGV."
  - "Non entrare in pozzi o in cantine chiuse senza aerarle."
