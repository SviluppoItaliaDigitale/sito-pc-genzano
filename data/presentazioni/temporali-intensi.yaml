# Presentazione per la classe: i temporali intensi.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-29-temporali-intensi"
tema: "temporali-intensi"
titolo: "Temporali e fulmini: come stare al sicuro"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è un temporale intenso"
    punti:
      - "Porta pioggia forte, fulmini, grandine e raffiche di vento."
      - "Si forma in pochi minuti e lascia poco tempo per ripararsi."
      - "Capita soprattutto tra maggio e ottobre."
    pittogramma: "arasaac/temporale"
    nota: "Chiedi alla classe chi ha visto un temporale arrivare all'improvviso, magari durante una partita o una gita. Che cosa avete fatto?"
    fonte: "/rischi-prevenzione/temporali-intensi/"
  - titolo: "Perché qui, ai Castelli Romani"
    punti:
      - "Colline e laghi vulcanici favoriscono temporali violenti."
      - "Genzano sta su pendii ripidi: l'acqua scende veloce."
      - "Su asfalto e tetti la pioggia non filtra e corre in strada."
    pittogramma: "arasaac/pioggia"
    nota: "Genzano sta sul bordo di un antico cratere e si affaccia sul lago di Nemi. Fai notare che le zone più basse del paese sono quelle dove l'acqua si raccoglie: sottopassi, cantine, garage."
    fonte: "/rischi-prevenzione/temporali-intensi/"
  - titolo: "Prima: informati e prepara"
    punti:
      - "Guarda le previsioni e l'allerta del giorno."
      - "Se il cielo si fa scuro, cambia programma."
      - "Libera dalle foglie tombini e caditoie vicino casa."
    pittogramma: "arasaac/informazione"
    nota: "L'allerta della Regione Lazio vale per un'area vasta: Genzano è nella zona di allerta F. Nessuna previsione sa dire in anticipo l'ora e la strada esatta di un temporale: per questo conta anche quello che vedi."
    fonte: "/rischi-prevenzione/temporali-intensi/"
  - titolo: "I colori dell'allerta"
    punti:
      - "Giallo: criticità ordinaria."
      - "Arancione: criticità moderata."
      - "Rosso: criticità elevata."
    nota: "Il colore lo decide il Centro Funzionale della Regione Lazio. Anche con il giallo sono possibili allagamenti, smottamenti e disagi alla circolazione: non vuol dire «non è niente»."
    fonte: "/allerte-meteo/"
  - titolo: "Se senti il tuono"
    punti:
      - "Se senti il tuono, anche lontano, sei già in pericolo."
      - "Il temporale è a pochi chilometri da te."
      - "Raggiungi subito un luogo chiuso."
    pittogramma: "arasaac/fulmine"
    nota: "Chiedi: dove andreste adesso, se sentiste un tuono durante l'intervallo in cortile? Fai indicare il posto chiuso più vicino."
    fonte: "/comunicazioni/2026-11-12-temporali-fulmini-video-3d/"
  - titolo: "Il riparo giusto"
    punti:
      - "Entra in un edificio solido."
      - "Se non c'è, va bene l'auto con porte e finestrini chiusi."
      - "Tettoie, gazebo e balconi non riparano."
    pittogramma: "arasaac/casa"
    nota: "Molti pensano che una tettoia o un gazebo bastino. Spiega che riparano dalla pioggia, non dal fulmine: serve un edificio o un'auto con porte e finestrini chiusi."
    fonte: "/comunicazioni/2026-11-12-temporali-fulmini-video-3d/"
  - titolo: "Se sei all'aperto"
    punti:
      - "Non ripararti sotto un albero, soprattutto se è isolato."
      - "Stai lontano da pali, tralicci e recinzioni di metallo."
      - "Esci dall'acqua e allontanati da mare, lago e piscina."
    nota: "I fulmini colpiscono più spesso le cose alte e appuntite. Il metallo non attira il fulmine, ma conduce la corrente: per questo si sta lontani da recinzioni e ringhiere."
    fonte: "/comunicazioni/2026-11-12-temporali-fulmini-video-3d/"
  - titolo: "Se sei in casa"
    punti:
      - "Chiudi le finestre e stai lontano da porte e finestre."
      - "Stacca le spine di televisore e computer."
      - "Non usare il telefono fisso: il cellulare sì."
    pittogramma: "arasaac/chiudere-finestra"
    nota: "Aggiungi che doccia e piatti si rimandano a dopo il temporale. Chiedi alla classe quali apparecchi ci sono in casa da staccare."
    fonte: "/comunicazioni/2026-11-12-temporali-fulmini-video-3d/"
  - titolo: "Acqua in strada: attenzione"
    punti:
      - "Non attraversare strade allagate, né a piedi né in auto."
      - "Non scendere in cantine o garage con la pioggia forte."
      - "Se l'acqua sale, vai ai piani alti, senza ascensore."
    pittogramma: "arasaac/alluvione"
    nota: "Sotto l'acqua non si vedono buche e tombini aperti, e pochi centimetri bastano a far perdere il controllo dell'auto. Un'auto si sostituisce, una persona no."
    fonte: "/rischi-prevenzione/temporali-intensi/"
  - tipo: "domanda"
    domanda: "Arriva un temporale con i fulmini. Dove ti ripari?"
    punti:
      - "Sotto un grande albero isolato."
      - "In un edificio o in un'auto chiusa."
      - "Sotto il gazebo del giardino."
    nota: "La risposta giusta è la seconda. L'albero isolato è un bersaglio per i fulmini e il gazebo non ripara: servono un edificio o un'auto con porte e finestrini chiusi."
    fonte: "/comunicazioni/2026-11-12-temporali-fulmini-video-3d/"
  - titolo: "Dopo il temporale"
    punti:
      - "Aspetta 30 minuti dopo l'ultimo tuono prima di uscire."
      - "Stai lontano dai cavi elettrici caduti."
      - "Segnala le situazioni di pericolo al 112."
    pittogramma: "arasaac/aspettare"
    nota: "Chi è stato colpito da un fulmine non resta carico di elettricità: si può soccorrere subito, chiamando il 112. Un bambino avvisa subito un adulto."
    fonte: "/comunicazioni/2026-11-12-temporali-fulmini-video-3d/"
ricorda:
  - "In emergenza chiama il 112: uno, uno, due."
  - "Se senti il tuono, raggiungi subito un edificio o un'auto chiusa."
  - "Aspetta 30 minuti dopo l'ultimo tuono prima di uscire."
