# Presentazione per la classe: gli animali domestici in emergenza.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-29-animali-emergenza"
tema: "animali-emergenza"
titolo: "Gli animali di casa in emergenza"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Anche loro fanno parte della famiglia"
    punti:
      - "Per molte famiglie un animale è un membro della famiglia."
      - "Il Codice della Protezione Civile tutela anche gli animali."
      - "Prepararsi prima evita separazioni e ritardi."
    pittogramma: "arasaac/famiglia"
    nota: "Chiedi alla classe chi ha un animale a casa e quale. Annota alla lavagna le specie: serviranno per le slide sullo zaino e sul trasportino."
    fonte: "/formazione/kit-calamita-animali/"
  - titolo: "Portalo con te, se si può"
    punti:
      - "Se dovete lasciare casa, pensate di portare l'animale."
      - "Fatelo solo se si può fare in sicurezza."
      - "Le persone vengono prima e si seguono le autorità."
    nota: "Spiega che in una calamità prevedibile, come un'alluvione o un incendio, la famiglia decide prima come portare con sé l'animale. Le indicazioni delle autorità prevalgono sempre."
    fonte: "/formazione/kit-calamita-animali/00-guida-operatori.html"
  - titolo: "La carta d'identità dell'animale"
    punti:
      - "Scrivi nome, specie, microchip e veterinario."
      - "Aggiungi farmaci, cibo e il telefono di chi lo cura."
      - "Mettine una copia nel trasportino e una con i documenti."
    pittogramma: "arasaac/documenti"
    nota: "Stampa la scheda «Carta d'identità animale» del sito e falla compilare a casa con i genitori. Se l'animale si perde, aiuta a riconoscerlo e a riportarlo a casa."
    fonte: "/formazione/kit-calamita-animali/01-carta-identita-animale.html"
  - titolo: "Microchip e medaglietta"
    punti:
      - "Il cane deve avere il microchip ed essere registrato."
      - "Per il gatto il microchip è consigliato."
      - "Una medaglietta con nome e telefono aiuta a ritrovarlo."
    nota: "Le regole si verificano con il veterinario o con la ASL. Chiedi: il vostro animale ha la medaglietta? Che cosa c'è scritto sopra?"
    fonte: "/formazione/kit-calamita-animali/00-guida-operatori.html"
  - titolo: "La borsa pronta dell'animale"
    punti:
      - "Il suo cibo abituale, acqua e ciotole leggere."
      - "Guinzaglio, trasportino e sacchetti per le feci."
      - "I farmaci del veterinario e una coperta che conosce."
    pittogramma: "arasaac/zaino"
    nota: "La borsa sta vicino a guinzaglio e trasportino e serve per almeno 72 ore. Le quantità dipendono da specie, taglia e stagione: l'acqua per l'animale è una scorta in più, oltre a quella per le persone."
    fonte: "/formazione/kit-calamita-animali/02-checklist-kit-pet.html"
  - titolo: "Il trasportino"
    punti:
      - "Gatti, conigli e piccoli animali vanno nel trasportino."
      - "In braccio, se si spaventano, possono scappare."
      - "Abitua l'animale al trasportino un poco alla volta."
    nota: "Proponi un'idea per casa: lasciare il trasportino aperto in una stanza, con dentro una coperta e un gioco, perché l'animale lo conosca prima che serva."
    fonte: "/formazione/kit-calamita-animali/00-guida-operatori.html"
  - titolo: "Dove potrà stare"
    punti:
      - "Non tutti i centri di accoglienza accettano animali."
      - "Chiedete prima al Comune come funziona."
      - "Trovate parenti o amici lontani dal rischio che possano ospitarlo."
    nota: "Fai scrivere a ogni studente, per compito, il nome di una persona di famiglia che potrebbe ospitare l'animale per qualche giorno."
    fonte: "/formazione/kit-calamita-animali/00-guida-operatori.html"
  - titolo: "Che cosa non fare mai"
    punti:
      - "Non lasciarlo legato: con l'acqua o con il fumo è in pericolo."
      - "Non abbandonarlo pensando di tornare presto."
      - "Non dargli calmanti senza la ricetta del veterinario."
    pittogramma: "arasaac/no"
    nota: "Nessuno sa quanto durerà una calamità: «torno tra poco» può diventare giorni. Diffidate anche di sconosciuti che offrono di prendere l'animale in fretta."
    fonte: "/formazione/kit-calamita-animali/00-guida-operatori.html"
  - tipo: "domanda"
    domanda: "Bisogna lasciare casa in fretta. Che cosa fai con il gatto?"
    punti:
      - "Lo prendi in braccio e corri fuori."
      - "Lo metti nel trasportino e lo porti con te."
      - "Lo lasci in casa: tanto torni presto."
    nota: "La risposta giusta è la seconda, se si può fare in sicurezza. In braccio un gatto spaventato scappa; lasciato in casa può restare solo per giorni."
    fonte: "/formazione/kit-calamita-animali/00-guida-operatori.html"
  - titolo: "Dopo l'emergenza"
    punti:
      - "Tienilo al guinzaglio o nel trasportino: potrebbe scappare."
      - "Controlla che non si sia ferito con vetri o detriti."
      - "Dagli acqua pulita e un posto tranquillo."
    nota: "Gli animali restano spaventati e disorientati anche quando l'evento è finito. Chiedi alla classe come si accorgerebbero che il proprio animale è spaventato."
    fonte: "/rischi-prevenzione/dopo-emergenza/"
  - titolo: "In pericolo, chiama il 112"
    punti:
      - "In emergenza il numero da chiamare è il 112."
      - "Il Gruppo comunale non si chiama direttamente dai cittadini."
      - "Lo attivano le autorità, come il Sindaco o la Sala operativa regionale."
    pittogramma: "arasaac/112"
    nota: "Spiega che i volontari arrivano perché il sistema li attiva. Per le segnalazioni di protezione civile non urgenti c'è l'803 555 della Sala operativa della Regione Lazio."
    fonte: "/numeri-utili/"
ricorda:
  - "In caso di pericolo chiama il 112."
  - "Prepara prima la borsa e la carta d'identità del tuo animale."
  - "Se si può fare in sicurezza, porta l'animale con te."
