# Presentazione per la classe: l'allerta meteo e i codici colore.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-03-25-allerta-meteo"
tema: "allerta-meteo"
titolo: "L'allerta meteo e i suoi colori"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è un'allerta meteo"
    punti:
      - "Indica i possibili effetti al suolo di pioggia, temporali e vento."
      - "Serve a prepararsi prima che la situazione diventi pericolosa."
      - "Non è una previsione del tempo."
    pittogramma: "arasaac/pioggia"
    nota: "Chiedi alla classe che cosa pensa voglia dire «allerta gialla». Raccogli le risposte alla lavagna e riprendile alla fine dell'ora."
    fonte: "/allerte-meteo/"
  - titolo: "Previsione e allerta sono diverse"
    punti:
      - "La previsione dice che tempo farà: pioggia, vento, temperatura."
      - "L'allerta dice che cosa può succedere al suolo."
      - "Per esempio allagamenti, frane o piene."
    pittogramma: "arasaac/temporale"
    nota: "Il colore dipende dagli effetti attesi, non solo dalla quantità di pioggia: la stessa pioggia può fare danni in un posto e non in un altro."
    fonte: "/allerte-meteo/"
  - titolo: "Chi decide il colore"
    punti:
      - "Il Centro Funzionale Regionale del Lazio emette il bollettino."
      - "Esce ogni giorno, di norma entro le 14."
      - "Genzano è nella zona di allerta F, Bacini Costieri Sud."
    nota: "Le allerte non le emettono il Gruppo comunale né il Comune: il Gruppo riporta il dato e aiuta a capirlo. Il bollettino vale per le successive 24-36 ore."
    fonte: "/allerte-meteo/"
  - titolo: "Verde: nessuna allerta"
    punti:
      - "Non sono previsti fenomeni significativi."
      - "Non vuol dire che il rischio sia nullo."
      - "È il momento giusto per preparare kit e piano familiare."
    nota: "Quando arriva l'allerta è tardi per organizzarsi: la preparazione si fa prima, con il cielo sereno."
    fonte: "/allerte-meteo/"
  - titolo: "Giallo: criticità ordinaria"
    punti:
      - "Sono possibili fenomeni localizzati, anche intensi."
      - "Non fermarti vicino a corsi d'acqua, fossi o sottopassi."
      - "Fai attenzione ad alberi e oggetti esposti al vento."
    pittogramma: "arasaac/pericolo"
    nota: "Il giallo non va sottovalutato: anche piogge moderate possono causare allagamenti localizzati. Con il giallo si segue con attenzione il bollettino."
    fonte: "/allerte-meteo/"
  - titolo: "Arancione: criticità moderata"
    punti:
      - "I fenomeni possono essere diffusi e pericolosi."
      - "Limita gli spostamenti non necessari."
      - "Tieni pronto il kit di emergenza e segui le autorità."
    pittogramma: "arasaac/zaino"
    nota: "Balconi, cantine e seminterrati si mettono in sicurezza solo se si può fare senza pericolo. Chiedi: chi in famiglia ha bisogno di una telefonata in più?"
    fonte: "/allerte-meteo/"
  - titolo: "Rosso: criticità elevata"
    punti:
      - "I fenomeni possono essere molto intensi e causare danni gravi."
      - "Non uscire se non è strettamente necessario."
      - "Stai lontano da piani interrati e strade allagate."
    pittogramma: "arasaac/casa"
    nota: "Con il rosso si seguono solo le indicazioni delle autorità e si tiene il telefono carico. Si esce solo per un'evacuazione disposta dall'autorità."
    fonte: "/allerte-meteo/"
  - tipo: "domanda"
    domanda: "Con l'allerta gialla devi restare a casa?"
    punti:
      - "Sì, sempre."
      - "No, ma fai attenzione e segui gli aggiornamenti."
      - "No, il giallo non vuol dire niente."
    nota: "La risposta giusta è la seconda. Con il giallo non serve chiudersi in casa, ma bisogna evitare le zone a rischio e seguire gli aggiornamenti ufficiali."
    fonte: "/allerte-meteo/"
  - titolo: "Che cosa fa il Comune"
    punti:
      - "Il Sindaco decide se attivare il Centro Operativo Comunale."
      - "Il COC può chiamare il Gruppo comunale per presidi e supporto."
      - "I volontari non si attivano da soli: li chiama l'autorità."
    nota: "L'attivazione del COC non è automatica: il Sindaco valuta il colore, gli effetti previsti e la situazione reale sul territorio."
    fonte: "/cosa-succede-quando-scatta-allerta/"
  - titolo: "Come ti informi"
    punti:
      - "Il colore di oggi è nella barra in cima al sito del Gruppo."
      - "Puoi seguire il canale Telegram del Gruppo."
      - "Non chiamare il 112 per chiedere informazioni sul meteo."
    pittogramma: "arasaac/informazione"
    nota: "Il 112 è per le emergenze immediate. Per segnalare un pericolo non urgente, come un tombino otturato, c'è la Sala operativa regionale, 803 555. IT-alert non manda le allerte meteo."
    fonte: "/cosa-succede-quando-scatta-allerta/"
ricorda:
  - "In emergenza chiama il 112; per il meteo usa le fonti ufficiali."
  - "Giallo, arancione e rosso: criticità ordinaria, moderata, elevata."
  - "Il colore lo decide la Regione Lazio, non il Gruppo comunale."
fonti:
