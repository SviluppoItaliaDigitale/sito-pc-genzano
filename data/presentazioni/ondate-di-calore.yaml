# Presentazione per la classe: le ondate di calore.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-14-ondate-di-calore"
tema: "ondate-di-calore"
titolo: "Il caldo intenso: come proteggersi"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (4ª e 5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è un'ondata di calore"
    punti:
      - "È un caldo molto forte che dura a lungo, per più giorni."
      - "Può mettere a rischio la salute e anche la vita."
      - "Ogni estate il Ministero della Salute la tiene sotto controllo."
    pittogramma: "arasaac/caldo"
    nota: "Chiedi alla classe: vi ricordate una giornata d'estate in cui faceva così caldo da non riuscire a dormire? Spiega che il pericolo nasce quando il caldo estremo dura a lungo."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Il caldo a Genzano"
    punti:
      - "Anche in collina, da giugno ad agosto, arrivano ondate di calore."
      - "Le temperature possono superare i 38-40 °C."
      - "Asfalto ed edifici trattengono il calore anche di mattina presto."
    nota: "Mostra la mappa termica di Roma sulla pagina del sito: il centro della città resta caldo anche all'alba. Chiedi: dove si sta più freschi d'estate, in piazza o vicino al bosco?"
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Chi rischia di più"
    punti:
      - "Gli anziani sopra i 75 anni, soprattutto se vivono soli."
      - "I bambini sotto i 4 anni."
      - "Chi ha malattie croniche e chi lavora all'aperto."
    pittogramma: "arasaac/nonno"
    nota: "Sulla pagina ci sono anche le persone senza dimora. Chiedi alla classe di pensare a chi, nella propria famiglia o nel palazzo, avrebbe bisogno di più attenzione."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Prima: informati ogni giorno"
    punti:
      - "Il Ministero della Salute pubblica bollettini ogni giorno."
      - "C'è anche il bollettino per la città di Roma."
      - "Puoi leggerlo dal telefono con l'app gratuita Caldo e Salute."
    pittogramma: "arasaac/informazione"
    nota: "Apri in classe il sito del Ministero della Salute e cerca il bollettino di Roma. Spiega che seguire le fonti ufficiali aiuta a prepararsi in tempo."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Prima: prepara la casa"
    punti:
      - "Tieni in casa una scorta d'acqua."
      - "Controlla che ventilatori e condizionatori funzionino."
      - "Con la tua famiglia, chiedi come stanno i vicini anziani."
    pittogramma: "arasaac/casa"
    nota: "La scorta d'acqua del kit di emergenza è di circa 4 litri a persona al giorno per 3 giorni. Il Piano caldo del Ministero della Salute raccomanda la rete tra vicini: una telefonata a chi vive solo è già prevenzione."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Bevi spesso"
    punti:
      - "Bevi molta acqua, anche se non hai sete."
      - "Meglio fresca, non ghiacciata, a piccoli sorsi."
      - "Evita le bevande zuccherate."
    pittogramma: "arasaac/bere-acqua"
    nota: "Spiega che la sete arriva tardi: si beve prima di sentirla. Le bevande gelate bevute in fretta e a stomaco pieno possono far stare male."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Dalle 11 alle 18 resta al fresco"
    punti:
      - "Nelle ore più calde, dalle 11 alle 18, stai al fresco o all'ombra."
      - "In quelle ore non fare sforzi fisici intensi."
      - "Abbassa le tapparelle quando entra il sole diretto."
    pittogramma: "arasaac/orologio"
    nota: "Chiedi: a che ora conviene andare al parco o fare sport d'estate? Fai notare che la mattina presto e la sera sono le ore migliori."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Vestiti leggeri e pasti leggeri"
    punti:
      - "Indossa abiti leggeri e chiari, di tessuti naturali."
      - "Usa cappello e occhiali da sole."
      - "Fai pasti leggeri, con frutta e verdura."
    nota: "Fai un gioco veloce: la classe dice quali vestiti metterebbe in valigia per una giornata di caldo intenso, e perché i colori chiari aiutano."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Mai in auto al sole"
    punti:
      - "Non lasciare mai persone o animali in un'auto parcheggiata al sole."
      - "In pochi minuti, dentro l'auto, la temperatura sale di molti gradi."
      - "Un finestrino abbassato cambia poco."
    pittogramma: "arasaac/no"
    nota: "Bambini e animali si scaldano molto più in fretta degli adulti e non possono uscire da soli. Chiedi alla classe che cosa farebbe se vedesse un cane chiuso in un'auto al sole: avvisare subito un adulto."
    fonte: "/rischi-prevenzione/idee-sbagliate/"
  - tipo: "domanda"
    domanda: "Sono le 15 di una giornata molto calda. Che cosa fai?"
    punti:
      - "Giochi a pallone in cortile, al sole."
      - "Resti al fresco e bevi acqua spesso."
      - "Bevi una bibita ghiacciata tutta d'un fiato."
    nota: "La risposta giusta è la seconda. Dalle 11 alle 18 non si fanno sforzi al sole, e l'acqua va bevuta fresca, a piccoli sorsi."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
  - titolo: "Se qualcuno sta male per il caldo"
    punti:
      - "Pelle calda e rossa, mal di testa o confusione sono segnali."
      - "Avvisa un adulto e chiamate subito il 112."
      - "Intanto portate la persona in un posto fresco."
    pittogramma: "arasaac/112"
    nota: "In attesa dei soccorsi l'adulto fa sdraiare la persona con le gambe sollevate e le mette panni umidi su fronte e collo. Nei casi più gravi si può perdere conoscenza: è il colpo di calore."
    fonte: "/rischi-prevenzione/ondate-di-calore/"
ricorda:
  - "Se qualcuno sta male per il caldo, chiama il 112."
  - "Bevi acqua spesso, anche se non hai sete."
  - "Dalle 11 alle 18 resta al fresco e non fare sforzi."
