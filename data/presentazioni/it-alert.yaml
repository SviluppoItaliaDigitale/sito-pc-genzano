# Presentazione per la classe: IT-alert.
# Testi verificati sulle pagine indicate in «fonte» di ogni slide.
# Il generatore è scripts/genera-presentazioni-lim.py: chi cambia un testo
# rigenera i file nello stesso lavoro.
file: "2026-05-29-it-alert"
tema: "it-alert"
titolo: "IT-alert, il messaggio di allarme sul telefono"
sottotitolo: "Un'ora di Educazione Civica per la classe"
fascia: "Primaria (5ª) e secondaria"
durata: "50-60 minuti"
aggiornato: "2026-11-20"
slide:
  - titolo: "Che cos'è IT-alert"
    punti:
      - "È il sistema di allarme pubblico della Protezione Civile."
      - "Manda un messaggio ai telefoni che sono in un'area in pericolo."
      - "Serve per gravi emergenze, imminenti o già in corso."
    pittogramma: "arasaac/allarme"
    nota: "Spiega che IT-alert è operativo dal 13 febbraio 2024, dopo una lunga fase di test. Chiedi alla classe: qualcuno ha già visto arrivare un messaggio così?"
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
  - titolo: "Perché serve"
    punti:
      - "In alcune emergenze ci sono solo pochi minuti per agire."
      - "TV, radio e social non raggiungono chi è in auto o fuori casa."
      - "IT-alert arriva al telefono che hai in tasca."
    pittogramma: "arasaac/urgente"
    nota: "Gli esempi della pagina sono il collasso di una grande diga e un incidente in uno stabilimento industriale. Chiedi: dove sono i ragazzi quando non guardano la TV?"
    fonte: "/comunicazioni/2026-06-11-it-alert-come-funziona-reagire/"
  - titolo: "Per quali emergenze si usa"
    punti:
      - "Incidenti nucleari o emergenze radiologiche."
      - "Incidenti in grandi stabilimenti industriali e collasso di grandi dighe."
      - "Attività vulcanica ai Campi Flegrei, al Vesuvio e a Vulcano."
    pittogramma: "arasaac/pericolo"
    nota: "Sono i quattro rischi per cui il sistema è operativo dal 13 febbraio 2024. Per il maremoto e per lo Stromboli la sperimentazione, con soli messaggi di test, continua fino al 31 dicembre 2026."
    fonte: "/comunicazioni/2026-06-11-it-alert-come-funziona-reagire/"
  - titolo: "Non serve per le allerte meteo"
    punti:
      - "IT-alert non manda le allerte gialle, arancioni o rosse."
      - "Le allerte meteo arrivano da bollettini, Regione e Comune."
      - "Nemmeno per il caldo si usa IT-alert."
    pittogramma: "arasaac/informazione"
    nota: "È un'idea sbagliata molto diffusa. Mostra la barra dell'allerta in cima al sito del Gruppo: lì si trova il colore del giorno."
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
  - titolo: "Come lo riconosci"
    punti:
      - "Il telefono fa un suono diverso dalle suonerie normali."
      - "Sul messaggio c'è scritto «IT-alert», in italiano e in inglese."
      - "Per tornare al telefono devi toccare la notifica."
    pittogramma: "arasaac/sirena"
    nota: "In modalità silenziosa il messaggio arriva lo stesso, ma il suono specifico potrebbe non partire. Il testo è anche in inglese per gli stranieri presenti in Italia."
    fonte: "/comunicazioni/2026-06-11-it-alert-come-funziona-reagire/"
  - titolo: "Non è un SMS e non è una truffa"
    punti:
      - "Parte dalle celle della rete mobile, non da un numero di telefono."
      - "Non chiede password, dati, soldi e non fa scaricare app."
      - "Un SMS o una chat che chiede dati a nome di IT-alert è una truffa."
    pittogramma: "arasaac/no"
    nota: "La tecnologia si chiama cell broadcast: il messaggio raggiunge i telefoni collegati alle celle scelte. IT-alert non conosce il numero di chi lo riceve. Una truffa si segnala alla Polizia Postale."
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
  - titolo: "Che cosa fai quando arriva"
    punti:
      - "Leggi tutto il messaggio con attenzione."
      - "Segui le indicazioni delle autorità di protezione civile."
      - "Avvisa familiari e vicini: forse non l'hanno ricevuto."
    pittogramma: "arasaac/vedere"
    nota: "Aggiungi le altre regole della pagina: segui radio, TV e canali ufficiali e non diffondere notizie non verificate. In caso di pericolo immediato si chiama il 112."
    fonte: "/comunicazioni/2026-06-11-it-alert-come-funziona-reagire/"
  - titolo: "I messaggi di prova"
    punti:
      - "Ogni tanto la Protezione Civile fa dei test, annunciati prima."
      - "Il messaggio di prova comincia con la parola «TEST»."
      - "Non c'è nessuna emergenza: non devi fare nulla."
    pittogramma: "arasaac/calendario"
    nota: "Nel Lazio il test regionale si è svolto il 27 settembre 2023. Chi era nell'area e non ha ricevuto il messaggio può segnalarlo sul sito di IT-alert entro 24 ore dall'inizio del test."
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
  - tipo: "domanda"
    domanda: "Arriva un SMS «IT-alert» che chiede la tua password. Che cos'è?"
    punti:
      - "Un messaggio vero: rispondo subito."
      - "Una truffa: non rispondo e lo dico a un adulto."
      - "Un test: scrivo la password per provare."
    nota: "La risposta giusta è la seconda. IT-alert non arriva come SMS e non chiede mai password, dati o soldi."
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
  - titolo: "Quando non arriva"
    punti:
      - "Non arriva se il telefono è spento, scarico o in modalità aereo."
      - "Non arriva senza campo della rete mobile, con il solo wi-fi."
      - "Per questo si affianca a radio, TV e canali del Comune."
    pittogramma: "arasaac/ascoltare-radio"
    nota: "Non serve installare app né cambiare impostazioni: secondo il Dipartimento lo ricevono anche i telefoni di vecchia generazione. Nessun sistema raggiunge tutti con certezza."
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
  - titolo: "IT-alert e il Gruppo comunale"
    punti:
      - "IT-alert non sostituisce gli altri canali di informazione."
      - "Le indicazioni locali arrivano da Sindaco, Polizia Locale e Comune."
      - "Serve sapere prima che cosa fare, con il piano familiare."
    pittogramma: "arasaac/famiglia"
    nota: "Collega la lezione al piano di emergenza familiare: un allarme serve se si sa già dove andare e chi chiamare."
    fonte: "/comunicazioni/2026-07-10-app-it-alert-test-nazionale/"
ricorda:
  - "In pericolo immediato chiama il 112: uno, uno, due."
  - "IT-alert: leggi tutto e segui le indicazioni delle autorità."
  - "Se un messaggio chiede password o soldi, è una truffa."
