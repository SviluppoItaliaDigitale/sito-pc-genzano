# Registro dei dati canonici del sito.
#
# Ogni voce è un dato che compare in più pagine e deve essere uguale
# dappertutto: valore ufficiale, fonte, e le varianti sbagliate già trovate
# (o prevedibili) da cercare. Lo legge scripts/check-dati-canonici.py, che
# gira su ogni pull request (validate-pr.yml) e blocca se trova una variante.
#
# Come si aggiunge un dato:
#   1. valore e fonte si prendono da una fonte primaria (INGV, DPC, ISPRA,
#      Normattiva, dataset del sito), mai a memoria;
#   2. "vietati" elenca espressioni regolari che descrivono il dato SBAGLIATO,
#      non quello giusto; "contesto" restringe la ricerca ai passaggi che
#      parlano davvero di quel soggetto (stessa finestra di caratteri);
#   3. prima del commit: python3 scripts/check-dati-canonici.py deve dare 0,
#      correggendo le pagine o, se il caso è legittimo, aggiungendo il file
#      a "escludi" con il motivo in un commento;
#   4. "stessa_frase: true" chiede che il contesto stia nella stessa frase
#      della variante, invece che entro "finestra" caratteri.
#
# Nasce il 01/10/2026: lo stesso dato sui Colli Albani compariva sul sito con
# tre valori diversi (36.000, 19.000 e «5.000 anni» di attività recente) e
# l'Osservatorio Vesuviano indicato come ente di sorveglianza.

dati:
  - id: colli-albani-ultima-eruzione
    dato: "Ultima eruzione dei Colli Albani"
    valore: "circa 36.000 anni fa"
    fonti:
      - nome: "INGV, scheda «Colli Albani»"
        url: "https://www.ingv.it/colli-albani"
      - nome: "Dipartimento della Protezione Civile, «Colli Albani»"
        url: "https://rischi.protezionecivile.gov.it/it/vulcanico/vulcani-italia/colli-albani/"
      - nome: "INGVvulcani, «Le eruzioni recenti ai Colli Albani: un mito moderno» (07/07/2020)"
        url: "https://ingvvulcani.com/2020/07/07/le-eruzioni-recenti-ai-colli-albani-un-mito-moderno/"
    vietati:
      - regex: '\b(?:5|19|20|23|30)\.?000\s+anni'
        perche: "Età diversa dai 36.000 anni dell'INGV. Le età di circa 5.000 anni venivano da datazioni su paleosuoli, smentite dall'INGV."
        contesto: 'Colli Albani|Vulcano Laziale|[Ll]ago Albano|[Ll]ago di Albano|[Ll]ago di Nemi|maar'
        finestra: 200

  - id: colli-albani-stato
    dato: "Stato di attività dei Colli Albani"
    valore: "quiescente (non spento, non estinto)"
    fonti:
      - nome: "Dipartimento della Protezione Civile, «I vulcani in Italia»"
        url: "https://rischi.protezionecivile.gov.it/it/vulcanico/vulcani-italia/"
    vietati:
      - regex: 'crateri\s+spenti|cratere\s+spento|spento\s+ma\s+(?:monitorato|sorvegliato)'
        perche: "I Colli Albani sono un vulcano quiescente: «spento» dice il contrario."
        contesto: 'Albani|Albano|Nemi|Laziale|Castelli'
        finestra: 250
      - regex: 'quiescent[ei]\s+ma\s+attiv[oaie]'
        perche: "Per il DPC gli unici vulcani attivi sono Etna e Stromboli: i Colli Albani sono quiescenti, non «quiescenti ma attivi»."
        contesto: 'Colli Albani|Vulcano Laziale|Albani|Laziale'
        finestra: 250
      - regex: '(?<!non )(?<!Non )(?<!non è )(?<!né )(?<!≠ )\bspent[oi]\b'
        perche: "I Colli Albani sono un vulcano quiescente, non spento. Vale per il vulcano e per i suoi crateri-lago."
        contesto: 'Colli Albani|Vulcano Laziale|apparato vulcanico|cratere|crateri|distretto vulcanico'
        stessa_frase: true
    escludi:
      # La Biblioteca delle idee sbagliate cita «spento» come luogo comune da
      # smentire, con la risposta «quiescente» subito sotto.
      - "content/rischi-prevenzione/idee-sbagliate.md"

  - id: colli-albani-sorveglianza
    dato: "Chi sorveglia i Colli Albani"
    valore: "INGV (rete GPS, misure di CO2 e radon, controlli sul Lago Albano)"
    fonti:
      - nome: "INGV, «Sorveglianza vulcani Colli Albani»"
        url: "https://www.ingv.it/monitoraggio-e-infrastrutture/sorveglianza/servizio-sorveglianza-vulcani-attivi/sorveglianza-vulcani-colli-albani"
    vietati:
      - regex: 'Osservatorio Vesuviano|INGV[- ]OV\b'
        perche: "L'Osservatorio Vesuviano sorveglia Vesuvio, Campi Flegrei e Ischia, non i Colli Albani."
        # Il soggetto può stare nella voce accanto dello stesso elenco
        # («nell'area»); se la frase stessa parla di altri vulcani,
        # l'attribuzione è corretta.
        contesto: 'Colli Albani|Vulcano Laziale'
        stesso_paragrafo: true
        salvo_se_frase: 'Vesuvio|Campi Flegrei|Ischia|vesuvian|campan|Etna|Etneo|Stromboli'

  - id: lago-albano-profondita
    dato: "Profondità massima del Lago Albano"
    valore: "168 m"
    fonti:
      - nome: "INGV, scheda «Colli Albani»"
        url: "https://www.ingv.it/colli-albani"
    vietati:
      - regex: '\b167(?:\s*(?:m\b|metri)|")'
        perche: "L'INGV indica 168 metri."
        contesto: 'Albano'
        finestra: 80
      - regex: '\b170\s*(?:m\b|metri)|\b(?:circa|oltre|fino\s+a|supera(?:no)?\s+i)\s+170\b'
        perche: "L'INGV indica 168 metri per il Lago Albano: 170 è un arrotondamento che nelle pagine diventava «oltre 170»."
        contesto: 'Albano'
        finestra: 80

  - id: lago-nemi-profondita
    dato: "Profondità massima del Lago di Nemi"
    valore: "33 m (quota 316 m s.l.m., superficie 1,67 km²)"
    fonti:
      - nome: "Istituto Superiore di Sanità, Rapporti ISTISAN 07/8, «Le acque del Parco Naturale Regionale dei Castelli Romani» (2007)"
        url: "https://www.iss.it/documents/20126/45616/07-8.1180687096.pdf/ea8402d3-719d-20e0-079a-1f9bc3a759ea?t=1581098399169"
    vietati:
      # Il Comune di Nemi indica 32 m e un testo di Ferri Ricchi 34 m nel corpo
      # (33 m nella didascalia): il sito segue l'ISS, fonte scientifica citata.
      - regex: '\b(?:32|34)\s*(?:m\b|metri)'
        perche: "L'ISS (Rapporti ISTISAN 07/8) indica 33 metri di profondità massima per il Lago di Nemi."
        contesto: 'Nemi'
        finestra: 80

  - id: laghi-albano-nemi-origine
    dato: "Origine dei laghi di Albano e di Nemi"
    valore: "crateri vulcanici (maar) della fase idromagmatica; la caldera è quella dell'intero vulcano"
    fonti:
      - nome: "Dipartimento della Protezione Civile, «Colli Albani — Storia eruttiva»"
        url: "https://rischi.protezionecivile.gov.it/it/vulcanico/vulcani-italia/colli-albani/"
      - nome: "ISPRA, Carta geologica d'Italia, note illustrative del foglio 388 «Velletri»"
        url: "https://progetto-carg.isprambiente.it/cartografiaCARG/index.php?source=cartageologica"
    vietati:
      - regex: '\bcaldere\s+di\s+(?:Albano|Nemi)|\bsono\s+le\s+caldere\b|[Oo]rigine\W+(?:vulcanica\W+)?(?:a\s+)?caldera'
        perche: "I laghi di Albano e di Nemi occupano crateri (maar), non caldere: la caldera è il collasso dell'intero apparato."
        contesto: 'Albano|Nemi|lago|laghi'
        finestra: 150

  - id: cava-dei-selci-area
    dato: "Area di monitoraggio del flusso di CO2 a Cava dei Selci"
    valore: "6.000 m² (area target INGV)"
    fonti:
      - nome: "INGV, «Sorveglianza vulcani Colli Albani»"
        url: "https://www.ingv.it/monitoraggio-e-infrastrutture/sorveglianza/servizio-sorveglianza-vulcani-attivi/sorveglianza-vulcani-colli-albani"
    vietati:
      - regex: '6\.?200\s*(?:m²|m2|metri\s+quadr)'
        perche: "L'INGV indica un'area target di 6.000 m² a Cava dei Selci."
        contesto: 'Cava dei Selci|degassamento'
        finestra: 250

  - id: colli-albani-sciame-1989-magnitudo
    dato: "Magnitudo massima della crisi sismica 1989-1990 dei Colli Albani"
    valore: "Md 3,9 (19 e 23 ottobre 1989, catalogo INGV); più di 3.000 scosse rilevate in circa un anno, circa 1.100 localizzate, fino a MD ~4,0 (Amato et al., 1994)"
    fonti:
      - nome: "INGV, servizio FDSN event (catalogo ISIDe, eventi 1989-1990 entro 25 km dai Colli Albani)"
        url: "https://webservices.ingv.it/fdsnws/event/1/query?starttime=1989-01-01&endtime=1990-12-31&lat=41.74&lon=12.70&maxradiuskm=25&minmag=3.0&orderby=magnitude&format=text"
      - nome: "Amato A., Chiarabba C., Cocco M., Di Bona M., Selvaggi G. (1994), «The 1989-1990 seismic swarm in the Alban Hills volcanic area, central Italy», J. Volcanol. Geotherm. Res. 61, 225-237"
        url: "https://doi.org/10.1016/0377-0273(94)90005-1"
    vietati:
      - regex: '\bM(?:agnitudo|d|L|w)?\s*(?:4[.,][1-9]|[5-9][.,]\d)|\bmagnitudo\s+(?:di\s+)?(?:4[.,][1-9]|[5-9][.,]\d)'
        perche: "La scossa più forte della crisi 1989-1990 ha Md 3,9 nel catalogo INGV (circa 4,0 nel lavoro di Amato et al.): non esiste un evento di magnitudo 4,2 del 14 aprile 1989."
        contesto: 'sciame sismic[oa]\W+(?:del\s+)?1989|crisi (?:sismica )?(?:dei )?Colli Albani\W+1989|1989\W{1,3}(?:19)?90'
        finestra: 160

  - id: colli-albani-genzano-posizione
    dato: "Posizione di Genzano rispetto al vulcano"
    valore: "Genzano sorge sul vulcano, sul bordo esterno del cratere del Lago di Nemi"
    fonti:
      - nome: "ISPRA, Carta geologica d'Italia 1:50.000, foglio 388 «Velletri» (il centro di Genzano e il Lago di Nemi cadono nel foglio)"
        url: "https://progetto-carg.isprambiente.it/cartografiaCARG/index.php?source=cartageologica"
    vietati:
      - regex: 'ai piedi (?:di un|del|dei) (?:complesso )?(?:<strong>)?(?:vulcan|Colli Albani)|alle spalle di Genzano|dietro Genzano|Genzano[^.\n]{0,40}(?:sorge|si trova|è)[^.\n]{0,20}su una caldera'
        perche: "Genzano non sta «ai piedi» o «dietro» il vulcano: sorge sull'apparato vulcanico, sul bordo del cratere di Nemi."
        contesto: 'Genzano'
        finestra: 120

  - id: numero-emergenza-112
    dato: "Numero da chiamare in emergenza nel Lazio"
    valore: "112 (NUE); i vecchi 115, 118 e 1515 non si comunicano come numeri da chiamare"
    fonti:
      - nome: "Regola del sito 06, § Numeri di emergenza; NUE 112 attivo nel Lazio dal 2017"
        url: "https://www.protezionecivilegenzano.it/numeri-utili/"
    vietati:
      - regex: '\bchiam(?:a|are|ate|ando)\s+(?:subito\s+)?(?:il\s+)?(?:115|118|1515)\b'
        perche: "Nel Lazio si chiama il 112: il cittadino deve ricordare un solo numero."
        # «Non chiamare», «Non devi chiamare», «Evita di chiamare»: la frase
        # ribadisce proprio la regola del 112.
        # Solo verbi di servizio fra la negazione e «chiama»: «Se non respira
        # chiama il 118» resta un errore.
        salvo_se_prima: '\b(?:non|mai|evita(?:re|te)?|niente)\s+(?:(?:devi|dovete|deve|si|più|di|bisogna|occorre|serve)\s+){0,2}$'
    escludi:
      # Esercizi che citano il vecchio numero per insegnare che è sbagliato:
      # il vero/falso del kit primaria, la soluzione del cruciverba e la
      # Biblioteca delle idee sbagliate (voce «si chiama il 115»).
      - "content/formazione/kit-scuola-primaria.md"
      - "static/formazione/schede-stampabili/cruciverba-secondaria2/index.html"
      - "content/rischi-prevenzione/idee-sbagliate.md"

  - id: genzano-zona-sismica
    dato: "Classificazione sismica di Genzano di Roma"
    valore: "zona sismica 2, sottozona 2B: ag tra 0,15 e 0,20 g, sismicità media"
    fonti:
      - nome: "Regione Lazio, DGR n. 387 del 22 maggio 2009, Allegato 1 «Nuova classificazione sismica del territorio della Regione Lazio»"
        url: "https://www.regione.lazio.it/sites/default/files/documentazione/AMB_DGR_387_22_05_2009_Allegato1.pdf"
    vietati:
      - regex: '\bzon[ae]\s+(?:sismic[ah]\s+)?2\s*[-–]\s*3\b|\bZ2-3\b'
        perche: "Genzano non è «al confine» fra due zone: è in zona 2, sottozona 2B."
        contesto: 'Genzano|Castelli|Colli Albani'
        finestra: 200
      - regex: '\b(?:pericolosità|sismicità|rischio)\s+medio[- ]alt[oa]\b'
        perche: "Per la Regione Lazio la sottozona 2B di Genzano è a sismicità media, non medio-alta."
        contesto: '2B|[Zz]ona\s+(?:sismica\s+)?2\b'
        stessa_frase: true

  - id: terremoto-1806-genzano
    dato: "Terremoto del 26 agosto 1806 e intensità a Genzano di Roma"
    valore: "Colli Albani, Mw 5,6 (CPTI15 v4.0); intensità VIII MCS a Genzano (DBMI15 v4.0); «gravi danni con morti e feriti» (CFTI5Med). Altri terremoti dei Colli Albani a Genzano: VII nel 1892 e nel 1927, VI nel 1829 e nel 1899"
    fonti:
      - nome: "INGV, DBMI15 v4.0 (record «Genzano di Roma») e CPTI15 v4.0"
        url: "https://emidius.mi.ingv.it/CPTI15-DBMI15/"
      - nome: "INGV, CFTI5Med, terremoto del 26 agosto 1806 (Colli Albani)"
        url: "https://storing.ingv.it/cfti/cfti5/"
    vietati:
      - regex: 'Palazzo Sforza|Chiesa della (?:SS\.|Santissima) Trinit|Chiesa della Cima'
        perche: "Il CFTI5Med non cita danni a Palazzo Sforza Cesarini né alla chiesa della Trinità nel 1806: per Genzano parla di «gravi danni, con morti e feriti»."
        contesto: '1806'
        finestra: 250
      - regex: 'epicentro stimato fra Rocca di Papa e Genzano'
        perche: "L'epicentro calcolato dal CFTI5Med e dal CPTI15 è nei Colli Albani (circa 41,72 N, 12,73 E), senza una collocazione «fra Rocca di Papa e Genzano»."
        contesto: '1806'
        finestra: 250

  - id: aib-2026-grave-pericolosita
    dato: "Periodo di grave pericolosità per gli incendi boschivi a Genzano nel 2026"
    valore: "dal 17 giugno al 15 ottobre 2026 (Ordinanza sindacale n. 14 del 17/06/2026); campagna antincendio boschivo dal 15 giugno al 15 ottobre 2026. La configurazione SOUP della Sala Operativa Regionale (15 giugno–30 settembre di ogni anno) è un'altra cosa e non segna la fine dei divieti"
    fonti:
      - nome: "Comune di Genzano di Roma, Ordinanza sindacale n. 14 del 17 giugno 2026"
        url: "https://www.protezionecivilegenzano.it/area-download/normativa/Ordinanza_Sindacale_AIB_2026.pdf"
      - nome: "Regione Lazio, «Sala Operativa Regionale» (configurazione SOR/SOUP)"
        url: "https://www.regione.lazio.it/protezione-civile/sala-operativa-regionale"
    # Gli articoli del 2025 raccontano la campagna di quell'anno.
    escludi:
      - "content/comunicazioni/2025-*"
    vietati:
      - regex: '(?:\bal|\bfino\s+al|\bentro\s+il|[-–])\s*30\s+settembre'
        perche: "Nel 2026 lo stato di grave pericolosità e i divieti valgono fino al 15 ottobre: il 30 settembre chiude solo la configurazione SOUP della sala regionale."
        contesto: 'incendi|AIB|abbruc|bruciar|fuochi|pericolosit'
        stessa_frase: true
        salvo_se_frase: 'SOUP|Sala Operativa|configurazione'
      - regex: '\b1\s*(?:°\s*)?giugno\s*(?:al|[-–])\s*30\s+settembre'
        perche: "Nessuna fonte fissa al 1° giugno l'inizio del periodo AIB nel Lazio: la campagna 2026 parte il 15 giugno, l'ordinanza di Genzano il 17 giugno."
        contesto: 'incendi|AIB|boschi|fuochi'
        finestra: 200

  - id: ustione-raffreddamento
    dato: "Quanto raffreddare un'ustione termica con acqua"
    valore: "acqua corrente fresca, non gelata, per almeno 20 minuti"
    fonti:
      - nome: "Pagina canonica del sito «Emorragie, ustioni e traumi» (/formazione/primo-soccorso/emorragie-ustioni-traumi/), basata sulle Linee guida IRC"
        url: "https://www.protezionecivilegenzano.it/formazione/primo-soccorso/emorragie-ustioni-traumi/"
      - nome: "Ospedale Pediatrico Bambino Gesù, «Bambini e incidenti: cosa fare nei primi 5 minuti»"
        url: "https://www.ospedalebambinogesu.it/bambini-e-incidenti-cosa-fare-nei-primi-5-minuti-109751/"
    vietati:
      - regex: '\b(?:1|5|10|15)(?:\s*[-–]\s*(?:15|20))?\s*min(?:uti)?\b'
        perche: "Le schede e la pagina canonica indicano almeno 20 minuti di acqua corrente fresca sull'ustione."
        contesto: '[Uu]stion|[Ss]cottat|parte bruciata'
        stessa_frase: true
        salvo_se_frase: 'chimic|attendi|aspetta|riavvicin|dura|minuti di cammino|occhi'
        salvo_se_prima: '(?:primi|non tocco)\s*$'

  - id: volontari-limiti-art-39
    dato: "Giorni di impiego dei volontari con i benefici dell'art. 39 del Codice di protezione civile"
    valore: "soccorso e assistenza: 30 giorni continuativi e 90 l'anno; emergenze di rilievo nazionale, su autorizzazione del Dipartimento della protezione civile e per i casi di effettiva necessità singolarmente individuati: fino a 60 continuativi e 180 l'anno; pianificazione, esercitazioni, formazione e diffusione della cultura di protezione civile: 10 continuativi e 30 l'anno"
    fonti:
      - nome: "D.Lgs. 2 gennaio 2018, n. 1, art. 39, commi 1-3 (testo vigente su Normattiva, verificato il 07/10/2026; condizioni dell'elevazione al comma 2)"
        url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2018-01-02;1~art39"
    vietati:
      - regex: 'tetto\s+(?:annuale\s+complessivo\s+)?(?:è\s+)?di\s+\**180\s+giorni'
        perche: "180 giorni l'anno è il limite elevato per le emergenze di rilievo nazionale, non un tetto generale: nel soccorso ordinario il limite è 90 giorni l'anno."
        contesto: 'volontari|volontariato|datore di lavoro|art\. 39'
        finestra: 300
      - regex: 'ulteriori\s+\**10\s+giorni'
        perche: "Per pianificazione, esercitazioni e formazione il limite è di 10 giorni continuativi e 30 l'anno, non «ulteriori 10 giorni»."
        contesto: 'formazione|esercitazion'
        finestra: 200
      - regex: '90\s+giorni\s+annui\s+nelle\s+attività\s+ordinarie'
        perche: "30 e 90 giorni valgono per il soccorso e l'assistenza, non per le «attività ordinarie»."
        contesto: 'volontari|giorni consecutivi'
        finestra: 200

  - id: indicazioni-nazionali-curricolo
    dato: "Indicazioni nazionali per il curricolo dell'infanzia e del primo ciclo"
    valore: "D.M. 9 dicembre 2025, n. 221 (dal 2026/27, con gradualità); D.M. 254/2012 solo per le classi già avviate nel 2025/26"
    fonti:
      - nome: "Gazzetta Ufficiale, Serie Generale n. 21 del 27 gennaio 2026 (artt. 1 e 5)"
        url: "https://www.gazzettaufficiale.it/atto/serie_generale/caricaDettaglioAtto/originario?atto.dataPubblicazioneGazzetta=2026-01-27&atto.codiceRedazionale=26G00021"
    vietati:
      - regex: 'Indicazioni [Nn]azionali(?: per il [Cc]urricolo)?(?: [Ii]nfanzia)?\**\s*\(?(?:MIM, )?2012\b'
        perche: "Dal 2026/27 valgono le Indicazioni del D.M. 221/2025; il 2012 resta solo per le classi già avviate e va citato insieme al nuovo decreto."
        contesto: 'Indicazioni'
        finestra: 20
      - regex: '(?i)Indicazioni nazionali[^.;\n]{0,90}?[\s*(]2012\b(?![^.;\n]{0,30}classi)'
        nota: "Qualunque grafia: grassetti, parentesi, «Scuola dell'Infanzia** (2012)». Ammessa solo insieme alle «classi già avviate» (segnalazione nella revisione della PR #1281)."
        perche: "Dal 2026/27 valgono le Indicazioni del D.M. 221/2025; il 2012 resta solo per le classi già avviate e va citato insieme al nuovo decreto."
        contesto: 'Indicazioni'
        finestra: 20

  - id: educazione-civica-linee-guida
    dato: "Linee guida per l'insegnamento dell'educazione civica"
    valore: "D.M. 7 settembre 2024, n. 183 (sostituisce le Linee guida del D.M. 35/2020)"
    fonti:
      - nome: "Ministero dell'Istruzione e del Merito, D.M. 183/2024"
        url: "https://www.mim.gov.it/"
    vietati:
      - regex: '(?<!quelle del )(?<!guida del )D\.M\.\s*(?:n\.\s*)?35/2020'
        perche: "Le Linee guida del D.M. 35/2020 sono sostituite da quelle del D.M. 183/2024: citarle solo come superate."
        contesto: 'Linee guida|educazione civica|Educazione Civica'
        finestra: 200

  - id: norma-nis-infrastrutture
    dato: "Norma italiana sulla sicurezza informatica dei servizi essenziali"
    valore: "D.Lgs. 4 settembre 2024, n. 138 (NIS2), che ha abrogato il D.Lgs. 65/2018"
    fonti:
      - nome: "Normattiva, D.Lgs. 138/2024"
        url: "https://www.normattiva.it/eli/id/2024/10/01/24G00155/ORIGINAL"
    vietati:
      - regex: '(?<!abrogato il )D\.Lgs\.\s*65/2018'
        perche: "Il D.Lgs. 65/2018 (NIS) è abrogato dal D.Lgs. 138/2024 (NIS2)."
        contesto: 'NIS|infrastruttur|critic'
        finestra: 200

  - id: emorragie-elevazione-arto
    dato: "Elevazione dell'arto nel controllo delle emorragie di primo soccorso"
    valore: "non è più una manovra raccomandata: il capitolo 12 (Primo soccorso) delle Linee Guida RCP 2025 IRC/ERC elenca solo pressione manuale diretta, medicazione (standard o emostatica) con pressione sopra, e laccio emostatico se la pressione non basta — nessun riferimento all'elevazione dell'arto"
    fonti:
      - nome: "Italian Resuscitation Council, Linee Guida RCP 2025, Capitolo 12 — Primo soccorso, § «Controllo di un'emorragia pericolosa per la vita»"
        url: "https://www.ircouncil.it/wp-content/uploads/2026/04/CAPITOLO_12-PRIMO-SOCCORSO_15.04.2026.pdf"
    vietati:
      - regex: "(?i)solleva(?:re|)\\s+(?:l['’]arto|la parte ferita)"
        perche: "Verificato il 14/10/2026 sul capitolo 12 delle Linee Guida RCP 2025 (audit interno F17, issue #1200): l'elevazione dell'arto non è più fra le azioni raccomandate per il controllo del sanguinamento."
        contesto: "emorrag|sanguin|ferita"
        finestra: 150

  - id: fepivol-genere
    dato: "Genere grammaticale della FEPIVOL"
    valore: "femminile («la FEPIVOL», è una federazione); al maschile solo con «Coordinamento» davanti («il Coordinamento FE.PI.VOL.»)"
    fonti:
      - nome: "Indicazione del Gruppo Comunale e del coordinatore, 13/10/2026"
        url: "https://www.protezionecivilegenzano.it/chi-siamo/"
    vietati:
      - regex: '\b(?:[Ii]l|[Aa]l|[Dd]el|[Dd]al|[Nn]el|[Ss]ul|[Nn]ostro)\s+\**(?:FEPIVOL|FE\.PI\.VOL)'
        perche: "La FEPIVOL è una federazione: articolo e preposizioni al femminile («la FEPIVOL», «alla FEPIVOL»). Il maschile vale solo con «Coordinamento» davanti."
        contesto: 'FEPIVOL|FE\.PI\.VOL'
        finestra: 40

  - id: soup-denominazione
    dato: "Nome per esteso della SOUP"
    valore: "Sala Operativa Unificata Permanente (SOUP), della Regione Lazio"
    fonti:
      - nome: "Legge 21 novembre 2000, n. 353, art. 7, comma 3 («sale operative unificate permanenti (SOUP)»)"
        url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2000-11-21;353~art7"
    vietati:
      - regex: '[Ss]ala\s+[Oo]perativa\s+[Uu]nica\s+[Pp]ermanente'
        perche: "La legge 353/2000 dice «unificata», non «unica» (corretto in 13 pagine il 15/10/2026)."

  - id: perdite-idriche-reti
    dato: "Perdite idriche totali delle reti comunali di distribuzione in Italia"
    valore: "42,4% dell'acqua immessa in rete (dato 2022)"
    fonti:
      - nome: "ISTAT, «Le statistiche dell'Istat sull'acqua. Anni 2020-2023» (22 marzo 2024)"
        url: "https://www.istat.it/it/files/2024/03/Report-GMA-Anno-2024.pdf"
    vietati:
      - regex: '\bcirca\s+(?:il\s+)?\**30\s?%'
        perche: "Il dato ISTAT 2022 è 42,4%: «circa il 30%» non ha fonte (allineato il 14/10/2026)."
        contesto: 'perdit|disperd|reti'
        finestra: 160

  - id: clima-genzano-luglio
    dato: "Aumento della massima media di luglio a Genzano fra i decenni 2005-2014 e 2016-2025"
    valore: "+1,6 °C (da 26,9 a 28,5 °C), rianalisi ERA5-Land via Open-Meteo, modello era5_seamless"
    fonti:
      - nome: "Dataset del sito, clima-luglio-temperature-genzano.json"
        url: "https://www.protezionecivilegenzano.it/open-data/clima-luglio-temperature-genzano.json"
    vietati:
      # Il valore sbagliato veniva dalla serie mista (rianalisi fino al 2016,
      # modello IFS dal 2017). Le note di correzione lo citano come superato.
      - regex: '(?:2,46|2,5)\s*°C|due gradi e mezzo'
        perche: "Sulla serie omogenea ERA5-Land l'aumento è di 1,6 °C; +2,5 °C era l'effetto del cambio di modello nel 2017."
        contesto: '[Ll]uglio'
        finestra: 250
        salvo_se_frase: 'versione precedente|prima versione|risultava'

  - id: caldo-ore-piu-calde
    dato: "Ore più calde da evitare durante le ondate di calore"
    valore: "dalle 11 alle 18"
    fonti:
      - nome: "Ministero della Salute, «Ondate di calore — Dieci consigli utili» («tra le 11.00 e le 18.00», verificato il 17/10/2026)"
        url: "https://www.salute.gov.it/new/it/tema/ondate-di-calore/dieci-consigli-utili/"
      - nome: "Pagina canonica del sito «Ondate di calore»"
        url: "https://www.protezionecivilegenzano.it/rischi-prevenzione/ondate-di-calore/"
    # Nato dall'audit esterno del 17/10/2026 (R6): 11-17 compariva in
    # articoli, versioni facili, kit, giochi, libro pop-up e messaggi Telegram.
    vietati:
      # Qualunque fascia che non finisca alle 18 (11-17, 12-17, 11-16, 12-16…).
      - regex: '(?<![\d/-])\b1[0-2](?:[.:]00)?\s*(?:[-–]|alle|e\s+le)\s*1[5-7](?:[.:]00)?\b(?![\d/%-]|\s*(?:%|min|km|cm|°|anni|gradi))'
        perche: "Il Ministero della Salute indica le ore più calde dalle 11 alle 18, come la pagina «Ondate di calore»."
        contesto: '[Cc]ald|[Ss]ole|calore|ombra|fresc|ore centrali'
        finestra: 200
        salvo_se_frase: 'turn[io]|avvistament|fasce di|forno'

  - id: gas-telefoni
    dato: "Fuga di gas: quali telefoni non usare"
    valore: "nessun telefono, né fisso né cellulare, nel locale con il gas; si chiama il 112 da fuori"
    fonti:
      - nome: "Corpo nazionale dei Vigili del Fuoco, vademecum, sezione «Fuga di gas»"
        url: "https://www.vigilfuoco.it/sites/default/files/2024-07/ita_vademecum.pdf"
    # Nato dall'audit esterno del 17/10/2026 (R7): l'assistente vietava solo
    # il «telefono fisso», come se il cellulare fosse un'eccezione.
    vietati:
      - regex: 'telefono\s+fisso'
        perche: "I Vigili del Fuoco vietano telefoni fissi e cellulari nel locale con il gas: citare solo il fisso fa pensare che il cellulare vada bene."
        contesto: '\bgas\b'
        finestra: 400
        salvo_se_frase: 'cellular|smartphone|nessun telefono|qualsiasi telefono|qualunque telefono'

  - id: farmaci-scorta-giorni
    dato: "Scorta di farmaci abituali nel kit di casa"
    valore: "almeno 7 giorni; per le terapie salvavita 7-14 giorni, secondo indicazione medica"
    fonti:
      - nome: "Checklist stampabile del kit di emergenza e calcolatore della scorta del sito"
        url: "https://www.protezionecivilegenzano.it/calcolatore-scorta/"
    # Nato il 17/10/2026 dallo scanner scripts/cerca-incongruenze.py: «almeno
    # 3 giorni» nell'articolo sul kit da 72 ore e nel piano familiare, contro i
    # 7 della checklist. La scorta d'acqua e cibo è di 3 giorni, quella dei
    # farmaci no: le due cose venivano confuse.
    vietati:
      - regex: '(?:[Ff]armac|[Mm]edicin)\w*[^.\n<]{0,60}?\b(?:almeno\s+)?(?:2|3)(?:\s*[-–]\s*\d+)?\s*giorni'
        perche: "I farmaci abituali si tengono per almeno 7 giorni: i 3 giorni valgono per acqua e cibo del kit."
        contesto: '.'
        finestra: 10
        salvo_se_frase: 'provvist|viveri|acqua|cibo'


  - id: proqol-versione-ufficiale
    dato: "Uso della scala ProQOL"
    valore: "Versione ufficiale integrale, senza adattamenti dichiarati validati; non formula diagnosi."
    fonti:
      - nome: "Stamm, The Concise ProQOL Manual, seconda edizione (2010)"
        url: "https://proqol.org/proqol-manual"
      - nome: "Questionario ProQOL 5 e traduzioni ufficiali"
        url: "https://proqol.org/proqol-measure"
    vietati:
      - regex: 'Diagnosi\s*:\s*scala\s+ProQOL|ProQOL(?:-5)?\s+semplificat[oa]'
        perche: "La scala non è diagnostica; una versione semplificata non coincide con il questionario ufficiale."
      - regex: 'Validato\s+in\s+studi\s+internazionali'
        contesto: 'ProQOL'
        finestra: 250
        perche: "La validazione dello strumento originale non dimostra quella di un adattamento locale."

  - id: benessere-volontari-promesse-kit
    dato: "Promesse cliniche nei materiali per i volontari"
    valore: "Nessuna promessa di risoluzione con debriefing psicologico o validazione IFRC non documentata."
    fonti:
      - nome: "OMS, Psychological debriefing in people exposed to a recent traumatic event (2012)"
        url: "https://www.who.int/teams/mental-health-and-substance-use/treatment-care/mental-health-gap-action-programme/evidence-centre/other-significant-emotional-and-medical-unexplained-somatic-complaints/psychological-debriefing-in-people-exposed-to-a-recent-traumatic-event"
    vietati:
      - regex: 'Risolutivo\s+con\s+debriefing|Validato\s+IFRC'
        perche: "Il debriefing psicologico non va presentato come risolutivo e il promemoria non ha una validazione clinica IFRC documentata."


  - id: sostegno-psicologico-articoli
    dato: "Indicazioni sul sostegno psicologico dopo un trauma"
    valore: "Nessuna promessa di prevenzione con debriefing psicologico; la richiesta di aiuto non dipende da una soglia fissa."
    fonti:
      - nome: "OMS, raccomandazione sul debriefing psicologico (2012)"
        url: "https://www.who.int/teams/mental-health-and-substance-use/treatment-care/mental-health-gap-action-programme/evidence-centre/other-significant-emotional-and-medical-unexplained-somatic-complaints/psychological-debriefing-in-people-exposed-to-a-recent-traumatic-event"
      - nome: "CDC/NIOSH, Traumatic Incident Stress (2026)"
        url: "https://www.cdc.gov/niosh/stress/traumaticincidentstress/index.html"
    vietati:
      - regex: 'debriefing\s+psicologico\s+con\s+un\s+professionista\s+entro\s+24[-–]72\s+ore\s+previene'
        perche: "La precedente promessa di prevenzione del disturbo non è sostenuta dalla raccomandazione OMS."
      - regex: 'debriefing\s+strutturato\s+entro\s+72\s+ore'
        contesto: 'NICE|APA|psicolog|PTSD'
        finestra: 350
        perche: "Non attribuire alle linee guida una raccomandazione sistematica al debriefing psicologico."
      - regex: 'Se\s+persistono\s+oltre\s+4[-–]6\s+settimane|persistono\s+dopo\s+3[-–]4\s+settimane'
        contesto: 'aiuto|parlarne|sintomi'
        finestra: 180
        perche: "La richiesta di una valutazione non va subordinata all'attesa di queste soglie."
      - regex: 'Reazioni\s+che\s+durano\s+alcuni\s+giorni\s+sono\s+normali\s+e\s+si\s+risolvono\s+da\s+sole'
        perche: "Le reazioni e i tempi variano: non garantire una risoluzione spontanea per tutti."

  - id: acqua-corrente-persone-auto
    dato: "Quanta acqua in movimento basta a far cadere una persona o a portare via un'auto"
    valore: "circa 15 cm fanno cadere un adulto; circa 30 cm portano via la maggior parte delle auto; circa 60 cm anche fuoristrada e furgoni"
    fonti:
      - nome: "National Weather Service, «Turn Around Don't Drown» (6 inches, 12 inches, 2 feet)"
        url: "https://www.weather.gov/safety/flood-turn-around-dont-drown"
      - nome: "Dipartimento della Protezione Civile, Io non rischio — Alluvione: «anche pochi centimetri d'acqua potrebbero farti perdere il controllo del veicolo»"
        url: "https://iononrischio.protezionecivile.gov.it/it/preparati/alluvione/cosa-fare/"
    # Nato il 23/10/2026: «15 cm per spostare un'automobile», «30 cm per
    # trascinare una persona» e «20 cm per trascinare una persona» convivevano
    # in articoli, kit della primaria e due giochi. I valori si scambiavano.
    # Fra la misura e il soggetto non ci sono virgole né altre cifre: così
    # «15 cm fanno cadere una persona, mentre 30 cm portano via un'auto» passa.
    vietati:
      - regex: '\b(?:1[05]|20)\s*(?:cm|centimetri)\b[^.\n<,;:0-9]{0,60}?(?:automobil|\bauto\b|macchin|veicol)'
        perche: "Per portare via un'auto servono circa 30 cm d'acqua in corsa (NWS); 15-20 cm sono la soglia per una persona."
        contesto: 'acqua'
        finestra: 120
        stessa_frase: true
      - regex: '\b(?:30|50)\s*(?:cm|centimetri)\b[^.\n<,;:0-9]{0,60}?(?:una\s+persona|un\s+adulto|un\s+bambino)'
        perche: "Per far cadere una persona bastano circa 15 cm d'acqua che corre (NWS): 30 cm è la soglia per le auto."
        contesto: 'acqua'
        finestra: 120
        stessa_frase: true

  - id: auto-bloccata-acqua
    dato: "Che cosa fare se l'auto resta bloccata nell'acqua"
    valore: "si esce solo se l'acqua è ferma o lenta e si raggiunge un punto più alto senza entrare nella corrente; in una corrente forte si resta nell'auto e si chiama il 112; se l'acqua sale nell'abitacolo si sale sul tetto"
    fonti:
      - nome: "Ready.gov, «Floods»: «Stay inside your car if it is trapped in rapidly moving water. Get on the roof if water is rising inside the car.»"
        url: "https://www.ready.gov/floods"
    # Nato il 23/10/2026 dalla revisione della PR #1557: sei pagine, assistente
    # compreso, dicevano «abbandona l'auto» senza distinguere la corrente forte,
    # in cui uscire vuol dire entrare nell'acqua che trascina.
    # Allargato il 24/10/2026 con il video in 3D sulle alluvioni: la prima
    # versione non vedeva «Esci subito dal veicolo», «Esci subito dall'auto» e
    # «Se l'auto si ferma, esci», rimasti in quattro pagine. «Si ferma» parla
    # dell'auto, non dell'acqua: per questo l'eccezione chiede «acqua ferma».
    # Le maiuscole contano: «Esci» a inizio elenco sfuggiva alla prima versione.
    # Nella seconda forma («auto … esci») il tratto in mezzo non può contenere
    # «acqua ferma», «lenta» o «corrente»: lì la condizione giusta è dentro la
    # variante, e l'eccezione, che guarda il resto della frase, non la vedrebbe.
    vietati:
      - regex: '\b(?:[Aa]bbandon\w*|[Ee]sc[io]\w*)\s+(?:(?:subito|immediatamente)\s+)?(?:dal(?:l.)?\s*)?(?:il\s+veicolo|l.auto|la\s+macchina|auto\b|veicolo\b|macchina\b)|(?:auto|veicolo|macchina)\b(?:(?!acqua\s+(?:è\s+)?(?:ferma|lenta)|ferma\s+o\s+lenta|corrente)[^.\n<]){0,40}?\b(?:[Aa]bbandon\w*|[Ee]sci\b)'
        perche: "In una corrente forte si resta nell'auto e si chiama il 112 (Ready.gov): il consiglio di uscire va limitato all'acqua ferma o lenta."
        contesto: 'acqua|allag|alluvion'
        finestra: 150
        # «Lontano dalla corrente» non è la condizione dell'acqua ferma: la scheda
        # di secondaria diceva «abbandonalo … lontano dalla corrente» e passava
        # per quella parola (trovato il 24/10/2026).
        salvo_se_frase: '(?<!dalla )(?<!dalle )corrente|acqua\s+(?:è\s+)?(?:ferma|lenta)|ferma\s+o\s+lenta'

  - id: acqua-rubinetto-alluvione
    dato: "Quando si beve l'acqua del rubinetto durante e dopo un'alluvione"
    valore: "durante l'alluvione non si beve, perché potrebbe essere contaminata; dopo, prima di berla ci si assicura che ordinanze o avvisi del Comune non lo vietino"
    fonti:
      - nome: "Dipartimento della Protezione Civile, «Io non rischio — Alluvione: cosa fare»: «Non bere acqua dal rubinetto: potrebbe essere contaminata» (durante, in un luogo chiuso); «Prima di bere l'acqua dal rubinetto assicurati che ordinanze o avvisi comunali non lo vietino» (dopo)"
        url: "https://iononrischio.protezionecivile.gov.it/it/preparati/alluvione/cosa-fare/"
    # Nato il 24/10/2026 dalla revisione automatica della PR del video in 3D
    # sulle alluvioni: le pagine nuove dicevano, come il Dipartimento, che dopo
    # l'alluvione l'acqua del rubinetto si beve se il Comune non lo vieta;
    # altre quindici dicevano di aspettare una conferma («finché non è
    # dichiarata potabile», «fino al via libera», «aspetta che le autorità
    # dicano che si può bere») o davano come criterio l'acqua torbida, cioè
    # una regola diversa da quella ufficiale. Le varianti chiedono una parola
    # sull'acqua prima della condizione, così «non rientrare finché le autorità
    # non lo autorizzano» resta libero.
    vietati:
      - regex: '(?:rubinetto|\bbere|\bberla|potabil\w*)[^.;\n<]{0,80}?\b(?:finch[éè]|fino\s+a\s+quando|se)\s+non\s+(?:è|viene|sia|venga)\s+(?:dichiarat|certificat|riconosciut)\w*\s+(?:di\s+nuovo\s+)?(?:potabile|sicur[ao])'
        perche: "Dopo un'alluvione il Dipartimento chiede di assicurarsi che ordinanze o avvisi del Comune non vietino l'acqua del rubinetto, non di aspettare che venga dichiarata potabile."
        contesto: 'alluvion|allag|inondaz|esondaz|flash flood'
        finestra: 400
      - regex: '(?:rubinetto|\bbere|\bberla|potabil\w*)[^.;\n<]{0,80}?\b(?:finch[éè]|fino\s+a\s+quando)\s+(?:(?:le|il|un|un.|l.)\s*)?(?:autorità|Comune|Sindaco|adulto|gestore|azienda\s+idrica)\s+non\s+(?:lo\s+)?(?:conferm|dic|consent|autorizz|permett)\w*'
        perche: "Dopo un'alluvione l'acqua del rubinetto si beve se ordinanze o avvisi del Comune non lo vietano (Dipartimento della Protezione Civile): non serve aspettare una conferma."
        contesto: 'alluvion|allag|inondaz|esondaz|flash flood'
        finestra: 400
      - regex: '(?:rubinetto|\bbere|\bberla)[^.;\n<]{0,60}?\b(?:fino\s+al|prima\s+del|senza\s+il|aspett\w*\s+il)\s+(?:via\s+libera|nulla\s?osta)'
        perche: "Per l'acqua del rubinetto dopo un'alluvione il criterio del Dipartimento sono le ordinanze o gli avvisi del Comune, non un via libera da aspettare."
        contesto: 'alluvion|allag|inondaz|esondaz|flash flood'
        finestra: 400
      - regex: '\b(?:[Aa]spett|[Aa]ttend)\w*\b[^.;\n<]{0,50}?\b(?:autorità|Comune|Sindaco|adulto|gestore|comunicazioni\s+ufficiali)\b[^.;\n<]{0,60}?(?:\bbere\b|\bberla\b|potabil\w*|si\s+può\s+bere)'
        perche: "Dopo un'alluvione non si aspetta che qualcuno dichiari l'acqua bevibile: ci si assicura che ordinanze o avvisi del Comune non la vietino (Dipartimento della Protezione Civile)."
        contesto: 'alluvion|allag|inondaz|esondaz|flash flood'
        finestra: 400
      - regex: 'rubinetto\s+(?:solo\s+)?se\s+(?:è\s+)?torbid\w*'
        perche: "Anche l'acqua limpida può essere contaminata: il criterio sono le ordinanze o gli avvisi del Comune, non l'aspetto dell'acqua."
        contesto: 'alluvion|allag|inondaz|esondaz|flash flood|DOPO'
        finestra: 400

  - id: incendi-cause-naturali
    dato: "Quanti incendi boschivi hanno cause naturali in Italia"
    valore: "il 2%, secondo le stime riportate dall'ISPRA; tutti gli altri hanno origine umana, dolosa o colposa"
    fonti:
      - nome: "ISPRA, «Ecosistemi e incendi boschivi in Italia: inquadramento del problema» (cita San-Miguel-Ayanz et al., 2022)"
        url: "https://www.isprambiente.gov.it/it/attivita/Crisi-Emergenze-ambientali-e-Danno/centro-operativo-per-la-sorveglianza-ambientale/ecosistemi-ed-incendi-boschivi-in-italia/inquadramento-del-problema"
      - nome: "Dipartimento della Protezione Civile, «Incendio boschivo»: i fulmini sono «fenomeni molto rari in un tipo di clima mediterraneo come il nostro»"
        url: "https://rischi.protezionecivile.gov.it/it/incendi-boschivi/incendio-boschivo/"
    # Nato il 24/10/2026 con il video in 3D sugli incendi boschivi: il catalogo
    # dei rischi scriveva «solo l'1% circa» (dato del Corpo Forestale dello
    # Stato per il solo 2010, ripreso dal testo del DPC per i docenti) e
    # l'articolo del 20 giugno «10-15% naturali», senza una fonte. Si usa la
    # stima più recente dell'ISPRA, la stessa che dice la voce del video.
    # In Europa la quota è più alta (circa il 4%, sempre ISPRA): per questo
    # una frase che parla dell'Europa o del mondo fa eccezione.
    vietati:
      - regex: '(?<![\d,.])(?:1|[3-9]|[1-9]\d)(?:[,.]\d+)?(?:\s*[-–]\s*\d+(?:[,.]\d+)?)?\s*%(?:\s+natural|[^.\n<%0-9]{0,70}?(?:caus\w*|origin\w*)\s+(?:\w+\s+)?natural)'
        perche: "In Italia le cause naturali sono stimate al 2% degli incendi (ISPRA): l'1% era un dato del solo 2010, il 10-15% non ha fonte."
        contesto: 'incend|bosc|fuoc|AIB'
        finestra: 300
        salvo_se_frase: 'Europa|europe|mondo|mondial|global'

  - id: sarno-1998-vittime
    dato: "Vittime delle colate di fango di Sarno, 5 maggio 1998"
    valore: "159 in tutto, 137 nella sola Sarno"
    fonti:
      - nome: "Dipartimento della Protezione Civile, scheda storica «Sarno»: «Nella sola Sarno 137 persone restano uccise [...] In totale i morti sono 159»"
        url: "https://servizio-nazionale.protezionecivile.gov.it/static/92b3cddfc9a174a28f7e76c13c0cd154/sarno.pdf"
    # Nato il 24/10/2026 con il video in 3D «Come nasce un'allerta meteo»: il sito
    # scriveva 161 vittime in una dozzina di file (articolo, schede, kit, gioco) e
    # «circa 160» nel dossier sulle frane. Il CNR-IRPI ne conta 160: si usa il
    # dato del Dipartimento, che è anche quello della voce del video.
    vietati:
      - regex: '\b(?:16[01]|circa\s+160)\s+(?:vittim\w*|mort[ie]\b|persone)'
        perche: "Il Dipartimento della Protezione Civile conta 159 vittime, 137 nella sola Sarno."
        contesto: 'Sarno'
        finestra: 300
      - regex: '(?:[Vv]ittime|[Mm]orti)\s*:?\s+16[01]\b'
