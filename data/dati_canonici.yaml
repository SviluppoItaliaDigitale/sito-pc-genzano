  # Bilanci dei grandi terremoti italiani. Nati il 29/10/2026 con il video in
  # 3D «Il terremoto dalla A alla Z»: lo stesso evento compariva con numeri
  # diversi in articoli, dossier, schede, kit e giochi (Irpinia 2.914 e 2.734,
  # Friuli 989, 990, 976, 970 e 965, Messina da 80.000 a 120.000). Fanno fede le
  # schede storiche del Dipartimento della Protezione Civile; le magnitudo
  # restano quelle del catalogo INGV.
  - id: messina-1908-vittime
    dato: "Vittime del terremoto e del maremoto di Messina e Reggio Calabria, 28 dicembre 1908"
    valore: "circa 80.000, stima degli studi più recenti (il numero esatto non è mai stato accertato)"
    fonti:
      - nome: "Dipartimento della Protezione Civile, scheda storica «Il terremoto e il maremoto di Messina e Reggio Calabria»: «Enorme, ma incerto, il numero delle vittime, che studi recenti stimano attorno alle 80mila persone»"
        url: "https://servizio-nazionale.protezionecivile.gov.it/static/041316488bb4a7fdccb230dfdee0d544/terrem-calabro-messinese.pdf"
    vietati:
      - regex: '\b(?:oltre|più di|almeno)\s+(?:80\.?000|ottantamila)\s+(?:vittim\w*|mort[ie]\b|persone)'
        perche: "Il Dipartimento della Protezione Civile scrive che gli studi recenti stimano le vittime «attorno alle 80mila persone»: circa, non oltre né almeno."
        contesto: 'Messina|Reggio|1908|Stretto'
        finestra: 300
      - regex: '\b80\.?000\s*(?:[-–—]|e|a)\s*(?:100|120)\.?000\b'
        perche: "Forbice non più usata: il Dipartimento della Protezione Civile riporta la stima degli studi recenti, circa 80.000."
        contesto: 'Messina|Reggio|1908|Stretto'
        finestra: 300
      - regex: '\b(?:100|120)\.?000\s+(?:vittim\w*|mort[ie]\b|caduti)|\bcentomila\s+(?:vittim\w*|mort[ie]\b|persone|caduti)|super\w*\s+(?:le\s+)?100\.?000|arriv\w*\s+oltre\s+(?:le\s+)?100\.?000'
        perche: "Le vittime stimate dagli studi recenti sono circa 80.000 (Dipartimento della Protezione Civile), non 100.000 o più."
        contesto: 'Messina|Reggio|1908|Stretto'
        finestra: 300
      - regex: 'unita="\s*mila\+"'
        perche: "«80 mila+» presenta come minimo una stima: le vittime sono circa 80.000."
        contesto: 'Messina|Reggio|1908'
        finestra: 400

