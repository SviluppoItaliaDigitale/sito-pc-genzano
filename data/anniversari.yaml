# Calendario delle ricorrenze di protezione civile: la fonte unica.
#
# Una voce per ogni evento storico che il sito ricorda nel suo giorno
# anniversario. Lo legge scripts/check-anniversari.py, che segnala:
#   - le ricorrenze dei prossimi giorni senza un articolo in uscita proprio quel giorno;
#   - gli articoli di ricorrenza usciti o programmati in un giorno diverso da quello dell'evento;
#   - gli articoli con un evento storico nel titolo che qui non sono registrati.
#
# Campi:
#   giorni   giorno o giorni della ricorrenza, "MM-GG" (più giorni per gli eventi
#            a cavallo della notte o in due scosse ravvicinate);
#   evento   nome breve;
#   anno     anno dell'evento;
#   chiave   espressione regolare cercata nel nome del file dell'articolo
#            (senza la data davanti): riconosce l'articolo anche negli anni successivi;
#   fonte    pagina della fonte primaria su cui è verificata la data;
#   nota     facoltativa.
# Una voce senza articolo (ricorrenza da scrivere) ha comunque la «chiave» che
# avrà il suo nome file: il controllo la segnala finché l'articolo non c'è.
#
# Nato il 14/11/2026: l'articolo sul Polesine era programmato per il giorno dopo
# l'anniversario, e la tabella del piano editoriale aveva date sbagliate
# (Versilia l'8 novembre, Friuli il 26 novembre, Livorno il 20 settembre).

