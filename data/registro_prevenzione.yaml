# Registro della prevenzione — alimenta lo shortcode {{< registro-prevenzione >}}
# (pagina /registro-prevenzione/, concetto in /conoscere/oltre-il-ciclo/ e nel
# dossier /dossier/il-disastro-che-non-e-successo/).
#
# Ogni voce documenta UN evento con allerta gestito sul territorio di Genzano:
#   data_evento    giornata (o prima giornata) di validità dell'allerta (AAAA-MM-GG)
#   tipo           tipo e livello dell'allerta (es. "Allerta gialla — temporali")
#   zona           zona di allertamento, quando pertinente
#   fonte_allerta  bollettino di origine, con data e finestra di validità
#   azioni         azioni di preparazione REALMENTE documentabili (niente di più)
#   esito          esito onesto: "non risultano danni documentati sui nostri
#                  canali", MAI "nessun danno in assoluto". Se ci sono stati
#                  danni o interventi, si scrivono quelli.
#   fonte_esito    come sappiamo l'esito (storico allertamento + archivio articoli)
#   articolo       (opzionale) path interno di un articolo collegato
#   articolo_titolo (opzionale) titolo del link all'articolo
#
# REGOLA: solo voci verificabili. Ogni voce riporta nei commenti i commit del
# repository (data/allerta.json) che documentano apertura e chiusura dell'allerta.

