<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allerta meteo: cosa fare</title>
<style>
/*FONTS*/
:root{ --navy:#0a1220; --az:#2e90fa; --txt:#eef2f7; --mut:#93a1b5; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03060b;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--navy);
  transform:translate(-50%,-50%);transform-origin:50% 50%;
  font-family:'Titillium Web',system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
.render #stage{left:0;top:0;transform:none}
.layer{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.rain{position:absolute;left:0;top:0;width:1080px;height:1920px}
.m{display:block;overflow:hidden;padding:.12em 0 .22em;margin:-.12em 0 -.22em}
.i{display:block;transform:translateY(135%)}

.dark{background:var(--navy)}
.glow{position:absolute;inset:0;background:
  radial-gradient(75% 42% at 18% 24%,rgba(46,144,250,.24),rgba(46,144,250,0) 70%),
  radial-gradient(70% 40% at 95% 96%,rgba(46,144,250,.13),rgba(46,144,250,0) 70%)}
.intro{position:absolute;left:96px;top:450px;width:888px}
.eyebrow{font:700 27px/1 'Roboto Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--az);margin-bottom:38px;opacity:0}
.w1{font-weight:900;font-size:124px;line-height:1;letter-spacing:-.01em}
.w2{font-weight:900;font-size:200px;line-height:.95;letter-spacing:-.02em;color:var(--az)}
.w3{font-weight:700;font-size:96px;line-height:1.05;margin-top:18px}
.q{margin-top:40px;font-weight:600;font-size:60px;line-height:1.1;color:var(--mut)}

.lvl{background:var(--c)}
.shade{position:absolute;inset:0;background:
  radial-gradient(110% 60% at 12% 8%,rgba(255,255,255,.30),rgba(255,255,255,0) 60%),
  radial-gradient(90% 55% at 95% 100%,rgba(10,18,32,.20),rgba(10,18,32,0) 65%)}
.content{position:absolute;left:96px;top:350px;width:888px;color:var(--navy);transform-origin:50% 30%}
.card{position:relative;width:888px;height:460px;border-radius:36px;overflow:hidden;opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22)),var(--c);
  box-shadow:0 22px 50px rgba(10,18,32,.22),inset 0 0 0 3px rgba(10,18,32,.9)}
.card svg{position:absolute;inset:0;width:888px;height:460px}
.chip{display:inline-flex;align-items:center;gap:14px;margin-top:34px;background:var(--navy);color:var(--c);
  font:700 29px/1 'Roboto Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
  padding:18px 28px 18px 24px;border-radius:999px;transform-origin:0 50%;opacity:0}
.chip::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--c)}
.head{margin-top:20px;font-weight:900;font-size:90px;line-height:.98;letter-spacing:-.01em}
.acts{list-style:none;margin:30px 0 0;padding:0}
.acts li{display:flex;align-items:flex-start;gap:22px;font-size:44px;font-weight:600;line-height:1.18;margin-bottom:18px;opacity:0}
.acts li b{flex:none;width:52px;height:52px;margin-top:0;border-radius:50%;background:var(--navy);color:var(--c);
  font:700 28px/52px 'Roboto Mono',monospace;text-align:center}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.outro{position:absolute;left:96px;top:420px;width:888px}
.cap{font:700 26px/1 'Roboto Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);opacity:0}
.o1{margin-top:30px;font-weight:900;font-size:104px;line-height:1}
.o2{font-weight:900;font-size:300px;line-height:.9;letter-spacing:-.03em;color:#ef4136}
.o3{margin-top:26px;font-weight:600;font-size:50px;line-height:1.2;opacity:0}
.zone{margin-top:56px;padding:30px 36px 34px;border-radius:28px;background:rgba(46,144,250,.10);border:2px solid rgba(46,144,250,.45);opacity:0}
.zk{font:700 24px/1 'Roboto Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--az)}
.uv{display:inline-block;position:relative;margin-top:14px;font-weight:700;font-size:58px;line-height:1.25;color:var(--az)}
.uv::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:3px;background:var(--az);
  transform-origin:0 50%;transform:scaleX(var(--u,0))}
.src{margin-top:40px;font-size:27px;line-height:1.35;color:var(--mut);opacity:0}

#hud{position:absolute;left:96px;top:212px;height:72px;display:flex;align-items:center;gap:26px;padding:0 32px 0 21px;
  background:rgba(10,18,32,.94);border:2px solid rgba(255,255,255,.14);border-radius:999px;
  box-shadow:0 12px 34px rgba(10,18,32,.28);font:700 25px/1 'Roboto Mono',monospace;letter-spacing:.13em;
  text-transform:uppercase;color:var(--txt);opacity:0;z-index:10}
.dots{display:flex;gap:20px}
.dot{position:relative;width:34px;height:34px}
.dot .f{position:absolute;inset:0;border-radius:50%;background:var(--c);transform:scale(0)}
.dot .r{position:absolute;inset:-9px;border-radius:50%;border:4px solid #fff;opacity:0}
#sweep{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;visibility:hidden;z-index:5}
#pz{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 16px;border-radius:999px;
  background:rgba(0,0,0,.6);color:#fff;font:600 14px/1 system-ui,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none}
.paused #pz{opacity:1}
.render #pz{display:none}

/* ---------- formati, sottotitoli, avvio con audio (24/09/2026) ---------- */
.rain{width:100%!important;height:100%!important}
#sweep{width:100%!important;height:100%!important}
#sub{position:absolute;left:96px;right:96px;bottom:340px;z-index:11;background:rgba(10,18,32,.92);border:2px solid rgba(255,255,255,.16);
  border-radius:22px;padding:18px 26px;font-weight:600;font-size:40px;line-height:1.25;text-align:center;color:#eef2f7;opacity:0}
#avvio{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);
  color:#fff;font:700 28px system-ui;border:0;width:100%;cursor:pointer;z-index:20}
.render #avvio{display:none!important}
html[data-fmt="16x9"] #stage{width:1920px;height:1080px}
html[data-fmt="16x9"] #hud{left:120px;top:56px}
html[data-fmt="16x9"] #sub{left:160px;right:160px;bottom:34px;font-size:36px}
html[data-fmt="16x9"] .intro{left:160px;top:230px;width:1600px}
html[data-fmt="16x9"] .content{left:160px;top:180px;width:1600px}
html[data-fmt="16x9"] .card{position:absolute;right:0;top:40px;width:760px;height:394px}
html[data-fmt="16x9"] .card svg{width:100%;height:100%}
html[data-fmt="16x9"] .chip{margin-top:0}
html[data-fmt="16x9"] .head,html[data-fmt="16x9"] .acts{max-width:780px}
html[data-fmt="16x9"] .acts li{font-size:40px}
html[data-fmt="16x9"] .outro{left:160px;top:200px;width:1600px;display:grid;grid-template-columns:860px 1fr;column-gap:100px;align-items:start}
html[data-fmt="16x9"] .cap{grid-column:1;grid-row:1}
html[data-fmt="16x9"] .o1{grid-column:1;grid-row:2}
html[data-fmt="16x9"] .o2{grid-column:1;grid-row:3}
html[data-fmt="16x9"] .o3{grid-column:1;grid-row:4}
html[data-fmt="16x9"] .zone{grid-column:2;grid-row:2/4;margin-top:40px}
html[data-fmt="16x9"] .src{grid-column:2;grid-row:4;margin-top:30px}
</style>
</head>
<body>
<div id="stage">
  <div id="sub" aria-hidden="true"></div>
  <svg id="sweep" viewBox="0 0 1080 1920"><polygon/><polygon/><polygon/><polygon/></svg>
  <div id="hud"><div class="dots"></div><span>Cosa fare</span></div>
</div>
<button id="avvio" type="button">Tocca per avviare (con audio)</button>
<div id="pz">In pausa · tocca per riprendere</div>

<script>
/* =====================================================================
   CONFIG — testi, colori e tempi (puntata 2: cosa fare)
   ===================================================================== */
const CONFIG = {
  intro: {
    eyebrow: 'Protezione Civile · Genzano di Roma',
    w1: 'Allerta meteo:',
    w2: 'cosa fare',
    w3: 'dal <span style="color:#34b25a">verde</span> al <span style="color:#ef4136">rosso</span>.',
    question: 'Colore per colore.'
  },
  livelli: [
    { colore:'#34b25a', chip:'Codice verde', head:'Preparati prima', scena:'casa', durata:5.2,
      azioni:['Conosci il piano del tuo Comune.', 'Scopri se abiti in zona a rischio.', 'Tieni pronto il kit di emergenza.'] },
    { colore:'#ffcc00', chip:'Allerta gialla', head:'Informati spesso', scena:'torrente', durata:5.3,
      azioni:['Segui gli avvisi ufficiali.', 'Evita le zone che si allagano.', 'Stai lontano da fossi e torrenti.'] },
    { colore:'#ff8a00', chip:'Allerta arancione', head:'Limita gli spostamenti', scena:'sottopasso', durata:5.6,
      azioni:['Niente sottopassi, argini e ponti.', 'Non dormire nei seminterrati.', 'Proteggi i locali al piano strada.'] },
    { colore:'#ef4136', chip:'Allerta rossa', head:'Mettiti al sicuro', scena:'alluvione', durata:6.4,
      azioni:['Sali ai piani alti, mai in cantina.', 'Chiudi il gas, stacca la corrente.', 'Non usare l’auto.', 'Segui le indicazioni delle autorità.'] }
  ],
  finale: {
    cap: 'Numero unico di emergenza',
    o1: 'In emergenza chiama il',
    o2: '112',
    o3: 'E aiuta anziani e persone fragili.',
    zonaK: 'Allerte per Genzano · Zona F',
    url: 'protezionecivilegenzano.it',
    fonte: 'Fonte: Dipartimento della Protezione Civile,<br>campagna «Io non rischio»'
  },
  // sottotitoli = testo parlato (voce/testi.txt) con i numeri in cifre
  sottotitoli: ['Allerta meteo: cosa fare, dal verde al rosso. Colore per colore.',
    'Codice verde: preparati prima. Conosci il piano del tuo Comune, scopri se abiti in zona a rischio e tieni pronto il kit di emergenza.',
    'Allerta gialla: informati spesso. Segui gli avvisi ufficiali, evita le zone che si allagano e stai lontano da fossi e torrenti.',
    'Allerta arancione: limita gli spostamenti. Niente sottopassi, argini e ponti. Non dormire nei seminterrati e proteggi i locali al piano strada.', "Allerta rossa: mettiti al sicuro. Sali ai piani alti, mai in cantina. Chiudi il gas e stacca la corrente. Non usare l'auto e segui le indicazioni delle autorità.", 'In emergenza chiama il 112. E aiuta anziani e persone fragili.'],
  tempi: { intro: 2.9, finale: 5.4, wipe: .62, sweep: .95 }
};

const AZ = '46,144,250', NV = '10,18,32';
const RAIN_INTRO = { rgb:AZ, a:.30, n:90,  v:1500, len:70,  ang:12, w:3 };
const RAIN_OUT   = { rgb:AZ, a:.18, n:60,  v:1300, len:60,  ang:12, w:3 };
const RAIN = [ null,
  { rgb:NV, a:.14, n:50,  v:1250, len:55,  ang:10, w:3 },
  { rgb:NV, a:.18, n:120, v:1750, len:75,  ang:15, w:3.2 },
  { rgb:NV, a:.22, n:210, v:2300, len:100, ang:19, w:3.4 } ];

/* ============================ motore ============================ */
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.documentElement.classList.add('render');
const FMT = new URLSearchParams(location.search).get('fmt') === '16x9' ? '16x9' : '9x16';
const W = FMT === '16x9' ? 1920 : 1080, H = FMT === '16x9' ? 1080 : 1920;
document.documentElement.dataset.fmt = FMT;
const DUR = /*DUR*/[];   // durate delle frasi della voce (voce.py)
const AUDIO = /*AUDIO*/"";
const TT = CONFIG.tempi;
const BASE = [TT.intro, ...CONFIG.livelli.map(L => L.durata), TT.finale];
// con la voce ogni scena dura almeno frase + 0,45 s prima + 0,75 s dopo
const DURS = BASE.map((b, k) => DUR[k] != null ? Math.max(b, .45 + DUR[k] + .75) : b);
const START = [0]; DURS.forEach(d => START.push(START[START.length - 1] + d));
const TOTAL = START[6];                  // START[5] = inizio chiusura
window.TOTAL = TOTAL;
window.VOICE_AT = DURS.map((d, k) => DUR[k] != null ? +(START[k] + .45).toFixed(3) : null);
window.SUBS = CONFIG.sottotitoli.map((testo, k) => DUR[k] != null ?
  { da: +(START[k] + .45).toFixed(3), a: +(START[k] + .45 + DUR[k] + .2).toFixed(3), testo } : null).filter(Boolean);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (u, s, d) => clamp((u - s) / d);
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const pulse = (u, t0, up, down) => u < t0 ? 0 : (u - t0 < up ? (u - t0) / up : Math.max(0, 1 - (u - t0 - up) / down));
const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const stage = document.getElementById('stage'), sweep = document.getElementById('sweep'), hud = document.getElementById('hud');
const node = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };

/* ---------------- illustrazioni: personaggi e ambienti ---------------- */
const INK = '#0a1220', SKIN = '#f3c6a0', WATER = '#2e90fa', WHITE = '#ffffff';
const CLOUD = '<circle cx="105" cy="165" r="45"/><circle cx="160" cy="128" r="62"/><circle cx="218" cy="170" r="40"/><rect x="60" y="160" width="198" height="50" rx="25"/>';

/* personaggio: piedi in (0,0), alto circa 240 unità */
function person({ coat = WATER, pose = 'phone' } = {}) {
  const legs = `<rect x="-25" y="-88" width="21" height="88" rx="10.5" fill="${INK}"/><rect x="4" y="-88" width="21" height="88" rx="10.5" fill="${INK}"/>`;
  const body = `<rect x="-37" y="-180" width="74" height="106" rx="33" fill="${coat}"/>`;
  const head = `<circle cx="0" cy="-210" r="30" fill="${SKIN}"/>
    <path d="M-31 -212 A31 31 0 0 1 31 -212 Q17 -228 0 -224 Q-17 -228 -31 -212Z" fill="${INK}"/>
    <circle cx="-10" cy="-207" r="3.8" fill="${INK}"/><circle cx="10" cy="-207" r="3.8" fill="${INK}"/>
    <path d="M-8 -194 Q0 -188 8 -194" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const arm = d => `<path d="${d}" stroke="${coat}" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  const phone = `<g class="phone"><rect x="-4" y="-156" width="26" height="40" rx="6" fill="${INK}"/><rect x="0" y="-151" width="18" height="28" rx="3" fill="#bfe0ff"/></g>`;
  let arms = '';
  if (pose === 'phone') arms = arm('M-27 -160 Q-44 -125 -38 -96') + arm('M26 -160 Q48 -128 16 -128') + phone;
  if (pose === 'umbrella') arms =
    `<g class="umb"><line x1="-46" y1="-196" x2="-16" y2="-318" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
      <path d="M-136 -312 A120 120 0 0 1 104 -312 Q74 -296 44 -312 Q14 -296 -16 -312 Q-46 -296 -76 -312 Q-106 -296 -136 -312Z" fill="${INK}"/>
      ${arm('M-27 -160 L-46 -198')}</g>` + arm('M26 -160 Q48 -128 16 -128') + phone;
  return `<g>${legs}${body}${arms}${head}</g>`;
}
/* busto affacciato a una finestra, con il braccio che saluta */
function waver(coat) {
  return `<g><rect x="-34" y="-8" width="68" height="80" rx="30" fill="${coat}"/>
    <g class="wave"><path d="M22 4 L52 -44" stroke="${coat}" stroke-width="19" stroke-linecap="round"/><circle cx="54" cy="-48" r="11" fill="${SKIN}"/></g>
    <circle cx="0" cy="-32" r="27" fill="${SKIN}"/>
    <path d="M-28 -34 A28 28 0 0 1 28 -34 Q15 -48 0 -45 Q-15 -48 -28 -34Z" fill="${INK}"/>
    <circle cx="-9" cy="-30" r="3.5" fill="${INK}"/><circle cx="9" cy="-30" r="3.5" fill="${INK}"/>
    <ellipse cx="0" cy="-17" rx="7" ry="5" fill="${INK}"/></g>`;
}
function svgDrops(xs, y, len) {
  return `<g stroke="${INK}" stroke-width="9" stroke-linecap="round" opacity=".75">` +
    xs.map(x => `<line class="drop" x1="${x}" y1="${y}" x2="${x - len * .25}" y2="${y + len}"/>`).join('') + '</g>';
}
const wavePath = (x0, x1, y, amp, len, ph, bottom) => {
  let d = `M${x0} ${bottom} L${x0} ${y.toFixed(1)}`;
  for (let x = x0; x <= x1 + 12; x += 12) d += ` L${x} ${(y + Math.sin(x / len * 2 * Math.PI + ph) * amp).toFixed(1)}`;
  return d + ` L${x1 + 12} ${bottom} Z`;
};

const SCENES = {
  /* VERDE — a casa, con calma: controlla il piano e prepara il kit */
  casa: {
    svg: () => {
      let rays = '';
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
        rays += `<line x1="${(62 * c).toFixed(1)}" y1="${(62 * s).toFixed(1)}" x2="${(86 * c).toFixed(1)}" y2="${(86 * s).toFixed(1)}"/>`; }
      return `<svg viewBox="0 0 888 460">
        <g transform="translate(770 112)"><g class="sun"><circle r="44" fill="${INK}"/><g stroke="${INK}" stroke-width="13" stroke-linecap="round">${rays}</g></g></g>
        <g fill="${INK}">
          <rect x="470" y="250" width="120" height="170" /><polygon points="455,256 530,190 605,256"/>
          <rect x="600" y="300" width="100" height="120"/><polygon points="590,306 650,256 710,306"/>
          <rect x="712" y="330" width="80" height="90"/>
        </g>
        <g fill="#fff" opacity=".85"><rect x="492" y="280" width="30" height="34" rx="4"/><rect x="540" y="280" width="30" height="34" rx="4"/>
          <rect x="492" y="336" width="30" height="34" rx="4"/><rect x="620" y="326" width="26" height="30" rx="4"/><rect x="730" y="350" width="22" height="26" rx="4"/></g>
        <rect x="0" y="410" width="888" height="50" fill="${INK}"/>
        <g transform="translate(250 410) scale(.8)" class="breath">${person({ coat: WATER, pose: 'phone' })}</g>
        <g transform="translate(345 410)"><rect x="0" y="-78" width="70" height="78" rx="18" fill="#ff8a00" stroke="${INK}" stroke-width="6"/>
          <rect x="14" y="-46" width="42" height="24" rx="7" fill="none" stroke="${INK}" stroke-width="5"/>
          <path d="M16 -78 Q35 -104 54 -78" fill="none" stroke="${INK}" stroke-width="7"/></g>
        <g class="bubble" transform="translate(300 150)">
          <path d="M-4 0 H150 a20 20 0 0 1 20 20 V92 a20 20 0 0 1 -20 20 H40 L18 136 L20 112 H-4 a20 20 0 0 1 -20 -20 V20 a20 20 0 0 1 20 -20Z" fill="#fff" stroke="${INK}" stroke-width="5"/>
          <g stroke="#34b25a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M4 26 l9 9 l15 -17"/><path d="M4 58 l9 9 l15 -17"/><path d="M4 90 l9 9 l15 -17"/></g>
          <g stroke="${INK}" stroke-width="8" stroke-linecap="round"><line x1="44" y1="28" x2="140" y2="28"/><line x1="44" y1="60" x2="124" y2="60"/><line x1="44" y1="92" x2="132" y2="92"/></g>
        </g></svg>`;
    },
    update(R, u) {
      R.q('.sun').setAttribute('transform', `rotate(${(u * 20).toFixed(2)})`);
      const b = E.outBack(prog(u, .9, .5));
      R.q('.bubble').setAttribute('transform', `translate(300 ${(150 + Math.sin(u * 2.4) * 6).toFixed(2)}) translate(18 136) scale(${b.toFixed(4)}) translate(-18 -136)`);
      R.q('.breath').setAttribute('transform', `translate(250 410) scale(.8 ${(.8 + Math.sin(u * 3) * .006).toFixed(4)})`);
    }
  },
  /* GIALLA — sotto la pioggia con l'ombrello, arriva l'avviso sul telefono; accanto il torrente */
  torrente: {
    svg: () => `<svg viewBox="0 0 888 460">
      <g fill="${INK}" transform="translate(470 -40) scale(1.1)">${CLOUD}</g>
      <g fill="${INK}" opacity=".85" transform="translate(40 -40) scale(.75)">${CLOUD}</g>
      ${svgDrops([560, 610, 660, 710, 760, 110, 160], 200, 26)}
      <rect x="0" y="410" width="888" height="50" fill="${INK}"/>
      <path d="M520 410 Q540 404 560 412 L888 412 L888 460 L520 460Z" fill="${INK}"/>
      <path class="water" fill="${WATER}"/>
      <g transform="translate(300 410) scale(.72)" class="walker">${person({ coat: WATER, pose: 'umbrella' })}</g>
      <g class="notif" transform="translate(360 190)"><circle r="36" fill="#ff8a00" stroke="${INK}" stroke-width="6"/>
        <rect x="-5" y="-20" width="10" height="24" rx="5" fill="${INK}"/><circle cx="0" cy="15" r="6" fill="${INK}"/></g>
    </svg>`,
    update(R, u) {
      R.q('.water').setAttribute('d', wavePath(560, 888, 426 - 6 * E.inOutSine(clamp(u / 4)), 5, 90, u * 4, 470));
      const s = E.outBack(prog(u, .8, .45)) * (1 + .08 * Math.sin(u * 7));
      R.q('.notif').setAttribute('transform', `translate(400 200) scale(${s.toFixed(4)})`);
      R.q('.umb').setAttribute('transform', `rotate(${(Math.sin(u * 2.2) * 3).toFixed(2)} -30 -170)`);
    }
  },
  /* ARANCIONE — l'auto si ferma prima del sottopasso allagato, cartello di pericolo */
  sottopasso: {
    svg: () => `<svg viewBox="0 0 888 460">
      <g fill="${INK}" transform="translate(560 -95) scale(1.1)">${CLOUD}</g><g fill="${INK}" opacity=".85" transform="translate(120 -110) scale(.9)">${CLOUD}</g>
      ${svgDrops([430, 480, 530, 580, 630, 680, 730, 780], 215, 32)}
      <rect x="0" y="380" width="470" height="80" fill="${INK}"/>
      <path d="M470 380 Q520 380 540 430 L540 460 L470 460Z" fill="${INK}"/>
      <path class="water" fill="${WATER}"/>
      <rect x="560" y="236" width="340" height="36" fill="${INK}"/>
      <rect x="560" y="224" width="340" height="8" fill="${INK}"/>
      <rect x="600" y="272" width="26" height="200" fill="${INK}"/><rect x="800" y="272" width="26" height="200" fill="${INK}"/>
      <path class="water2" fill="${WATER}" opacity=".55"/>
      <g transform="translate(460 380)"><line x1="0" y1="0" x2="0" y2="-120" stroke="${INK}" stroke-width="9"/>
        <path d="M0 -206 L52 -118 L-52 -118Z" fill="#fff" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
        <rect x="-5" y="-184" width="10" height="36" rx="5" fill="${INK}"/><circle cx="0" cy="-135" r="6.5" fill="${INK}"/></g>
      <g class="car" transform="translate(110 380)">
        <path d="M18 -26 L60 -80 L185 -80 L222 -26Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
        <rect x="0" y="-34" width="270" height="44" rx="20" fill="#fff" stroke="${INK}" stroke-width="6"/>
        <path d="M44 -32 L72 -70 L118 -70 L118 -32Z" fill="#bfe0ff" stroke="${INK}" stroke-width="5"/>
        <path d="M130 -32 L130 -70 L178 -70 L206 -32Z" fill="#bfe0ff" stroke="${INK}" stroke-width="5"/>
        <circle cx="96" cy="-44" r="15" fill="${SKIN}"/><path d="M81 -46 A15 15 0 0 1 111 -46Z" fill="${INK}"/>
        <circle class="hz" cx="262" cy="-18" r="9" fill="#ffcc00"/><circle class="hz" cx="8" cy="-18" r="8" fill="#ffcc00"/>
        <circle cx="62" cy="12" r="26" fill="${INK}"/><circle cx="62" cy="12" r="9" fill="#fff"/>
        <circle cx="212" cy="12" r="26" fill="${INK}"/><circle cx="212" cy="12" r="9" fill="#fff"/>
      </g></svg>`,
    update(R, u) {
      const lvl = 402 - 26 * E.inOutSine(clamp(u / 3));
      R.q('.water').setAttribute('d', wavePath(520, 888, lvl, 6, 110, u * 3.5, 470));
      R.q('.water2').setAttribute('d', wavePath(520, 888, lvl - 8, 5, 80, -u * 2.6, 470));
      const stop = E.outCubic(prog(u, .1, 1.3));
      R.q('.car').setAttribute('transform', `translate(${(-160 + 250 * stop).toFixed(2)} 380)`);
      const on = (Math.floor(u * 3) % 2 === 0 && u > 1.3) ? 1 : .25;
      R.qa('.hz').forEach(h => h.setAttribute('opacity', on));
    }
  },
  /* ROSSA — l'acqua sale al piano terra, la famiglia è salita al piano alto e chiede aiuto */
  alluvione: {
    svg: () => `<svg viewBox="0 0 888 460">
      <g fill="${INK}" transform="translate(-60 -80) scale(1.15)">${CLOUD}</g>
      <g fill="${INK}" transform="translate(520 -95) scale(1.25)">${CLOUD}</g>
      <path class="bolt" d="M190 150 L150 232 L184 232 L162 300 L236 206 L198 206 L222 150Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
      ${svgDrops([80, 120, 300, 340, 740, 790, 840], 175, 34)}
      <rect x="0" y="420" width="888" height="40" fill="${INK}"/>
      <g>
        <rect x="330" y="176" width="330" height="244" fill="#fff" stroke="${INK}" stroke-width="7"/>
        <polygon points="306,184 495,74 684,184" fill="${INK}"/>
        <line x1="330" y1="300" x2="660" y2="300" stroke="${INK}" stroke-width="6"/>
        <rect x="372" y="200" width="118" height="84" fill="#ffd9d6" stroke="${INK}" stroke-width="6"/>
        <rect x="512" y="200" width="110" height="84" fill="#ffd9d6" stroke="${INK}" stroke-width="6"/>
        <clipPath id="w1"><rect x="375" y="203" width="112" height="78"/></clipPath>
        <clipPath id="w2"><rect x="515" y="203" width="104" height="78"/></clipPath>
        <g clip-path="url(#w1)"><g transform="translate(418 268)">${waver('#34b25a')}</g></g>
        <g clip-path="url(#w2)"><g transform="translate(566 272) scale(.8)">${waver('#8a5cf6')}</g></g>
        <rect x="372" y="330" width="70" height="90" fill="${INK}"/>
        <rect x="490" y="320" width="120" height="70" fill="#ffd9d6" stroke="${INK}" stroke-width="6"/>
      </g>
      <path class="water" fill="${WATER}" opacity=".92"/>
      <path class="water2" fill="#7cc0ff" opacity=".5"/>
      </svg>`,
    update(R, u) {
      const lvl = lerp(470, 318, E.inOutSine(prog(u, .2, 2.6)));
      R.q('.water').setAttribute('d', wavePath(-12, 888, lvl, 7, 130, u * 3, 470));
      R.q('.water2').setAttribute('d', wavePath(-12, 888, lvl + 10, 5, 90, -u * 2.2, 470));
      R.qa('.wave').forEach((w, j) => w.setAttribute('transform', `rotate(${(Math.sin(u * 7 + j) * 16).toFixed(2)} 22 4)`));
      const f = flashAt(u);
      R.q('.bolt').setAttribute('opacity', (.15 + .85 * clamp(f * 2 + (u % 1.6 < .08 ? 0 : 0))).toFixed(3));
    }
  }
};
const flashAt = u => Math.min(1, pulse(u, 1.55, .04, .14) + .7 * pulse(u, 1.74, .04, .4) + .55 * pulse(u, 3.4, .04, .35));

/* ---------------- costruzione ---------------- */
let L0, L5, lv = [], dots = [], bands = [];
function build() {
  const C = CONFIG;
  const dwrap = hud.querySelector('.dots');
  C.livelli.forEach(L => {
    const d = node(`<div class="dot" style="--c:${L.colore}"><div class="f"></div><div class="r"></div></div>`);
    dwrap.appendChild(d); dots.push({ el:d, f:d.querySelector('.f'), r:d.querySelector('.r') });
  });
  bands = [...sweep.querySelectorAll('polygon')];
  bands.forEach((b, j) => b.setAttribute('fill', C.livelli[3 - j].colore));

  const I = C.intro;
  const a = node(`<section class="layer dark"><div class="glow"></div><canvas class="rain" width="${W}" height="${H}"></canvas>
    <div class="intro"><div class="eyebrow">${I.eyebrow}</div>
      <span class="m w1"><span class="i">${I.w1}</span></span>
      <span class="m w2"><span class="i">${I.w2}</span></span>
      <span class="m w3"><span class="i">${I.w3}</span></span>
      <div class="m q"><span class="i">${I.question}</span></div></div></section>`);
  stage.insertBefore(a, sweep);
  L0 = { el:a, ctx:a.querySelector('canvas').getContext('2d'), box:a.querySelector('.intro'), eyebrow:a.querySelector('.eyebrow'),
         words:[...a.querySelectorAll('.w1 .i, .w2 .i, .w3 .i')], q:a.querySelector('.q .i') };

  C.livelli.forEach((L, k) => {
    const S = SCENES[L.scena];
    const s = node(`<section class="layer lvl" style="--c:${L.colore}"><div class="shade"></div>
      <canvas class="rain" width="${W}" height="${H}"></canvas>
      <div class="content"><div class="card">${S.svg()}</div>
        <div class="chip">${L.chip}</div>
        <div class="m head"><span class="i">${L.head}</span></div>
        <ul class="acts">${L.azioni.map((x, j) => `<li><b>${j + 1}</b><span>${x}</span></li>`).join('')}</ul>
      </div>${k === 3 ? '<div class="flash"></div>' : ''}</section>`);
    stage.insertBefore(s, sweep);
    const card = s.querySelector('.card');
    lv.push({ el:s, ctx:s.querySelector('canvas').getContext('2d'), content:s.querySelector('.content'), card, scene:S,
      R:{ q:sel => card.querySelector(sel), qa:sel => [...card.querySelectorAll(sel)] },
      drops:[...card.querySelectorAll('.drop')], chip:s.querySelector('.chip'), head:s.querySelector('.head .i'),
      acts:[...s.querySelectorAll('.acts li')], flash:s.querySelector('.flash') });
  });

  const F = C.finale;
  const o = node(`<section class="layer dark"><div class="glow"></div><canvas class="rain" width="${W}" height="${H}"></canvas>
    <div class="outro"><div class="cap">${F.cap}</div>
      <span class="m o1"><span class="i">${F.o1}</span></span>
      <span class="m o2"><span class="i">${F.o2}</span></span>
      <div class="o3">${F.o3}</div>
      <div class="zone"><div class="zk">${F.zonaK}</div><span class="uv">${F.url}</span></div>
      <div class="src">${F.fonte}</div></div></section>`);
  stage.insertBefore(o, sweep);
  L5 = { el:o, ctx:o.querySelector('canvas').getContext('2d'), cap:o.querySelector('.cap'), o1:o.querySelector('.o1 .i'),
    o2:o.querySelector('.o2 .i'), o3:o.querySelector('.o3'), zone:o.querySelector('.zone'), uv:o.querySelector('.uv'), src:o.querySelector('.src') };
}

function measure() {
  const st = stage.getBoundingClientRect(), sc = st.width / W;
  dots.forEach((d, k) => {
    const r = d.el.getBoundingClientRect();
    const x = (r.left + r.width / 2 - st.left) / sc, y = (r.top + r.height / 2 - st.top) / sc;
    Object.assign(lv[k], { ox:x, oy:y, rmax: Math.max(Math.hypot(x, y), Math.hypot(W - x, y), Math.hypot(x, H - y), Math.hypot(W - x, H - y)) + 30 });
  });
}

function reveal(el, u, s, d = .62) { const p = E.outQuart(prog(u, s, d)); el.style.transform = `translateY(${((1 - p) * 135).toFixed(2)}%)`; }
function fadeUp(el, u, s, d = .5, dist = 36) {
  const p = E.outCubic(prog(u, s, d));
  el.style.opacity = p.toFixed(3); el.style.transform = `translateY(${((1 - p) * dist).toFixed(2)}px)`;
}
function drawRain(ctx, cfg, t, seed) {
  ctx.clearRect(0, 0, W, H);
  if (!cfg) return;
  const tn = Math.tan(cfg.ang * Math.PI / 180);
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    const far = pass === 0;
    ctx.lineWidth = far ? cfg.w * .6 : cfg.w;
    ctx.strokeStyle = `rgba(${cfg.rgb},${far ? cfg.a * .55 : cfg.a})`;
    ctx.beginPath();
    const n = Math.round(cfg.n * (far ? .6 : .4));
    for (let i = 0; i < n; i++) {
      const id = i * 2 + pass + seed * 1000, h1 = hash(id), h2 = hash(id + .37), h3 = hash(id + .71);
      const sp = cfg.v * (far ? .7 : 1) * (.8 + .4 * h3), len = cfg.len * (far ? .65 : 1) * (.75 + .5 * h2), span = H + len + 240;
      const y = ((h2 * span + sp * t) % span) - len - 120;
      const x = h1 * (W + 520 + (H + 120) * tn) - 260 - (y + 120) * tn;
      ctx.moveTo(x, y); ctx.lineTo(x - len * tn, y + len);
    }
    ctx.stroke();
  }
}

function renderIntro(t) {
  const L = L0;
  if (t >= START[1] + TT.wipe) { L.el.style.visibility = 'hidden'; return; }
  L.el.style.visibility = 'visible';
  drawRain(L.ctx, RAIN_INTRO, t, 1);
  fadeUp(L.eyebrow, t, -1, .5, 26);
  L.words.forEach((w, k) => reveal(w, t, k === 0 ? -1 : -.05 + k * .22));
  reveal(L.q, t, 1.1);
  L.box.style.transform = `translateY(${(-60 * E.inOutCubic(prog(t, START[1], TT.wipe))).toFixed(2)}px)`;
}

function renderLevel(k, t) {
  const L = lv[k], s = START[k + 1], next = START[k + 2], u = t - s;
  const hideAt = next + (k < 3 ? TT.wipe : TT.sweep);
  if (t < s || t >= hideAt) { L.el.style.visibility = 'hidden'; return; }
  L.el.style.visibility = 'visible';
  const pw = prog(u, 0, TT.wipe);
  L.el.style.clipPath = pw < 1 ? `circle(${(17 + (L.rmax - 17) * E.inOutCubic(pw)).toFixed(1)}px at ${L.ox.toFixed(1)}px ${L.oy.toFixed(1)}px)` : 'none';
  drawRain(L.ctx, RAIN[k], t, k + 2);

  const pc = E.outCubic(prog(u, .1, .9)), ex = E.inOutCubic(prog(t, next, .6));
  L.content.style.transform = `translateY(${(-70 * ex).toFixed(2)}px) scale(${(1.04 - .04 * pc - .02 * ex).toFixed(4)})`;

  const pk = prog(u, .18, .6), ek = E.outBack(pk);
  L.card.style.opacity = clamp(pk * 3).toFixed(3);
  L.card.style.transform = `translateY(${((1 - ek) * 60).toFixed(2)}px) scale(${(.9 + .1 * ek).toFixed(4)})`;
  L.scene.update(L.R, u);
  const per = [0, .8, .55, .45][k];
  L.drops.forEach((d, j) => {
    const c = ((u / (per || 1)) + j * .37) % 1;
    d.setAttribute('transform', `translate(${(-c * 30 * .25).toFixed(2)} ${(c * 30).toFixed(2)})`);
    d.setAttribute('opacity', Math.sin(Math.PI * c).toFixed(3));
  });

  const pch = prog(u, .55, .45), ech = E.outBack(pch);
  L.chip.style.opacity = clamp(pch * 2.5).toFixed(3);
  L.chip.style.transform = `translateX(${((1 - ech) * -30).toFixed(2)}px) scale(${(.85 + .15 * ech).toFixed(4)})`;
  reveal(L.head, u, .65);
  L.acts.forEach((li, j) => fadeUp(li, u, 1.05 + j * .32, .5, 30));

  if (L.flash) L.flash.style.opacity = (.26 * flashAt(u)).toFixed(3);
}

function renderOutro(t) {
  const L = L5, u = t - START[5];
  if (u < 0) { L.el.style.visibility = 'hidden'; sweep.style.visibility = 'hidden'; return; }
  L.el.style.visibility = 'visible';
  const p = E.inOutCubic(clamp(u / TT.sweep));
  const K = 95, B = 92, yE = lerp(H + K + 4 * B + 10, -K - 10, p);
  if (p < 1) {
    sweep.style.visibility = 'visible';
    L.el.style.clipPath = `polygon(0px ${(yE + K).toFixed(1)}px,${W}px ${(yE - K).toFixed(1)}px,${W}px 4000px,0px 4000px)`;
    bands.forEach((b, j) => {
      const top = yE - (j + 1) * B - 1, bot = yE - j * B + 1;
      b.setAttribute('points', `0,${(top + K).toFixed(1)} ${W},${(top - K).toFixed(1)} ${W},${(bot - K).toFixed(1)} 0,${(bot + K).toFixed(1)}`);
    });
  } else { sweep.style.visibility = 'hidden'; L.el.style.clipPath = 'none'; }
  drawRain(L.ctx, RAIN_OUT, t, 7);
  fadeUp(L.cap, u, .55, .4, 20);
  reveal(L.o1, u, .7);
  reveal(L.o2, u, .85, .7);
  fadeUp(L.o3, u, 1.35, .5, 26);
  fadeUp(L.zone, u, 1.7, .55, 34);
  L.uv.style.setProperty('--u', E.outQuart(prog(u, 2.1, .5)).toFixed(4));
  fadeUp(L.src, u, 2.3, .5, 16);
}

function renderHud(t) {
  hud.style.opacity = 1;
  dots.forEach((d, k) => {
    const ph = k === 0 ? 1 : prog(t, .16 + (k - 1) * .18, .5);
    let s = ph > 0 ? E.outBack(ph) : 0;
    const a0 = START[k + 1], a1 = START[k + 2];
    const act = (t >= a0 && t < a1 + .25) ? clamp(Math.min(E.outBack(prog(t, a0, .4)), 1 - prog(t, a1, .25)), 0, 1.1) : 0;
    s *= 1 + .14 * act + .22 * Math.sin(Math.PI * prog(t, a0, .35));
    s *= 1 + .28 * Math.sin(Math.PI * prog(t, START[5] + 2.6 + k * .1, .4));
    d.f.style.transform = `scale(${s.toFixed(4)})`;
    d.r.style.opacity = clamp(act).toFixed(3);
    d.r.style.transform = `scale(${(.5 + .5 * act).toFixed(4)})`;
  });
}

function render(t) {
  t = clamp(t, 0, TOTAL);
  renderSub(t);
  renderIntro(t);
  for (let k = 0; k < 4; k++) renderLevel(k, t);
  renderOutro(t);
  renderHud(t);
}
const subEl = document.getElementById('sub');
function renderSub(t) {
  const c = window.SUBS.find(x => t >= x.da - .1 && t <= x.a);
  if (!c) { subEl.style.opacity = 0; return; }
  if (subEl.textContent !== c.testo) subEl.textContent = c.testo;
  subEl.style.opacity = Math.min(prog(t, c.da - .1, .2), 1 - prog(t, c.a - .2, .2)).toFixed(3);
}
window.renderFrame = t => { render(t); return true; };

function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
let t0 = null, paused = false, cur = 0;
function loop(now) {
  if (!paused) { if (t0 === null) t0 = now; cur = ((now - t0) / 1000) % (TOTAL + 1.2); render(cur); }
  requestAnimationFrame(loop);
}
function toggle() {
  if (window.__au && window.__auOn) { const au = window.__au; if (au.paused) au.play(); else au.pause();
    document.documentElement.classList.toggle('paused', au.paused); return; } paused = !paused; document.documentElement.classList.toggle('paused', paused); if (!paused) t0 = performance.now() - cur * 1000; }
function loopAudio() {
  const au = window.__au;
  if (au.ended) { au.currentTime = 0; au.play(); }
  render(clamp(au.currentTime, 0, TOTAL));
  requestAnimationFrame(loopAudio);
}
async function boot() {
  build();
  sweep.setAttribute('viewBox', `0 0 ${W} ${H}`);
  try {
    await Promise.all(['400 40px "Titillium Web"', '600 40px "Titillium Web"', '700 40px "Titillium Web"', '900 40px "Titillium Web"',
      '500 20px "Roboto Mono"', '700 20px "Roboto Mono"'].map(f => document.fonts.load(f)));
    await document.fonts.ready;
  } catch (e) {}
  if (!RENDER) { fit(); addEventListener('resize', fit); addEventListener('pointerdown', toggle); }
  measure(); render(0); window.__ready = true;
  if (!RENDER && AUDIO) {
    const au = window.__au = new Audio(AUDIO), b = document.getElementById('avvio');
    b.style.display = 'flex';
    b.onclick = e => { e.stopPropagation(); b.style.display = 'none'; window.__auOn = true;
      document.documentElement.classList.remove('paused'); au.play(); requestAnimationFrame(loopAudio); };
  } else if (!RENDER) requestAnimationFrame(loop);
}
boot();
</script>
</body>
