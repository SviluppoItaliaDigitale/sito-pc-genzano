<!doctype html>
<html lang="it">
<head>

<title>Le frane: riconoscerle e mettersi al sicuro</title>
<!-- frane.src.html — video 3D divulgativo «Le frane: riconoscerle e mettersi al sicuro» (Protezione Civile Genzano di
     Roma), versione con telecamera in volo della pillola 2D: stesso testo e stessa voce.
     Scritto per Alessandro Cuollo il 12/11/2026 sul modello della skill video-3d, senza codice di terzi. Si costruisce
     con costruisci.py di video-3d (three.js 0.181.2 MIT, motore 3D, impaginazione, font) e i dati rilievo (rilievo.py),
     tempi (ritmo.py) e sottotitoli (ritmo.py da parole.py). Tutto dipende solo da t: render(t) deterministico.
     Due «set» nella stessa scena 3D: il rilievo vero dei Castelli Romani (chilometri) e il plastico di un versante
     (metri: x di traverso al pendio, z verso valle, y in alto; il pendio scende da z = -16 a z = 12). -->
<!--FONT-->
<style>
  html, body { margin: 0; background: #05080f; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden;
           background: radial-gradient(ellipse at 50% 42%, #1d2d4f 0%, #111c33 48%, #0a1220 100%); }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #livello-scena { z-index: 2; }
  #velo { position: absolute; left: 0; top: 0; z-index: 3; background: #0a1220; opacity: 0; pointer-events: none; }
  .sovra { position: absolute; z-index: 30; font-family: 'Titillium Web', sans-serif; color: #eef2f7; pointer-events: none; }
  #fonte { font-weight: 400; font-size: 17px; line-height: 1.3; color: rgba(238, 242, 247, .86); white-space: pre;
           padding: 5px 12px; border-radius: 10px; background: rgba(10, 18, 32, .62); text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  #titolo { left: 96px; width: 888px; box-sizing: border-box; padding: 26px 34px 30px; border-radius: 18px;
            background: rgba(10, 18, 32, .78); border-left: 10px solid #f59e0b; }
  #titolo b { display: block; font-weight: 700; font-size: 124px; line-height: 1; letter-spacing: 2px; }
  #titolo span { display: block; margin-top: 14px; font-weight: 600; font-size: 46px; line-height: 1.15; color: #dbe5f2; }
  .luogo { font-weight: 700; font-size: 30px; letter-spacing: 2.5px; white-space: nowrap; padding: 4px 12px;
           border-radius: 8px; background: rgba(10, 18, 32, .58); text-shadow: 0 1px 2px rgba(5, 8, 15, .95); }
  .punto { position: absolute; z-index: 29; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
           background: #eef2f7; box-shadow: 0 0 0 3px rgba(10, 18, 32, .75); }
  #chiusura { left: 96px; width: 888px; text-align: center; }
  #chiusura i { display: block; font-style: normal; font-weight: 600; font-size: 54px; letter-spacing: 6px; color: #dbe5f2; }
  #chiusura b { display: inline-block; margin-top: 18px; padding: 0 56px 12px; border-radius: 28px; background: #2e90fa;
                color: #fff; font-weight: 700; font-size: 280px; line-height: 1.12; letter-spacing: 6px; }
  #sito { left: 96px; width: 888px; text-align: center; font-weight: 700; font-size: 50px; color: #eef2f7; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="livello-scena"></canvas>
  <div id="velo"></div>
  <div id="titolo" class="sovra" data-componente="titolo"><b>LE FRANE</b><span>riconoscerle e mettersi al sicuro</span></div>
  <div id="p-genzano" class="punto"></div><div id="l-genzano" class="sovra luogo" data-componente="luogo-genzano">GENZANO DI ROMA</div>
  <div id="p-nemi" class="punto"></div><div id="l-nemi" class="sovra luogo" data-componente="luogo-nemi">LAGO DI NEMI</div>
  <div id="chiusura" class="sovra" data-componente="chiusura"><i>CHIAMA IL</i><b>112</b></div>
  <div id="sito" class="sovra" data-componente="sito">protezionecivilegenzano.it</div>
  <div id="fonte" class="sovra" data-componente="fonte-3d"></div>
</div>
<script type="application/json" id="dato-rilievo">/*DATO:rilievo*/</script>
<script type="application/json" id="dato-tempi">/*DATO:tempi*/</script>
<script type="application/json" id="dato-sottotitoli">/*DATO:sottotitoli*/</script>
<!--LIBRERIE-->
<!--THREE-->
<!--MOTORE3D-->
<script>
/* ============================================================ CONFIG ============ */
const CONFIG = {
  titolo: 'Le frane: riconoscerle e mettersi al sicuro',
  ente: 'pc-genzano',
  formato: 'verticale',
  hud: ['LE FRANE', 'QUANDO SUCCEDE', 'I SEGNALI', 'NON SI FERMA', 'SPOSTATI DI LATO', 'PROTEGGITI', 'SULLA STRADA'],
  esagerazione: 2,                                   // altezze del rilievo: la nota dice di quanto
  notaRilievo: 'RILIEVO ×2 · NON IN SCALA',
  notaSchema: 'SCHEMA · NON IN SCALA',
  fonte: 'Fonte: Dipartimento della Protezione Civile, «In caso di frana»',
  luoghi: { genzano: { lat: 41.7068, lon: 12.6890 }, nemi: { lat: 41.7122, lon: 12.7022 } },
  etichette: { genzano: { lat: 41.7072, lon: 12.6905 }, nemi: { lat: 41.7112, lon: 12.6992 } },
  chiave: ['frane:', 'frana', 'piogge', 'pendii', 'ripidi,', 'crepe', 'inclinano,', 'smottamenti.', 'Comune.', 'allontanati',
           'lato,', 'alto', 'stabile.', 'rannicchiati', 'testa.', 'bordo', 'lontano,', 'avvisa', '112.'],
  modo: 'parole'
};
function dato(nome) {
  const e = document.getElementById('dato-' + nome), s = e ? e.textContent.trim() : '';
  return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s);
}
const RILIEVO = dato('rilievo');
const TEMPI = dato('tempi') || { scene: Array.from({ length: 7 }, (_, i) => ({ inizio: i * 10, durata: 10 })), totale: 70 };
const SOTT = dato('sottotitoli') || [];
// le frasi lunghe si mostrano a pezzi (frasi intere), così il sottotitolo resta su tre righe
const FRASI = [];
SOTT.forEach(f => {
  const chiave = (f.chiave || []).concat(CONFIG.chiave), P = f.parole || [];
  const parti = String(f.testo).trim().split(/\s+/);
  if (f.testo.length <= 96 || P.length !== parti.length) { FRASI.push(Object.assign({}, f, { chiave })); return; }
  let da = 0, n = 0;
  const chiudi = (a) => {
    FRASI.push({ inizio: da === 0 ? f.inizio : P[da].t0, fine: a === parti.length ? f.fine : P[a].t0 - .02,
      testo: parti.slice(da, a).join(' '), parole: P.slice(da, a), chiave });
    da = a;
  };
  for (let i = 0; i < parti.length; i++) {
    n += parti[i].length + 1;
    const fineFrase = /[.:;?!]$/.test(parti[i]) && i < parti.length - 1;
    const resto = parti.slice(i + 1).join(' ').length;
    if (fineFrase && n > 30 && resto > 20) { chiudi(i + 1); n = 0; }
  }
  if (da < parti.length) chiudi(parti.length);
});
/* ============================================================ fine CONFIG ======= */

(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const formato = CONFIG.formato, ente = CONFIG.ente;
  const L = IMP.layout(formato), W = L.W, H = L.H;
  const SC = TEMPI.scene, TOTAL = TEMPI.totale || SC[SC.length - 1].inizio + SC[SC.length - 1].durata;
  const S = i => SC[i].inizio, D = i => SC[i].durata, E = i => SC[i].inizio + SC[i].durata;
  window.TOTAL = TOTAL; window.STAGE_W = W; window.STAGE_H = H;
  document.title = CONFIG.titolo;
  const { clamp, prog, mix, ease, hash } = M3;
  const fin = M3.finestra;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const liscia = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  const esplodi = u => { u = clamp(u); return u * u * u * (u * (6 * u - 15) + 10); };   // parte e arriva piano

  /* istante di una parola detta nella scena k (dai sottotitoli), con riserva in proporzione */
  const norma = w => String(w).toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu, '');
  function parola(k, w, n = 0, riserva = 0.5) {
    const f = SOTT[k];
    if (f && f.parole) {
      let c = 0;
      for (const p of f.parole) if (norma(p.w) === norma(w)) { if (c === n) return p.t0; c++; }
    }
    return S(k) + D(k) * riserva;
  }

  /* ================================================================ TEMPI degli eventi (tutti dalla voce) */
  const T = {};
  T.cut1 = parola(0, 'Una') - .05;                 // dal rilievo al plastico
  T.frana1 = T.cut1 + .3; T.frana1d = 4.0;
  T.giro0 = T.frana1 + T.frana1d + .12; T.giro1 = E(0) - .15;   // la telecamera gira di lato per lo spaccato
  T.pioggia0 = E(0) - .7;
  T.apre = E(0) - .35; T.apred = 1.1;
  T.zuppa = S(1) + .8; T.zuppad = 2.5;
  T.cut2 = parola(1, 'Anche') - .07;               // dal plastico al rilievo
  T.genzano = parola(1, 'Genzano') - .15; T.nemi = parola(1, 'lago') - .15;
  T.crepe = parola(2, 'crepe') - .15; T.muri = parola(2, 'muri'); T.alberi = parola(2, 'alberi');
  T.inclinano = parola(2, 'inclinano'); T.smott = parola(2, 'smottamenti'); T.avvisa = parola(2, 'avvisa');
  T.frana4 = S(3) + .3; T.frana4d = 6.3;
  T.allont = parola(3, 'allontanati');
  T.spostati = parola(4, 'spostati'); T.verso = parola(4, 'verso', 1); T.non5 = parola(4, 'Non');
  T.giro5 = E(4) - 2.1;
  T.rann = parola(5, 'rannicchiati'); T.proteggi = parola(5, 'proteggi'); T.non6 = parola(5, 'Non', 1); T.cedere = parola(5, 'cedere');
  T.cut6 = T.non6 - .25;
  T.fermati = parola(6, 'fermati'); T.avvisa7 = parola(6, 'avvisa'); T.chiama = parola(6, 'chiama');
  T.carta = T.chiama + .2; T.sito = T.carta + 1.9;
  const SELVA = t => t < S(2);                      // prima parte: versante senza strada né case
  const inRilievo = t => t < T.cut1 || (t >= T.cut2 && t < S(2));

  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente, formato, hud: CONFIG.hud[0], passiHUD: SC.length, nota: CONFIG.notaRilievo });
  IMP.anteprima(stage);
  const C = IMP.ENTI[ente].colori;

  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: 32, zona: L.zona });
  const velo = document.getElementById('velo'); velo.style.width = W + 'px'; velo.style.height = H + 'px';

  /* ---------------------------------------------------------------- luci (solo per il plastico) */
  scena.add(new THREE.HemisphereLight(0xeef3ff, 0x39404e, 1.25));
  const sole = new THREE.DirectionalLight(0xfff4e6, 1.7); sole.position.set(-14, 22, 16); scena.add(sole);
  const contro = new THREE.DirectionalLight(0xb7cdf5, 0.6); contro.position.set(12, 8, -14); scena.add(contro);

  /* ---------------------------------------------------------------- materiali e aiuti */
  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 1; return t;
  }
  const tinta = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: 0.03, roughness: 0.8 }, o));
  const base = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
  const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  const cil = (r1, r2, h, mat, seg = 12) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  const texOmbra = tela(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  function ombra(rx, rz) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(rx * 2, rz * 2), base(0xffffff, { map: texOmbra, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.05; return m;
  }

  /* ================================================================ RILIEVO VERO (chilometri) */
  const ril = M3.rilievo(RILIEVO || M3.rilievoDiProva(), { esagerazione: CONFIG.esagerazione, passo: 1, laghi: RILIEVO ? [
    { nome: 'Lago Albano', lat: 41.748, lon: 12.668, profondita: 160 },
    { nome: 'Lago di Nemi', lat: CONFIG.luoghi.nemi.lat, lon: CONFIG.luoghi.nemi.lon, profondita: 30 }] : [] });
  scena.add(ril.gruppo);
  const pioggiaR = M3.particelle({ tipo: 'pioggia', numero: 2400, centro: ril.sopra(41.7098, 12.6965, 700), dimensioni: [7, 2.6, 7],
                                   vento: [-.5, .2], opacita: .5, seme: 3 });
  scena.add(pioggiaR.oggetto);

  /* ================================================================ PLASTICO DEL VERSANTE (metri) */
  const X0 = -22, X1 = 22, XT = 6, Z0 = -26, Z1 = 26, PASSO = 0.5, YB = -8;
  const NZ = Math.round((Z1 - Z0) / PASSO) + 1;
  const TERRAZZO = 5.2;
  function terrazzo(x, z) { return liscia((x - 7.5) / 4.5) * (1 - liscia((x - 17.5) / 4)) * liscia((z - .5) / 4.5) * (1 - liscia((z - 8.5) / 4.5)); }
  function h0(x, z) {
    let y = 14 * (1 - liscia((z + 16) / 28));
    const a = .34 * liscia((z + 25) / 6) * (1 - liscia((z - 8) / 3.5));
    y += a * ((M3.rumore2(x * .16 + 3, z * .16 + 7, 5) - .5) * 2 + (M3.rumore2(x * .43, z * .43, 9) - .5) * .7);
    const tz = terrazzo(x, z);
    if (tz > 0) y = mix(y, Math.max(y, TERRAZZO), tz);
    return y;
  }
  // frane: A = quella grande, CR = la zolla del ciglio che cede ancora, SM = il piccolo smottamento
  const FA = { xc: -5, hw: 6.2, zt: -12, zb: 9, depth: 2.9, adv: .7, lobo: .3 };
  const FC = { xc: -5, hw: 3.1, zt: -15.3, zb: -9.5, depth: 1.5, adv: .25, lobo: .35 };
  const FS = { xc: -9.3, hw: 1.7, zt: -4.5, zb: .8, depth: .8, adv: .3, lobo: .35 };
  const ST = { a: 0, c: 0, s: 0, bagnato: 0, fronte: 0 };       // stato del terreno al tempo t
  const eff = { dy: 0, e: 0, sc: 0 };
  function effetto(fr, x, z, s) {
    if (s <= 0) return;
    const v = (z - fr.zt) / (fr.zb - fr.zt), vc = .55 + fr.adv * s, vmax = vc + fr.lobo;
    if (v < -.04 || v > vmax + .05) return;
    const hw = fr.hw * (.74 + .34 * clamp(v)), u = (x - fr.xc) / hw, au = Math.abs(u);
    if (au >= 1) return;
    const mx = 1 - u * u;
    const dep = liscia(v / .06) * (1 - liscia((v - .28) / .42));
    const q = (v - vc) / fr.lobo, acc = Math.abs(q) < 1 ? Math.pow(1 - q * q, 1.25) : 0;
    eff.dy += s * fr.depth * (-dep * Math.pow(mx, .55) + acc * Math.pow(mx, .7) * (1 + .22 * Math.sin(v * 46 + u * 3) * liscia((1 - Math.abs(q)) / .5)));
    const e = liscia((1 - au) / .1) * liscia((v + .04) / .05) * (1 - liscia((v - vmax + .04) / .06)) * liscia((s - .05) / .12);
    if (e > eff.e) eff.e = e;
    if (e * dep > eff.sc) eff.sc = e * dep;
  }
  function campo(x, z, base0) {                                  // quota e terra smossa al tempo corrente
    eff.dy = 0; eff.e = 0; eff.sc = 0;
    effetto(FA, x, z, ST.a); effetto(FC, x, z, ST.c); effetto(FS, x, z, ST.s);
    return (base0 == null ? h0(x, z) : base0) + eff.dy;
  }
  const quotaT = (x, z) => campo(x, z);

  const plastico = new THREE.Group(); scena.add(plastico);
  const matTop = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, metalness: 0 });
  const matLato = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const PROF = [0, .4, .8, 1.2, 1.6, 2.0, 2.39, 2.41, 3.9, 5.49, 5.51];   // profondità delle righe dei fianchi (m)
  const KR = PROF.length + 2;                                               // + due righe fino al fondo
  const SUOLO = [.33, .23, .16], MEDIO = [.66, .54, .36], ROCCIA = [.47, .49, .54], ZUPPO = [.16, .27, .43];
  function pezzo(xa, xb) {
    const nx = Math.round((xb - xa) / PASSO) + 1, n = nx * NZ;
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), H0 = new Float32Array(n), RU = new Float32Array(n), RK = new Float32Array(n);
    const idx = [];
    for (let i = 0; i < NZ; i++) for (let j = 0; j < nx; j++) {
      const k = i * nx + j, x = xa + j * PASSO, z = Z0 + i * PASSO;
      pos[k * 3] = x; pos[k * 3 + 2] = z; H0[k] = h0(x, z);
      RU[k] = M3.rumore2(x * .55 + 11, z * .55 + 5, 2) * .6 + hash(k * 1.37) * .4;
      const tz = terrazzo(x, z), yb = 14 * (1 - liscia((z + 16) / 28));
      RK[k] = 0;
      if (i < NZ - 1 && j < nx - 1) idx.push(k, k + nx, k + 1, k + 1, k + nx, k + nx + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setIndex(idx);
    // fianchi: per ogni punto del bordo una colonna di righe a profondità fisse (strati netti)
    const bordo = [];
    for (let i = 0; i < NZ; i++) bordo.push([xa, Z0 + i * PASSO, 0]);
    bordo.push(null);
    for (let i = 0; i < NZ; i++) bordo.push([xb, Z0 + i * PASSO, 1]);
    bordo.push(null);
    for (let j = 0; j < nx; j++) bordo.push([xa + j * PASSO, Z0, 2]);
    bordo.push(null);
    for (let j = 0; j < nx; j++) bordo.push([xa + j * PASSO, Z1, 3]);
    const nb = bordo.length, pl = new Float32Array(nb * KR * 3), cl = new Float32Array(nb * KR * 3), il = [], HB = new Float32Array(nb);
    bordo.forEach((b, c) => {
      if (!b) return;
      HB[c] = h0(b[0], b[1]);
      for (let r = 0; r < KR; r++) { pl[(c * KR + r) * 3] = b[0]; pl[(c * KR + r) * 3 + 2] = b[1]; }
      if (c + 1 < nb && bordo[c + 1]) for (let r = 0; r < KR - 1; r++) {
        const a = c * KR + r, d = (c + 1) * KR + r;
        il.push(a, a + 1, d, d, a + 1, d + 1);
      }
    });
    const gl = new THREE.BufferGeometry();
    gl.setAttribute('position', new THREE.BufferAttribute(pl, 3)); gl.setAttribute('color', new THREE.BufferAttribute(cl, 3));
    gl.setIndex(il);
    const gruppo = new THREE.Group();
    const top = new THREE.Mesh(g, matTop), lato = new THREE.Mesh(gl, matLato);
    top.frustumCulled = lato.frustumCulled = false;
    const fondo = box(xb - xa, .4, Z1 - Z0, base(0x1c2536)); fondo.position.set((xa + xb) / 2, YB - .2, (Z0 + Z1) / 2);
    gruppo.add(top, lato, fondo); plastico.add(gruppo);
    function aggiorna() {
      for (let k = 0; k < n; k++) {
        const x = pos[k * 3], z = pos[k * 3 + 2];
        pos[k * 3 + 1] = campo(x, z, H0[k]);
        const u = RU[k], e = eff.e, rk = RK[k] * (1 - e);
        let r = mix(.30, .43, u), gg = mix(.50, .63, u), b = mix(.20, .29, u);
        r = mix(r, mix(.55, .63, u), rk); gg = mix(gg, mix(.55, .62, u), rk); b = mix(b, mix(.54, .6, u), rk);
        const sc = 1 - .28 * eff.sc;
        const zl = .82 + .36 * M3.rumore2(x * 1.3 + 2, z * .9 - ST.a * 9, 4);
        r = mix(r, mix(.47, .60, u) * sc * zl, e); gg = mix(gg, mix(.33, .42, u) * sc * zl, e); b = mix(b, mix(.21, .27, u) * sc * zl, e);
        const w = 1 - .22 * ST.bagnato;
        col[k * 3] = r * w; col[k * 3 + 1] = gg * w; col[k * 3 + 2] = b * (w + .06 * ST.bagnato);
      }
      g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
      g.computeVertexNormals();
      for (let c = 0; c < nb; c++) {
        const b = bordo[c]; if (!b) continue;
        const ys = campo(b[0], b[1], HB[c]), hb = HB[c], smossa = eff.e;
        for (let r = 0; r < KR; r++) {
          const o = (c * KR + r) * 3;
          let y, cr;
          if (r === 0) { y = ys; cr = SUOLO; }
          else if (r < PROF.length) { y = Math.min(hb - PROF[r], ys); cr = r <= 6 ? SUOLO : r <= 9 ? MEDIO : ROCCIA; }

    piede: [[-4.6, 2.3, 7.6], 12, 18, 6.6],
    smott: [[-9.3, 6.6, -1.9], -24, 30, 4.8],
    alto: [[-.5, 2.5, 5.5], 8, 52, 21],
    alto2: [[-.5, 2.5, 5.5], 36, 46, 21],
    pedana: [[0, 1.0, 60], -16, 14, 2.25],
    strada: [[5.5, 1.5, 16.6], -60, 17, 10.5],
    fine: [[3, 2.5, 11], -40, 30, 20]
  };
  const vista = (t, nome, extra) => { const v = VISTE[nome]; chiave(t, v[0], v[1], v[2], v[3], extra); };
  vista(T.cut1, 'pendio'); vista(T.giro0, 'pendio'); vista(T.giro1, 'fianco'); vista(T.cut2, 'fianco');
  chiave(S(2), [-5, 12.8, -12], -18, 30, 7.4); vista(S(2) + .5, 'ciglio'); vista(T.muri - .4, 'ciglio');
  vista(T.muri + .2, 'piede'); vista(T.smott + .1, 'piede');
  vista(T.smott + .7, 'smott'); vista(S(3), 'smott');
  chiave(S(3) + 1.2, [2, 2.4, 11], -30, 13, 8, { passa: true });                    // carrellata lungo il muro
  chiave(T.allont - .3, [-5.5, 2.4, 12], -30, 13, 8); chiave(S(4), [-5.5, 2.4, 12], -30, 13, 8);
  vista(S(4) + 1.95, 'alto'); vista(T.giro5, 'alto'); vista(S(5), 'alto2');
  vista(S(5) + .001, 'pedana'); vista(T.cut6, 'pedana');
  chiave(T.cut6 + .001, [-4.6, 12.4, -12.2], -40, 26, 9.4); vista(T.cut6 + 1.0, 'ciglio2'); vista(S(6), 'ciglio2');
  vista(S(6) + 1.5, 'strada'); vista(T.carta - .35, 'strada'); vista(TOTAL, 'fine');
  const camP = M3.telecamera(camera, KP, {});
  // movimenti veri: ogni telecamera conta solo nei tratti in cui è lei a inquadrare
  const tratti = (mv, finestre) => { const r = []; mv.forEach(m => finestre.forEach(([a, b]) => { const i = Math.max(a, m.inizio), f = Math.min(b, m.fine); if (f - i > .02) r.push({ inizio: i, fine: f }); })); return r; };
  const cam = { movimenti: () => tratti(camR.movimenti(), [[0, T.cut1], [T.cut2, S(2)]]).concat(tratti(camP.movimenti(), [[T.cut1, T.cut2], [S(2), TOTAL]])) };

  /* ================================================================ SCHEDE */
  const SCH = [];
  const scheda = (id, titolo, sotto, punto, verso, inizio, fine, colore) => SCH.push({ id, titolo, sotto, punto, verso, inizio, fine, colore });
  const vs = (dx, dy) => ({ dx, dy });
  const ROSSO = '#ef4136', AMBRA = '#f59e0b', VERDE = '#22a04b';
  const terra = (x, z, su = 0) => V(x, quotaT(x, z) + su, z);
  scheda('frana', 'Terra, fango o roccia', 'CHE SCIVOLA LUNGO UN PENDIO', () => terra(-5, 1, .4), vs(170, -330), parola(0, 'terra') - .2, T.giro0 - .3, AMBRA);
  scheda('piogge', 'Piogge forti', 'O CHE DURANO A LUNGO', () => V(XT, h0(XT, -4) - 1.1, -4), vs(40, -330), parola(1, 'piogge') - .15, T.cut2 - .3);
  scheda('crepeT', 'Crepe nel terreno', null, () => terra(-3.2, -12.6, .1), vs(150, 250), T.crepe + .1, T.muri - .5, AMBRA);
  scheda('crepeM', 'Crepe nei muri', null, () => V(-4.6, 1.2, 10.3), vs(230, 250), T.muri + .25, T.smott - .05, AMBRA);
  scheda('inclina', 'Alberi e pali inclinati', null, () => paloSegno.localToWorld(V(0, 5.4, 0)), vs(-60, -230), T.alberi + .45, T.smott - .05, AMBRA);
  scheda('smott', 'Piccoli smottamenti', null, () => terra(-9.3, -1.2, .2), vs(170, 250), T.smott + .75, T.avvisa + 1.1, AMBRA);
  scheda('comune', 'Avvisa il Comune', 'SE NOTI QUESTI SEGNALI', null, null, T.avvisa - .1, E(2) - .4, VERDE);
  scheda('via', 'Allontanati subito', 'SE LA TERRA SI MUOVE', () => persB.testa(), vs(-150, -260), T.allont + .05, E(3) - .4, VERDE);
  scheda('lato', 'Spostati di lato', 'FUORI DAL PERCORSO DELLA FRANA', () => terra(1.2, 20.1, .4), vs(120, 250), T.spostati + .05, T.verso - .2, VERDE);
  scheda('alto', 'Un punto più alto e stabile', null, () => terra(12.6, 5.6, .3), vs(-160, -300), T.verso + .1, T.non5 - .2, VERDE);
  scheda('sotto', 'Non fermarti', 'SOTTO ALBERI E PALI', () => paloVia.localToWorld(V(0, 6.2, 0)), vs(-250, -210), T.non5 + .15, T.giro5 - .25, ROSSO);
  scheda('rann', 'Rannicchiati e proteggi la testa', 'SE NON RIESCI A SCAPPARE', () => persC.testa(), vs(40, -330), T.rann - .3, T.cut6 - .25, AMBRA);
  scheda('bordo', 'Non avvicinarti al bordo', 'PUÒ CEDERE ANCORA', () => terra(-4.2, -14.3, .2), vs(190, 290), T.cut6 + 1.05, E(5) - .4, ROSSO);
  scheda('fermati', 'Fermati lontano', null, () => autoA.g.localToWorld(V(0, 2.1, 0)), vs(-60, -270), T.fermati + .15, T.carta - .45, VERDE);
  scheda('avvisa', 'Avvisa chi sta arrivando', null, () => autoB.g.localToWorld(V(0, 2.1, 0)), vs(-130, 280), T.avvisa7 + .2, T.carta - .45, VERDE);
  const PROBLEMI_TEMPI = M3.controllaTempi(cam, SCH.map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine })), []);
  PROBLEMI_TEMPI.forEach(p => console.warn('Controllo tempi:', p.chi.join(', '), '·', p.dettagli));

  /* eventi per la colonna sonora (colonna.py li legge dalla pagina: gli effetti cadono sull'immagine) */
  window.EVENTI = {
    passaggi: [T.cut1, T.giro0 + .6, T.cut2, S(2), T.muri - .1, T.smott + .4, S(4) + .9, S(5), T.cut6, S(6) + .7],
    frane: [[T.frana1, T.frana1 + 4.5, 0], [T.smott + .75, T.smott + 2.4, -8], [T.frana4, T.frana4 + 4.5, 0], [T.frana4 + 3.6, T.frana4 + 8.1, -3], [S(4) + 3.4, S(4) + 7.9, -7],
            [T.cedere - .05, T.cedere + 2.2, -4]],
    pioggia: [[T.pioggia0, S(2) + .3]],
    schede: SCH.map(s => s.inizio).concat([.35, T.carta, T.sito]),
    cartello: T.carta
  };

  const fonte = document.getElementById('fonte'), titolo = document.getElementById('titolo');
  const chiusura = document.getElementById('chiusura'), sito = document.getElementById('sito');
  const luoghi = ['genzano', 'nemi'].map(k => ({ k, e: document.getElementById('l-' + k), p: document.getElementById('p-' + k), da: T[k],
    pos: ril.sopra(CONFIG.etichette[k].lat, CONFIG.etichette[k].lon, 25) }));
  const attribuzione = ((RILIEVO && RILIEVO.attribuzione) || '').replace(' da EU-DEM', '\nda EU-DEM');
  const sceneA = t => { let k = 0; SC.forEach((s, i) => { if (t >= s.inizio) k = i; }); return k; };
  let tAttuale = 0, proiezioni = {};
  const comparsa = (o, t, t0, dur = .4) => { const u = clamp(prog(t, t0, dur)); o.visible = u > 0; o.scale.setScalar(Math.max(.001, ease.morbida(u) * (1 + .12 * Math.sin(u * Math.PI)))); };

  /* ================================================================ ANIMAZIONE */
  function anima(t) {
    const R = inRilievo(t), selva = SELVA(t);
    ril.gruppo.visible = R; plastico.visible = !R && !(t >= S(5) && t < T.cut6);
    pedana.visible = t >= S(5) - .05 && t < T.cut6 + .05;
    pioggiaR.oggetto.visible = R && t >= T.cut2;
    if (pioggiaR.oggetto.visible) pioggiaR.aggiorna(t, 1);
    pioggiaP.oggetto.visible = !R && t >= T.pioggia0 && t < T.cut2;
    if (pioggiaP.oggetto.visible) pioggiaP.aggiorna(t, liscia(prog(t, T.pioggia0, 1.2)));
    if (!plastico.visible && !pedana.visible) return;
    // --- stato del terreno
    if (selva) {
      ST.a = ease.morbida(prog(t, T.frana1, T.frana1d)); ST.s = 0; ST.c = 0;
      ST.bagnato = liscia(prog(t, T.pioggia0 + .2, 2.2)); ST.fronte = t < T.zuppa ? 0 : .12 + 2.3 * liscia(prog(t, T.zuppa, T.zuppad));
    } else {
      ST.a = .04 * liscia(prog(t, T.crepe, .8)) + .68 * ease.morbida(prog(t, T.frana4, T.frana4d)) + .28 * liscia(prog(t, S(4) + .2, D(4) - 2.4));
      ST.s = .75 * liscia(prog(t, T.smott + .75, 1.1)) + .25 * liscia(prog(t, T.smott + 1.6, S(3) - T.smott - 1.7)); ST.c = liscia(prog(t, T.cedere, 1.3));
      ST.bagnato = 0; ST.fronte = 0;
    }
    set.visible = !selva;
    destro.gruppo.position.set(selva ? 19 * esplodi(prog(t, T.apre, T.apred)) : 0, selva ? -9 * esplodi(prog(t, T.apre, T.apred)) : 0, 0);
    if (plastico.visible) { sinistro.aggiorna(); destro.aggiorna(); }
    // --- alberi
    const sa = ST.a, avanti = clamp((sa - .04) / .96);
    for (const a of alberi) {
      let x = a.x, z = a.z, incl = 0;
      if (a.frana === 'selva') { a.g.visible = selva; z += 10.5 * sa; incl = .55 * liscia(sa * 1.6); }
      if (a.frana === 'segno') { a.g.visible = !selva; z += 7.5 * avanti; incl = .2 * liscia(prog(t, T.alberi, T.inclinano + .5 - T.alberi)) + .75 * liscia(avanti * 1.8); }
      a.g.position.set(x, quotaT(x, z) - .1, z); a.g.rotation.set(incl, 0, incl * .25);
    }
    paloSegno.visible = !selva;
    { const z = 6.4 + 6.5 * avanti, incl = .26 * liscia(prog(t, T.alberi + .15, T.inclinano + .5 - T.alberi)) + 1.05 * liscia(avanti * 1.7);
      paloSegno.position.set(-2.4, quotaT(-2.4, z) - .15, z); paloSegno.rotation.set(incl, .3, -incl * .2); }
    alberoVia.g.visible = paloVia.visible = !selva;
    paloVia.position.set(6.7, quotaT(6.7, 13.3) - .1, 13.3);
    // --- sassi
    muoviSassi(FA, sa, 0, 60); muoviSassi(FS, ST.s, 60, 10); muoviSassi(FC, ST.c, 70, 14);
    sassi.instanceMatrix.needsUpdate = true;
    // --- crepe nel terreno (scena dei segnali) e nei muri
    const cr = selva ? 0 : liscia(prog(t, T.crepe, .9)), crVia = 1 - liscia(prog(t, T.frana4 + .5, 1.2));
    crepeTerra.forEach((c, i) => c.aggiorna(liscia(cr * 1.3 - i * .25), crVia));
    crepaCiglio.aggiorna(t >= T.cut6 - .05 ? 1 : 0, 1 - liscia(prog(t, T.cedere + .1, .6)));
    crepeMuro.forEach((c, i) => { c.material.opacity = selva ? 0 : liscia(prog(t, T.muri - .1 + i * .25, .5)); c.visible = c.material.opacity > .01 && sa < muro[i ? 4 : 3].soglia; });
    // --- muro che cede sotto la spinta
    muro.forEach((m, i) => {
      const c = liscia((sa - m.soglia) / .13) * m.dentro;
      m.perno.rotation.x = 1.42 * c; m.perno.position.set(m.x, -.25 * c, 10 + 1.5 * c);
    });
    // --- persone
    { const ta = T.allont - .2, t0 = T.spostati - .05, t1 = T.verso - .25, t2 = T.non5 - .5;
      let p, ang = Math.PI, ph = 0;
      if (t < t0) { const u = ease.morbida(prog(t, ta, 1.5)); p = [-5, mix(17.9, PB[0][1], u)]; if (u > 0 && u < 1) { ph = (t - ta) * 11; ang = 0; } }
      else if (t < t1) { const u = ease.morbida(prog(t, t0, t1 - t0)); p = [mix(PB[0][0], PB[1][0], u), mix(PB[0][1], PB[1][1], u)]; ang = Math.PI / 2; if (u > 0 && u < 1) ph = (t - t0) * 11; }
      else { const u = ease.morbida(prog(t, t1, t2 - t1)); p = u < .55 ? [mix(PB[1][0], PB[2][0], u / .55), mix(PB[1][1], PB[2][1], u / .55)] : [mix(PB[2][0], PB[3][0], (u - .55) / .45), mix(PB[2][1], PB[3][1], (u - .55) / .45)];
        ang = u < 1 ? Math.PI * .8 : Math.PI * 1.25; if (u > 0 && u < 1) ph = (t - t1) * 11; }
      persB.root.position.set(p[0], Math.max(.08, quotaT(p[0], p[1]) + .03), p[1]);
      persB.root.rotation.y = ang; persB.posa(0, 0, ph);
      persB.root.visible = !selva && t >= S(3) + .25 && t < S(6);
      anelloB.oggetto.position.set(p[0], Math.max(.1, quotaT(p[0], p[1])) + .22, p[1]); anelloB.aggiorna(t, { inizio: S(4) + .8, fine: T.verso - .3 }); }
    pedana.rotation.y = .22 * (t - S(5));
    persC.posa(liscia(prog(t, T.rann - .1, .7)), liscia(prog(t, T.proteggi - .15, .6)), 0);
    // --- frecce del percorso (scena «spostati di lato»)
    const fr = fin(t, S(4) + .5, S(5), .3, .3);
    frecciaRossa.aggiorna(liscia(prog(t, S(4) + .5, 1.4)), fr * .92);
    frecciaVerde.aggiorna(liscia(prog(t, T.spostati, T.non5 - .6 - T.spostati)), fr * .95);
    // --- croci su albero e palo, divieto sul ciglio
    const cx = fin(t, T.non5, S(5), .3, .2);
    [[croceAlbero, V(2.9, quotaT(2.9, 12.7) + 6.6, 12.7)], [crocePalo, V(6.7, quotaT(6.7, 13.3) + 7.6, 13.3)]].forEach(([c, p], i) => {
      c.visible = cx > .01; c.position.copy(p); c.material.opacity = cx; c.scale.setScalar(2.6 * (1 + .12 * Math.sin((t - T.non5) * 6 + i))); });
    divieto.visible = !selva && t >= T.cut6 - .05 && t < S(6) + 1.6;
    divieto.position.set(-.6, quotaT(-.6, -17.2), -17.2);
    // --- automobili
    { const u = prog(t, S(6) + .9, T.fermati + .1 - S(6) - .9), x = mix(27, 12.6, 1 - (1 - u) * (1 - u));
      autoA.g.visible = t >= S(6) && x < 22.2; autoA.g.position.set(x, .06, 17.5);
      const lam = t > T.fermati + .2 && Math.sin((t - T.fermati) * 9) > 0;
      autoA.frecce.forEach(f => f.material.color.set(lam ? 0xffb020 : 0x7a4a00)); }
    { const u = prog(t, T.avvisa7 - .7, 1.3), x = mix(27.5, 19.4, 1 - (1 - u) * (1 - u));
      autoB.g.visible = t >= S(6) && x < 22.2; autoB.g.position.set(x, .06, 17.5); }
  }

  function render(t) {
    t = clamp(t, 0, TOTAL); tAttuale = t;
    const R = inRilievo(t);
    (R ? camR : camP).applica(t);
    anima(t);
    plastico.updateMatrixWorld(true); pedana.updateMatrixWorld(true);
    vicino.disegna(scena, camera);
    const k = sceneA(t), sc = SC[k];
    IMP.aggiorna(stato, t, { passoHUD: k + (k === 0 ? 1 : clamp((t - sc.inizio) / .4)), hud: CONFIG.hud[k], notaVisibile: true,
                             nota: R ? CONFIG.notaRilievo : CONFIG.notaSchema });
    IMP.sottotitoli(stato, t, FRASI, { modo: CONFIG.modo });
    proiezioni = {};
    for (const s of SCH) {
      let punto = null, vis = true, p = null;
      const attiva = t >= s.inizio - .1 && t <= s.fine + .5;
      if (s.punto && attiva) { p = M3.proietta(s.punto(), camera, { zona: L.zonaSchede, margine: L.margine }); punto = p.punto; vis = p.visibile; }
      proiezioni[s.id] = p;
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, colore: s.colore, punto, verso: s.verso,
        inizio: s.inizio, fine: s.fine, visibile: vis, centro: s.punto ? null : { x: W / 2, y: L.zona.alto + 150 } });
    }
    // titolo, nomi dei luoghi, cartello finale
    const vt = fin(t, .3, T.cut1 - .05, .45, .2);
    titolo.style.opacity = vt.toFixed(3); titolo.style.top = (L.zona.alto + 70 + 30 * (1 - ease.outCubic(prog(t, .3, .5)))) + 'px';
    for (const l of luoghi) {
      const v = R ? fin(t, l.da, S(2) - .05, .35, .2) : 0;
      const p = v > 0 ? M3.proietta(l.pos, camera, { zona: L.zona, margine: L.margine + 110 }) : null, ok = p && p.visibile ? v : 0;
      l.e.style.opacity = l.p.style.opacity = ok.toFixed(3);
      if (ok > 0) { l.p.style.left = p.x + 'px'; l.p.style.top = p.y + 'px'; l.e.style.left = (p.x - l.e.offsetWidth / 2) + 'px'; l.e.style.top = (p.y - 66) + 'px'; }
    }
    const vc = fin(t, T.carta, TOTAL + 1, .4, .2);
    velo.style.opacity = (.74 * liscia(prog(t, T.carta - .3, .6))).toFixed(3);
    chiusura.style.opacity = vc.toFixed(3); chiusura.style.top = (L.zona.alto + 130 + 26 * (1 - ease.outCubic(prog(t, T.carta, .5)))) + 'px';
    sito.style.opacity = fin(t, T.sito, TOTAL + 1, .4, .2).toFixed(3); sito.style.top = (L.zona.alto + 690) + 'px';
    const testo = R ? attribuzione : (t >= T.carta - .3 ? CONFIG.fonte : '');
    if (fonte.textContent !== testo) fonte.textContent = testo;
    fonte.style.display = testo ? '' : 'none'; fonte.style.fontSize = R ? '17px' : '22px';
    fonte.style.left = L.margine + 'px';
    fonte.style.top = (L.zona.basso - fonte.offsetHeight - 6) + 'px';
  }

  window.renderFrame = t => render(t);
  window.__controlli = () => IMP.controlli(stato)
    .concat(M3.controlliSchede(tAttuale, SCH.filter(s => s.punto).map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine, proiezione: proiezioni[s.id], attivo: true }))))
    .concat(PROBLEMI_TEMPI.filter(p => tAttuale >= p.inizio && tAttuale <= p.fine));
  IMP.caricaFont().then(() => { render(0); window.__ready = true; });
})();
</script>
