<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vento forte: che cosa fare</title>
<!-- vento-forte.src.html — video 3D divulgativo «Vento forte: che cosa fare» (Protezione Civile Genzano di Roma):
     tuffo sul rilievo vero dei Castelli Romani con le linee del vento, poi un quartiere in plastico (palazzina con i
     balconi, casa in spaccato, viale alberato, impalcatura, cartellone) e una strada con galleria e viadotto.
     Scritto per Alessandro Cuollo il 12/11/2026 sul modello della skill video-3d, senza codice di terzi. Si costruisce
     con costruisci.py di video-3d (three.js 0.181.2 MIT, motore 3D, impaginazione, font) e i dati rilievo (rilievo.py),
     tempi e sottotitoli (ritmo.py). Tutto dipende solo da t: render(t) deterministico.
     Plastico in metri: x verso est, z verso sud, terreno a y = 0. La strada del quartiere corre lungo x fra z = 2 e 9;
     gli edifici stanno a nord (z < 0). La strada con galleria e viadotto sta a parte, 220 m più a sud. -->
<!--FONT-->
<style>
  html, body { margin: 0; background: #05080f; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden;
           background: radial-gradient(ellipse at 50% 42%, #1d2d4f 0%, #111c33 48%, #0a1220 100%); }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #livello-rilievo { z-index: 1; } #livello-scena { z-index: 2; }
  #fonte { position: absolute; z-index: 30; font-family: 'Titillium Web', sans-serif; font-weight: 400; font-size: 17px;
           line-height: 1.3; color: rgba(238, 242, 247, .86); white-space: nowrap; padding: 5px 12px; border-radius: 10px;
           background: rgba(10, 18, 32, .62); text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  #titolo, #grande { position: absolute; z-index: 31; left: 96px; width: 888px; text-align: center; opacity: 0;
           box-sizing: border-box;
           font-family: 'Titillium Web', sans-serif; color: #eef2f7; }
  #titolo .a { font-weight: 700; font-size: 104px; line-height: 1.02; text-shadow: 0 2px 4px rgba(4, 8, 16, .95), 0 0 2px rgba(4, 8, 16, .9); }
  #titolo .b { font-weight: 600; font-size: 50px; line-height: 1.2; color: #ffcc00; text-shadow: 0 2px 4px rgba(4, 8, 16, .95), 0 0 2px rgba(4, 8, 16, .9); }
  #grande { left: 290px; width: 500px; padding: 14px 0 6px; border-radius: 22px; background: rgba(10, 18, 32, .78); border: 3px solid #ffcc00; }
  #grande .a { font-weight: 600; font-size: 40px; line-height: 1.1; letter-spacing: 1px; }
  #grande .b { font-weight: 700; font-size: 212px; line-height: .98; color: #ffcc00; }
</style>

<body>
<div id="stage">
  <canvas id="livello-rilievo"></canvas>
  <canvas id="livello-scena"></canvas>
  <div id="fonte" data-componente="fonte-3d"></div>
  <div id="titolo" data-componente="titolo"><div class="a">Vento forte</div><div class="b">che cosa fare</div></div>
  <div id="grande" data-componente="numero-112"><div class="a">Chiama il</div><div class="b">112</div></div>
</div>
<script type="application/json" id="dato-rilievo">/*DATO:rilievo*/</script>
<script type="application/json" id="dato-tempi">/*DATO:tempi*/</script>
<script type="application/json" id="dato-sottotitoli">/*DATO:sottotitoli*/</script>
<!--LIBRERIE-->
<!--THREE-->
<!--MOTORE3D-->
<script>
/* ============================================================ CONFIG ============ */
const CONFIG = {
  titolo: 'Vento forte: che cosa fare',
  ente: 'pc-genzano',
  formato: 'verticale',
  hud: ['VENTO FORTE', 'PRIMA', "L'ALLERTA", 'IN CASA', 'SE SEI FUORI', 'IN STRADA', 'DOPO'],
  esagerazione: 2,                                   // rilievo ×2: lo dice la nota in alto
  notaRilievo: 'RILIEVO ×2 · NON IN SCALA',
  nota: 'SCHEMA · NON IN SCALA',
  fonte: 'Fonte: Dipartimento della Protezione Civile, «Cosa fare in caso di venti e mareggiate»',
  chiave: ['raffiche', 'rami', 'tegole', 'vasi', 'riparo', 'fissa', "l'allerta", 'alberi', 'impalcature', 'casa', 'porte',
           'finestre', 'vetri', 'parchi', 'alberate', 'cartelloni', 'cornicioni', 'rallenta', 'gallerie', 'viadotti',
           'cavi', '112'],
  modo: 'parole'
};
function dato(nome) {
  const e = document.getElementById('dato-' + nome), s = e ? e.textContent.trim() : '';
  return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s);
}
const RILIEVO = dato('rilievo');
const TEMPI = dato('tempi');
if (!TEMPI) throw new Error('manca tempi.json: lancia ritmo.py e costruisci con --dato tempi=tempi.json');
const SOTT = dato('sottotitoli') || [];
const FRASI = SOTT.map(f => Object.assign({}, f, { chiave: (f.chiave || []).concat(CONFIG.chiave) }));
/* ============================================================ fine CONFIG ======= */

(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const ente = CONFIG.ente, formato = new URLSearchParams(location.search).get('formato') || CONFIG.formato;
  const L = IMP.layout(formato), W = L.W, H = L.H, ORIZ = formato === 'orizzontale';
  const SC = TEMPI.scene, TOTAL = TEMPI.totale, EV = TEMPI.ev, VOCE = TEMPI.voce;
  const S = i => SC[i].inizio, D = i => SC[i].durata, E = i => SC[i].inizio + SC[i].durata;
  window.TOTAL = TOTAL; window.STAGE_W = W; window.STAGE_H = H;
  document.title = CONFIG.titolo;
  const { clamp, prog, mix, ease, hash } = M3;
  const fin = M3.finestra;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const liscia = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  const esplodi = u => { u = clamp(u); return u * u * u * (u * (6 * u - 15) + 10); };   // parte e arriva piano
  const fr = x => x - Math.floor(x);

  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente, formato, hud: CONFIG.hud[0], passiHUD: SC.length, nota: CONFIG.notaRilievo });
  IMP.anteprima(stage);

  const lontano = M3.creaRenderer(document.getElementById('livello-rilievo'), W, H, { scala: 0.8 });
  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scenaRil = new THREE.Scene(), scena = new THREE.Scene();
  const cameraRil = M3.creaCamera(W, H, { fov: 32, zona: L.zona });
  const camera = M3.creaCamera(W, H, { fov: 32, zona: L.zona });

  /* ---------------------------------------------------------------- luci (plastico) */
  scena.add(new THREE.HemisphereLight(0xeef3ff, 0x39425a, 1.2));
  const sole = new THREE.DirectionalLight(0xfff4e6, 1.6); sole.position.set(9, 14, 12); scena.add(sole);
  const contro = new THREE.DirectionalLight(0xb7cdf5, 0.7); contro.position.set(-8, 6, -9); scena.add(contro);

  /* ---------------------------------------------------------------- aiuti: texture, materiali, solidi */
  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 1; return t;
  }
  const tinta = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: 0.03, roughness: 0.8 }, o));
  const base = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
  const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  const cil = (r1, r2, h, mat, seg = 12) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  const metti = (gr, m, x, y, z) => { m.position.set(x, y, z); gr.add(m); return m; };
  const texOmbra = tela(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  function ombra(rx, rz, y = 0.05) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(rx * 2, rz * 2), base(0xffffff, { map: texOmbra, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = y; return m;
  }
  const matIntonaco = tinta(0xf0e6d2), matIntonaco2 = tinta(0xe4d3bd), matIntonaco3 = tinta(0xd9dee6);
  const matBianco = tinta(0xf7f8fa, { roughness: .5 }), matScuro = tinta(0x2b3442), matGrigio = tinta(0x9aa3ad);
  const matLegno = tinta(0x8a5a36, { roughness: .6 }), matLegnoScuro = tinta(0x5b3a22, { roughness: .6 });
  const matMetallo = tinta(0xb8c0ca, { metalness: .6, roughness: .35 });
  const matVetro = base(0x8fc1ea), matVetroBuio = base(0x25344d);
  const matAsfalto = tinta(0x3d434c, { roughness: .95 }), matMarciapiede = tinta(0xc4c8cc, { roughness: .95 });
  const matPrato = tinta(0x6b9a4a, { roughness: 1 }), matTerra = tinta(0x8a7350, { roughness: 1 });
  const matCotto = tinta(0xc1663f, { roughness: .75 }), matTegola = tinta(0xb5532f, { roughness: .8 });
  const matGiallo = tinta(0xffcc00, { roughness: .45, emissive: 0x6b4f00, emissiveIntensity: .7 });
  const VERDI = [0x3f8f3a, 0x4d9a3e, 0x387f33, 0x5aa045];

  /* segni: spunta verde e divieto rosso (sprite sempre rivolti alla telecamera) */
  const texSi = tela(128, 128, g => { g.fillStyle = '#16a34a'; g.beginPath(); g.arc(64, 64, 60, 0, 6.29); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 6; g.stroke();
    g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(34, 68); g.lineTo(56, 90); g.lineTo(96, 40); g.stroke(); });
  const texNo = tela(128, 128, g => { g.fillStyle = '#ffffff'; g.beginPath(); g.arc(64, 64, 60, 0, 6.29); g.fill();
    g.strokeStyle = '#dc2626'; g.lineWidth = 15; g.beginPath(); g.arc(64, 64, 50, 0, 6.29); g.stroke();
    g.beginPath(); g.moveTo(29, 29); g.lineTo(99, 99); g.stroke(); });
  const SEGNI = [];
  function segno(si, pos, lato, t0, t1, dove = scena) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: si ? texSi : texNo, transparent: true, depthTest: false, depthWrite: false }));
    sp.position.copy(pos); sp.renderOrder = 20; sp.visible = false; dove.add(sp);
    const s = { sp, lato, t0, t1: t1 == null ? 1e9 : t1 };
    SEGNI.push(s); return s;
  }
  function aggiornaSegni(t) {
    for (const s of SEGNI) {
      const u = prog(t, s.t0, .4), via = prog(t, s.t1, .25);
      s.sp.visible = u > 0 && via < 1;
      const k = (u < 1 ? ease.morbida(u) * (1 + .22 * Math.sin(u * Math.PI)) : 1 + .06 * Math.sin((t - s.t0) * 3.2)) * (1 - liscia(via));
      s.sp.scale.setScalar(Math.max(.001, s.lato * k));
    }
  }

  /* nastri del vento: strisce chiare che scorrono, rivolte alla telecamera */
  function creaNastri(n, seg) {
    const pos = new Float32Array(n * (seg + 1) * 2 * 3), idx = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < seg; j++) { const a = (i * (seg + 1) + j) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx);
    const mesh = new THREE.Mesh(g, base(0xf4f8ff, { transparent: true, opacity: .82, depthWrite: false, side: THREE.DoubleSide }));
    mesh.frustumCulled = false; mesh.renderOrder = 8;
    return { mesh, pos, n, seg, g };
  }
  const _v = V(0, 0, 0), _s = V(0, 0, 0), _c = V(0, 0, 0);
  // punto(i, j, v): scrive in v il nodo j del nastro i e restituisce lo spessore relativo (0-1)
  function aggiornaNastri(N, cam, dir, largh, punto) {
    let k = 0;
    for (let i = 0; i < N.n; i++) for (let j = 0; j <= N.seg; j++) {
      const w = punto(i, j, _v) * largh;
      _c.copy(cam.position).sub(_v); _s.crossVectors(dir, _c).normalize().multiplyScalar(w);
      N.pos[k++] = _v.x + _s.x; N.pos[k++] = _v.y + _s.y; N.pos[k++] = _v.z + _s.z;
      N.pos[k++] = _v.x - _s.x; N.pos[k++] = _v.y - _s.y; N.pos[k++] = _v.z - _s.z;
    }
    N.g.attributes.position.needsUpdate = true;
  }

  /* ================================================================ RILIEVO VERO (apertura) */
  const ril = M3.rilievo(RILIEVO || M3.rilievoDiProva(), { esagerazione: CONFIG.esagerazione, laghi: RILIEVO ? [
    { nome: 'Lago Albano', lat: 41.750, lon: 12.665, profondita: 167 }, { nome: 'Lago di Nemi', lat: 41.715, lon: 12.700, profondita: 33 }] : [] });
  scenaRil.add(ril.gruppo);
  const BB = ril.riquadro, lat0 = BB.lat_min, lon0 = BB.lon_min, lat1 = BB.lat_max, lon1 = BB.lon_max;
  const nastriRil = creaNastri(30, 12); scenaRil.add(nastriRil.mesh);
  const DIR_EST = V(1, 0, 0), DIR_SUD = V(0, 0, 1);
  const camRil = M3.telecamera(cameraRil, [
    { t: 0, bersaglio: { lat: 41.722, lon: 12.684, sopra: 0 }, az: 0, el: 80, dist: 62, fov: 32 },
    { t: 3.9, bersaglio: { lat: 41.7075, lon: 12.689, sopra: 0 }, az: -14, el: 42, dist: 8.5, facilita: 'lineare' }
  ], { rilievo: ril });

  /* ================================================================ IL QUARTIERE (plastico) */
  const quartiere = new THREE.Group(); scena.add(quartiere);
  // basamento, prato, strada, marciapiedi, parcheggio, giardino
  metti(quartiere, box(91, 1.2, 37, tinta(0x2a3546, { roughness: 1 })), 3, -.75, 4);
  metti(quartiere, box(90, .3, 36, matPrato), 3, -.15, 4);
  metti(quartiere, box(90, .06, 7, matAsfalto), 3, .0, 5.5);
  metti(quartiere, box(90, .16, 1.8, matMarciapiede), 3, .06, 1.1);
  metti(quartiere, box(90, .16, 1.8, matMarciapiede), 3, .06, 9.9);
  for (let i = 0; i < 22; i++) metti(quartiere, box(2, .01, .14, base(0xe5e7eb)), -39 + i * 4, .04, 5.5);
  metti(quartiere, box(15, .06, 8.4, tinta(0x4a515b, { roughness: .95 })), -29, .0, 15);          // parcheggio libero
  for (let i = 0; i < 6; i++) metti(quartiere, box(.12, .01, 4.2, base(0xe5e7eb)), -35.5 + i * 2.6, .04, 16.9);
  metti(quartiere, box(5, .06, 2, tinta(0x4a515b, { roughness: .95 })), -30.2, .0, 11);            // ingresso del parcheggio

  /* alberi: tronco e chioma a sfere sfaccettate; si piegano col vento attorno alla base */
  const ALBERI = [];
  function albero(x, z, h, seme, dove = quartiere) {
    const g = new THREE.Group(); g.position.set(x, .1, z); dove.add(g);
    metti(g, cil(.14, .24, h * .55, matLegnoScuro, 8), 0, h * .275, 0);
    const chioma = new THREE.Group(); chioma.position.y = h * .55; g.add(chioma);
    const r = h * .3;
    [[0, r * .9, 0, 1], [-r * .62, r * .35, r * .2, .72], [r * .6, r * .45, -r * .25, .76], [r * .1, r * .3, r * .62, .66]].forEach(([a, b, c, k], i) => {
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(r * k, 1), tinta(VERDI[(seme + i) % 4], { roughness: 1, flatShading: true }));
      s.position.set(a, b, c); s.rotation.y = hash(seme * 3.1 + i) * 6; chioma.add(s);
    });
    const om = ombra(r * 1.5, r * 1.3, .1); om.position.set(x + .6, .16, z + .3); dove.add(om);
    const a = { g, chioma, h, seme, caduto: null }; ALBERI.push(a); return a;
  }
  const T0 = albero(-22.2, 1.1, 6.2, 1), TA = albero(10.8, 1.1, 6.4, 2), TC = albero(27.2, -8.5, 5.6, 3);
  const VN = [albero(30, 1.1, 6.4, 4), albero(36, 1.1, 6.8, 5), albero(42, 1.1, 6.2, 6)];
  const VS = [albero(40.5, 9.9, 6.6, 8), albero(46, 9.9, 6.0, 9)];
  albero(41, 14.5, 5.6, 10); albero(45.4, 18, 6.0, 11); albero(-39.5, 16, 5.4, 12);
  const zolla = cil(1.0, .7, .3, matTerra, 10); zolla.position.y = .05; zolla.visible = false; VN[1].g.add(zolla);   // la zolla dell'albero caduto
  // panchina del parco
  metti(quartiere, box(1.8, .08, .5, matLegno), 43, .55, 12.4); metti(quartiere, box(1.8, .5, .06, matLegno), 43, .85, 12.15);
  [-.8, .8].forEach(d => metti(quartiere, box(.08, .5, .5, matScuro), 43 + d, .3, 12.4));

  // rami che si spezzano: quello dell'apertura (albero TA) e quello del viale (primo albero a nord)
  function ramo(al, lato, giu) {
    const g = new THREE.Group(); quartiere.add(g);
    const l = cil(.06, .1, 2.0, matLegnoScuro, 6); l.rotation.z = Math.PI / 2; g.add(l);
    const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.75, 1), tinta(VERDI[1], { roughness: 1, flatShading: true })); f.position.set(lato * 1.1, .15, 0); g.add(f);
    const f2 = new THREE.Mesh(new THREE.IcosahedronGeometry(.5, 1), tinta(VERDI[3], { roughness: 1, flatShading: true })); f2.position.set(lato * .35, .25, .25); g.add(f2);
    return { g, su: V(al.g.position.x + lato * 1.25, al.h * .62, al.g.position.z + .5), giu, lato };
  }
  const ramoA = ramo(TA, 1, V(12.4, .45, 3.3)), ramoV = ramo(VN[0], -1, V(28.6, .45, 3.6));
  function aggiornaRamo(r, t, t0, piega) {
    const u = prog(t, t0, .85), q = u * u;
    r.g.position.set(mix(r.su.x + piega * 2.2, r.giu.x, liscia(u)), mix(r.su.y, r.giu.y, q), mix(r.su.z, r.giu.z, liscia(u)));
    r.g.rotation.set(0, u * 1.1 * r.lato, r.lato * (-.35 + .25 * piega) * (1 - u) + u * .12 + (u > 0 && u < 1 ? Math.sin(u * 9) * .3 : 0));
  }

  /* ---------------------------------------------------------------- palazzina con i balconi (x da -8 a 8) */
  const pal = new THREE.Group(); quartiere.add(pal);
  const PZ = -2, PH = 9.6;
  metti(pal, box(16, PH, 9, matIntonaco), 0, PH / 2, -6.5);
  metti(pal, box(16.1, .5, 9.1, tinta(0xb9b2a4, { roughness: .95 })), 0, .25, -6.5);
  // cornicione: tre tratti, quello a ovest è lesionato (scena «fuori»)
  const matCorn = tinta(0xd6d3cc, { roughness: .9 });
  metti(pal, box(10.9, .45, 9.9, matCorn), 2.95, PH + .22, -6.5);
  metti(pal, box(2, .45, 9.9, matCorn), -7.45, PH + .22, -6.5);
  metti(pal, box(3.9, .45, 8.9, matCorn), -4.45, PH + .22, -7.0);
  const cornRotto = box(3.8, .45, .95, tinta(0xcbc6bc, { roughness: .9 })); cornRotto.position.set(-4.45, PH + .1, -2.02); cornRotto.rotation.set(.16, 0, -.045); pal.add(cornRotto);
  const texCrepa = tela(256, 64, (g, w, h) => {
    g.strokeStyle = 'rgba(25,20,18,.95)'; g.lineWidth = 5; g.beginPath(); g.moveTo(0, h / 2);
    for (let i = 1; i <= 16; i++) g.lineTo(i * w / 16, h / 2 + (hash(i * 3.7) - .5) * h * .8);
    g.stroke();
  });
  const crepa = new THREE.Mesh(new THREE.PlaneGeometry(3.6, .5), base(0xffffff, { map: texCrepa, transparent: true, depthWrite: false })); crepa.position.set(-4.45, PH - .35, PZ + .02); pal.add(crepa);
  metti(pal, box(15.6, .5, 8.6, tinta(0x8f8a80)), 0, PH + .55, -6.5);
  function finestra(gr, x, y, z, w = 1.2, h = 1.4, lato = false, buia = false) {
    const f = box(lato ? .06 : w, h, lato ? w : .06, buia ? matVetroBuio : matVetro); f.position.set(x, y + h / 2, z); gr.add(f);
    const d = box(lato ? .24 : w + .2, .08, lato ? w + .2 : .24, matBianco); d.position.set(x + (lato ? .08 : 0), y - .04, z + (lato ? 0 : .08)); gr.add(d);
    return f;
  }
  [0, 3.2, 6.4].forEach((y, p) => {
    [-6.5, 6.5].forEach(x => finestra(pal, x, y + 1.0, PZ + .01));
    if (p > 0) finestra(pal, .65, y + 1.0, PZ + .01, 1.2, 1.4, false, p === 2);       // al secondo piano è aperta (davanzale)
    [-4.4, -8.4].forEach(z => finestra(pal, 8.01, y + 1.0, z, 1.2, 1.4, true));
  });
  metti(pal, box(1.5, 2.3, .08, tinta(0x7a4b2b)), 0, 1.15, PZ + .02);
  metti(pal, box(2.2, .12, 1.0, matCorn), 0, 2.5, PZ + .5);

        });
      }
    } else {
      // veicoli: escono dalla galleria, rallentano e oscillano appena con le raffiche di lato
      [[autoV, S(5) + .3, .22, .035, 0], [moto, S(5) + 1.25, .3, .05, 1]].forEach(([o, t0, amp, imb, m]) => {
        const x = xVeicolo(t, t0), g = raffica(t + m * .4, x);
        o.visible = x > -3.5; o.position.set(x, .06, CORSIA + amp * g);
        o.rotation.set(m ? -.13 * g : -.02 * g, -imb * (.6 * 2.3 * Math.cos((t + m * .4) * 2.3)) * liscia((x - .5) / 3) * .5, 0);
      });
      const gm = .6 + .4 * Math.sin(t * 2.3);
      manica.rotation.set(-.12 - .3 * (1 - gm) + .05 * Math.sin(t * 9), .1 * Math.sin(t * 5.3), 0);
      const cx = clamp(st.bersaglio.x, 4, 30), r = clamp(st.dist / 40, .5, 1.5), Lp = 26;
      aggiornaNastri(nastriS, camera, DIR_SUD, .1 * r * (.55 + .45 * gm), (i, j, v) => {
        const s = fr(t * .6 + hash(i * 7.3)), a = s * Lp - j / nastriS.seg * (5 + 3 * hash(i * 2.9)) * Math.max(1, r * 1.7);
        v.set(cx + (hash(i * 5.1) - .5) * 30 * r + .4 * Math.sin(a * .33 + i * 2), .9 + 5.5 * hash(i * 3.7) + .3 * Math.sin(a * .5 + i), RZ - Lp * .5 + a);
        return Math.sin(Math.PI * j / nastriS.seg) * Math.sin(Math.PI * s);
      });
    }
    aggiornaSegni(t);
  }

  function render(t) {
    t = clamp(t, 0, TOTAL); tAttuale = t;
    const k = sceneA(t), sc = SC[k];
    // apertura: rilievo vero con le linee del vento, in dissolvenza verso il plastico
    const vRil = 1 - prog(t, 3.05, .6), vPla = prog(t, 3.0, .6);
    lontano.canvas.style.display = vRil > 0 ? '' : 'none';
    if (vRil > 0) {
      camRil.applica(t);
      const lonL = lon1 - lon0;
      aggiornaNastri(nastriRil, cameraRil, DIR_EST, .016 + .0022 * camRil.stato(t).dist, (i, j, v) => {
        const s = fr(t * .42 + hash(i * 7.3)), lon = lon0 + .02 * lonL + s * lonL * .96 - j / nastriRil.seg * lonL * (.14 + .1 * hash(i * 2.9));
        const lat = lat0 + (.06 + .88 * hash(i * 5.1)) * (lat1 - lat0) + .004 * Math.sin((lon - lon0) * 160 + i);
        const lonC = clamp(lon, lon0 + 1e-4, lon1 - 1e-4);
        v.copy(ril.sopra(lat, lonC, 260 + 160 * hash(i * 3.7)));
        return Math.sin(Math.PI * j / nastriRil.seg) * Math.sin(Math.PI * clamp(s)) * (lon === lonC ? 1 : 0);
      });
      lontano.canvas.style.opacity = vRil.toFixed(3);
      lontano.disegna(scenaRil, cameraRil);
    }
    vicino.canvas.style.display = vPla > 0 ? '' : 'none';
    if (vPla > 0) {
      const st = cam.applica(t);
      camera.near = Math.max(.15, st.dist * .01); camera.far = 700; camera.updateProjectionMatrix();
      anima(t, k, st);
      vicino.canvas.style.opacity = vPla.toFixed(3);
      vicino.disegna(scena, camera);
    }
    IMP.aggiorna(stato, t, { passoHUD: k + (k === 0 ? 1 : clamp((t - sc.inizio) / .4)), hud: CONFIG.hud[k], notaVisibile: true,
      nota: t < 3.3 ? CONFIG.notaRilievo : CONFIG.nota });
    IMP.sottotitoli(stato, t, FRASI, { modo: CONFIG.modo });
    proiezioni = {};
    for (const s of SCH) {
      let punto = null, vis = true, p = null;
      if (s.punto) {
        p = M3.proietta(s.punto(), camera, { zona: L.zonaSchede, margine: L.margine });
        punto = p.punto; vis = p.visibile;
      }
      proiezioni[s.id] = p;
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, colore: s.colore, punto, verso: s.verso,
        inizio: s.inizio, fine: s.fine, visibile: vis, centro: s.punto ? null : { x: s.id === 'fine' ? XG : W / 2, y: s.centroY || L.zonaSchede.alto + (ORIZ ? 48 : 62) } });
    }
    // titolo dell'apertura e numero di emergenza della chiusura
    const vt = fin(t, .2, 3.0, .35, .35);
    titolo.style.opacity = vt.toFixed(3); titolo.style.display = vt > 0 ? '' : 'none';
    titolo.style.transform = 'translateY(' + ((1 - ease.morbida(prog(t, .2, .5))) * 18).toFixed(1) + 'px)';
    const ug = prog(t, EV.n112 - .15, .45);
    grande.style.opacity = clamp(ug * 2).toFixed(3); grande.style.display = ug > 0 ? '' : 'none';
    grande.style.transform = 'scale(' + (KG * (ug < 1 ? ease.morbida(ug) * (1 + .12 * Math.sin(ug * Math.PI)) : 1 + .02 * Math.sin((t - EV.n112 - .3) * 3))).toFixed(4) + ')';
    // fonte dei consigli, nella chiusura
    const testo = k === SC.length - 1 ? CONFIG.fonte : '';
    if (fonte.textContent !== testo) fonte.textContent = testo;
    fonte.style.display = testo ? '' : 'none';
    fonte.style.left = L.margine + 'px';
    fonte.style.top = (L.zona.basso - fonte.offsetHeight - 6) + 'px';
  }

  window.renderFrame = t => render(t);
  window.__controlli = () => IMP.controlli(stato)
    .concat(M3.controlliSchede(tAttuale, SCH.filter(s => s.punto).map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine, proiezione: proiezioni[s.id], attivo: true }))))
    .concat(PROBLEMI_TEMPI.filter(p => tAttuale >= p.inizio && tAttuale <= p.fine));
  IMP.caricaFont().then(() => { scena.updateMatrixWorld(true); render(0); window.__ready = true; });
})();
</script>
