<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estintori e veicoli</title>
<!-- veicoli.src.html — seconda puntata: incendio a bordo di auto, scuolabus, autobus, camion, auto elettriche, a GPL e a metano (Protezione Civile Genzano di Roma).
     Scritto per Alessandro Cuollo il 28/10/2026 sul modello della skill video-3d, senza codice di terzi.
     Si costruisce con costruisci.py di video-3d (three.js 0.181.2 MIT, motore 3D, impaginazione comune, font)
     e i dati tempi (ritmo.py) e sottotitoli (voce.py tempi). Tutto dipende solo da t: render(t) deterministico.
     Riusa l'estintore, il fuoco e i getti della prima puntata. Stazioni lungo l'asse x: 0 auto a benzina, 10 scuolabus,
     21 camion con pannello arancione, 31 auto elettrica (vista esplosa del pacco batteria), 39 auto a GPL. -->
<!--FONT-->
<style>
  html, body { margin: 0; background: #05080f; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden;
           background: radial-gradient(ellipse at 50% 42%, #1d2d4f 0%, #111c33 48%, #0a1220 100%); }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #livello-scena { z-index: 2; }
  #fonte { position: absolute; z-index: 30; font-family: 'Titillium Web', sans-serif; font-weight: 400; font-size: 17px;
           line-height: 1.3; color: rgba(238, 242, 247, .86); white-space: pre; padding: 5px 12px; border-radius: 10px;
           background: rgba(10, 18, 32, .62); text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="livello-scena"></canvas>
  <div id="fonte" data-componente="fonte-3d"></div>
</div>
<script type="application/json" id="dato-tempi">/*DATO:tempi*/</script>
<script type="application/json" id="dato-sottotitoli">/*DATO:sottotitoli*/</script>
<!--LIBRERIE-->
<!--THREE-->
<!--MOTORE3D-->
<script>
/* ============================================================ CONFIG ============ */
const CONFIG = {
  titolo: 'Estintori e veicoli',
  ente: 'pc-genzano',
  formato: 'verticale',
  capitoli: ['VEICOLI', 'IN AUTO', 'BUS E SCUOLABUS', 'CAMION', 'ELETTRICHE', 'GPL E METANO'],
  capitoloDi: [0, 1, 1, 1, 1, 2, 2, 2, 3, 4, 4, 5, 5],
  hud: ['ESTINTORI E VEICOLI', 'FERMATI E SCENDI', 'IL COFANO', 'BENZINA E DIESEL', 'IN AUTO', 'BUS E SCUOLABUS',
        'TUTTI FUORI', "USARE L'ESTINTORE", 'MERCI PERICOLOSE', 'AUTO ELETTRICHE', 'STAI LONTANO', 'GPL E METANO',
        'PROTEZIONE CIVILE'],
  nota: 'SCHEMA · NON IN SCALA',
  fonte: 'Fonti: Vigili del Fuoco · accordo ADR sulle merci pericolose',
  chiave: ['112', 'frecce', 'cofano', 'fessura', 'scintilla', 'fissalo', 'uscite', 'emergenza', 'martelletto', 'spina',
           'base', 'leva', 'arancione', 'litio', 'vento', 'elettrica', 'valvole', 'serbatoio', 'scendere'],
  modo: 'parole'
};
function dato(nome) {
  const e = document.getElementById('dato-' + nome), s = e ? e.textContent.trim() : '';
  return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s);
}
const TEMPI = dato('tempi') || { scene: Array.from({ length: 13 }, (_, i) => ({ inizio: i * 12, durata: 12 })), totale: 156 };
const SOTT = dato('sottotitoli') || [];
// le frasi lunghe si mostrano a pezzi (frasi intere, al massimo ~125 caratteri), così il sottotitolo resta su tre righe
const FRASI = [];
SOTT.forEach(f => {
  const chiave = (f.chiave || []).concat(CONFIG.chiave), P = f.parole || [];
  const parti = String(f.testo).trim().split(/\s+/);
  if (f.testo.length <= 130 || P.length !== parti.length) { FRASI.push(Object.assign({}, f, { chiave })); return; }
  let da = 0, n = 0;
  const chiudi = (a) => {
    FRASI.push({ inizio: da === 0 ? f.inizio : P[da].t0, fine: a === parti.length ? f.fine : P[a].t0 - .02,
      testo: parti.slice(da, a).join(' '), parole: P.slice(da, a), chiave });
    da = a;
  };
  for (let i = 0; i < parti.length; i++) {
    n += parti[i].length + 1;
    const fineFrase = /[.:;?!]$/.test(parti[i]) && i < parti.length - 1;
    const resto = parti.slice(i + 1).join(' ').length;
    if (fineFrase && n > 45 && resto > 30) { chiudi(i + 1); n = 0; }
  }
  if (da < parti.length) chiudi(parti.length);
});
/* ============================================================ fine CONFIG ======= */

(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const P = new URLSearchParams(location.search);
  const formato = P.get('formato') || CONFIG.formato, ente = CONFIG.ente;
  const L = IMP.layout(formato), W = L.W, H = L.H, ORIZ = formato === 'orizzontale';
  const SC = TEMPI.scene, TOTAL = TEMPI.totale || SC[SC.length - 1].inizio + SC[SC.length - 1].durata;
  const S = i => SC[i].inizio, D = i => SC[i].durata, E = i => SC[i].inizio + SC[i].durata;
  window.TOTAL = TOTAL; window.STAGE_W = W; window.STAGE_H = H;
  document.title = CONFIG.titolo;
  const { clamp, prog, mix, ease, hash, rumore1 } = M3;
  const fin = M3.finestra;

  /* istante di una parola detta nella scena k (dai sottotitoli), con riserva in proporzione */
  const norma = w => String(w).toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu, '');
  function parola(k, w, n = 0, riserva = 0.5) {
    const f = SOTT[k];
    if (f && f.parole) {
      let c = 0;
      for (const p of f.parole) if (norma(p.w) === norma(w) || norma(p.w).startsWith(norma(w)) && norma(w).length > 3) { if (c === n) return p.t0; c++; }
    }
    return S(k) + D(k) * riserva;
  }

  const stage = document.getElementById('stage');
  const nCap = CONFIG.capitoli.length;
  const stato = IMP.monta(stage, { ente, formato, hud: CONFIG.hud[0], passiHUD: nCap, nota: CONFIG.nota });
  IMP.anteprima(stage);

  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: 30, zona: L.zona });

  /* ---------------------------------------------------------------- luci */
  scena.add(new THREE.HemisphereLight(0xdfe9ff, 0x1a2236, 1.05));
  const sole = new THREE.DirectionalLight(0xffffff, 1.6); sole.position.set(3, 6, 5); scena.add(sole);
  const contro = new THREE.DirectionalLight(0x7fb4ff, 0.9); contro.position.set(-4, 3, -4); scena.add(contro);

  /* ---------------------------------------------------------------- texture su canvas */
  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 1; return t;
  }
  const FT = "'Titillium Web', sans-serif", FM = "'Roboto Mono', monospace";
  function tondoRett(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function fiammaPath(g, x, y, s) {           // fiammella stilizzata con base in (x, y)
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x - s * .55, y - s * .05, x - s * .45, y - s * .6, x - s * .05, y - s);
    g.bezierCurveTo(x + s * .05, y - s * .62, x + s * .25, y - s * .55, x + s * .2, y - s * .82);
    g.bezierCurveTo(x + s * .55, y - s * .5, x + s * .55, y - s * .05, x, y);
    g.closePath();
  }
  function fiamma2D(g, x, y, s) {
    g.fillStyle = '#f97316'; fiammaPath(g, x, y, s); g.fill();
    g.fillStyle = '#fde047'; fiammaPath(g, x, y - s * .02, s * .55); g.fill();
  }

  /* ---------------------------------------------------------------- materiali */
  const metallo = () => new THREE.MeshStandardMaterial({ color: 0xb8c0ca, metalness: 0.75, roughness: 0.32 });
  const nero = () => new THREE.MeshStandardMaterial({ color: 0x1c1f24, metalness: 0.1, roughness: 0.6 });
  const tinta = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: 0.05, roughness: 0.55 }, o));
  const base = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));

  /* ---------------------------------------------------------------- pavimento e pedane */
  const pav = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), tinta(0x0d1729, { roughness: 1 }));
  pav.rotation.x = -Math.PI / 2; pav.position.set(10, 0, 0); scena.add(pav);
  const texAlone = tela(256, 256, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(70,140,255,.55)'); gr.addColorStop(.55, 'rgba(46,144,250,.16)'); gr.addColorStop(1, 'rgba(46,144,250,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  const texOmbra = tela(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.7)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  function alone(x, z, r) {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 48), base(0xffffff, { map: texAlone, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.002, z); scena.add(m); return m;
  }
  function ombra(gruppo, r) {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 32), base(0xffffff, { map: texOmbra, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.004; gruppo.add(m); return m;
  }
  const anelloPedana = (x, z, r) => {
    const m = new THREE.Mesh(new THREE.RingGeometry(r - 0.012, r, 96), base(0x2e90fa, { transparent: true, opacity: 0.55 }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.003, z); scena.add(m); return m;
  };

  /* ---------------------------------------------------------------- l'estintore */
  const TIPI = {
    polvere:   { R: .16, H: .74, nome: 'POLVERE',  classi: ['A', 'B', 'C'], agente: 0xefe3b5, gauge: true, uscita: 'tubo' },
    cartuccia: { R: .16, H: .74, nome: 'POLVERE',  classi: ['A', 'B', 'C'], agente: 0xefe3b5, gauge: false, uscita: 'tubo', cartuccia: true },
    co2:       { R: .12, H: .88, nome: 'CO₂',      classi: ['B'],           agente: 0xd5e8ff, gauge: false, uscita: 'cono', fascia: '#4b5563' },
    schiuma:   { R: .16, H: .74, nome: 'SCHIUMA',  classi: ['A', 'B'],      agente: 0xf5f8fb, gauge: true, uscita: 'tubo', fascia: '#e8d9a8' },
    acqua:     { R: .16, H: .74, nome: 'ACQUA',    classi: ['A'],           agente: 0x5cb3ff, gauge: true, uscita: 'tubo', fascia: '#2e90fa' },
    F:         { R: .15, H: .70, nome: 'CLASSE F', classi: ['F'],           agente: 0xcfeef0, gauge: true, uscita: 'lancia' },
    D:         { R: .16, H: .74, nome: 'CLASSE D', classi: ['D'],           agente: 0xd8d2c4, gauge: true, uscita: 'lancia', fascia: '#9ca3af' }
  };
  const COL_CLASSE = { A: '#34b25a', B: '#2e90fa', C: '#f59e0b', D: '#8b97a8', F: '#ef4136' };

  function etichetta(c) {
    return tela(512, 640, (g, w, h) => {
      g.fillStyle = '#f4f6f8'; g.fillRect(0, 0, w, h);
      g.fillStyle = c.fascia || '#d9dde3'; g.fillRect(0, 0, w, 70);
      g.fillStyle = '#0a1220'; g.font = '700 30px ' + FM; g.textAlign = 'center'; g.fillText('ESTINTORE', w / 2, 48);
      g.font = '900 ' + (c.nome.length > 6 ? 84 : 108) + 'px ' + FT; g.fillText(c.nome, w / 2, 210);
      const n = c.classi.length, d = 116, x0 = w / 2 - (n - 1) * d / 2;
      c.classi.forEach((k, i) => {
        g.fillStyle = COL_CLASSE[k]; g.beginPath(); g.arc(x0 + i * d, 330, 50, 0, 6.283); g.fill();
        g.fillStyle = '#fff'; g.font = '900 64px ' + FT; g.fillText(k, x0 + i * d, 352);
      });
      g.fillStyle = '#5b6573'; g.font = '500 24px ' + FM;
      ['1 · TOGLI LA SPINA', '2 · PUNTA ALLA BASE', '3 · PREMI LA LEVA'].forEach((r, i) => g.fillText(r, w / 2, 450 + i * 40));
      g.fillStyle = '#c8102e'; g.fillRect(0, h - 26, w, 26);
    });
  }
  function texManometro() {
    return tela(256, 256, (g, w) => {
      const c = w / 2;
      g.fillStyle = '#f8fafc'; g.beginPath(); g.arc(c, c, c, 0, 6.283); g.fill();
      g.lineWidth = 30;
      const arco = (a0, a1, col) => { g.strokeStyle = col; g.beginPath(); g.arc(c, c, c * .72, a0, a1); g.stroke(); };
      arco(Math.PI * .8, Math.PI * 1.25, '#ef4136'); arco(Math.PI * 1.25, Math.PI * 1.75, '#22a04b'); arco(Math.PI * 1.75, Math.PI * 2.2, '#ef4136');
      g.fillStyle = '#0a1220'; g.font = '700 30px ' + FM; g.textAlign = 'center'; g.fillText('bar', c, c + 70);
      g.lineWidth = 6; g.strokeStyle = '#1f2937'; g.beginPath(); g.arc(c, c, c - 4, 0, 6.283); g.stroke();
    });
  }
  const TEX_MANO = { t: null };

  /* ritorna { gruppo, corpo, interno, leva, spina, ago, ugello(), direzione(), taglio(d), livello(u), flusso(t,u), gas } */
  function estintore(tipo) {
    const c = TIPI[tipo], R = c.R, Hh = c.H;
    const g = new THREE.Group(), corpo = new THREE.Group(); g.add(corpo);
    const piano = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1e7);
    const rosso = new THREE.MeshStandardMaterial({ color: 0xb3161e, metalness: 0.15, roughness: 0.38, side: THREE.DoubleSide, clippingPlanes: [piano] });
    const prof = [[0, 0], [R * .82, 0], [R * .97, .014], [R, .05], [R, Hh - .07], [R * .93, Hh - .028], [R * .72, Hh - .004],
                  [R * .36, Hh + .018], [.042, Hh + .024], [.042, Hh + .05], [0, Hh + .05]].map(p => new THREE.Vector2(p[0], p[1]));
    const guscio = new THREE.Mesh(new THREE.LatheGeometry(prof, 56), rosso); corpo.add(guscio);
    // interno del guscio più scuro (si vede con lo spaccato)
    const dentro = new THREE.Mesh(new THREE.CylinderGeometry(R * .985, R * .985, Hh - .09, 48, 1, true),
      new THREE.MeshStandardMaterial({ color: 0x4a0b0e, roughness: .9, side: THREE.BackSide, clippingPlanes: [piano] }));
    dentro.position.y = (Hh - .09) / 2 + .03; corpo.add(dentro);
    const et = new THREE.Mesh(new THREE.CylinderGeometry(R + .002, R + .002, Hh * .5, 48, 1, true, -0.95, 1.9),
      new THREE.MeshStandardMaterial({ map: etichetta(c), roughness: .5, clippingPlanes: [piano] }));
    et.position.y = Hh * .5; corpo.add(et);
    // valvola
    const testa = new THREE.Mesh(new THREE.CylinderGeometry(.036, .04, .07, 24), metallo());
    testa.position.y = Hh + .085; g.add(testa);
    const manico = new THREE.Mesh(new THREE.BoxGeometry(.17, .016, .036), nero());
    manico.position.set(-.075, Hh + .075, 0); g.add(manico);
    const leva = new THREE.Group(); leva.position.set(.02, Hh + .125, 0); g.add(leva);
    const levaB = new THREE.Mesh(new THREE.BoxGeometry(.19, .016, .036), nero()); levaB.position.x = -.09; leva.add(levaB);
    leva.rotation.z = -0.22;
    const spina = new THREE.Group(); spina.position.set(-.035, Hh + .1, 0); g.add(spina);
    const spinaB = new THREE.Mesh(new THREE.CylinderGeometry(.005, .005, .09, 8), metallo()); spinaB.rotation.x = Math.PI / 2; spina.add(spinaB);
    const anello = new THREE.Mesh(new THREE.TorusGeometry(.018, .004, 8, 24), metallo()); anello.position.z = .055; spina.add(anello);
    const sigillo = new THREE.Mesh(new THREE.BoxGeometry(.012, .02, .006), tinta(0xffcc00)); sigillo.position.set(0, -.02, .07); spina.add(sigillo);
    let ago = null, faccia = null;
    if (c.gauge) {
      const cassa = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .014, 28), metallo());
      cassa.rotation.x = Math.PI / 2; cassa.position.set(.0, Hh + .09, .043); g.add(cassa);
      if (!TEX_MANO.t) TEX_MANO.t = texManometro();
      faccia = new THREE.Mesh(new THREE.CircleGeometry(.026, 32), base(0xffffff, { map: TEX_MANO.t }));
      faccia.position.set(0, Hh + .09, .0505); g.add(faccia);
      ago = new THREE.Mesh(new THREE.BoxGeometry(.003, .022, .001), base(0x0a1220)); ago.geometry.translate(0, .011, 0);
      ago.position.set(0, Hh + .09, .052); g.add(ago);
    }
    // uscita: tubo flessibile con ugello, cono (CO2) o lancia
    const p0 = new THREE.Vector3(.036, Hh + .08, 0);
    const curva = c.uscita === 'cono'
      ? new THREE.CatmullRomCurve3([p0, new THREE.Vector3(.09, Hh + .07, .01), new THREE.Vector3(R + .04, Hh - .08, .05), new THREE.Vector3(R + .05, Hh * .55, .07)])
      : new THREE.CatmullRomCurve3([p0, new THREE.Vector3(.09, Hh + .06, .015), new THREE.Vector3(R + .03, Hh - .1, .04), new THREE.Vector3(R + .04, Hh * .42, .06), new THREE.Vector3(R + .025, Hh * .2, .075)]);
    const tubo = new THREE.Mesh(new THREE.TubeGeometry(curva, 40, c.uscita === 'cono' ? .014 : .011, 10), nero()); g.add(tubo);
    const fine = curva.getPoint(1), tang = curva.getTangent(1).normalize();
    let punta = fine.clone(), dirLocale = tang.clone();
    if (c.uscita === 'cono') {
      const cono = new THREE.Mesh(new THREE.CylinderGeometry(.055, .014, .17, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: .5, side: THREE.DoubleSide }));
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), tang);
      cono.quaternion.copy(q); cono.position.copy(fine).addScaledVector(tang, .085); g.add(cono);
      const imp = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, .05, 12), tinta(0x3a3f47)); imp.quaternion.copy(q); imp.position.copy(fine).addScaledVector(tang, -.01); g.add(imp);
      punta = fine.clone().addScaledVector(tang, .17);
    } else if (c.uscita === 'lancia') {
      const dl = new THREE.Vector3(.5, -.15, .85).normalize(), lung = .32;
      const lancia = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, lung, 10), metallo());
      lancia.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dl); lancia.position.copy(fine).addScaledVector(dl, lung / 2); g.add(lancia);
      punta = fine.clone().addScaledVector(dl, lung); dirLocale = dl;
    } else {
      const ug = new THREE.Mesh(new THREE.CylinderGeometry(.009, .014, .04, 12), nero());
      ug.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), tang); ug.position.copy(fine).addScaledVector(tang, .02); g.add(ug);
      punta = fine.clone().addScaledVector(tang, .04);
    }
    ombra(g, R * 2.4);

    // interno (visibile con lo spaccato)
    const interno = new THREE.Group(); interno.visible = false; g.add(interno);
    const alto = Hh - .06, basso = .03, rIn = R * .93;
    const agMat = tinta(c.agente, { roughness: tipo === 'acqua' ? .2 : .95, transparent: tipo === 'acqua', opacity: tipo === 'acqua' ? .85 : 1 });
    const agente = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rIn, 1, 40), agMat);
    interno.add(agente);
    const gasMat = base(0x7cc4ff, { transparent: true, opacity: .22, depthWrite: false });
    const gas = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rIn, 1, 40, 1, true), gasMat); interno.add(gas);
    const pescante = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, alto - basso + .06, 10), tinta(0xdde3ea, { metalness: .6, roughness: .3 }));
    pescante.position.set(0, (alto + basso) / 2 + .03, 0); interno.add(pescante);
    let cart = null;
    if (c.cartuccia) {
      cart = new THREE.Mesh(new THREE.CylinderGeometry(.028, .028, .22, 20), tinta(0xd4a017, { metalness: .7, roughness: .3 }));
      cart.position.set(-.07, alto - .14, 0); interno.add(cart);
      const coll = new THREE.Mesh(new THREE.CylinderGeometry(.012, .028, .03, 16), tinta(0xa0780e, { metalness: .7, roughness: .3 }));
      coll.position.set(-.07, alto - .015, 0); interno.add(coll);
    }
    // molecole di gas (punti che si agitano) e flusso dell'agente (punti lungo pescante e tubo)
    const NM = 70, mPos = new Float32Array(NM * 3), mGeo = new THREE.BufferGeometry();
    mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
    const molecole = new THREE.Points(mGeo, new THREE.PointsMaterial({ color: 0xbfe3ff, size: .012, transparent: true, opacity: .95, depthWrite: false }));
    molecole.frustumCulled = false; interno.add(molecole);
    const NF = 90, fPos = new Float32Array(NF * 3), fGeo = new THREE.BufferGeometry();
    fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));

    const kBus = busFuoco * mix(1, .45, ease.morbida(prog(t, tLevaB + .3, 2.5)));
    fuocoBus.aggiorna(t, k >= 6 && k <= 7 ? kBus : 0, k >= 6 && k <= 7 ? .5 : 0);
    // --- camion: fuoco alle ruote posteriori, il camionista si allontana
    const kT = fin(t, S(8) + 1.0, E(8) + .8, 1.0, .8) * (1 + .4 * ease.morbida(prog(t, parola(8, 'carico') - .2, 2)));
    fuocoTir.aggiorna(t, k === 8 ? kT : 0, k === 8 ? .7 : 0);
    const via = ease.morbida(prog(t, parola(8, 'allontanati') - .3, 2.6));
    camionista.position.copy(tir.punto(mix(3.0, 6.5, via), 0, mix(1.6, 4.4, via))); guarda(camionista, tir.punto(3, 0, 1.6), tir.punto(6.5, 0, 4.4));
    camionista.visible = k === 8;
    viaTir.visible = k === 8 && t > parola(8, 'avvicinarti') - .2;
    viaTir.children[0].material.opacity = .45 + .45 * Math.abs(Math.sin(t * 3));
    // --- elettrica: carrozzeria che sale (vista esplosa), celle che si scaldano una dopo l'altra
    const su = ease.morbida(prog(t, parola(9, 'batteria') - .3, 1.2)) * (1 - ease.morbida(prog(t, E(9) - .4, .8)));
    autoE.carro.position.y = 1.15 * su;
    const tCalda = parola(9, 'fuoco') - .5;
    celle.forEach(c => {
      const caldo = clamp(prog(t, tCalda + c.ordine * 1.4, .6)) * (t < E(10) + .5 ? 1 : 0);
      c.m.material.color.setHex(caldo > .5 ? 0xef4444 : 0x3b82f6);
      c.m.material.emissive.setRGB(caldo * .9, caldo * .25, 0);
    });
    const tGettoE = parola(9, 'estintore') - .3;
    const gE = fin(t, tGettoE, tGettoE + 1.8, .2, .3) * (k === 9 ? 1 : 0);
    gettoE.aggiorna(t, gE, autoE.punto(1.6, .7, 2.4), autoE.punto(.3, .35, .6), .3, 0);
    const kE = clamp(prog(t, parola(9, 'riaccendersi') - .6, .8)) * (k >= 9 && k <= 10 ? 1 : 0) * (1 - .6 * gE);
    fuocoE.aggiorna(t, kE * .9, k >= 9 && k <= 10 ? .6 * kE : 0);
    // vento e persona che si allontana sopravento
    const vU = ease.morbida(prog(t, S(10) + .3, 2.8));
    guidatoreE.position.copy(autoE.punto(mix(1.6, 2.6, vU), 0, mix(2.4, 5.2, vU))); guidatoreE.visible = k >= 9 && k <= 10;
    vento.forEach((f, i) => {
      const s = (t * .35 + i / 3) % 1;
      f.position.copy(autoE.punto(1.0 + (i - 1) * 1.1, .02, 6.4 - s * 2.4)); f.rotation.y = Math.PI / 2;
      f.children[0].material.opacity = (k === 10 ? 1 : 0) * Math.sin(Math.PI * s) * .9; f.visible = k === 10;
    });
    // --- GPL: baule aperto, sfiato della valvola, fiamme che si avvicinano
    const bG = ease.morbida(prog(t, S(11) + .2, 1.2));
    autoG.baule.rotation.z = -1.3 * bG;
    const kG = fin(t, parola(11, 'fiamme') - .2, E(11) + .5, .8, .6);
    fuocoG.aggiorna(t, k === 11 ? kG * .8 : 0, k === 11 ? .4 : 0);
    sfiato.aggiorna(t, k === 11 ? clamp(prog(t, parola(11, 'valvole'), .6)) * .9 : 0);
    serb.visible = bG > .4;
  }

  function render(t) {
    t = clamp(t, 0, TOTAL); tAttuale = t;
    cam.applica(t);
    camera.near = .05; camera.far = 120; camera.updateProjectionMatrix();
    anima(t);
    vicino.disegna(scena, camera);
    const k = sceneA(t), c = CONFIG.capitoloDi[k], sc = SC[k];
    const primaDelCap = CONFIG.capitoloDi.indexOf(c);
    IMP.aggiorna(stato, t, { passoHUD: c + (k === 0 ? 1 : (k === primaDelCap ? clamp((t - sc.inizio) / .4) : 1)), hud: CONFIG.hud[k], notaVisibile: true });
    IMP.sottotitoli(stato, t, FRASI, { modo: CONFIG.modo });
    proiezioni = {};
    for (const s of SCH) {
      let punto = null, vis = true, p = null;
      if (s.punto) { p = M3.proietta(s.punto(), camera, { zona: L.zonaSchede, margine: L.margine }); punto = p.punto; vis = p.visibile; }
      proiezioni[s.id] = p;
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, colore: s.colore, punto, verso: s.verso,
        inizio: s.inizio, fine: s.fine, visibile: vis,
        centro: s.punto ? null : { x: W / 2, y: s.id === 'fine' ? (L.zona.alto + L.zona.basso) / 2 - (ORIZ ? 230 : 300) : (L.zona.alto + L.zona.basso) / 2 - (ORIZ ? 200 : 260) } });
    }
    const testo = k === SC.length - 1 ? CONFIG.fonte : '';
    if (fonte.textContent !== testo) fonte.textContent = testo;
    fonte.style.display = testo ? '' : 'none';
    fonte.style.left = L.margine + 'px';
    fonte.style.top = (L.zona.basso - fonte.offsetHeight - 6) + 'px';
  }

  window.renderFrame = t => render(t);
  window.__controlli = () => IMP.controlli(stato)
    .concat(M3.controlliSchede(tAttuale, SCH.filter(s => s.punto).map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine, proiezione: proiezioni[s.id], attivo: true }))))
    .concat(PROBLEMI_TEMPI.filter(p => tAttuale >= p.inizio && tAttuale <= p.fine));
  IMP.caricaFont().then(() => { scena.updateMatrixWorld(true); render(0); window.__ready = true; });
})();
</script>
