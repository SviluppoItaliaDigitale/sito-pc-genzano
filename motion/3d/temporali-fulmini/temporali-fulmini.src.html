<script>
/* ============================================================ CONFIG ============ */
const CONFIG = {
  titolo: 'Temporali e fulmini: come stare al sicuro',
  ente: 'pc-genzano',
  formato: 'verticale',
  hud: ['TEMPORALI', 'PRIMA DI USCIRE', 'IL TUONO', 'IL RIPARO', "ALL'APERTO", 'IN CASA', 'DOPO'],
  esagerazione: 2,                                   // rilievo ×2: lo dice la nota
  notaRilievo: 'SIMULAZIONE · RILIEVO ×2 · NON IN SCALA',
  notaPlastico: 'SCHEMA · NON IN SCALA',
  fonte: 'Fonte: Dipartimento della Protezione Civile, «In caso di temporali e fulmini»',
  chiave: ['temporale', 'previsioni', "l'allerta", 'scuro', 'tuono', 'chilometri', 'pericolo', 'chiuso', 'edificio', "l'automobile",
           'chiusi', 'albero', 'alte', 'appuntite', 'pali', 'tralicci', 'recinzioni', "dall'acqua", 'finestre', 'spine', 'fisso',
           'cellulare', 'dopo', '30', 'minuti', '112'],
  modo: 'parole',
  genzano: { lat: 41.7075, lon: 12.6895 },
  laghi: [{ nome: 'Lago Albano', lat: 41.750, lon: 12.665, profondita: 167 }, { nome: 'Lago di Nemi', lat: 41.715, lon: 12.700, profondita: 33 }],
  nube: { lat: 41.750, lon: 12.738 },                // centro del nuvolone, sopra i boschi a est di Monte Cavo
  colpo: { lat: 41.746, lon: 12.744 }                // dove cadono i fulmini lontani (bosco, non un paese)
};
function dato(nome) {
  const e = document.getElementById('dato-' + nome), s = e ? e.textContent.trim() : '';
  return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s);
}
const RILIEVO = dato('rilievo');
const TEMPI = dato('tempi') || { totale: 84.65,
  scene: [[0, 11.46, 2.6], [11.46, 10.24, 12.76], [21.7, 11.54, 22.7], [33.24, 12.44, 34.34], [45.68, 12.42, 46.78], [58.1, 14.71, 60.3], [72.81, 11.84, 74.71]]
    .map(a => ({ inizio: a[0], durata: a[1], voce: a[2] })),
  eventi: { tuffo: 1.5, lampo0: 8.27, lampo2: 22.0, tuono2: 22.81, zoom: 28.84, entra: 31.99, lampo4: 49.69, apre: 58.35, esce: 73.56, lampo6: 74.56 } };
const SOTT = dato('sottotitoli') || [];
// le frasi lunghe si mostrano a pezzi (frasi intere), così il sottotitolo resta su tre righe
const FRASI = [];
SOTT.forEach(f => {
  const chiave = (f.chiave || []).concat(CONFIG.chiave), P = f.parole || [];
  const parti = String(f.testo).trim().split(/\s+/);
  if (f.testo.length <= 96 || P.length !== parti.length) { FRASI.push(Object.assign({}, f, { chiave })); return; }
  let da = 0, n = 0;
  const chiudi = a => {
    FRASI.push({ inizio: da === 0 ? f.inizio : P[da].t0, fine: a === parti.length ? f.fine : P[a].t0 - .02,
      testo: parti.slice(da, a).join(' '), parole: P.slice(da, a), chiave });
    da = a;
  };
  for (let i = 0; i < parti.length; i++) {
    n += parti[i].length + 1;
    const fineFrase = /[.:;?!]$/.test(parti[i]) && i < parti.length - 1;
    const resto = parti.slice(i + 1).join(' ').length;
    if (fineFrase && n > 24 && resto > 18) { chiudi(i + 1); n = 0; }
  }
  if (da < parti.length) chiudi(parti.length);
});
/* ============================================================ fine CONFIG ======= */

(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const Q = new URLSearchParams(location.search);
  const formato = Q.get('formato') || CONFIG.formato, ente = CONFIG.ente;
  const L = IMP.layout(formato), W = L.W, H = L.H, ORIZ = formato === 'orizzontale';
  const SC = TEMPI.scene, EV = TEMPI.eventi, TOTAL = TEMPI.totale;
  const S = i => SC[i].inizio, D = i => SC[i].durata, E = i => SC[i].inizio + SC[i].durata;
  window.TOTAL = TOTAL; window.STAGE_W = W; window.STAGE_H = H;
  document.title = CONFIG.titolo;
  const { clamp, prog, mix, hash } = M3;
  const fin = M3.finestra;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const liscia = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  const esplodi = u => { u = clamp(u); return u * u * u * (u * (6 * u - 15) + 10); };   // parte e arriva piano
  const AZZ = '#2e90fa', ROSSO = '#ef4136', AMBRA = '#f59e0b', VERDE = '#22a04b';

  /* istante di una parola detta nella scena k (dai sottotitoli) */
  const norma = w => String(w).toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu, '');
  function parola(k, w, n = 0, riserva = 0.5) {
    const f = SOTT[k];
    if (f && f.parole) {
      let c = 0;
      for (const p of f.parole) if (norma(p.w) === norma(w) || norma(p.w).startsWith(norma(w)) && norma(w).length > 3) { if (c === n) return p.t0; c++; }
    }
    return S(k) + D(k) * riserva;
  }

  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente, formato, hud: CONFIG.hud[0], passiHUD: SC.length, nota: CONFIG.notaRilievo });
  IMP.anteprima(stage);

  const livR = M3.creaRenderer(document.getElementById('livello-rilievo'), W, H, { scala: 0.8 });
  const livP = M3.creaRenderer(document.getElementById('livello-plastico'), W, H, { scala: 0.8 });
  const scenaR = new THREE.Scene(), scenaP = new THREE.Scene();
  const camR = M3.creaCamera(W, H, { fov: 32, zona: L.zona }), camP = M3.creaCamera(W, H, { fov: 32, zona: L.zona });

  /* ---------------------------------------------------------------- aiuti di costruzione */
  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 1; return t;
  }
  const tinta = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: 0.03, roughness: 0.75 }, o));
  const base = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
  const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  const cil = (r1, r2, h, mat, seg = 14) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  const metti = (m, x, y, z, g) => { m.position.set(x, y, z); if (g) g.add(m); return m; };
  const SU = V(0, 1, 0);
  function orientaAsta(m, a, b) {                     // mette un'asta lunga 1 (asse y) fra i punti a e b
    const d = b.clone().sub(a), l = d.length();
    m.position.copy(a).addScaledVector(d, .5);
    m.scale.y = Math.max(l, 1e-6);
    m.quaternion.setFromUnitVectors(SU, d.normalize());
    return m;
  }
  const asta = (a, b, sp, mat, g) => { const m = orientaAsta(box(sp, 1, sp, mat), a, b); if (g) g.add(m); return m; };
  function tettoPrisma(larg, alt, lung, mat) {        // tetto a due falde: colmo lungo z, largo «larg» in x
    const s = new THREE.Shape(); s.moveTo(-larg / 2, 0); s.lineTo(larg / 2, 0); s.lineTo(0, alt); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: lung, bevelEnabled: false }); g.translate(0, 0, -lung / 2);
    return new THREE.Mesh(g, mat);
  }
  const texAlone = tela(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(225,238,255,.5)'); gr.addColorStop(1, 'rgba(210,230,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  /* distintivi: spunta verde, croce rossa del divieto («no»), orologio ambra («dopo») */
  const texDistintivo = tipo => tela(160, 160, (g, w) => {
    const c = w / 2;
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(c, c, c - 2, 0, 6.283); g.fill();
    g.fillStyle = tipo === 'ok' ? VERDE : tipo === 'no' ? ROSSO : AMBRA; g.beginPath(); g.arc(c, c, c - 11, 0, 6.283); g.fill();
    g.strokeStyle = tipo === 'dopo' ? '#0a1220' : '#ffffff'; g.lineWidth = 17; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
    if (tipo === 'ok') { g.moveTo(c - 36, c + 3); g.lineTo(c - 11, c + 28); g.lineTo(c + 38, c - 26); }
    else if (tipo === 'no') { g.moveTo(c - 30, c - 30); g.lineTo(c + 30, c + 30); g.moveTo(c + 30, c - 30); g.lineTo(c - 30, c + 30); }
    else { g.lineWidth = 12; g.arc(c, c, 44, 0, 6.283); g.moveTo(c, c - 30); g.lineTo(c, c); g.lineTo(c + 22, c + 14); }
    g.stroke();
  });
  const TEX = { ok: texDistintivo('ok'), no: texDistintivo('no'), dopo: texDistintivo('dopo') };
  const DISTINTIVI = [];
  function distintivo(tipo, pos, lato, inizio, fine, genitore) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX[tipo], transparent: true, depthTest: false, depthWrite: false }));
    s.renderOrder = 30; s.position.copy(pos); genitore.add(s);
    DISTINTIVI.push({ s, lato, inizio, fine });
    return s;
  }
  /* fulmine: spezzata fra due punti con uno scarto laterale deterministico, due rami e un alone locale (mai a tutto schermo) */
  function fulmine(da, a, o) {
    const g = new THREE.Group(), sp = o.spessore, seme = o.seme || 1, n = o.pezzi || 13;
    const matN = base(0xfffbe6, { transparent: true, depthWrite: false }), matA = base(0xa9cdff, { transparent: true, depthWrite: false });
    const asse = a.clone().sub(da), lung = asse.length(), dir = asse.clone().normalize();
    const lato1 = V(dir.z, 0, -dir.x).normalize(); if (lato1.lengthSq() < .5) lato1.set(1, 0, 0);
    const lato2 = dir.clone().cross(lato1).normalize();
    const punto = (u, s) => da.clone().addScaledVector(asse, u)
      .addScaledVector(lato1, (hash(s * 3.1 + u * 97) - .5) * lung * .16 * Math.sin(Math.PI * u) ** .6)
      .addScaledVector(lato2, (hash(s * 5.7 + u * 53) - .5) * lung * .10 * Math.sin(Math.PI * u) ** .6);
    const pts = []; for (let i = 0; i <= n; i++) pts.push(i === 0 ? da.clone() : i === n ? a.clone() : punto(i / n, seme));
    for (let i = 0; i < n; i++) { asta(pts[i], pts[i + 1], sp, matN, g); asta(pts[i], pts[i + 1], sp * 3.2, matA, g); }
    [4, 8].forEach((k, j) => {                         // due rami che si perdono a metà strada
      let p = pts[k].clone();
      for (let i = 1; i <= 4; i++) {
        const q = p.clone().addScaledVector(dir, lung * .06).addScaledVector(lato1, (j ? -1 : 1) * lung * (.035 + .03 * hash(seme + i * 7 + j)))
          .addScaledVector(lato2, (hash(seme * 2 + i * 3 + j) - .5) * lung * .05);
        asta(p, q, sp * .6, matN, g); p = q;
      }
    });
    const alone = new THREE.Sprite(new THREE.SpriteMaterial({ map: texAlone, transparent: true, depthWrite: false, depthTest: false }));
    alone.position.copy(a); alone.scale.setScalar(o.alone); alone.renderOrder = 8; g.add(alone);
    g.renderOrder = 7;
    return { gruppo: g, forza(k) { g.visible = k > .01; matN.opacity = k; matA.opacity = .28 * k; alone.material.opacity = .3 * k; } };
  }
  /* un solo lampo per fulmine: pieno per un decimo di secondo, poi si spegne in mezzo secondo (mai più di 2 al secondo) */
  const lampo = (t, t0) => { const d = t - t0; return d < 0 || d > .62 ? 0 : d < .1 ? 1 : Math.exp(-(d - .1) / .13) * (1 - liscia((d - .42) / .2)); };

  /* ================================================================ MONDO 1: IL RILIEVO VERO (chilometri) */
  const ril = M3.rilievo(RILIEVO || M3.rilievoDiProva(), { esagerazione: CONFIG.esagerazione, laghi: RILIEVO ? CONFIG.laghi : [], passo: 1 });
  scenaR.add(ril.gruppo);
  const matRilievo = []; ril.gruppo.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.color && !matRilievo.includes(m)) matRilievo.push(m); }); });
  scenaR.add(new THREE.HemisphereLight(0xffffff, 0x4a5466, 2.3));
  const soleR = new THREE.DirectionalLight(0xfff6ea, 1.5); soleR.position.set(-6, 9, 7); scenaR.add(soleR);
  const GEN = CONFIG.genzano, pGen = m => ril.sopra(GEN.lat, GEN.lon, m);
  const pColpo = ril.sopra(CONFIG.colpo.lat, CONFIG.colpo.lon, 0);
  const cNube = ril.posizione(CONFIG.nube.lat, CONFIG.nube.lon, 0);
  const Y_NUBE = 3.7;

  // il nuvolone: sbuffi che crescono dal basso verso l'alto (scena 0) e una coltre che si allarga (scena 1)
  const nube = new THREE.Group(); scenaR.add(nube);
  const matNube = new THREE.MeshLambertMaterial({ color: 0xe3e8f0, emissive: 0xbcd2ff, emissiveIntensity: 0 });
  const geoSbuffo = new THREE.SphereGeometry(1, 20, 14);
  const SBUFFI = [];
  const sbuffo = (x, y, z, r, sy, quando, durata) => {
    const m = new THREE.Mesh(geoSbuffo, matNube); m.position.set(cNube.x + x, y, cNube.z + z); nube.add(m);
    SBUFFI.push({ m, r, sy, quando, durata });
  };
  const T0N = 2.9;                                    // la nube comincia a crescere qui
  for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283 + hash(i) * .6, d = i === 0 ? 0 : .9 + 1.5 * hash(i * 3.3);
    sbuffo(Math.cos(a) * d, Y_NUBE + .25 * hash(i * 7), Math.sin(a) * d, 1.25 + .55 * hash(i * 1.7), .62, T0N + .5 * hash(i * 2.3), 1.9); }
  for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + 1 + hash(i + 20) * .5, d = .3 + .9 * hash(i * 3.3 + 20);
    sbuffo(Math.cos(a) * d, Y_NUBE + 1.25 + .3 * hash(i + 30), Math.sin(a) * d, 1.1 + .4 * hash(i * 1.7 + 20), .8, T0N + 1.2 + .5 * hash(i * 2.3 + 20), 1.9); }
  for (let i = 0; i < 4; i++) { const a = i / 4 * 6.283 + 2 + hash(i + 40) * .5, d = .2 + .55 * hash(i * 3.3 + 40);
    sbuffo(Math.cos(a) * d, Y_NUBE + 2.5 + .3 * hash(i + 50), Math.sin(a) * d, .95 + .35 * hash(i * 1.7 + 40), .9, T0N + 2.0 + .5 * hash(i * 2.3 + 40), 1.9); }
  for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + hash(i + 60) * .5, d = i === 0 ? 0 : 1.5 + .9 * hash(i * 3.3 + 60);   // incudine
    sbuffo(Math.cos(a) * d + .5, Y_NUBE + 3.55, Math.sin(a) * d - .3, 1.45 + .5 * hash(i * 1.7 + 60), .36, T0N + 2.9 + .4 * hash(i * 2.3 + 60), 1.9); }
  const tScuro = parola(1, 'cielo') - .35;            // la coltre si allarga verso i laghi quando «il cielo si fa scuro»
  const versoGen = pGen(0).sub(cNube).setY(0).normalize(), traverso = V(-versoGen.z, 0, versoGen.x);
  for (let i = 0; i < 12; i++) { const lungo = .6 + 2.6 * (i / 11), lato = (hash(i * 9.1 + 3) - .5) * 4.6;
    sbuffo(versoGen.x * lungo + traverso.x * lato, Y_NUBE - .05 + .2 * hash(i + 80), versoGen.z * lungo + traverso.z * lato,
           1.5 + .7 * hash(i * 1.3 + 80), .3, tScuro + .28 * lungo, 1.5); }
  // la pioggia sotto la nube
  const pioggiaR = M3.particelle({ tipo: 'pioggia', centro: [cNube.x - .4, 1.9, cNube.z + .4], dimensioni: [7.5, 2.9, 7.5], numero: 950,
                                   vento: [.5, .25], lunghezza: .22, opacita: .6, seme: 3 });
  nube.add(pioggiaR.oggetto);

  etichetta('P', 'tralicci', 'Tralicci', () => V(XB + TRA.x, 8.2, TRA.z), vs(150, 26), T.tralicci - .15, E(4) - .15, AMBRA);
  etichetta('P', 'recinzioni', 'Recinzioni di metallo', () => V(XB + 4, 1.3, ZR), vs(-60, 74), T.recinzioni - .15, E(4) - .15, AMBRA);
  etichetta('P', 'acqua', 'Acqua', () => V(XB + ACQ.x, .1, ACQ.z), vs(120, -52), T.acqua - .15, E(4) - .15, AMBRA);
  etichetta('P', 'finestre', 'Finestre chiuse', () => mondoC(-3.1, 2.5, -LZ), vs(210, 40), T.finestre - .1, C5.tv0 + .35, VERDE);
  etichetta('P', 'spine', 'Spine staccate', () => mondoC(CIAB.x, .3, CIAB.z + .1), vs(140, 120), T.spine + 1.1, C5.tel0 + .35, VERDE);
  etichetta('P', 'fisso', 'Telefono fisso: no', () => mondoC(FISSO.x - .05, 1.22, FISSO.z), vs(-190, -70), T.fisso - .1, C5.acq0 + .3, ROSSO);
  etichetta('P', 'cellulare', 'Cellulare: sì', () => mondoC(CELL.x + .03, 1.22, CELL.z), vs(170, -70), T.cellulare - .1, C5.acq0 + .3, VERDE);
  etichetta('P', 'dopo', 'Doccia e piatti: dopo il temporale', () => mondoC(PIATTI.x - .15, 1.4, PIATTI.z), vs(-260, 200), T.dopo5 - .25, C5.fine0 + .3, AMBRA);
  // distintivi: spunte, croci e orologi accanto agli oggetti
  distintivo('ok', V(-3.2, 6.6, -2.6), 1.5, T.riparo + .25, T.se3 + .3, areaA);
  distintivo('ok', V(.2, 2.35, 9.2), .8, T.va + .45, T.chiusi + .5, areaA);
  distintivo('no', V(-6.3, 3.5, 2.6), 1.25, T.tettoie, null, areaA);
  distintivo('no', V(6.3, 4.4, 2.6), 1.25, T.gazebo, null, areaA);
  distintivo('no', V(2.1, 4.9, -1.9), 1.25, T.balconi, null, areaA);
  distintivo('no', V(ALB.x + .9, 1.5, ALB.z + 1.2), 1.1, S(4) + 1.25, T.fulmini + .6, areaB);
  distintivo('ok', V(-3.1, 2.5, -LZ + .1), .42, T.finestre - .1, null, casaC);
  distintivo('ok', V(CIAB.x, .3, CIAB.z + .1), .3, T.spine + 1.1, null, casaC);
  distintivo('no', V(FISSO.x - .05, 1.22, FISSO.z), .26, T.fisso - .1, null, casaC);
  distintivo('ok', V(CELL.x + .03, 1.22, CELL.z), .26, T.cellulare - .1, null, casaC);
  distintivo('dopo', V(DOC.x - .1, 2.5, DOC.z + .35), .5, T.doccia + .35, null, casaC);
  distintivo('dopo', V(PIATTI.x - .15, 1.4, PIATTI.z), .5, T.piatti + .15, null, casaC);

  const PROBLEMI_TEMPI = M3.controllaTempi(cam1, SCH.filter(s => s.cam === 'R').map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine })), [])
    .concat(M3.controllaTempi(cam2, SCH.filter(s => s.cam === 'P').map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine })), []));
  PROBLEMI_TEMPI.forEach(p => console.warn('Controllo tempi:', p.chi.join(', '), '·', p.dettagli));

  // etichette nel DOM (con il loro filo), controllate insieme alle schede da IMP.controlli
  const strato = document.getElementById('strato'), linee = document.getElementById('strato-linee');
  strato.style.width = W + 'px'; strato.style.height = H + 'px';
  linee.setAttribute('width', W); linee.setAttribute('height', H); linee.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const SVGNS = 'http://www.w3.org/2000/svg';
  ET.forEach(e => {
    const d = document.createElement('div'); d.className = 'et' + (e.nuda ? ' nuda' : ''); d.id = 'et-' + e.id; d.dataset.componente = 'et-' + e.id;
    if (!e.nuda) { d.dataset.scatola = '1'; d.style.borderColor = e.colore || AZZ; }
    d.textContent = e.testo; strato.appendChild(d); e.el = d;
    const g = document.createElementNS(SVGNS, 'g');
    const riga = (c, w) => { const l = document.createElementNS(SVGNS, 'line'); l.setAttribute('stroke', c); l.setAttribute('stroke-width', w); l.setAttribute('stroke-linecap', 'round'); g.appendChild(l); return l; };
    e.ombra = riga('rgba(0,0,0,.45)', 6); e.riga = riga('#ffffff', 2.5);
    const p = document.createElementNS(SVGNS, 'circle'); p.setAttribute('r', e.nuda ? 5 : 7); p.setAttribute('fill', '#ffffff'); p.setAttribute('stroke', e.colore || '#0a1220'); p.setAttribute('stroke-width', 2.5); g.appendChild(p);
    e.pallino = p; e.g = g; linee.appendChild(g);
  });
  // orologio dei 30 minuti
  const quadrante = document.getElementById('quadrante');
  const svg = (tag, attr) => { const e = document.createElementNS(SVGNS, tag); for (const k in attr) e.setAttribute(k, attr[k]); quadrante.appendChild(e); return e; };
  svg('circle', { r: 94, fill: '#0a1220', stroke: '#eef2f7', 'stroke-width': 7 });
  const spicchio = svg('path', { fill: AMBRA, opacity: .92 });
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.2832; svg('line', { x1: Math.sin(a) * 76, y1: -Math.cos(a) * 76, x2: Math.sin(a) * 88, y2: -Math.cos(a) * 88, stroke: '#eef2f7', 'stroke-width': i % 3 ? 3 : 6, 'stroke-linecap': 'round' }); }
  const lancetta = svg('line', { x1: 0, y1: 0, x2: 0, y2: -70, stroke: '#ffffff', 'stroke-width': 7, 'stroke-linecap': 'round' });
  svg('circle', { r: 8, fill: '#ffffff' });
  const elTitolo = document.getElementById('titolo'), elOrologio = document.getElementById('orologio'), elEmergenza = document.getElementById('emergenza');
  const el112 = elEmergenza.querySelector('.n'), elSito = elEmergenza.querySelector('.w'), elR1 = elTitolo.querySelector('.r1'), elR2 = elTitolo.querySelector('.r2');
  [elTitolo, elOrologio, elEmergenza].forEach(e => { e.style.left = L.margine + 'px'; e.style.top = (L.zonaSchede.alto + 16) + 'px'; });
  elOrologio.style.width = elEmergenza.style.width = (ORIZ ? 800 : W - 2 * L.margine) + 'px';
  if (ORIZ) { elOrologio.style.left = elEmergenza.style.left = (W - L.margine - 800) + 'px'; elOrologio.style.height = '210px'; el112.style.fontSize = '170px'; elR1.style.fontSize = '72px'; elR2.style.fontSize = '44px'; }
  const blocco = (el, v) => { el.style.opacity = v.toFixed(3); el.style.transform = 'translateY(' + ((1 - esplodi(v)) * 18).toFixed(1) + 'px)'; };

  const fonte = document.getElementById('fonte');
  fonte.style.fontFamily = IMP.ENTI[ente].font.testo;
  const sceneA = t => { let k = 0; SC.forEach((s, i) => { if (t >= s.inizio) k = i; }); return k; };
  let tAttuale = 0, proiezioni = {};
  const colNube = new THREE.Color(), CHIARA = new THREE.Color(0xf4f6fa), SCURA = new THREE.Color(0x7d8696);
  const colCima = new THREE.Color(), CIMA_VERDE = new THREE.Color(0x4a9a54), CIMA_BRUCIATA = new THREE.Color(0x2a2620);

  /* ================================================================ ANIMAZIONE */
  function animaRilievo(t) {
    // la nube cresce, si scurisce, poi se ne va
    const via = viaNube(t);
    for (const s of SBUFFI) { const g = esplodi(prog(t, s.quando, s.durata)) * (1 - .25 * via), r = s.r * g; s.m.visible = g > .01; s.m.scale.set(r, r * s.sy, r); }
    nube.position.set(ALLONTANA.x * via, 0, ALLONTANA.z * via);
    const buio = clamp(.3 * liscia(prog(t, T0N + 2.5, 3)) + .7 * liscia(prog(t, tScuro, 1.9))) * (1 - liscia(prog(t, S(6) + 1.2, 5.5)));
    let lampi = 0;
    for (const x of FULMINI_R) { const k = lampo(t, x.t); x.f.forza(k); lampi = Math.max(lampi, k); }
    colNube.copy(CHIARA).lerp(SCURA, buio); matNube.color.copy(colNube); matNube.emissiveIntensity = .12 * lampi;
    const luce = 1 - .46 * buio;
    for (const m of matRilievo) m.color.setScalar(luce);
    pioggiaR.aggiorna(t, clamp(liscia(prog(t, EV.lampo0 - .2, 2.2)) * (1 - liscia(prog(t, S(6) + .8, 3.2)))));
    // anelli del tuono e linea della distanza
    ANELLI.forEach((A, i) => {
      const d = t - EV.lampo2 - i * .2, r = d * vAnello;
      aggiornaAnello(A, r, .03 + .004 * r, d < 0 ? 0 : (.8 - .12 * i) * (1 - liscia((r - dGen * .85) / (dGen * .6))));
    });
    const cresce = prog(t, T.pochi - .75, .7), vl = fin(t, T.pochi - .75, EV.zoom + .1, .1, .5);
    lineaDist.forEach(l => { l.m.visible = vl > .01 && l.u <= cresce; l.m.material.opacity = vl; });
    anelloGen.oggetto.position.copy(pGen(8)); anelloGen.aggiorna(t, { inizio: T.guarda - .3, fine: T.se1 - .3 });
    anelloGenR.oggetto.position.copy(pGen(8)); anelloGenR.aggiorna(t, { inizio: EV.tuono2 - .05, fine: EV.zoom + .4 });
  }
  function animaPlastici(t) {
    const k = sceneA(t), inA = t < S(4) + .9, inB = t > S(4) + .1 && t < S(5) + 1.0, inC = t > S(5) + .1;
    areaA.visible = inA; areaB.visible = inB; areaC.visible = inC;
    pioggiaA.oggetto.visible = inA; pioggiaB.oggetto.visible = inB; pioggiaC.oggetto.visible = inC;
    if (inA) pioggiaA.aggiorna(t, 1);
    if (inB) pioggiaB.aggiorna(t, 1);
    if (inC) pioggiaC.aggiorna(t, 1);
    // A: il finestrino dell'auto si chiude con «finestrini chiusi»
    const su = esplodi(prog(t, T.porte + .35, .9)); finestrino.position.y = mix(.86, 1.24, su); finestrino.scale.y = mix(.25, 1, su);
    // B: il fulmine cade sulla punta dell'albero, che resta annerita e fuma
    const kb = lampo(t, EV.lampo4); fulmineB.forza(kb);
    soleP.intensity = 1.2 * (1 + .3 * kb);
    colCima.copy(CIMA_VERDE).lerp(CIMA_BRUCIATA, liscia(prog(t, EV.lampo4 + .05, .4)) * .7); matCima.color.copy(colCima);
    fumoB.oggetto.visible = inB; if (inB) fumoB.aggiorna(t - EV.lampo4, fin(t, EV.lampo4 + .15, EV.lampo4 + 6, .4, 2));
    [T.pali, T.tralicci, T.recinzioni, T.acqua].forEach((q, i) => cerchi[i](t, q - .1));
    // C: la casa si apre, poi i quattro gesti
    const ap = esplodi(prog(t, EV.apre, 1.3)), ut = esplodi(prog(t, EV.apre + .15, 1.3)), resp = ut * (1 + .11 * Math.sin((t - EV.apre) * 1.15));
    facciata.rotation.x = 1.5 * ap;
    tettoC.position.set(0, HM + 4.3 * resp, -1.5 * resp);
    const ch = esplodi(prog(t, T.chiudi + .15, .75));
    ante.forEach(a => { a.perno.rotation.y = -a.s * 1.3 * (1 - ch); });
    spine.forEach((s, i) => {
      const u = prog(t, T.spine + .35 + i * .45, .6), e = esplodi(u);
      s.s.position.set(s.x, .105 + .2 * Math.sin(Math.PI * u) - .06 * e, CIAB.z + .36 * e); s.s.rotation.x = 1.1 * e;
      orientaAsta(s.cavo, s.s.position.clone().add(V(0, .02, 0)), s.capo);
    });
    const tvSpenta = t > T.spine + .7, pcSpento = t > T.spine + 1.15;
    schermoTV.visible = !tvSpenta; schermoTVoff.visible = tvSpenta; schermoPC.visible = !pcSpento; schermoPCoff.visible = pcSpento;
    for (const d of DISTINTIVI) {
      const v = esplodi(prog(t, d.inizio, .32)) * (d.fine == null ? 1 : 1 - liscia(prog(t, d.fine, .25)));
      d.s.visible = v > .01; d.s.scale.setScalar(d.lato * (v + .1 * Math.sin(Math.PI * clamp(prog(t, d.inizio, .45)))));
    }
  }
  function sovrimpressioni(t, mp) {
    // titolo d'apertura: con la voce, una riga per volta
    const vt = fin(t, T.titolo, T.un, .3, .3); blocco(elTitolo, vt);
    elR1.style.opacity = clamp(prog(t, T.titolo, .3)).toFixed(3); elR2.style.opacity = clamp(prog(t, T.come, .3)).toFixed(3);
    // orologio dei 30 minuti, poi il 112
    const vo = fin(t, T.trenta - .25, T.emergenza - .15, .3, .25); blocco(elOrologio, vo);
    if (vo > 0) {
      const a = Math.PI * esplodi(prog(t, T.trenta, 2.2)), x = Math.sin(a) * 86, y = -Math.cos(a) * 86;
      spicchio.setAttribute('d', a < .001 ? '' : 'M0,0 L0,-86 A86,86 0 ' + (a > Math.PI ? 1 : 0) + ',1 ' + x.toFixed(2) + ',' + y.toFixed(2) + ' Z');
      lancetta.setAttribute('x2', (Math.sin(a) * 70).toFixed(2)); lancetta.setAttribute('y2', (-Math.cos(a) * 70).toFixed(2));
    }
    const ve = fin(t, T.emergenza - .05, TOTAL + 1, .3, .3); blocco(elEmergenza, ve);
    el112.style.opacity = clamp(prog(t, T.n112 - .12, .25)).toFixed(3);
    elSito.style.opacity = clamp(prog(t, T.n112 + .9, .35)).toFixed(3);
    // etichette
    for (const e of ET) {
      const plast = e.cam === 'P', cam = plast ? camP : camR;
      let v = fin(t, e.inizio, e.fine, .22, .25) * (plast ? (mp > .98 ? 1 : 0) : (mp < .02 ? 1 : 0));
      let p = null;
      if (v > 0) { p = M3.proietta(e.punto(), cam, plast ? {} : { rilievo: ril }); if (!p.davanti || (!plast && p.coperto)) v = 0; }
      if (v <= 0) { e.el.style.opacity = '0'; e.g.style.display = 'none'; continue; }
      const w = e.el.offsetWidth, h = e.el.offsetHeight;
      const x = clamp(p.x + e.verso.dx - w / 2, L.margine, W - L.margine - w), y = clamp(p.y + e.verso.dy - h / 2, L.zona.alto, L.zona.basso - h);
      e.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + (y + (1 - esplodi(v)) * 10).toFixed(1) + 'px)'; e.el.style.opacity = v.toFixed(3);
      const qx = clamp(p.x, x, x + w), qy = clamp(p.y, y, y + h), dist = Math.hypot(qx - p.x, qy - p.y);
      const mostra = dist > 10 && p.x > 0 && p.x < W && p.y > L.zona.alto - 40 && p.y < L.zona.basso + 10;
      e.g.style.display = mostra ? '' : 'none'; e.g.style.opacity = v.toFixed(3);
      if (mostra) {
        for (const l of [e.ombra, e.riga]) { l.setAttribute('x1', p.x.toFixed(1)); l.setAttribute('y1', p.y.toFixed(1)); l.setAttribute('x2', qx.toFixed(1)); l.setAttribute('y2', qy.toFixed(1)); }
        e.pallino.setAttribute('cx', p.x.toFixed(1)); e.pallino.setAttribute('cy', p.y.toFixed(1));
      }
    }
  }

  function render(t) {
    t = clamp(t, 0, TOTAL); tAttuale = t;
    const mp = plastici(t);
    cam1.applica(t);
    cam2.applica(t); camP.near = .1; camP.far = 400; camP.updateProjectionMatrix();
    livR.canvas.style.visibility = mp < 1 ? 'visible' : 'hidden';
    livP.canvas.style.visibility = mp > 0 ? 'visible' : 'hidden'; livP.canvas.style.opacity = mp.toFixed(3);
    if (mp < 1) { animaRilievo(t); livR.disegna(scenaR, camR); }
    if (mp > 0) { animaPlastici(t); livP.disegna(scenaP, camP); }
    const k = sceneA(t), sc = SC[k];
    IMP.aggiorna(stato, t, { passoHUD: k + (k === 0 ? 1 : clamp((t - sc.inizio) / .4)), hud: CONFIG.hud[k], notaVisibile: true,
                             nota: mp > .5 ? CONFIG.notaPlastico : CONFIG.notaRilievo });
    IMP.sottotitoli(stato, t, FRASI, { modo: CONFIG.modo });
    proiezioni = {};
    for (const s of SCH) {
      const plast = s.cam === 'P', attiva = plast ? mp > .98 : mp < .02;
      let punto = null, vis = attiva, p = null;
      if (s.punto && attiva) {
        p = M3.proietta(s.punto(), plast ? camP : camR, plast ? { zona: L.zonaSchede, margine: L.margine } : { rilievo: ril, zona: L.zonaSchede, margine: L.margine });
        punto = p.punto; vis = p.visibile;
      }
      proiezioni[s.id] = p;
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, colore: s.colore, punto, verso: s.verso, inizio: s.inizio, fine: s.fine,
        visibile: vis, centro: s.punto ? null : { x: W / 2, y: L.zona.alto + (ORIZ ? 110 : 96) } });
    }
    sovrimpressioni(t, mp);
    const testo = CONFIG.fonte;      // l'attribuzione del rilievo va nella descrizione del video, non dentro il video
    if (fonte.textContent !== testo) fonte.textContent = testo;
    fonte.style.left = L.margine + 'px';
    fonte.style.top = (L.zona.basso - fonte.offsetHeight - 6) + 'px';
  }

  window.renderFrame = t => render(t);
  window.__controlli = () => IMP.controlli(stato)
    .concat(M3.controlliSchede(tAttuale, SCH.filter(s => s.punto && proiezioni[s.id]).map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine, proiezione: proiezioni[s.id], attivo: true }))))
    .concat(PROBLEMI_TEMPI.filter(p => tAttuale >= p.inizio && tAttuale <= p.fine));
  IMP.caricaFont().then(() => { scenaP.updateMatrixWorld(true); render(0); window.__ready = true; });
})();
</script>
