<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terremoto: una casa vista dall'interno</title>
<!-- terremoto-casa.src.html — video 3D divulgativo: una stanza durante la scossa, prima senza e poi con le precauzioni
     (Protezione Civile Genzano di Roma). Scritto per Alessandro Cuollo il 03/11/2026 sul modello della skill video-3d,
     senza codice di terzi. Si costruisce con costruisci.py di video-3d (three.js 0.181.2 MIT, motore 3D, impaginazione,
     font) e i dati tempi (ritmo.py) e sottotitoli (voce.py tempi). Tutto dipende solo da t: render(t) deterministico.
     Coordinate in metri: pavimento della stanza a y = 0, x da -3 a 3 (ovest-est), z da -2,5 (parete di fondo) a 2,5.
     Il pianerottolo con scale e ascensore sta a parte, attorno a x = 12. -->
<!--FONT-->
<style>
  html, body { margin: 0; background: #05080f; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden;
           background: radial-gradient(ellipse at 50% 42%, #1d2d4f 0%, #111c33 48%, #0a1220 100%); }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #livello-scena { z-index: 2; }
  #livello-fx { z-index: 3; pointer-events: none; }
  #fonte { position: absolute; z-index: 30; font-family: 'Titillium Web', sans-serif; font-weight: 400; font-size: 17px;
           line-height: 1.3; color: rgba(238, 242, 247, .86); white-space: pre; padding: 5px 12px; border-radius: 10px;
           background: rgba(10, 18, 32, .62); text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="livello-scena"></canvas>
  <canvas id="livello-fx"></canvas>
  <div id="fonte" data-componente="fonte-3d"></div>
</div>
<script type="application/json" id="dato-tempi">/*DATO:tempi*/</script>
<script type="application/json" id="dato-sottotitoli">/*DATO:sottotitoli*/</script>
<!--LIBRERIE-->
<!--THREE-->
<!--MOTORE3D-->
<script>
/* ============================================================ CONFIG ============ */
const CONFIG = {
  titolo: "Terremoto: una casa vista dall'interno",
  ente: 'pc-genzano',
  formato: 'verticale',
  hud: ['UNA CASA', 'LA STANZA', 'LA SCOSSA', 'COSA FARE', 'SCALE', 'RIAVVOLGIAMO', 'DOPO', 'PREPARATI'],
  nota: 'SIMULAZIONE · NON IN SCALA',
  fonte: 'Fonte: Dipartimento della Protezione Civile\nprotezionecivilegenzano.it/rischi-prevenzione/rischio-sismico',
  chiave: ['scossa', 'libreria', 'mensola', 'finestra', 'tavolo', 'vaso', 'abbassa', 'ripara', 'testa', 'collo', 'tiene',
           'scale', "l'ascensore", 'staffe', 'tasselli', 'basso', 'kit', 'nulla', 'scarpe', 'gas', 'luce', 'attesa',
           'prevedere', 'preparata', 'protezionecivilegenzano.it'],
  modo: 'parole'
};
function dato(nome) {
  const e = document.getElementById('dato-' + nome), s = e ? e.textContent.trim() : '';
  return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s);
}
const TEMPI = dato('tempi') || { scene: Array.from({ length: 8 }, (_, i) => ({ inizio: i * 15, durata: 15 })), totale: 120 };
const SOTT = dato('sottotitoli') || [];
// le frasi lunghe si mostrano a pezzi (frasi intere, al massimo ~125 caratteri), così il sottotitolo resta su tre righe
const FRASI = [];
SOTT.forEach(f => {
  const chiave = (f.chiave || []).concat(CONFIG.chiave), P = f.parole || [];
  const parti = String(f.testo).trim().split(/\s+/);
  if (f.testo.length <= 130 || P.length !== parti.length) { FRASI.push(Object.assign({}, f, { chiave })); return; }
  let da = 0, n = 0;
  const chiudi = (a) => {
    FRASI.push({ inizio: da === 0 ? f.inizio : P[da].t0, fine: a === parti.length ? f.fine : P[a].t0 - .02,
      testo: parti.slice(da, a).join(' '), parole: P.slice(da, a), chiave });
    da = a;
  };
  for (let i = 0; i < parti.length; i++) {
    n += parti[i].length + 1;
    const fineFrase = /[.:;?!]$/.test(parti[i]) && i < parti.length - 1;
    const resto = parti.slice(i + 1).join(' ').length;
    if (fineFrase && n > 45 && resto > 30) { chiudi(i + 1); n = 0; }
  }
  if (da < parti.length) chiudi(parti.length);
});
/* ============================================================ fine CONFIG ======= */

(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const P = new URLSearchParams(location.search);
  const formato = P.get('formato') || CONFIG.formato, ente = CONFIG.ente;
  const L = IMP.layout(formato), W = L.W, H = L.H, ORIZ = formato === 'orizzontale';
  const SC = TEMPI.scene, TOTAL = TEMPI.totale || SC[SC.length - 1].inizio + SC[SC.length - 1].durata;
  const S = i => SC[i].inizio, D = i => SC[i].durata, E = i => SC[i].inizio + SC[i].durata;
  window.TOTAL = TOTAL; window.STAGE_W = W; window.STAGE_H = H;
  document.title = CONFIG.titolo;
  const { clamp, prog, mix, ease, hash } = M3;
  const fin = M3.finestra;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const liscia = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  const esplodi = u => { u = clamp(u); return u * u * u * (u * (6 * u - 15) + 10); };   // parte e arriva piano

  /* istante di una parola detta nella scena k (dai sottotitoli), con riserva in proporzione */
  const norma = w => String(w).toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu, '');
  function parola(k, w, n = 0, riserva = 0.5) {
    const f = SOTT[k];
    if (f && f.parole) {
      let c = 0;
      for (const p of f.parole) if (norma(p.w) === norma(w) || norma(p.w).startsWith(norma(w)) && norma(w).length > 3) { if (c === n) return p.t0; c++; }
    }
    return S(k) + D(k) * riserva;
  }

  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente, formato, hud: CONFIG.hud[0], passiHUD: SC.length, nota: CONFIG.nota });
  IMP.anteprima(stage);

  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: 32, zona: L.zona });
  const fx = document.getElementById('livello-fx');
  fx.width = W / 2; fx.height = H / 2; fx.style.width = W + 'px'; fx.style.height = H + 'px';
  const gfx = fx.getContext('2d');

  /* ---------------------------------------------------------------- luci */
  scena.add(new THREE.HemisphereLight(0xeef3ff, 0x2a3346, 1.15));
  const sole = new THREE.DirectionalLight(0xfff4e6, 1.55); sole.position.set(4, 8, 6); scena.add(sole);
  const contro = new THREE.DirectionalLight(0x8fb8ff, 0.6); contro.position.set(-5, 4, -3); scena.add(contro);

  /* ---------------------------------------------------------------- texture e materiali */
  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 1; return t;
  }
  const FT = "'Titillium Web', sans-serif";
  const tinta = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: 0.03, roughness: 0.7 }, o));
  const base = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
  const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  const cil = (r1, r2, h, mat, seg = 16) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  const texOmbra = tela(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  function ombra(rx, rz) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(rx * 2, rz * 2), base(0xffffff, { map: texOmbra, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.006; return m;
  }
  const texParquet = tela(512, 512, (g, w, h) => {
    for (let i = 0; i < 16; i++) {
      for (let j = 0; j < 4; j++) {
        const v = 150 + Math.floor(hash(i * 7.1 + j * 3.3) * 40);
        g.fillStyle = `rgb(${v},${Math.floor(v * .72)},${Math.floor(v * .48)})`;
        const off = (i % 2) * 64;
        g.fillRect(j * 128 + off - 128, i * 32, 128, 32); g.fillRect(j * 128 + off, i * 32, 128, 32);
      }
      g.fillStyle = 'rgba(60,35,15,.35)'; g.fillRect(0, i * 32, w, 2);
    }
  });
  texParquet.wrapS = texParquet.wrapT = THREE.RepeatWrapping; texParquet.repeat.set(3, 2.5);
  const matMuro = tinta(0xe6ebf1, { roughness: .9, emissive: 0x2a2f36, emissiveIntensity: .55 });
  const matMuroEst = tinta(0xf0efe9, { roughness: .9 });
  const matLegno = tinta(0x8a5a36, { roughness: .6 });
  const matLegnoScuro = tinta(0x5b3a22, { roughness: .6 });
  const matBianco = tinta(0xf7f8fa, { roughness: .5 });
  const matMetallo = tinta(0xb8c0ca, { metalness: .7, roughness: .3 });
  const matStaffa = tinta(0xdfe6ee, { metalness: .6, roughness: .25, emissive: 0x3a4655, emissiveIntensity: .6 });

  /* ---------------------------------------------------------------- piattaforma, casa e stanza */
  const giardino = cil(8.2, 8.2, 0.24, tinta(0x6b9a4a, { roughness: 1 }), 64); giardino.position.y = -0.13; scena.add(giardino);
  const bordoG = cil(8.25, 8.25, 0.2, tinta(0x3a4a2e, { roughness: 1 }), 64); bordoG.position.y = -0.2; scena.add(bordoG);
  const vialetto = box(1.1, 0.02, 4.0, tinta(0xc9c2b2, { roughness: 1 })); vialetto.position.set(3.9, 0.0, 4.6); scena.add(vialetto);

  const casa = new THREE.Group(); scena.add(casa);           // tutto ciò che trema con la scossa
  const pav = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.12, 5.3), [matLegnoScuro, matLegnoScuro, tinta(0xffffff, { map: texParquet, roughness: .75 }), matLegnoScuro, matLegnoScuro, matLegnoScuro]);
  pav.position.y = -0.06; casa.add(pav);
  const HM = 2.8, SP = 0.14;
  const muroFondo = box(6.3, HM, SP, matMuro); muroFondo.position.set(0, HM / 2, -2.5 - SP / 2); casa.add(muroFondo);
  const muroSx = box(SP, HM, 5.3, matMuro); muroSx.position.set(-3 - SP / 2, HM / 2, 0); casa.add(muroSx);
  // parete destra con la porta d'ingresso (vano fra z = -1,65 e -0,75)
  const muroDxA = box(SP, HM, 3.25, matMuro); muroDxA.position.set(3 + SP / 2, HM / 2, -0.75 + 3.25 / 2); casa.add(muroDxA);
  const muroDxB = box(SP, HM, 0.85, matMuro); muroDxB.position.set(3 + SP / 2, HM / 2, -2.5 + 0.85 / 2 - 0.0); casa.add(muroDxB);
  const muroDxC = box(SP, HM - 2.1, 0.9, matMuro); muroDxC.position.set(3 + SP / 2, 2.1 + (HM - 2.1) / 2, -1.2); casa.add(muroDxC);
  // battiscopa
  [[0, -2.49, 6, 0], [-2.99, 0, 5, 1]].forEach(([x, z, l, r]) => {
    const b = box(r ? .02 : l, .08, r ? l : .02, tinta(0xb9c3cf)); b.position.set(x, .04, z); casa.add(b);
  });
  // porta (si apre nella scena 6): cerniera sul lato z = -0,75
  const portaPerno = new THREE.Group(); portaPerno.position.set(3.0, 0, -0.75); casa.add(portaPerno);
  const porta = box(0.05, 2.08, 0.9, tinta(0x7a4b2b, { roughness: .55 })); porta.position.set(0, 1.04, -0.45); portaPerno.add(porta);
  const maniglia = box(0.08, 0.03, 0.12, matMetallo); maniglia.position.set(-0.05, 1.0, -0.8); portaPerno.add(maniglia);
  const telaio = box(0.06, 0.06, 1.0, matBianco); telaio.position.set(2.98, 2.11, -1.2); casa.add(telaio);

  // finestra sulla parete di fondo
  const FX0 = 1.0, FY0 = 1.5, FWd = 1.3, FHt = 1.2;
  const cornice = new THREE.Group(); cornice.position.set(FX0, FY0, -2.5 + 0.01); casa.add(cornice);
  [[0, FHt / 2, FWd + .1, .08], [0, -FHt / 2, FWd + .1, .08], [-FWd / 2, 0, .08, FHt], [FWd / 2, 0, .08, FHt], [0, 0, .05, FHt]].forEach(([x, y, w, h]) => {
    const m = box(w, h, .07, matBianco); m.position.set(x, y, .02); cornice.add(m);
  });
  const davanzale = box(FWd + .3, .05, .2, matBianco); davanzale.position.set(0, -FHt / 2 - .05, .08); cornice.add(davanzale);
  const cielo = new THREE.Mesh(new THREE.PlaneGeometry(FWd, FHt), base(0x9cc6ea)); cielo.position.z = -0.005; cornice.add(cielo);
  const vetro = new THREE.Mesh(new THREE.PlaneGeometry(FWd, FHt), base(0xffffff, { transparent: true, opacity: 0.18, depthWrite: false }));
  vetro.position.z = 0.01; cornice.add(vetro);
  const texCrepe = tela(512, 512, (g, w, h) => {
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 3;
    const cx = w * .62, cy = h * .4;
    for (let i = 0; i < 11; i++) {
      const a = i / 11 * Math.PI * 2 + hash(i) * .4; let x = cx, y = cy; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += Math.cos(a + (hash(i * 9 + k) - .5) * .7) * 60; y += Math.sin(a + (hash(i * 5 + k) - .5) * .7) * 60; g.lineTo(x, y); }
      g.stroke();
    }
    for (let r = 30; r < 200; r += 55) { g.beginPath(); g.arc(cx, cy, r, 0, 6.28); g.globalAlpha = .55; g.stroke(); g.globalAlpha = 1; }
  });
  const crepe = new THREE.Mesh(new THREE.PlaneGeometry(FWd, FHt), base(0xffffff, { map: texCrepe, transparent: true, depthWrite: false }));
  crepe.position.z = 0.015; cornice.add(crepe);
  const schegge = new THREE.Group(); casa.add(schegge);
  for (let i = 0; i < 14; i++) {
    const s = new THREE.Mesh(new THREE.CircleGeometry(.05 + .05 * hash(i * 3.1), 3), base(0xcfe6ff, { transparent: true, opacity: .85 }));
    s.rotation.x = -Math.PI / 2; s.rotation.z = hash(i * 1.3) * 6;
    s.position.set(FX0 + (hash(i * 2.7) - .5) * 1.3, 0.012, -2.35 + hash(i * 4.1) * .6); schegge.add(s);
  }

  // libreria contro la parete di fondo: perno sullo spigolo anteriore in basso, cade verso +z
  const LBX = -1.9, LBW = 1.0, LBH = 2.1, LBD = 0.36;
  const librPerno = new THREE.Group(); librPerno.position.set(LBX, 0, -2.5 + LBD); casa.add(librPerno);
  const libreria = new THREE.Group(); libreria.position.z = -LBD / 2; librPerno.add(libreria);
  [[0, LBH / 2, -LBD / 2 + .01, LBW, LBH, .02], [-LBW / 2, LBH / 2, 0, .04, LBH, LBD], [LBW / 2, LBH / 2, 0, .04, LBH, LBD], [0, LBH - .02, 0, LBW, .04, LBD]].forEach(([x, y, z, w, h, d]) => {
    const m = box(w, h, d, matLegno); m.position.set(x, y, z); libreria.add(m);
  });
  const COL_LIBRI = [0xb3261e, 0x1f4e79, 0x2f7d4f, 0xe0a422, 0x6b3fa0, 0x334155, 0xc2410c, 0x0e7490];
  const ripiani = [0.04, 0.55, 1.05, 1.55];
  ripiani.forEach((y, r) => {
    const rp = box(LBW - .06, .03, LBD - .02, matLegno); rp.position.set(0, y, 0); libreria.add(rp);
    let x = -LBW / 2 + .06;
    for (let i = 0; x < LBW / 2 - .1; i++) {
      if (r === 3 && x > -0.1) break;            // i libri dell'ultimo ripiano a destra cadono (oggetti separati)
      const lw = .045 + .03 * hash(r * 17 + i), lh = .26 + .12 * hash(r * 11 + i * 3);
      const b = box(lw, lh, .22, tinta(COL_LIBRI[(r * 3 + i) % COL_LIBRI.length])); b.position.set(x + lw / 2, y + .015 + lh / 2, .02); libreria.add(b);
      x += lw + .006;
    }
  });
  // scatola pesante sopra la libreria (figlia della libreria; nella casa preparata scende a terra)
  const scatola = box(.38, .3, .3, tinta(0x9a7b55, { roughness: .9 })); libreria.add(scatola);
  const scatolaSu = V(0.12, LBH + .15, 0), scatolaGiu = V(0.68, .15, -0.02);
  // libri che scivolano dall'ultimo ripiano (coordinate della casa)
  const libriCadono = [];
  for (let i = 0; i < 5; i++) {
    const lw = .06, lh = .3 + .06 * hash(i * 5.5);
    const b = box(lw, lh, .22, tinta(COL_LIBRI[(i + 2) % COL_LIBRI.length]));
    const p0 = V(LBX + 0.0 + i * .075, 1.55 + .015 + lh / 2, -2.5 + LBD / 2 + .02);
    const p1 = V(LBX - .1 + i * .14 + (hash(i) - .5) * .1, .03, -1.85 + hash(i * 2.3) * .55);
    casa.add(b); libriCadono.push({ b, p0, p1, lh, t0: .0 + i * .12, rot: (hash(i * 7) - .5) * 3 });
  }
  // staffe e tasselli (vista esplosa nella casa preparata), mostrate grandi: è uno schema
  const staffe = [];
  [-LBW / 2 + .08, LBW / 2 - .08].forEach((x, i) => {
    const g = new THREE.Group();
    const a = box(.05, .16, .012, matStaffa); a.position.set(0, -.06, -.004); g.add(a);
    const b = box(.05, .012, .16, matStaffa); b.position.set(0, .0, .074); g.add(b);
    const vite = cil(.012, .012, .14, tinta(0xd4a017, { metalness: .6, roughness: .35 }), 8); vite.rotation.x = Math.PI / 2; vite.position.set(0, -.08, -.05); g.add(vite);
    const testa = cil(.024, .024, .012, tinta(0xd4a017, { metalness: .6, roughness: .35 }), 12); testa.rotation.x = Math.PI / 2; testa.position.set(0, -.08, .01); g.add(testa);
    g.position.set(LBX + x, LBH + .006, -2.5 + .006); g.scale.setScalar(2.6); casa.add(g);
    staffe.push({ g, base: g.position.clone(), vite, viteBase: vite.position.clone() });
  });

  // mobile basso (credenza) contro la parete di fondo
  const credenza = box(1.0, .5, .42, matLegno); credenza.position.set(-0.45, .25, -2.5 + .21); casa.add(credenza);
  [-0.2, 0.2].forEach(x => { const a = box(.46, .42, .01, tinta(0x9c6b44)); a.position.set(-0.45 + x * 1.1, .26, -2.5 + .425); casa.add(a); });

  // divano contro la parete sinistra, mensola con vaso e quadro sopra
  const divano = new THREE.Group(); divano.position.set(-2.52, 0, 1.25); casa.add(divano);
  const matDiv = tinta(0x4a6d8f, { roughness: .95 });
  const seduta = box(.86, .42, 1.9, matDiv); seduta.position.set(0.05, .21, 0); divano.add(seduta);
  const schienale = box(.24, .5, 1.9, matDiv); schienale.position.set(-0.36, .6, 0); divano.add(schienale);
  [-1, 1].forEach(s => { const br = box(.86, .28, .16, matDiv); br.position.set(0.05, .56, s * .95); divano.add(br); });
  [-.45, .45].forEach(z => { const c = box(.5, .14, .78, tinta(0x5b82a8, { roughness: .95 })); c.position.set(.12, .49, z); divano.add(c); });
  divano.add(ombra(.6, 1.15));
  const mensola = box(.26, .04, 1.0, matBianco); mensola.position.set(-3 + .13, 1.92, 1.25); casa.add(mensola);
  const vaso = new THREE.Group(); casa.add(vaso);
  const vasoC = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [.08, 0], [.11, .08], [.1, .2], [.06, .28], [.07, .32], [0, .32]].map(p => new THREE.Vector2(p[0], p[1])), 20), tinta(0x2a8c8c, { roughness: .35 }));
  vaso.add(vasoC);
  const vasoSu = V(-2.86, 1.94, 1.25), vasoDivano = V(-2.38, .56, 1.05), vasoBasso = V(-0.2, .5, -2.3);
  const quadro = new THREE.Group(); quadro.position.set(-3 + .02, 1.38, 1.25); casa.add(quadro);
  const texQuadro = tela(256, 192, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#8fb6d9'); gr.addColorStop(.6, '#dfe9f2'); gr.addColorStop(.6, '#6f8f4f'); gr.addColorStop(1, '#4f6b35');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#3d5a2a'; g.beginPath(); g.moveTo(0, h * .62); g.quadraticCurveTo(w * .35, h * .3, w * .7, h * .6); g.lineTo(w, h * .55); g.lineTo(w, h); g.lineTo(0, h); g.fill();
  });
  const qCorn = box(.03, .5, .7, matLegnoScuro); quadro.add(qCorn);
  const qTela = new THREE.Mesh(new THREE.PlaneGeometry(.62, .42), base(0xffffff, { map: texQuadro })); qTela.rotation.y = Math.PI / 2; qTela.position.x = .017; quadro.add(qTela);

  scheda('lontano', 'Lontano da finestre', 'E DA MOBILI ALTI', () => mondo(cornice, ORIZ ? V(-.3, -.45, .05) : V(-.2, .3, .05)), vs(-140, -190), parola(3, 'lontano'), E(3) - .4, AMBRA);
  // 4 scale e ascensore
  scheda('noscale', 'Niente scale', 'DURANTE LA SCOSSA', () => xScale.position.clone(), vs(200, -200), parola(4, 'scale'), E(4) - .35, ROSSO);
  scheda('noasc', 'Niente ascensore', 'PUÒ BLOCCARSI', () => xAsc.position.clone(), vs(-120, -210), parola(4, "l'ascensore"), E(4) - .35, ROSSO);
  // 5 la casa preparata
  scheda('staffe', 'Fissata con staffe e tasselli', 'ALLA PARETE', () => staffe[1].g.getWorldPosition(V(0, 0, 0)), vs(240, -170), T.staffe + .2, T.sopra - .2, VERDE);
  scheda('divanoOk', 'Niente pesi sopra il divano', 'NÉ MENSOLE NÉ QUADRI PESANTI', () => mondo(divano, V(.0, .9, 0)), vs(240, -150), T.sopra + 1.2, T.basso - .2, VERDE);
  scheda('basso', 'Oggetti pesanti in basso', 'MAI IN CIMA AI MOBILI', () => scatola.getWorldPosition(V(0, 0, 0)), vs(220, -180), T.basso + 1.0, T.kit - .25, VERDE);
  scheda('kit', 'Kit di emergenza', "PRONTO VICINO ALL'INGRESSO", () => mondo(kit, V(0, .45, 0)), vs(-220, -190), T.kit + .1, T.ora - .2, VERDE);
  scheda('nulla', 'Stessa scossa: nulla cade', 'LA PREVENZIONE SI FA PRIMA', null, null, parola(5, 'nulla') - .1, E(5) - .4, VERDE);
  // 6 dopo
  scheda('bene', 'Tutti bene?', 'CONTROLLA CHI È CON TE', () => bimbo.testa(), vs(-200, -190), T.controlla + .2, T.scarpe - .25);
  scheda('scarpe', 'Metti le scarpe', 'A TERRA POSSONO ESSERCI VETRI', () => mondo(adulto.root, V(0, .1, 0)), vs(-230, 170), T.scarpe, T.chiudi - .25, AMBRA);
  scheda('gasluce', 'Chiudi gas e luce', 'PRIMA DI USCIRE', () => mondo(gas, V(-.1, .5, 0)), vs(-250, -200), T.chiudi + .1, T.esci + .3);
  scheda('esci', "Verso l'area di attesa", 'ESCI CON PRUDENZA', () => mondo(portaPerno, V(0, 1.6, -.45)), vs(-220, -170), T.attesa - .2, parola(6, 'rientrare') - .3, VERDE);
  scheda('rientro', 'Non rientrare', 'FINCHÉ NON LO DICONO LE AUTORITÀ', null, null, parola(6, 'rientrare'), E(6) - .4, AMBRA);
  // 7 chiusura
  scheda('aa', 'Area di attesa', 'DOVE ASPETTARE LE INDICAZIONI', () => mondo(cartello, V(0, 2.15, 0)), vs(-190, -170), S(7) + 2.1, parola(7, 'su') - .3, VERDE);
  scheda('fine', 'protezionecivilegenzano.it', "COSA FARE · AREE DI ATTESA", null, null, parola(7, 'su'), TOTAL + 1);
  const PROBLEMI_TEMPI = M3.controllaTempi(cam, SCH.map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine })), []);
  PROBLEMI_TEMPI.forEach(p => console.warn('Controllo tempi:', p.chi.join(', '), '·', p.dettagli));

  const fonte = document.getElementById('fonte');
  fonte.style.fontFamily = IMP.ENTI[ente].font.testo;
  const sceneA = t => { let k = 0; SC.forEach((s, i) => { if (t >= s.inizio) k = i; }); return k; };
  let tAttuale = 0, proiezioni = {};

  /* ================================================================ ANIMAZIONE */
  function cammina(p, a, b, t, t0, dur) {          // posizione e fase del passo lungo il segmento a→b
    const u = prog(t, t0, dur), s = ease.morbida(u);
    p.set(mix(a.x, b.x, s), 0, mix(a.z, b.z, s));
    return u > 0 && u < 1 ? (t - t0) * 9 : 0;
  }
  const _p = V(0, 0, 0);
  function anima(t) {
    const k = sceneA(t), A = ampiezza(t), te = tEventi(t), prep = preparata(t);
    // --- scossa: la casa trema (pavimento, pareti, mobili e persone insieme)
    casa.position.copy(tremito(t, A.casa, 0));
    pianerottolo.position.set(XP, 0, 0).add(tremito(t, A.pian, 3));
    // --- apertura (scena 0) e chiusura (scena 7) di tetto e parete frontale
    const apri = esplodi(prog(t, T.entriamo, 1.4)), chiudi = esplodi(prog(t, S(7) + .2, 1.5));
    const aperto = apri * (1 - chiudi);
    tetto.position.y = HM + 4.0 * aperto; tetto.visible = aperto < .995;
    fronte.position.set(0, 0, 3.4 * aperto); fronte.position.y = -HM * 1.05 * aperto * aperto; fronte.visible = aperto < .995;
    esterni.visible = true;
    // --- lampadario
    const osc = (A.casa * .35 + (t > T.scossa1 && t < S(4) ? .05 * Math.exp(-(t - T.vetri) * .2) : 0)) * Math.sin(t * 5.6);
    lampPerno.rotation.set(osc * .6, 0, osc);
    // --- libri che scivolano (prima scossa)
    libriCadono.forEach(l => {
      const u = prog(te, T.libri + l.t0, .7);
      const s = u * u;
      l.b.position.set(mix(l.p0.x, l.p1.x, u), mix(l.p0.y, l.p1.y + .03, s), mix(l.p0.z, l.p1.z, u));
      l.b.rotation.set(mix(0, Math.PI / 2, u), mix(0, l.rot, u), 0);
    });
    // --- vaso: dalla mensola al divano; nella casa preparata va sulla credenza
    if (!prep) {
      const u = prog(te, T.vaso, .65), s = u * u;
      vaso.position.set(mix(vasoSu.x, vasoDivano.x, u), mix(vasoSu.y, vasoDivano.y, s) + Math.sin(u * Math.PI) * .12, mix(vasoSu.z, vasoDivano.z, u));
      vaso.rotation.set(mix(0, 1.35, u), 0, mix(0, -.6, u));
      vaso.visible = true;
    } else {
      const u = ease.morbida(prog(t, T.sopra + .1, 1.4));
      vaso.position.set(mix(vasoSu.x, vasoBasso.x, u), mix(vasoSu.y, vasoBasso.y, u) + Math.sin(u * Math.PI) * .5, mix(vasoSu.z, vasoBasso.z, u));
      vaso.rotation.set(0, u * 1.2, 0);
    }
    // --- mensola e quadro: spariscono nella casa preparata
    const via = prep ? liscia(prog(t, T.sopra, 1.0)) : 0;
    mensola.position.y = 1.92 + .5 * via; mensola.visible = via < .98;
    quadro.position.y = 1.38 + .5 * via; quadro.visible = via < .98;
    mensola.material.transparent = quadro.children[0].material.transparent = via > 0;
    mensola.material.opacity = 1 - via;
    // --- libreria: si inclina e si rovescia (prima scossa); fissata con le staffe nella casa preparata
    let ang = 0;
    if (!prep) {
      const w = prog(te, T.inclina - .6, .6), c = prog(te, T.inclina, 1.0);
      ang = .06 * Math.sin(w * Math.PI * 3) * (1 - c) + 1.43 * c * c;
      if (c >= 1) ang = 1.43 - .04 * Math.abs(Math.sin(prog(te, T.inclina + 1.0, .4) * Math.PI)) * (1 - prog(te, T.inclina + 1.4, .3));
    } else {
      ang = .012 * A.casa * Math.sin(t * 9);
    }
    librPerno.rotation.x = ang;
    // --- scatola pesante: in cima alla libreria, poi a terra
    const sg = prep ? ease.morbida(prog(t, T.basso, 1.3)) : 0;
    scatola.position.set(mix(scatolaSu.x, scatolaGiu.x, sg), mix(scatolaSu.y, scatolaGiu.y, sg) + Math.sin(sg * Math.PI) * .25, mix(scatolaSu.z, scatolaGiu.z, sg));
    // --- staffe e tasselli: vista esplosa che si chiude sulla libreria
    staffe.forEach((s, i) => {
      const u = esplodi(prog(t, T.staffe - .2, 1.0)), resp = .12 * Math.sin(prog(t, T.staffe + .8, 1.2) * Math.PI);
      s.g.visible = prep;
      s.g.position.copy(s.base).add(V(0, .55 * (1 - u) + .02 * resp, .9 * (1 - u)));
      s.vite.position.copy(s.viteBase).add(V(0, 0, .25 * (1 - esplodi(prog(t, T.staffe + .5, .6)))));
    });
    // --- vetri: crepe e schegge (prima scossa)
    const rotto = !prep && te >= T.vetri;
    crepe.visible = rotto; schegge.visible = rotto && te >= T.vetri + .15;
    // --- kit
    const ku = prep ? clamp(prog(t, T.kit - .15, .45)) : 0;
    kit.visible = ku > 0; kit.scale.setScalar(Math.max(.001, ku < 1 ? ease.morbida(ku) * (1 + .12 * Math.sin(ku * Math.PI)) : 1));
    // --- persone
    const inStanza = (t >= T.persone && t < S(4)) || (t >= T.ora - .5 && t < T.esci + 2.4);
    adulto.root.visible = bimbo.root.visible = inStanza;
    adulto.scarpe(t >= T.scarpe + .2 && t < S(7)); bimbo.scarpe(t >= T.scarpe + .45 && t < S(7));
    const aFuori = V(.75, 0, 1.45), aSotto = V(.55, 0, .42), bFuori = V(1.55, 0, 1.3), bSotto = V(1.2, 0, .32);
    if (t < S(4)) {
      // scena 3: compaiono vicino al tavolo, poi si riparano sotto
      const pa = cammina(adulto.root.position, aFuori, aSotto, t, T.abbassa + .1, 1.2);
      const pb = cammina(bimbo.root.position, bFuori, bSotto, t, T.abbassa + .3, 1.1);
      const c = liscia(prog(t, T.abbassa, 1.1)), cb = liscia(prog(t, T.abbassa + .2, 1.1));
      const cop = liscia(prog(t, T.protegge, .7)), tieni = liscia(prog(t, T.tiene, .6));
      // non correre fuori: l'adulto si volta verso la porta e poi torna al tavolo
      const volta = Math.sin(prog(t, parola(3, 'corre') - .2, 1.6) * Math.PI);
      adulto.root.rotation.y = Math.PI + 1.1 * volta;
      bimbo.root.rotation.y = Math.PI - .3;
      adulto.posa(c, cop, tieni, pa); bimbo.posa(cb, cop, tieni * .8, pb);
      const sc = liscia(prog(t, T.persone, .4));
      adulto.root.scale.setScalar(Math.max(.001, sc)); bimbo.root.scale.setScalar(Math.max(.001, sc));
    } else {
      // scena 5-6: già sotto il tavolo durante la seconda scossa, poi escono, chiudono gas e luce ed escono
      const sc = liscia(prog(t, T.ora - .5, .4));
      adulto.root.scale.setScalar(Math.max(.001, sc)); bimbo.root.scale.setScalar(Math.max(.001, sc));
      const fuori = liscia(prog(t, T.finisce, 1.0));
      const c = 1 - fuori, cop = 1 - liscia(prog(t, T.finisce - .1, .6)), tieni = cop;
      adulto.root.position.copy(aSotto).lerp(V(.55, 0, 1.2), fuori);
      bimbo.root.position.copy(bSotto).lerp(V(1.4, 0, 1.25), fuori);
      // si guardano (controlla chi è con te)
      const guarda = liscia(prog(t, T.controlla, .6)) * (1 - liscia(prog(t, T.scarpe + 1.6, .6)));
      adulto.root.rotation.y = mix(Math.PI, Math.PI / 2, guarda);
      bimbo.root.rotation.y = mix(Math.PI - .3, -Math.PI / 2, guarda);
      let pa = 0, pb = 0;
      // l'adulto va al gas, chiude, va al quadro elettrico, poi tutti alla porta e fuori
      const gasP = V(2.45, 0, .35), qeP = V(2.45, 0, 1.0), portaP = V(2.4, 0, -1.2), oltre = V(3.9, 0, -1.2);
      if (t >= T.chiudi - 1.3) {
        const tA = T.chiudi - 1.3;
        if (t < tA + 1.2) { pa = cammina(adulto.root.position, V(.55, 0, 1.2), gasP, t, tA, 1.2); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.luce - .4) { adulto.root.position.copy(gasP); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.luce + .3) { pa = cammina(adulto.root.position, gasP, qeP, t, T.luce - .4, .7); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.esci) { adulto.root.position.copy(qeP); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.esci + 1.2) { pa = cammina(adulto.root.position, qeP, portaP, t, T.esci, 1.2); adulto.root.rotation.y = Math.PI; }
        else { pa = cammina(adulto.root.position, portaP, oltre, t, T.esci + 1.2, 1.0); adulto.root.rotation.y = Math.PI / 2; }
      }
      if (t >= T.esci - .2) {
        const b0 = V(1.4, 0, 1.25), bp = V(2.2, 0, -1.0);
        if (t < T.esci + 1.4) { pb = cammina(bimbo.root.position, b0, bp, t, T.esci - .2, 1.6); bimbo.root.rotation.y = Math.PI * .8; }
        else { pb = cammina(bimbo.root.position, bp, V(3.9, 0, -1.0), t, T.esci + 1.4, 1.0); bimbo.root.rotation.y = Math.PI / 2; }
      }
      const braccio = t >= T.chiudi - .1 && t < T.esci ? 1 : 0;
      adulto.posa(c, cop, Math.max(tieni, braccio * .9), pa); bimbo.posa(c, cop, tieni * .8, pb);
    }
    // gas e luce
    valvola.rotation.x = -Math.PI / 2 * liscia(prog(t, T.chiudi + .1, .5)) * (t < S(7) ? 1 : 0);
    interruttore.rotation.z = (t >= T.luce + .2 && t < S(7)) ? .6 : -.4;
    lampadina.material.color.set(t >= T.luce + .2 && t < S(7) ? 0x6b6b6b : 0xfff3c4);
    portaPerno.rotation.y = -1.45 * liscia(prog(t, T.esci + .8, .6)) * (1 - liscia(prog(t, S(7) + .1, .6)));
    // --- pianerottolo
    pianerottolo.visible = ospite.root.visible = t > S(4) - 1.4 && t < S(5) + 1.4;
    const sx = liscia(prog(t, parola(4, 'scale') - .2, .4)), sa = liscia(prog(t, parola(4, "l'ascensore") - .2, .4));
    xScale.visible = sx > 0 && pianerottolo.visible; xScale.scale.setScalar(Math.max(.001, sx));
    xAsc.visible = sa > 0 && pianerottolo.visible; xAsc.scale.setScalar(Math.max(.001, sa));
    xScale.position.set(XP + .7, .55, .6).add(tremito(t, A.pian, 3)); xAsc.position.set(XP - .85, 1.2, -1.4).add(tremito(t, A.pian, 3));
    ospite.root.position.set(XP - .2, 0, .9).add(tremito(t, A.pian, 3));
    ospite.root.rotation.y = Math.PI * .85; ospite.posa(0, 0, 0, 0);
    // --- persone all'area di attesa (scena 7)
    cartello.visible = true;
    // --- visibilità per scena (meno oggetti da disegnare)
    casa.visible = giardino.visible = bordoG.visible = vialetto.visible = !(t > S(4) + 1.4 && t < S(5) - .2);
    // riavvolgimento: righe e tinta sopra la scena
    gfx.clearRect(0, 0, fx.width, fx.height);
    const rw = fin(t, T.rewind - .1, T.rewind + RW + .1, .15, .25);
    if (rw > 0) {
      gfx.fillStyle = 'rgba(40,90,190,' + (.16 * rw).toFixed(3) + ')'; gfx.fillRect(0, 0, fx.width, fx.height);
      const off = (t * 220) % 12;
      gfx.fillStyle = 'rgba(255,255,255,' + (.07 * rw).toFixed(3) + ')';
      for (let y = -12 + off; y < fx.height; y += 12) gfx.fillRect(0, y, fx.width, 2);
      gfx.fillStyle = 'rgba(255,255,255,' + (.85 * rw).toFixed(3) + ')';
      const cx = fx.width / 2, cy = (ORIZ ? 240 : 470) / 2, s = ORIZ ? 22 : 26;
      [-1, 1].forEach(d => { gfx.beginPath(); gfx.moveTo(cx + d * s * .2 + s * .9, cy - s); gfx.lineTo(cx + d * s * .2 - s * .1, cy); gfx.lineTo(cx + d * s * .2 + s * .9, cy + s); gfx.fill(); });
    }
    // persone fuori, all'area di attesa
    if (t >= S(7)) {
      adulto.root.visible = bimbo.root.visible = true;
      adulto.root.position.set(3.3, 0, 5.2); bimbo.root.position.set(3.85, 0, 5.05);
      adulto.root.rotation.y = bimbo.root.rotation.y = -.4;
      adulto.root.scale.setScalar(1); bimbo.root.scale.setScalar(1);
      adulto.posa(0, 0, 0, 0); bimbo.posa(0, 0, 0, 0);
      adulto.scarpe(true); bimbo.scarpe(true);
      // in casa, a quel punto, non c'è più nessuno: la posizione è fuori dalla casa (che trema solo prima)
    }
  }

  function render(t) {
    t = clamp(t, 0, TOTAL); tAttuale = t;
    cam.applica(t);
    camera.near = .02; camera.far = 120; camera.updateProjectionMatrix();
    anima(t);
    // le persone fuori casa non devono tremare con la casa: in scena 7 la casa è ferma
    vicino.disegna(scena, camera);
    const k = sceneA(t), sc = SC[k];
    IMP.aggiorna(stato, t, { passoHUD: k + (k === 0 ? 1 : clamp((t - sc.inizio) / .4)), hud: CONFIG.hud[k], notaVisibile: true });
    IMP.sottotitoli(stato, t, FRASI, { modo: CONFIG.modo });
    proiezioni = {};
    for (const s of SCH) {
      let punto = null, vis = true, p = null;
      if (s.punto) {
        p = M3.proietta(s.punto(), camera, { zona: L.zonaSchede, margine: L.margine });
        punto = p.punto; vis = p.visibile;
      }
      proiezioni[s.id] = p;
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, colore: s.colore, punto, verso: s.verso,
        inizio: s.inizio, fine: s.fine, visibile: vis,
        centro: s.punto ? null : { x: W / 2, y: L.zona.alto + (ORIZ ? 110 : 150) } });
    }
    const testo = k === 7 ? CONFIG.fonte : '';
    if (fonte.textContent !== testo) fonte.textContent = testo;
    fonte.style.display = testo ? '' : 'none';
    fonte.style.left = L.margine + 'px';
    fonte.style.top = (L.zona.basso - fonte.offsetHeight - 6) + 'px';
  }

  window.renderFrame = t => render(t);
  window.__controlli = () => IMP.controlli(stato)
    .concat(M3.controlliSchede(tAttuale, SCH.filter(s => s.punto).map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine, proiezione: proiezioni[s.id], attivo: true }))))
    .concat(PROBLEMI_TEMPI.filter(p => tAttuale >= p.inizio && tAttuale <= p.fine));
  IMP.caricaFont().then(() => { casa.updateMatrixWorld(true); render(0); window.__ready = true; });
})();
</script>
</body>
