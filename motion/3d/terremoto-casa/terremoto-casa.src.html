<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terremoto: una casa vista dall'interno</title>
<!-- terremoto-casa.src.html — video 3D divulgativo (versione 2): una casa su due piani durante la scossa, prima senza e poi
     con le precauzioni, con i primi piani su come si mette in sicurezza ogni cosa (Protezione Civile Genzano di Roma).
     Scritto per Alessandro Cuollo il 03/11/2026 sul modello della skill video-3d, senza codice di terzi. Si costruisce
     con costruisci.py di video-3d (three.js 0.181.2 MIT, motore 3D, impaginazione, font) e i dati tempi (ritmo.py) e
     sottotitoli (voce.py tempi). Tutto dipende solo da t: render(t) deterministico.
     Coordinate in metri: pavimento della stanza (primo piano) a y = 0, x da -3 a 3 (ovest-est), z da -2,5 (parete di
     fondo, verso la strada) a 2,5. Il piano terra va da y = -3 a 0; strada e marciapiede dietro la casa (z < -3).
     Il pianerottolo con scale e ascensore sta a parte, attorno a x = 12. -->
<!--FONT-->
<style>
  html, body { margin: 0; background: #05080f; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden;
           background: radial-gradient(ellipse at 50% 42%, #1d2d4f 0%, #111c33 48%, #0a1220 100%); }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #livello-scena { z-index: 2; }
  #livello-fx { z-index: 3; pointer-events: none; }
  #fonte { position: absolute; z-index: 30; font-family: 'Titillium Web', sans-serif; font-weight: 400; font-size: 17px;
           line-height: 1.3; color: rgba(238, 242, 247, .86); white-space: pre; padding: 5px 12px; border-radius: 10px;
           background: rgba(10, 18, 32, .62); text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="livello-scena"></canvas>
  <canvas id="livello-fx"></canvas>
  <div id="fonte" data-componente="fonte-3d"></div>
</div>
<script type="application/json" id="dato-tempi">/*DATO:tempi*/</script>
<script type="application/json" id="dato-sottotitoli">/*DATO:sottotitoli*/</script>
<!--LIBRERIE-->
<!--THREE-->
<!--MOTORE3D-->
<script>
/* ============================================================ CONFIG ============ */
const CONFIG = {
  titolo: "Terremoto: una casa vista dall'interno",
  ente: 'pc-genzano',
  formato: 'verticale',
  capitoli: ['UNA CASA', 'I PERICOLI', 'LA SCOSSA', 'COSA FARE', 'RIAVVOLGIAMO', 'LA PREVENZIONE', 'LA PROVA', 'DOPO', 'PREPARATI'],
  capitoloDi: [0, 1, 2, 2, 3, 3, 4, 5, 5, 5, 5, 5, 5, 5, 6, 7, 8],
  hud: ['UNA CASA', 'I PERICOLI', 'LA SCOSSA', 'FUORI', 'COSA FARE', 'SCALE', 'RIAVVOLGIAMO', 'LIBRERIA', 'QUADRI',
        'LA TV', 'IN ALTO', 'CUCINA', 'BALCONE', 'GAS E KIT', 'LA PROVA', 'DOPO', 'PREPARATI'],
  nota: 'SIMULAZIONE · NON IN SCALA',
  fonte: 'Fonte: Dipartimento della Protezione Civile\nprotezionecivilegenzano.it/rischi-prevenzione/rischio-sismico',
  chiave: ['scossa', 'libreria', 'mensola', 'TV', 'cucina', 'ante', 'vasi', 'tegole', 'cornicione', 'cedere', 'allontana',
           'tavolo', 'abbassa', 'ripara', 'testa', 'collo', 'tiene', 'scale', "l'ascensore", 'staffe', 'tasselli', 'ganci',
           'cinghia', 'bassi', 'nastro', 'fermo', 'tolgono', 'gas', 'acqua', 'cassetta', 'torcia', 'radio', 'tecnico',
           'nulla', 'scarpe', 'attesa', 'prevedere', 'preparata', 'protezionecivilegenzano.it'],
  modo: 'parole'
};
function dato(nome) {
  const e = document.getElementById('dato-' + nome), s = e ? e.textContent.trim() : '';
  return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s);
}
const TEMPI = dato('tempi') || { scene: Array.from({ length: 17 }, (_, i) => ({ inizio: i * 12, durata: 12 })), totale: 204 };
const SOTT = dato('sottotitoli') || [];
// le frasi lunghe si mostrano a pezzi (frasi intere, al massimo ~125 caratteri), così il sottotitolo resta su tre righe
const FRASI = [];
SOTT.forEach(f => {
  const chiave = (f.chiave || []).concat(CONFIG.chiave), P = f.parole || [];
  const parti = String(f.testo).trim().split(/\s+/);
  if (f.testo.length <= 130 || P.length !== parti.length) { FRASI.push(Object.assign({}, f, { chiave })); return; }
  let da = 0, n = 0;
  const chiudi = (a) => {
    FRASI.push({ inizio: da === 0 ? f.inizio : P[da].t0, fine: a === parti.length ? f.fine : P[a].t0 - .02,
      testo: parti.slice(da, a).join(' '), parole: P.slice(da, a), chiave });
    da = a;
  };
  for (let i = 0; i < parti.length; i++) {
    n += parti[i].length + 1;
    const fineFrase = /[.:;?!]$/.test(parti[i]) && i < parti.length - 1;
    const resto = parti.slice(i + 1).join(' ').length;
    if (fineFrase && n > 45 && resto > 30) { chiudi(i + 1); n = 0; }
  }
  if (da < parti.length) chiudi(parti.length);
});
/* ============================================================ fine CONFIG ======= */

(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const P = new URLSearchParams(location.search);
  const formato = P.get('formato') || CONFIG.formato, ente = CONFIG.ente;
  const L = IMP.layout(formato), W = L.W, H = L.H, ORIZ = formato === 'orizzontale';
  const SC = TEMPI.scene, TOTAL = TEMPI.totale || SC[SC.length - 1].inizio + SC[SC.length - 1].durata;
  const S = i => SC[i].inizio, D = i => SC[i].durata, E = i => SC[i].inizio + SC[i].durata;
  window.TOTAL = TOTAL; window.STAGE_W = W; window.STAGE_H = H;
  document.title = CONFIG.titolo;
  const { clamp, prog, mix, ease, hash } = M3;
  const fin = M3.finestra;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const liscia = u => { u = clamp(u); return u * u * (3 - 2 * u); };
  const esplodi = u => { u = clamp(u); return u * u * u * (u * (6 * u - 15) + 10); };   // parte e arriva piano

  /* istante di una parola detta nella scena k (dai sottotitoli), con riserva in proporzione */
  const norma = w => String(w).toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu, '');
  function parola(k, w, n = 0, riserva = 0.5) {
    const f = SOTT[k];
    if (f && f.parole) {
      let c = 0;
      for (const p of f.parole) if (norma(p.w) === norma(w) || norma(p.w).startsWith(norma(w)) && norma(w).length > 3) { if (c === n) return p.t0; c++; }
    }
    return S(k) + D(k) * riserva;
  }

  const stage = document.getElementById('stage');
  const nCap = CONFIG.capitoli.length;
  const stato = IMP.monta(stage, { ente, formato, hud: CONFIG.hud[0], passiHUD: nCap, nota: CONFIG.nota });
  IMP.anteprima(stage);

  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: 32, zona: L.zona });
  const fx = document.getElementById('livello-fx');
  fx.width = W / 2; fx.height = H / 2; fx.style.width = W + 'px'; fx.style.height = H + 'px';
  const gfx = fx.getContext('2d');

  /* ---------------------------------------------------------------- luci */
  scena.add(new THREE.HemisphereLight(0xeef3ff, 0x2a3346, 1.15));
  const sole = new THREE.DirectionalLight(0xfff4e6, 1.55); sole.position.set(4, 8, 6); scena.add(sole);
  const contro = new THREE.DirectionalLight(0xb7cdf5, 0.85); contro.position.set(-5, 5, -7); scena.add(contro);

  /* ---------------------------------------------------------------- texture e materiali */
  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 1; return t;
  }
  const FT = "'Titillium Web', sans-serif";
  const tinta = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: 0.03, roughness: 0.7 }, o));
  const base = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
  const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  const cil = (r1, r2, h, mat, seg = 16) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  const texOmbra = tela(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  function ombra(rx, rz) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(rx * 2, rz * 2), base(0xffffff, { map: texOmbra, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.006; return m;
  }
  const texParquet = tela(512, 512, (g, w, h) => {
    for (let i = 0; i < 16; i++) {
      for (let j = 0; j < 4; j++) {
        const v = 150 + Math.floor(hash(i * 7.1 + j * 3.3) * 40);
        g.fillStyle = `rgb(${v},${Math.floor(v * .72)},${Math.floor(v * .48)})`;
        const off = (i % 2) * 64;
        g.fillRect(j * 128 + off - 128, i * 32, 128, 32); g.fillRect(j * 128 + off, i * 32, 128, 32);
      }
      g.fillStyle = 'rgba(60,35,15,.35)'; g.fillRect(0, i * 32, w, 2);
    }
  });
  texParquet.wrapS = texParquet.wrapT = THREE.RepeatWrapping; texParquet.repeat.set(3, 2.5);
  const texCrepa = tela(256, 64, (g, w, h) => {        // crepa irregolare (balcone, cornicione)
    g.strokeStyle = 'rgba(25,20,18,.95)'; g.lineWidth = 5; g.beginPath(); g.moveTo(0, h / 2);
    for (let i = 1; i <= 16; i++) g.lineTo(i * w / 16, h / 2 + (hash(i * 3.7) - .5) * h * .8);
    g.stroke(); g.lineWidth = 2;
    for (let i = 2; i < 16; i += 3) { g.beginPath(); g.moveTo(i * w / 16, h / 2); g.lineTo(i * w / 16 + 10, h * (hash(i) > .5 ? .05 : .95)); g.stroke(); }
  });
  const matMuro = tinta(0xe6ebf1, { roughness: .9, emissive: 0x2a2f36, emissiveIntensity: .55 });
  const matMuroEst = tinta(0xf0ece2, { roughness: .9 });
  const matLegno = tinta(0x8a5a36, { roughness: .6 });
  const matLegnoScuro = tinta(0x5b3a22, { roughness: .6 });
  const matBianco = tinta(0xf7f8fa, { roughness: .5 });
  const matMetallo = tinta(0xb8c0ca, { metalness: .7, roughness: .3 });
  const matStaffa = tinta(0xdfe6ee, { metalness: .6, roughness: .25, emissive: 0x3a4655, emissiveIntensity: .6 });
  const matOro = tinta(0xd4a017, { metalness: .6, roughness: .35, emissive: 0x3a2a00, emissiveIntensity: .45 });
  const matFermo = tinta(0xf5c518, { roughness: .4, emissive: 0x6b4f00, emissiveIntensity: .7 });
  const matVetroAzz = base(0x9cc6ea);
  // pareti della stanza: faccia interna chiara, le altre in intonaco esterno (ordine facce: +x, -x, +y, -y, +z, -z)
  const facce = interna => [0, 1, 2, 3, 4, 5].map(i => i === interna ? matMuro : matMuroEst);

  /* ---------------------------------------------------------------- terreno: prato, marciapiede, strada, piazza */
  const quartiere = new THREE.Group(); scena.add(quartiere);        // tutto ciò che trema con la scossa
  const YT = -3;                                                     // quota del terreno
  const terreno = new THREE.Group(); quartiere.add(terreno);
  const zoccoloT = box(18.4, .5, 22.4, tinta(0x2a3546, { roughness: 1 })); zoccoloT.position.set(0, YT - .3, -1.5); terreno.add(zoccoloT);
  const prato = box(18, .1, 12, tinta(0x6b9a4a, { roughness: 1 })); prato.position.set(0, YT - .05, 3.0); terreno.add(prato);
  const marciapiede = box(18, .14, 1.4, tinta(0xc4c8cc, { roughness: .95 })); marciapiede.position.set(0, YT - .0, -3.7); terreno.add(marciapiede);
  const cordolo = box(18, .16, .12, tinta(0x9aa1a9, { roughness: .9 })); cordolo.position.set(0, YT + .0, -4.44); terreno.add(cordolo);
  const strada = box(18, .1, 4.6, tinta(0x3d434c, { roughness: .95 })); strada.position.set(0, YT - .05, -6.7); terreno.add(strada);
  for (let i = -3; i <= 3; i++) {
    const s = box(1.4, .01, .12, base(0xe5e7eb)); s.position.set(i * 2.6, YT + .006, -6.7); terreno.add(s);
  }
  const piazza = box(18, .1, 3.3, tinta(0xb9b0a0, { roughness: .95 })); piazza.position.set(0, YT - .05, -10.65); terreno.add(piazza);
  [[-6.8, -10.9], [6.6, -11.1], [-7.6, 6.8]].forEach(([x, z], i) => {
    const tr = cil(.09, .12, 1.4, tinta(0x5b3a22), 8); tr.position.set(x, YT + .7, z); terreno.add(tr);
    const ch = new THREE.Mesh(new THREE.SphereGeometry(.8 + .15 * hash(i), 14, 10), tinta(0x3f7a35, { roughness: 1 })); ch.position.set(x, YT + 1.9, z); terreno.add(ch);
  });
  const vialetto = box(1.2, .02, 6.2, tinta(0xc9c2b2, { roughness: 1 })); vialetto.position.set(0, YT + .01, 5.8); terreno.add(vialetto);

  /* ---------------------------------------------------------------- la casa */
  const casa = new THREE.Group(); quartiere.add(casa);
  const HM = 2.8, SP = 0.14;
  // piano terra (blocco pieno con finestre e portone) e fasce
  const pianoTerra = box(6.28, 2.95, 5.28, matMuroEst); pianoTerra.position.y = -1.525; casa.add(pianoTerra);
  const zoccoloCasa = box(6.36, .45, 5.36, tinta(0xb9b2a4, { roughness: .95 })); zoccoloCasa.position.y = YT + .22; casa.add(zoccoloCasa);
  const marcapiano = box(6.46, .14, 5.46, tinta(0xd6d3cc, { roughness: .9 })); marcapiano.position.y = -.08; casa.add(marcapiano);
  function finestraEst(gr, x, y, z, verso) {          // verso = +1 facciata davanti (z+), -1 dietro (z-)
    const f = box(1.0, 1.1, .04, matVetroAzz); f.position.set(x, y, z + verso * .02); gr.add(f);
    const c = box(1.12, .08, .12, matBianco); c.position.set(x, y - .6, z + verso * .05); gr.add(c);
    const m = box(.05, 1.1, .05, matBianco); m.position.set(x, y, z + verso * .045); gr.add(m);
    [-1, 1].forEach(s => { const p = box(.32, 1.18, .03, tinta(0x3f6e4f, { roughness: .8 })); p.position.set(x + s * .68, y, z + verso * .03); gr.add(p); });
  }
  finestraEst(casa, -1.7, -1.45, 2.64, 1); finestraEst(casa, 1.7, -1.45, 2.64, 1);
  finestraEst(casa, -1.7, -1.45, -2.64, -1); finestraEst(casa, 1.6, -1.45, -2.64, -1);
  const portone = box(1.0, 2.1, .06, tinta(0x7a4b2b)); portone.position.set(0, YT + 1.05, 2.66); casa.add(portone);

  // primo piano: la stanza
  const pav = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.12, 5.3), [matLegnoScuro, matLegnoScuro, tinta(0xffffff, { map: texParquet, roughness: .75 }), matLegnoScuro, matLegnoScuro, matLegnoScuro]);
  pav.position.y = -0.06; casa.add(pav);
  // parete di fondo con la portafinestra del balcone (vano fra x = 1,05 e 2,05, alto 2,2)
  const DX = 1.55, DW = 1.0, DH = 2.2, ZF = -2.5 - SP / 2;
  const fondoA = new THREE.Mesh(new THREE.BoxGeometry(4.19, HM, SP), facce(4)); fondoA.position.set(-3.14 + 4.19 / 2, HM / 2, ZF); casa.add(fondoA);
  const fondoB = new THREE.Mesh(new THREE.BoxGeometry(1.09, HM, SP), facce(4)); fondoB.position.set(2.05 + 1.09 / 2, HM / 2, ZF); casa.add(fondoB);
  const fondoC = new THREE.Mesh(new THREE.BoxGeometry(DW, HM - DH, SP), facce(4)); fondoC.position.set(DX, DH + (HM - DH) / 2, ZF); casa.add(fondoC);
  const muroSx = new THREE.Mesh(new THREE.BoxGeometry(SP, HM, 5.28), facce(0)); muroSx.position.set(-3 - SP / 2, HM / 2, 0); casa.add(muroSx);
  // parete destra con la porta d'ingresso (vano fra z = -1,65 e -0,75)
  const muroDxA = new THREE.Mesh(new THREE.BoxGeometry(SP, HM, 3.39), facce(1)); muroDxA.position.set(3 + SP / 2, HM / 2, -0.75 + 3.39 / 2); casa.add(muroDxA);
  const muroDxB = new THREE.Mesh(new THREE.BoxGeometry(SP, HM, .99), facce(1)); muroDxB.position.set(3 + SP / 2, HM / 2, -2.64 + .99 / 2); casa.add(muroDxB);
  const muroDxC = new THREE.Mesh(new THREE.BoxGeometry(SP, HM - 2.1, .9), facce(1)); muroDxC.position.set(3 + SP / 2, 2.1 + (HM - 2.1) / 2, -1.2); casa.add(muroDxC);
  [[-1.95, -2.49, 2.1, 0], [-2.99, 0, 5, 1]].forEach(([x, z, l, r]) => {
    const b = box(r ? .02 : l, .08, r ? l : .02, tinta(0xb9c3cf)); b.position.set(x, .04, z); casa.add(b);
  });
  const portaPerno = new THREE.Group(); portaPerno.position.set(3.0, 0, -0.75); casa.add(portaPerno);
  const porta = box(0.05, 2.08, 0.9, tinta(0x7a4b2b, { roughness: .55 })); porta.position.set(0, 1.04, -0.45); portaPerno.add(porta);
  const maniglia = box(0.08, 0.03, 0.12, matMetallo); maniglia.position.set(-0.05, 1.0, -0.8); portaPerno.add(maniglia);
  const telaio = box(0.06, 0.06, 1.0, matBianco); telaio.position.set(2.98, 2.11, -1.2); casa.add(telaio);

  // portafinestra: telaio, due vetri, crepa e schegge (prima scossa)
  const pf = new THREE.Group(); pf.position.set(DX, 0, ZF); casa.add(pf);
  [[0, DH + .03, DW + .1, .07], [-DW / 2, DH / 2, .07, DH], [DW / 2, DH / 2, .07, DH], [0, DH / 2, .05, DH]].forEach(([x, y, w, h]) => {
    const m = box(w, h, .1, matBianco); m.position.set(x, y, 0); pf.add(m);
  });
  [-1, 1].forEach(s => {
    const v = new THREE.Mesh(new THREE.PlaneGeometry(DW / 2 - .06, DH - .04), base(0xdbeeff, { transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide }));
    v.position.set(s * DW / 4, DH / 2, 0); pf.add(v);
  });
  const pomolo = box(.03, .14, .04, matMetallo); pomolo.position.set(-.06, 1.05, .06); pf.add(pomolo);
  const texCrepe = tela(512, 512, (g, w, h) => {
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 3;
    const cx = w * .55, cy = h * .42;
    for (let i = 0; i < 11; i++) {
      const a = i / 11 * Math.PI * 2 + hash(i) * .4; let x = cx, y = cy; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += Math.cos(a + (hash(i * 9 + k) - .5) * .7) * 60; y += Math.sin(a + (hash(i * 5 + k) - .5) * .7) * 60; g.lineTo(x, y); }
      g.stroke();
    }
    for (let r = 30; r < 200; r += 55) { g.beginPath(); g.arc(cx, cy, r, 0, 6.28); g.globalAlpha = .55; g.stroke(); g.globalAlpha = 1; }
  });
  const crepe = new THREE.Mesh(new THREE.PlaneGeometry(DW / 2 - .06, (DH - .04) * .6), base(0xffffff, { map: texCrepe, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  crepe.position.set(DW / 4, DH * .62, .012); pf.add(crepe);
  const schegge = new THREE.Group(); casa.add(schegge);
  for (let i = 0; i < 12; i++) {
    const s = new THREE.Mesh(new THREE.CircleGeometry(.04 + .05 * hash(i * 3.1), 3), base(0xcfe6ff, { transparent: true, opacity: .85 }));
    s.rotation.x = -Math.PI / 2; s.rotation.z = hash(i * 1.3) * 6;
    s.position.set(DX + (hash(i * 2.7) - .2) * .7, 0.012, -2.35 + hash(i * 4.1) * .55); schegge.add(s);
  }

  // balcone: perno sul filo del muro, così può «cedere» abbassandosi verso la strada
  const matBalc = matMuroEst.clone();
  const matCopertina = tinta(0xd6d3cc, { roughness: .85 });
  const balc = new THREE.Group(); balc.position.set(DX, 0, -2.64); casa.add(balc);
  const soletta = box(1.6, .15, .96, matBalc); soletta.position.set(0, -.075, -.48); balc.add(soletta);
  const parapetti = [[0, .5, -.92, 1.6, 1.0, .08], [-.76, .5, -.48, .08, 1.0, .88], [.76, .5, -.48, .08, 1.0, .88]];

  function cammina(p, a, b, t, t0, dur) {          // posizione e fase del passo lungo il segmento a→b

    const offTetto = tetto.position.y - HM;
    // --- lampadario

    lampPerno.rotation.set(osc * .6, 0, osc);

    lampPerno.visible = !((t > S(8) + .4 && t < E(8) - .1) || (t > S(11) + .4 && t < E(11) - .3) || (t > S(13) + .4 && t < T.muri - .2));

      const u = prog(te, T.libri + l.t0, .7), s = u * u;

      l.b.rotation.set(mix(0, Math.PI / 2, u), mix(0, l.rot, u), 0);
    });
    // --- vaso della mensola: sul divano; nella casa preparata va a terra
    if (!prep) {
      const u = prog(te, T.vaso, .65), s = u * u;
      vaso.position.set(mix(vasoSu.x, vasoDivano.x, u), mix(vasoSu.y, vasoDivano.y, s) + Math.sin(u * Math.PI) * .12, mix(vasoSu.z, vasoDivano.z, u));
      vaso.rotation.set(mix(0, 1.35, u), 0, mix(0, -.6, u));
    } else {
      const u = ease.morbida(prog(t, T.sopra + .1, 1.5));
      vaso.position.set(mix(vasoSu.x, vasoBasso.x, u), mix(vasoSu.y, vasoBasso.y, u) + Math.sin(u * Math.PI) * .35, mix(vasoSu.z, vasoBasso.z, u));
      vaso.rotation.set(0, u * 1.2, 0);
    }
    // --- mensola: sparisce nella casa preparata
    const via = prep ? liscia(prog(t, T.sopra, 1.0)) : 0;
    mensola.position.y = 1.92 + .4 * via; mensola.visible = via < .98;
    mensola.material.transparent = via > 0; mensola.material.opacity = 1 - via;
    // --- quadro: salta dal gancio aperto e cade sul divano; nella casa preparata resta (gancio chiuso)
    if (!prep) {
      const u = prog(te, T.quadro, .75), s = u * u;
      quadro.position.set(mix(QX, QD.x, u), mix(QY, QD.y, s) + Math.sin(Math.min(1, u * 2.5) * Math.PI) * .07, mix(QZ, QD.z, u));

    gancioVeroAperto.visible = !prep || t < T.ganci + .6;

    const ug = prep ? fin(t, T.ganci - .1, T.sopra - .25, .45, .4) : 0;
    [gancioGrandeAperto, gancioGrandeChiuso].forEach((g, i) => {
      const u = clamp(prog(t, T.ganci - .1 + i * .35, .45)) * (ug > 0 ? 1 : 0) * ug;

    // --- TV: scivola e cade; nella casa preparata cinghie e staffetta (vista esplosa)
    if (!prep) {
      const u = prog(te, T.tv, .55), v = prog(te, T.tv + .55, .55), vv = v * v;
      tv.position.set(CX, mix(.5, .1, vv), mix(mix(TVZ, -2.13, liscia(u)), -1.74, v));

    } else {
      tv.position.set(CX, .5, TVZ);
      tv.rotation.set(.006 * A.casa * Math.sin(t * 11), 0, 0);
    }
    const uc = esplodi(prog(t, T.cinghia - .3, 1.0));
    cinghie.visible = prep && t >= T.cinghia - .3;
    cinghieSingole.forEach((c, i) => {
      c.g.position.copy(c.base).add(V(0, .45 * (1 - uc), .75 * (1 - uc) + .05 * i * (1 - uc)));
      c.g.rotation.set((1 - uc) * .9, 0, 0);
    });
    const usp = esplodi(prog(t, T.cinghia + .3, .8));
    staffaPiede.visible = cinghie.visible;
    staffaPiede.position.copy(spBase).add(V(0, .3 * (1 - usp), .55 * (1 - usp)));
    staffaPiede.scale.setScalar(2.2);
    // --- cucina: le ante si spalancano, piatti e bicchieri cadono; nella casa preparata i fermi
    ante.forEach((a, i) => {
      if (!prep) {
        const u = esplodi(prog(te, T.ante + i * .12, .45));

    piatti.forEach(p => {
      const u = prep ? 0 : prog(te, T.ante + p.d, .6), s = u * u;
      const fuori = clamp(u * 3);
      p.p.position.set(mix(p.p0.x, p.p0.x + .45, fuori) + (p.p1.x - p.p0.x - .45) * clamp((u - .2) / .5), mix(p.p0.y, p.p1.y, s), mix(p.p0.z, p.p1.z, u));
      p.p.rotation.set(mix(0, p.rx, u) + Math.sin(u * Math.PI) * 1.2, p.sp * u, mix(0, p.rz, u));
    });
    bicchieri.forEach(b => {
      const u = prep ? 0 : prog(te, T.ante + b.d, .6), s = u * u;
      b.b.position.set(mix(b.b0.x, b.b1.x, u), mix(b.b0.y, b.b1.y, s), mix(b.b0.z, b.b1.z, u));
      b.b.rotation.set(0, 0, mix(0, Math.PI / 2, liscia(u)));
    });
    frantumi.visible = !prep && te >= T.ante + .85;
    const uf = esplodi(prog(t, T.fermo - .3, .9));
    fermi.forEach((f, i) => {
      f.fe.visible = prep && t >= T.fermo - .3;
      f.fe.position.copy(f.base).add(V(.55 * (1 - uf), .12 * (1 - uf) + .02 * i * (1 - uf), 0));
      f.fe.scale.setScalar(1.7);

    let ang;
    if (!prep) {
      const w = prog(te, T.inclina - .6, .6), c = prog(te, T.inclina, 1.0);
      ang = .06 * Math.sin(w * Math.PI * 3) * (1 - c) + 1.43 * c * c;
      if (c >= 1) ang = 1.43 - .04 * Math.abs(Math.sin(prog(te, T.inclina + 1.0, .4) * Math.PI)) * (1 - prog(te, T.inclina + 1.4, .3));
    } else ang = .01 * A.casa * Math.sin(t * 9);
    librPerno.rotation.x = ang;
    // --- scatola pesante: in cima, poi a terra; statuina e orologio con il biadesivo
    const sg = prep ? esplodi(prog(t, T.pesanti + .1, 1.2)) : 0;
    scatola.position.set(mix(scatolaSu.x, scatolaGiu.x, sg), mix(scatolaSu.y, scatolaGiu.y, sg) + Math.sin(sg * Math.PI) * .28, mix(scatolaSu.z, scatolaGiu.z, sg));
    const alza = prep ? Math.sin(clamp(prog(t, T.nastro - .2, 1.3)) * Math.PI) * .24 : 0;
    statuina.position.y = LBH + .006 + alza; orologio.position.y = LBH + .006 + alza * .9;
    biadesivi.forEach((b, i) => { b.visible = prep && t >= T.nastro + .2; if (b.visible) comparsa(b, t, T.nastro + .2 + i * .1, .3); });
    // --- staffe, viti e tasselli: vista esplosa che si chiude sulla libreria
    staffe.forEach(s => {
      const u = esplodi(prog(t, T.staffe - .1, 1.0)), resp = .12 * Math.sin(prog(t, T.staffe + .9, 1.2) * Math.PI);
      s.g.visible = prep && t >= T.staffe - .4;
      s.g.position.copy(s.base).add(V(0, .55 * (1 - u) + .02 * resp, .9 * (1 - u)));
      s.tassello.position.copy(s.tasBase).add(V(0, 0, .3 * (1 - esplodi(prog(t, T.staffe - .3, .7)))));
      s.vite.position.copy(s.viteBase).add(V(0, 0, .28 * (1 - esplodi(prog(t, T.staffe + .6, .6)))));
    });
    // --- portafinestra: crepa e schegge (prima scossa)
    const rotto = !prep && te >= T.ante + .3;
    crepe.visible = rotto; schegge.visible = rotto && te >= T.ante + .45;
    // --- fuori: vasi dal balcone, tegole, cornicione, balcone che cede
    vasiB.forEach((v, i) => {
      if (!prep) {
        const u = prog(te, T.vasiF + i * .18, .95), s = u * u;
        v.g.position.set(mix(v.up.x, v.giu.x, u), mix(v.up.y, v.giu.y, s) + Math.sin(Math.min(1, u * 4) * Math.PI) * .06, mix(v.up.z, v.giu.z, u));
        v.g.rotation.set(mix(0, v.rx, u), 0, mix(0, v.rz, u));
        v.cocci.visible = u >= 1;
        v.pianta.position.y = u >= 1 ? .2 : .32;
      } else {
        const u = esplodi(prog(t, T.tolgono + i * .18, 1.0));
        v.g.position.set(mix(v.up.x, v.pav.x, u), mix(v.up.y, v.pav.y, u) + Math.sin(u * Math.PI) * .3, mix(v.up.z, v.pav.z, u));
        v.g.rotation.set(0, 0, .015 * A.casa * Math.sin(t * 10 + i));
        v.cocci.visible = false; v.pianta.position.y = .32;
      }
    });
    tegole.forEach(g => {
      const t0 = T.tegole + g.d, u1 = prep ? 0 : prog(te, t0, .35), u2 = prep ? 0 : prog(te, t0 + .35, .85);
      if (u2 <= 0) {
        g.g.position.copy(g.base).lerp(g.gronda, u1 * u1);
        if (u1 <= 0) g.g.position.y += offTetto;
        g.g.rotation.set(-PEND, 0, 0);
      } else {
        g.g.position.set(mix(g.gronda.x, g.giu.x, u2), mix(g.gronda.y, g.giu.y, u2 * u2), mix(g.gronda.z, g.giu.z, u2));
        g.g.rotation.set(-PEND + u2 * 3, g.sp * u2 * .3, u2 * g.sp * .2);
      }
      g.g.visible = u1 > 0 || tetto.visible;
    });
    {
      const u = prep ? 0 : prog(te, T.cornicione, .95);
      pezzoCorn.position.set(mix(pcBase.x, pcGiu.x, u), mix(pcBase.y, pcGiu.y, u * u), mix(pcBase.z, pcGiu.z, u));
      if (u <= 0) pezzoCorn.position.y += offTetto;
      pezzoCorn.rotation.set(-u * 1.1, 0, u * .35);
      pezzoCorn.visible = u > 0 || tetto.visible;
      cicatrice.visible = u > 0;
    }
    const ced = prep ? 0 : esplodi(prog(te, T.cedere, .9));
    balc.rotation.x = -.33 * ced - (ced > 0 && ced < 1 ? .01 * Math.sin(t * 40) : 0);
    crepaBalc.visible = crepaSotto.visible = !prep && te >= T.cedere - .25;
    calcinacci.forEach(c => {
      const u = prep ? 0 : prog(te, T.cedere + .15 + c.d, .85);
      c.c.visible = u > 0;
      c.c.position.set(mix(c.p0.x, c.p1.x, u), mix(c.p0.y, c.p1.y, u * u), mix(c.p0.z, c.p1.z, u));
      c.c.rotation.set(u * 4, u * 2, 0);
    });
    // --- il tecnico: balcone e cornicione evidenziati
    const ev = prep ? fin(t, T.muri + .2, E(13), .6, .5) * (.5 + .5 * Math.sin(t * 4)) : 0;
    matBalc.emissive.set(0x2a8cff); matBalc.emissiveIntensity = .35 * ev;
    matCorn.emissive.set(0x2a8cff); matCorn.emissiveIntensity = .35 * ev;
    // --- gas, acqua e luce evidenziati (scena 13); kit che compare
    matLevaGas.emissiveIntensity = prep ? .9 * lampeggio(t, T.gas, 1.6) : 0;
    matRub.emissiveIntensity = prep ? .9 * lampeggio(t, T.acqua, 1.4) : 0;
    matInt.emissiveIntensity = prep ? 1.2 * lampeggio(t, T.luceK, 1.2) : 0;
    [T.gas, T.acqua, T.luceK].forEach((t0, i) => {
      const u = prep ? fin(t, t0 - .1, T.muri - .5, .3, .4) : 0, p = (t - t0) * 1.6 % 1;
      aloni[i].visible = u > 0; aloni[i].material.opacity = u * (1 - .6 * p); aloni[i].scale.setScalar(1 + .5 * p);
    });
    const kitOn = prep;
    [[zaino, T.tieniK - .1], [cassetta, T.cassetta], [torcia, T.torcia], [radio, T.radio]].forEach(([o, t0]) => {
      if (kitOn) comparsa(o, t, t0); else o.visible = false;
    });
    // --- persone
    const inStanza = (t >= T.persone && t < S(5)) || (t >= T.ora - .5 && t < T.esci + 2.4);
    adulto.root.visible = bimbo.root.visible = inStanza;
    adulto.scarpe(t >= T.scarpe + .2); bimbo.scarpe(t >= T.scarpe + .45);
    const aFuori = V(.75, 0, 1.45), aSotto = V(.55, 0, .42), bFuori = V(1.55, 0, 1.3), bSotto = V(1.2, 0, .32);
    if (t < S(5)) {
      const pa = cammina(adulto.root.position, aFuori, aSotto, t, T.abbassa + .1, 1.2);
      const pb = cammina(bimbo.root.position, bFuori, bSotto, t, T.abbassa + .3, 1.1);
      const c = liscia(prog(t, T.abbassa, 1.1)), cb = liscia(prog(t, T.abbassa + .2, 1.1));
      const cop = liscia(prog(t, T.protegge, .7)), tieni = liscia(prog(t, T.tiene, .6));
      const volta = Math.sin(prog(t, T.corre - .2, 1.6) * Math.PI);
      adulto.root.rotation.y = Math.PI + 1.1 * volta;
      bimbo.root.rotation.y = Math.PI - .3;
      adulto.posa(c, cop, tieni, pa); bimbo.posa(cb, cop, tieni * .8, pb);
      const sc = liscia(prog(t, T.persone, .4));
      adulto.root.scale.setScalar(Math.max(.001, sc)); bimbo.root.scale.setScalar(Math.max(.001, sc));
    } else if (t < S(16)) {
      const sc = liscia(prog(t, T.ora - .5, .4));
      adulto.root.scale.setScalar(Math.max(.001, sc)); bimbo.root.scale.setScalar(Math.max(.001, sc));
      const fuori = liscia(prog(t, T.finisce, 1.0));
      const c = 1 - fuori, cop = 1 - liscia(prog(t, T.finisce - .1, .6)), tieni = cop;
      adulto.root.position.copy(aSotto).lerp(V(.55, 0, 1.2), fuori);
      bimbo.root.position.copy(bSotto).lerp(V(1.4, 0, 1.25), fuori);
      const guarda = liscia(prog(t, T.controlla, .6)) * (1 - liscia(prog(t, T.scarpe + 1.6, .6)));
      adulto.root.rotation.y = mix(Math.PI, Math.PI / 2, guarda);
      bimbo.root.rotation.y = mix(Math.PI - .3, -Math.PI / 2, guarda);
      let pa = 0, pb = 0;
      const gasP = V(2.45, 0, .35), qeP = V(2.45, 0, 1.05), portaP = V(2.4, 0, -1.2), oltre = V(3.9, 0, -1.2);
      if (t >= T.chiudi - 1.3) {
        const tA = T.chiudi - 1.3;
        if (t < tA + 1.2) { pa = cammina(adulto.root.position, V(.55, 0, 1.2), gasP, t, tA, 1.2); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.luce - .4) { adulto.root.position.copy(gasP); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.luce + .3) { pa = cammina(adulto.root.position, gasP, qeP, t, T.luce - .4, .7); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.esci) { adulto.root.position.copy(qeP); adulto.root.rotation.y = Math.PI / 2; }
        else if (t < T.esci + 1.2) { pa = cammina(adulto.root.position, qeP, portaP, t, T.esci, 1.2); adulto.root.rotation.y = Math.PI; }
        else { pa = cammina(adulto.root.position, portaP, oltre, t, T.esci + 1.2, 1.0); adulto.root.rotation.y = Math.PI / 2; }
      }
      if (t >= T.esci - .2) {
        const b0 = V(1.4, 0, 1.25), bp = V(2.2, 0, -1.0);
        if (t < T.esci + 1.4) { pb = cammina(bimbo.root.position, b0, bp, t, T.esci - .2, 1.6); bimbo.root.rotation.y = Math.PI * .8; }
        else { pb = cammina(bimbo.root.position, bp, V(3.9, 0, -1.0), t, T.esci + 1.4, 1.0); bimbo.root.rotation.y = Math.PI / 2; }
      }
      const braccio = t >= T.chiudi - .1 && t < T.esci ? 1 : 0;
      adulto.posa(c, cop, Math.max(tieni, braccio * .9), pa); bimbo.posa(c, cop, tieni * .8, pb);
    } else {
      // all'area di attesa
      adulto.root.visible = bimbo.root.visible = true;
      adulto.root.position.set(3.45, YT, 5.75); bimbo.root.position.set(4.0, YT, 5.6);
      adulto.root.rotation.y = bimbo.root.rotation.y = -.4;
      adulto.root.scale.setScalar(1); bimbo.root.scale.setScalar(1);
      adulto.posa(0, 0, 0, 0); bimbo.posa(0, 0, 0, 0);
      adulto.scarpe(true); bimbo.scarpe(true);
    }
    // gas e luce chiusi dopo la scossa
    valvola.rotation.x = -Math.PI / 2 * liscia(prog(t, T.chiudi + .1, .5)) * (t < S(16) ? 1 : 0);
    interruttore.rotation.z = (t >= T.luce + .2 && t < S(16)) ? .6 : -.4;
    lampadina.material.color.set(t >= T.luce + .2 && t < S(16) ? 0x6b6b6b : 0xfff3c4);
    portaPerno.rotation.y = -1.45 * liscia(prog(t, T.esci + .8, .6)) * (1 - liscia(prog(t, S(16) + .1, .6)));
    // --- il passante in strada (scena 3): si ferma, guarda, poi si allontana verso la piazza
    passante.root.visible = t > S(3) - .4 && t < S(4) + .4;
    {
      const YM = YT + .07, Y0 = YT;
      const a0 = V(-.15, YM, -3.55), a1 = V(-.95, YM, -3.55), a2 = V(-1.3, Y0, -8.6);
      let ph = 0;
      if (t < T.allontana) {
        ph = cammina(passante.root.position, a0, a1, t, S(3), T.vasiF - S(3) + .2) * .8;
        const gira = liscia(prog(t, T.vasiF + .3, .7));
        passante.root.rotation.y = mix(-Math.PI / 2, 0, gira);
      } else {
        ph = cammina(passante.root.position, a1, a2, t, T.allontana + .2, 3.4);
        passante.root.position.y = mix(YM, Y0, clamp(prog(t, T.allontana + .5, .6)));
        passante.root.rotation.y = mix(0, Math.PI, liscia(prog(t, T.allontana - .1, .5)));
      }
      const spav = fin(t, T.vasiF + .2, T.allontana, .3, .3) * .25;
      passante.posa(0, spav, 0, ph);
    }
    // --- pianerottolo
    pianerottolo.visible = ospite.root.visible = t > S(5) - 1.4 && t < S(6) + 1.4;
    const sx = liscia(prog(t, T.scale - .2, .4)), sa = liscia(prog(t, T.ascensore - .2, .4));
    xScale.visible = sx > 0 && pianerottolo.visible; xScale.scale.setScalar(Math.max(.001, sx));
    xAsc.visible = sa > 0 && pianerottolo.visible; xAsc.scale.setScalar(Math.max(.001, sa));
    xScale.position.set(XP + .7, .55, .6).add(tremito(t, A.pian, 3)); xAsc.position.set(XP - .85, 1.2, -1.4).add(tremito(t, A.pian, 3));
    ospite.root.position.set(XP - .2, 0, .9).add(tremito(t, A.pian, 3));
    ospite.root.rotation.y = Math.PI * .85; ospite.posa(0, 0, 0, 0);
    // --- visibilità per scena (meno oggetti da disegnare)
    quartiere.visible = !(t > S(5) + 1.4 && t < S(6) - .2);
    // riavvolgimento: righe e tinta sopra la scena
    gfx.clearRect(0, 0, fx.width, fx.height);
    const rw = fin(t, T.rewind - .1, T.rewind + RW + .1, .15, .25);
    if (rw > 0) {
      gfx.fillStyle = 'rgba(40,90,190,' + (.16 * rw).toFixed(3) + ')'; gfx.fillRect(0, 0, fx.width, fx.height);
      const off = (t * 220) % 12;
      gfx.fillStyle = 'rgba(255,255,255,' + (.07 * rw).toFixed(3) + ')';
      for (let y = -12 + off; y < fx.height; y += 12) gfx.fillRect(0, y, fx.width, 2);
      gfx.fillStyle = 'rgba(255,255,255,' + (.85 * rw).toFixed(3) + ')';
      const cx = fx.width / 2, cy = (ORIZ ? 240 : 470) / 2, s = ORIZ ? 22 : 26;
      [-1, 1].forEach(d => { gfx.beginPath(); gfx.moveTo(cx + d * s * .2 + s * .9, cy - s); gfx.lineTo(cx + d * s * .2 - s * .1, cy); gfx.lineTo(cx + d * s * .2 + s * .9, cy + s); gfx.fill(); });
    }
  }

  function render(t) {
    t = clamp(t, 0, TOTAL); tAttuale = t;
    cam.applica(t);
    camera.near = .02; camera.far = 150; camera.updateProjectionMatrix();
    anima(t);
    vicino.disegna(scena, camera);
    const k = sceneA(t), c = CONFIG.capitoloDi[k], sc = SC[k];
    const primaDelCap = CONFIG.capitoloDi.indexOf(c);
    IMP.aggiorna(stato, t, { passoHUD: c + (k === 0 ? 1 : (k === primaDelCap ? clamp((t - sc.inizio) / .4) : 1)), hud: CONFIG.hud[k], notaVisibile: true });
    IMP.sottotitoli(stato, t, FRASI, { modo: CONFIG.modo });
    proiezioni = {};
    for (const s of SCH) {
      let punto = null, vis = true, p = null;
      if (s.punto) {
        p = M3.proietta(s.punto(), camera, { zona: L.zonaSchede, margine: L.margine });
        punto = p.punto; vis = p.visibile;
      }
      proiezioni[s.id] = p;
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, colore: s.colore, punto, verso: s.verso,
        inizio: s.inizio, fine: s.fine, visibile: vis,
        centro: s.punto ? null : { x: W / 2, y: L.zona.alto + (ORIZ ? 110 : 150) } });
    }
    const testo = k === SC.length - 1 ? CONFIG.fonte : '';
    if (fonte.textContent !== testo) fonte.textContent = testo;
    fonte.style.display = testo ? '' : 'none';
    fonte.style.left = L.margine + 'px';
    fonte.style.top = (L.zona.basso - fonte.offsetHeight - 6) + 'px';
  }

  window.renderFrame = t => render(t);
  window.__controlli = () => IMP.controlli(stato)
    .concat(M3.controlliSchede(tAttuale, SCH.filter(s => s.punto).map(s => ({ id: s.id, inizio: s.inizio, fine: s.fine, proiezione: proiezioni[s.id], attivo: true }))))
    .concat(PROBLEMI_TEMPI.filter(p => tAttuale >= p.inizio && tAttuale <= p.fine));
  IMP.caricaFont().then(() => { casa.updateMatrixWorld(true); render(0); window.__ready = true; });
})();
</script>
