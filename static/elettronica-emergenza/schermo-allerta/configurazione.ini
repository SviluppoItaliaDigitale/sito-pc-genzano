; Impostazioni dello schermo dell'allerta. Non contiene segreti.
; Pagina del progetto: https://www.protezionecivilegenzano.it/elettronica-emergenza/schermo-allerta/
[schermo]
; Indirizzo pubblico dello stato dell'allerta (dati CC BY 4.0)
indirizzo = https://www.protezionecivilegenzano.it/allerta-stato/index.json
; Ogni quanti minuti rileggere (almeno 5: rileggere piu' spesso non serve)
intervallo_minuti = 5
; Oltre quante ore dall'ultimo controllo del sito lo stato diventa "da confermare"
ore_validita = 6
; Tempo massimo di attesa della risposta, in secondi
timeout_secondi = 20
