<title id="titolo">Il terremoto</title>
<desc id="descrizione">Sezione del terreno: una faglia attraversa l’ipocentro, in profondità. L’epicentro è in superficie, sulla verticale dell’ipocentro. Le onde sismiche raggiungono una casa.</desc>
