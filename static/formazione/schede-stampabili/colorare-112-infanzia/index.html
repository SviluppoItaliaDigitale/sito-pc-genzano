    <img src="scheda-completa.png"
         alt="Scheda da colorare: come chiamo il 112. In alto al centro il logo del Gruppo Comunale Volontari di Protezione Civile di Genzano di Roma. Titolo 'Come chiamo il 112?'. Sei vignette numerate: 1) bambino vede del fumo e un altro bambino caduto a terra che si è fatto male; 2) bambino calmo prende il telefono da un tavolo; 3) tastiera del telefono con i numeri 1-1-2 evidenziati in alto; 4) bambino al telefono con cartellino del nome 'Flavio'; 5) bambino al telefono indica una mappa con un pin di posizione; 6) bambino aspetta sulla porta di casa mentre l'ambulanza arriva con la sirena. In basso 'Rev. 02 - Maggio 2026 - protezionecivilegenzano.it'.">
