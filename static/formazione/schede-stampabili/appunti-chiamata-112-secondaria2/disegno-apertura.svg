<rect x="242" y="113" width="114" height="70" rx="10" fill="#fff0a8"/>
<g fill="#003366" font-family="Arial, sans-serif" font-size="24"><text x="253" y="161" font-size="48" font-weight="700">112</text><text x="38" y="35">che cosa<tspan x="38" dy="28">succede</tspan></text><text x="405" y="61">dove</text><text x="38" y="238">quante<tspan x="38" dy="28">persone</tspan></text><text x="405" y="264">chi sei</text></g>
