<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">Come si chiama il 112</title>
<desc id="descrizione">Un telefono con 112 sullo schermo, collegato a quattro promemoria: che cosa succede, dove, quante persone, chi sei.</desc>
