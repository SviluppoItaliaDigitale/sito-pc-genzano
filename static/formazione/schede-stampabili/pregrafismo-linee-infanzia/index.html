<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheda da colorare: Pregrafismo — Le linee della Protezione Civile (Infanzia)</title>
  <meta name="description" content="Scheda fotocopiabile per la Scuola dell'Infanzia. Esercizi di pregrafismo a tema Protezione Civile: linee dritte (casco), zig-zag (fulmine), onde (acqua), spirali (tornado). Il bambino ripassa con la matita le linee tratteggiate.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/formazione/schede-stampabili/assets/scheda-print.css">
  <style>
    body { margin: 0; padding: 0; background: #f4f7fb; }
    .scheda-immagine-wrapper { max-width: 900px; margin: 1rem auto; padding: 0 1rem; }
    .scheda-immagine-wrapper img { width: 100%; height: auto; display: block; box-shadow: 0 4px 20px rgba(0,0,0,0.12); border-radius: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media print {
      body { background: #fff; }
      .scheda-immagine-wrapper { max-width: 100%; margin: 0; padding: 0; }
      .scheda-immagine-wrapper img { box-shadow: none; border-radius: 0; width: 100%; height: auto; max-height: calc(100vh - 16mm); object-fit: contain; }
      /* Banda affiliazioni (Reg. UE 2021/888): Quality Label ESC + codice E10435833, Coordinamento FE.PI.VOL., SNPC Volontariato — stessa immagine di .scheda-page::after in assets/scheda-print.css */
      .scheda-immagine-wrapper::after { content: ""; display: block; height: 12mm; margin-top: 2mm; background: url("/images/footer-print-affiliazioni.png") no-repeat center / contain; -webkit-print-color-adjust: exact; print-color-adjust: exact; page-break-inside: avoid; }
      @page { size: A4 portrait; margin: 8mm; }
    }
  </style>

<body>
  <div class="scheda-toolbar no-print">
    <a href="/formazione/schede-stampabili/" aria-label="Torna alle schede">← Torna alle schede</a>
    <span class="scheda-titolo">Pregrafismo: Le linee della Protezione Civile — Infanzia</span>
    <button type="button" onclick="window.print()">🖨️ Stampa o salva come PDF</button>
  </div>

  <main class="scheda-immagine-wrapper">
    <h1 class="sr-only">Pregrafismo: Le linee della Protezione Civile — Infanzia</h1>
    <img src="scheda-completa.png"
         alt="Scheda di pregrafismo: le linee della Protezione Civile. In alto al centro il logo del Gruppo Comunale Volontari di Protezione Civile di Genzano di Roma. Titolo 'Le linee della Protezione Civile'. Sottotitolo 'Segui le linee tratteggiate con la matita!'. Quattro esercizi: 1) Linee dritte, illustrazione di un casco di sicurezza accanto a tre linee orizzontali tratteggiate; 2) Zig-zag, illustrazione di un fulmine accanto a due linee a zig-zag tratteggiate; 3) Onde, illustrazione di onde di mare accanto a due linee ondulate tratteggiate; 4) Spirali, illustrazione di un tornado accanto a tre spirali tratteggiate. In basso 'Rev. 02 - Maggio 2026 - protezionecivilegenzano.it'.">
  </main>
