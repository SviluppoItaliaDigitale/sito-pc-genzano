<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" role="img" aria-labelledby="title desc"><title id="title">Manica a vento: osserva</title><desc id="desc">Manica quasi sgonfia con vento debole e manica estesa verso il flusso con vento più forte. Le frecce indicano la direzione in cui si muove l'aria.</desc><defs><linearGradient id="bg" x1="0" x2="0.2" y1="0" y2="1"><stop stop-color="#f5fbfe"/><stop offset="1" stop-color="#e9f2f6"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8d9f0"/><stop offset="1" stop-color="#ecf8fa"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3495b5"/><stop offset="1" stop-color="#236889"/></linearGradient></defs><rect width="720" height="1180" fill="url(#bg)"/><rect width="720" height="16" fill="#15658b"/><text x="32" y="68" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="#123f5c" text-anchor="start">Manica a vento: osserva</text>
<rect x="23" y="105" width="674" height="478" rx="22" fill="#ffffff" stroke="#b7cdd8" stroke-width="3"/><path d="M44 105 H675 Q697 105 697 127 V181 H23 V127 Q23 105 44 105Z" fill="#217892"/><circle cx="65" cy="144" r="27" fill="#fff"/><text x="65" y="154" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#217892" text-anchor="middle">1</text><text x="113" y="157" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="start">VENTO DEBOLE</text>
<g transform="translate(221 238)"><path d="M0 0 V272" stroke="#557287" stroke-width="16" stroke-linecap="round"/><path d="M-66 274 H65" stroke="#6d8797" stroke-width="15" stroke-linecap="round"/><circle cx="0" cy="0" r="15" fill="#d0dfde" stroke="#5d7b8e" stroke-width="6"/><path d="M0 -28 V27" stroke="#748e9c" stroke-width="6"/><path d="M0 -31 Q85 -30 94 25 Q112 102 61 142 Q48 150 56 116 Q76 52 0 31Z" fill="#f4e8da" stroke="#947456" stroke-width="7"/><path d="M3 -30 Q78 -28 89 15 Q93 34 88 54 Q80 19 3 26Z" fill="#d97951"/></g>
<path d="M70 298 H169 M82 335 H170" fill="none" stroke="#78b7cb" stroke-width="8" stroke-linecap="round"/>
<text x="469" y="348" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#225d7a" text-anchor="middle">Poco gonfia</text>
<text x="468" y="383" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#225d7a" text-anchor="middle">e ricadente</text>
<text x="358" y="560" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#376a7c" text-anchor="middle">Osserva solo da un luogo sicuro.</text>
<g transform="translate(0 20)"><rect x="23" y="583" width="674" height="490" rx="22" fill="#ffffff" stroke="#b7cdd8" stroke-width="3"/><path d="M44 583 H675 Q697 583 697 605 V659 H23 V605 Q23 583 44 583Z" fill="#165c87"/><circle cx="65" cy="622" r="27" fill="#fff"/><text x="65" y="632" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#165c87" text-anchor="middle">2</text><text x="113" y="635" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="start">VENTO PIÙ FORTE</text>
<g transform="translate(141 702)"><path d="M0 0 V272" stroke="#557287" stroke-width="16" stroke-linecap="round"/><path d="M-66 274 H65" stroke="#6d8797" stroke-width="15" stroke-linecap="round"/><circle cx="0" cy="0" r="15" fill="#d0dfde" stroke="#5d7b8e" stroke-width="6"/><path d="M0 -28 V27" stroke="#748e9c" stroke-width="6"/><path d="M0 -31 L256 -5 Q279 0 255 9 L0 31Z" fill="#f6ece0" stroke="#947456" stroke-width="7"/><path d="M39 -28 L96 -20 V20 L39 28Z M140 -16 L193 -11 V12 L140 15Z" fill="#df774e" stroke="#c85d43" stroke-width="3"/></g>
<path d="M70 698 H111 M70 754 H111 M70 810 H111" stroke="#328bb4" stroke-width="9" stroke-linecap="round"/>
<text x="492" y="787" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#225d7a" text-anchor="middle">Più distesa</text>
<text x="492" y="826" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#225d7a" text-anchor="middle">e gonfia</text>
<text x="357" y="1046" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#376a7c" text-anchor="middle">Non è uno strumento di misura preciso.</text>
</g><text x="361" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#426479" text-anchor="middle">La punta indica dove scorre l'aria.</text>
</svg>