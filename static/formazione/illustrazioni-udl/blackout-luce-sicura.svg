<text x="298" y="486" font-family="Arial,sans-serif" fill="#176f61" font-weight="700" font-size="23" text-anchor="middle">Torcia e radio a pile</text><text x="892" y="491" font-family="Arial,sans-serif" fill="#9c4939" font-weight="700" font-size="22" text-anchor="middle">No candele; mai generatori</text><text x="892" y="515" font-family="Arial,sans-serif" fill="#9c4939" font-weight="400" font-size="19" text-anchor="middle">a combustibile in locali chiusi</text>
<text x="601" y="586" font-family="Arial,sans-serif" fill="#40596b" font-weight="400" font-size="17" text-anchor="middle">Non usare mai motori a combustibile negli ambienti interni: rischio di monossido di carbonio.</text></svg>