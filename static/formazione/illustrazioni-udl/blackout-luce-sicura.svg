<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Blackout: illumina in sicurezza</title><desc id="desc">A sinistra sono mostrati torcia elettrica e radio a pile; a destra, barrati, una candela accesa e un generatore a combustibile in un ambiente chiuso.</desc><defs><linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fcfe"/><stop offset="1" stop-color="#eaf3f7"/></linearGradient><linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#cfeefb"/><stop offset="1" stop-color="#6cb4d6"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect y="0" width="1200" height="12" fill="#0b6384"/><text x="43" y="67" font-family="Arial,sans-serif" fill="#123d5a" font-weight="700" font-size="31" text-anchor="start">Blackout: illumina in sicurezza</text>
<rect x="31" y="106" width="548" height="441" rx="19" fill="#ebf6f7" stroke="#b4d6dc" stroke-width="3"/><rect x="604" y="106" width="570" height="441" rx="19" fill="#fff1e8" stroke="#e5b7a0" stroke-width="3"/>
