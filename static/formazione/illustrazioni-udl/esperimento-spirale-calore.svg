<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">La spirale che gira: l'aria calda sale</title><desc id="desc">Due spirali di carta appese a un filo. A sinistra, lontana dal calore, la spirale resta quasi ferma. A destra, sopra un termosifone acceso, l'aria scaldata sale e la fa girare, mentre aria più fresca arriva dai lati. Nessuna fiamma: la carta prende fuoco.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="sand" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e6c497"/><stop offset="1" stop-color="#bb9462"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e2f6"/><stop offset="1" stop-color="#4a9dc9"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123957">La spirale che gira: l'aria calda sale</text><rect x="42" y="99" width="535" height="458" rx="22" fill="#f3faff" stroke="#b7d5e8" stroke-width="2"/><rect x="622" y="99" width="535" height="458" rx="22" fill="#fff7ed" stroke="#e7c5a1" stroke-width="2"/><text x="309" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#145b82">LONTANO DAL CALORE</text><text x="888" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#834d20">SOPRA IL TERMOSIFONE</text><path d="M309 170 V292" stroke="#6b7f8c" stroke-width="3"/><g class="spiraleL"><path d="M317.0 300.0 L317.3 300.9 L317.5 301.8 L317.6 302.8 L317.6 303.8 L317.5 304.9 L317.2 306.0 L316.8 307.0 L316.3 308.1 L315.6 309.1 L314.8 310.0 L313.8 310.9 L312.8 311.7 L311.6 312.3 L310.4 312.9 L309.0 313.3 L307.6 313.6 L306.1 313.7 L304.6 313.7 L303.0 313.5 L3