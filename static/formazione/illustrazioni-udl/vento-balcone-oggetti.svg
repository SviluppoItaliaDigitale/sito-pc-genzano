<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Vento forte: metti al sicuro gli oggetti</title><desc id="d">Su un balcone a sinistra i vasi e le sedie sono riposti all'interno prima del vento; a destra, un vaso non fissato cade vicino alla strada. Prepararsi riduce i rischi.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaf7fe"/><stop offset="1" stop-color="#fbfcf9"/></linearGradient><linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b88c69"/><stop offset="1" stop-color="#e8c8a5"/></linearGradient></defs><rect width="1200" height="620" rx="20" fill="url(#sky)"/><rect width="1200" height="12" fill="#0a6386"/><text x="45" y="65" font-family="Arial,sans-serif" font-size="31" fill="#123f5c" font-weight="700" text-anchor="start">Vento forte: metti al sicuro gli oggetti</text>
