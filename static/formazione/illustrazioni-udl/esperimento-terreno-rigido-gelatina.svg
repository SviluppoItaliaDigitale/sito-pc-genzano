<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Terremoto simulato: terreno rigido e morbido</title><desc id="desc">Due torrette identiche poggiano su basi differenti: tavoletta rigida e gelatina. Scuotendo delicatamente si possono osservare oscillazioni diverse; l'esito dipende anche da altezza, frequenza e materiali.</desc><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#e8f2f7"/></linearGradient><linearGradient id="gel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a8dbe6"/><stop offset="1" stop-color="#4ea2b6"/></linearGradient><linearGradient id="sand" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e6c497"/><stop offset="1" stop-color="#bb9462"/></linearGradient></defs><rect width="1200" height="620" rx="22" fill="url(#bg)"/><rect y="0" width="1200" height="13" fill="#176d8d"/><text x="40" y="67" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#153d59" text-anchor="start">Terremoto simulato: terreno rigido e morbido</text>
