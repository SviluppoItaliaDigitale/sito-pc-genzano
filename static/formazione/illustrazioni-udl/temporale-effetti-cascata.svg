fff" stroke="#c4d7df" stroke-width="2"/><rect x="0" y="107" width="260" height="66" rx="18" fill="#087d80"/><text x="17" y="149" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">4. ALTRI EFFETTI</text></g><g transform="translate(32 0)"><path d="M61 296 Q47 250 100 241 Q125 203 166 242 Q216 232 219 278 Q245 308 212 325 L89 325 Q56 320 61 296" fill="#8cabc0" stroke="#54748b" stroke-width="5"/><path d="M105 339 l-11 36 M159 342 l-11 36 M204 339 l-11 36" stroke="#1879b5" stroke-width="8" stroke-linecap="round"/><path d="M148 328 L123 383 L157 374 L137 413" stroke="#e6a53b" stroke-width="12" fill="none" stroke-linejoin="round"/></g><g transform="translate(324 0)"><path d="M132 420 V236 M90 260 H192 M92 285 H193" stroke="#657380" stroke-width="12" stroke-linecap="round"/><path d="M89 260 Q41 275 8 240 M191 260 Q218 277 248 242" fill="none" stroke="#657380" stroke-width="4"/><path d="M40 390 C28 357 39 318 81 318 C93 286 141 296 143 331 C180 344 166 391 120 395Z" fill="#65a783" stroke="#2c775a" stroke-width="5"/><path d="M83 385 L119 437" stroke="#805a39" stroke-width="13" stroke-linecap="round"/><path d="M93 307 L148 248" stroke="#a5483a" stroke-width="6"/><circle cx="144" cy="255" r="14" fill="#fff1e8" stroke="#b6382d" stroke-width="4"/></g><g transform="translate(616 0)"><path d="M42 429 V300 L132 241 L225 300 V429" fill="#e8eff4" stroke="#557088" stroke-width="6"/><path d="M36 302 L132 235 L230 302" fill="none" stroke="#537890" stroke-width="13" stroke-linejoin="round"/><rect x="64" y="322" width="53" height="56" rx="5" fill="#334b61"/><rect x="147" y="322" width="53" height="56" rx="5" fill="#334b61"/><rect x="118" y="383" width="31" height="46" fill="#a1b5c3"/><circle cx="132" cy="291" r="16" fill="#e4a83d"/><path d="M120 282 L144 302 M144 282 L120 302" stroke="#99462c" stroke-width="6" stroke-linecap="round"/></g><g transform="translate(908 0)"><circle cx="93" cy="311" r="62" fill="#edf6fa" stroke="#087d80" stroke-width="5"/><path d="M93 261 C67 301 58 316 61 332 C67 367 119 367 125 331 C127 309 104 279 93 261" fill="#65b7d8" stroke="#167fa9" stroke-width="4"/><circle cx="193" cy="340" r="48" fill="#fff2df" stroke="#a36e32" stroke-width="5"/><path d="M185 318 V334 M201 318 V334" stroke="#a36e32" stroke-width="6" stroke-linecap="round"/><rect x="176" y="332" width="34" height="26" rx="6" fill="#a36e32"/><path d="M193 358 V376" stroke="#a36e32" stroke-width="6" stroke-linecap="round"/><path d="M70 418 H209" stroke="#0b7780" stroke-width="7" stroke-linecap="round"/></g><g fill="#123957" font-size="17" font-family="Arial,sans-serif" text-anchor="middle"><text x="162" y="483">Pioggia e vento</text><text x="454" y="483">Alberi o infrastrutture</text><text x="746" y="483">Possibile interruzione</text><text x="1038" y="483">Acqua e apparecchi</text><text x="162" y="506">intensi</text><text x="454" y="506">possono danneggiarsi</text><text x="746" y="506">della corrente</text><text x="1038" y="506">possono risentirne</text></g><g stroke="#9aabb5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M296 315 H318 l-9 -9 M318 315 l-9 9"/><path d="M588 315 H610 l-9 -9 M610 315 l-9 9"/><path d="M880 315 H902 l-9 -9 M902 315 l-9 9"/></g><text x="600" y="581" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#3b5363">Sono conseguenze POSSIBILI, non una catena inevitabile. Prepararsi aiuta a ridurre gli effetti.</text></svg>