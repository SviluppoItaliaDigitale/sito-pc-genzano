<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Siccità: limita sprechi e usi non essenziali</title><desc id="desc">Tre azioni quotidiane illustrate: ripara un rubinetto che perde, riempi la lavatrice prima dell'uso e conserva acqua potabile in contenitori idonei alle necessità della famiglia.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#e7f2f7"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#91d3e7"/><stop offset="1" stop-color="#1f749d"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3eff6"/><stop offset="1" stop-color="#72b7d0"/></linearGradient></defs><rect width="1200" height="620" rx="16" fill="url(#wash)"/><rect width="1200" height="12" fill="#166181"/><text x="42" y="62" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#173f58" text-anchor="start">Siccità: limita sprechi e usi non essenziali</text>
<rect x="33" y="108" width="354" height="426" rx="15" fill="#eaf6fa" stroke="#b1cfdb" stroke-width="3"/><rect x="419" y="108" width="355" height="426" rx="15" fill="#edf7f4" stroke="#b4d7cb" stroke-width="3"/><rect x="808" y="108" width="360" height="426" rx="15" fill="#f5f5ea" stroke="#d2d6b7" stroke-width="3"/>
<circle cx="78" cy="149" r="24" fill="#297c9e"/><circle cx="78" cy="149" r="18" stroke="white" fill="none" stroke-width="2"/><text x="78" y="157" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">1</text><circle cx="464" cy="149" r="24" fill="#267b64"/><circle cx="464" cy="149" r="18" stroke="white" fill="none" stroke-width="2"/><text x="464" y="157" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">2</text><circle cx="851" cy="149" r="24" fill="#727b3d"/><circle cx="851" cy="149" r="18" stroke="white" fill="none" stroke-width="2"/><text x="851" y="157" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="114" y="153" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#276886" text-anchor="start">RIPARA LE PERDITE</text>
<text x="598" y="153" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#23705c" text-anchor="middle">PIENO CARICO</text>
<text x="989" y="153" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#647039" text-anchor="middle">ACQUA POTABILE</text>
<g transform="translate(100 274)"><rect x="3" y="16" width="114" height="27" rx="7" fill="#8297a2" stroke="#57717d" stroke-width="5"/><rect x="42" y="-19" width="35" height="44" rx="5" fill="#aabac2" stroke="#57717d" stroke-width="5"/><path d="M32 -23 H91" stroke="#506b7b" stroke-width="9" stroke-linecap="round"/><path d="M115 23 H151 V79" stroke="#738e9a" stroke-width="24" fill="none" stroke-linejoin="round"/><path d="M151 98 Q130 132 151 141 Q172 135 151 98" fill="#3b9dcb" stroke="#1f7da5" stroke-width="3"/></g>
<text x="205" y="497" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#285c76" text-anchor="middle">Segnala anche le perdite in strada</text>
<g transform="translate(461 222)"><rect x="0" y="0" width="276" height="235" rx="18" fill="#e2e8e9" stroke="#7c969c" stroke-width="8"/><circle cx="134" cy="119" r="85" fill="#8fc1d5" stroke="#547f92" stroke-width="8"/><path d="M58 131 Q108 100 155 135 T215 132" fill="none" stroke="#eaf6fa" stroke-width="14"/><circle cx="135" cy="119" r="61" fill="none" stroke="#b6dce8" stroke-width="7"/><rect x="219" y="27" width="24" height="12" rx="3" fill="#4380a0"/><circle cx="46" cy="35" r="7" fill="#4289ad"/></g>
<text x="599" y="497" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#285c76" text-anchor="middle">Avvia a carico completo</text>
<g transform="translate(900 244)"><rect x="16" y="19" width="118" height="197" rx="19" fill="url(#glass)" stroke="#4e8ba5" stroke-width="6"/><rect x="43" y="3" width="64" height="27" rx="6" fill="#4b8b9b"/><rect x="29" y="122" width="92" height="77" fill="#91cde5" opacity=".7"/><path d="M28 125 H124" stroke="#f0fcff" stroke-width="6"/><rect x="30" y="75" width="92" height="38" rx="5" fill="#eff9fb" stroke="#699bb1" stroke-width="2"/><text x="76" y="101" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#377189" text-anchor="middle">POTABILE</text></g>
<text x="992" y="497" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#285c76" text-anchor="middle">Scorta secondo il piano familiare</text>
<path d="M40 564 H1160" stroke="#bfced7" stroke-width="2"/><text x="600" y="597" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#36596b" text-anchor="middle">Per ordinanze e limitazioni segui sempre il gestore idrico e il Comune; usa solo acqua dichiarata potabile.</text></svg>