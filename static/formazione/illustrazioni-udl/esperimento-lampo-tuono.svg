dth="3"/><text x="955" y="236" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173C57" text-anchor="middle">Lampo: lo vedi subito</text><path d="M685 274 L376 274" fill="none" stroke="#254960" stroke-opacity=".38" stroke-width="15" stroke-linecap="round"/><path d="M685 274 L376 274" fill="none" stroke="#FFE171" stroke-width="9" stroke-linecap="round"/><path d="M380 274 L408 258 L408 290Z" fill="#FFE171" stroke="#254960" stroke-width="2"/><rect x="776" y="296" width="359" height="50" rx="13" fill="#FFFFFF" stroke="#D4DFE8" stroke-width="3"/><text x="955" y="330" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173C57" text-anchor="middle">Tuono: lo senti dopo</text><path d="M1050 372 Q995 337 938 373 T826 373 T714 373 T602 373 T490 373 L379 373" fill="none" stroke="#16364D" stroke-opacity=".32" stroke-width="13" stroke-linecap="round"/><path d="M1050 372 Q995 337 938 373 T826 373 T714 373 T602 373 T490 373 L379 373" fill="none" stroke="#D7F5FF" stroke-width="7" stroke-dasharray="21 15" stroke-linecap="round"/><path d="M379 373 L405 358 L405 388Z" fill="#D7F5FF" stroke="#16364D" stroke-width="2"/><rect x="610" y="399" width="545" height="58" rx="15" fill="#FFFFFF" stroke="#9AB7C5" stroke-width="3"/><text x="883" y="438" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173C57" text-anchor="middle">9 secondi : 3 = circa 3 km</text><rect x="30" y="477" width="1140" height="120" rx="18" fill="#FFF1DB" stroke="#E2AC6A" stroke-width="4"/><circle cx="99" cy="536" r="33" fill="#AF473D" stroke="none" stroke-width="2"/><text x="99" y="548" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text><text x="154" y="529" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#173C57" text-anchor="start">Al primo tuono entra al chiuso.</text><text x="154" y="566" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173C57" text-anchor="start">Esci 30 minuti dopo l’ultimo tuono</text></svg>