<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Lampo e tuono: la luce arriva prima del suono</title><desc id="desc">Un bambino resta al chiuso, davanti a una finestra chiusa che mostra lo stesso cielo scuro e piovoso dell'esterno. Una freccia gialla rettilinea indica la luce del lampo che arriva subito; una freccia blu ondulata e tratteggiata mostra il tuono che si sente dopo. Nove secondi diviso tre corrispondono a circa tre chilometri. Al primo tuono bisogna entrare al chiuso e uscire solo trenta minuti dopo l'ultimo.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C4F4FA"/><stop offset="1" stop-color="#4A9DCC"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EBF9FD"/><stop offset="1" stop-color="#D8EFFA"/></linearGradient><linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#506C91"/><stop offset="1" stop-color="#A7C7DB"/></linearGradient></defs><rect x="0" y="0" width="1200" height="620" rx="24" fill="#F6FAFD" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#167A99" stroke="none" stroke-width="2"/><rect x="20" y="23" width="544" height="434" rx="20" fill="#F9F4E7" stroke="#E7CC9F" stroke-width="4"/><rect x="581" y="23" width="599" height="434" rx="20" fill="url(#storm)" stroke="#6286A2" stroke-width="4"/><rect x="70" y="54" width="431" height="333" rx="10" fill="#F8F3E7" stroke="#A7B2B2" stroke-width="6"/><rect x="103" y="83" width="364" height="239" rx="3" fill="url(#storm)" stroke="#517891" stroke-width="10"/><path d="M287 85 V321 M103 200 H467" fill="none" stroke="#517891" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M337 147 Q326 130 340 116 Q351 103 371 109 Q389 84 414 100 Q440 96 450 118 Q462 141 436 150Z" fill="#627A98" stroke="#334E69" stroke-width="4"/><path d="M354 170 l-10 20 M394 170 l-10 20 M