ont-size="31" font-weight="700" fill="#173C57" text-anchor="middle">9 secondi : 3 = circa 3 km</text><rect x="30" y="477" width="1140" height="120" rx="18" fill="#FFF1DB" stroke="#E2AC6A" stroke-width="4"/><circle cx="99" cy="536" r="33" fill="#AF473D" stroke="none" stroke-width="2"/><text x="99" y="548" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text><text x="154" y="529" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#173C57" text-anchor="start">Al primo tuono entra al chiuso.</text><text x="154" y="566" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173C57" text-anchor="start">Esci 30 minuti dopo l’ultimo tuono</text></svg>