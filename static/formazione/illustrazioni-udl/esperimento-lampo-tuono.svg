<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Lampo e tuono: osservazione sicura dall’interno</title><desc id="desc">Bambino protetto dietro una finestra chiusa conta sulle dita; all’esterno si vede il temporale con fulmine, luce e onda sonora. Esempio nove secondi diviso tre, circa tre chilometri. Avvertenza: entrare subito al primo tuono e attendere trenta minuti dall’ultimo.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C4F4FA"/><stop offset="1" stop-color="#4A9DCC"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EBF9FD"/><stop offset="1" stop-color="#D8EFFA"/></linearGradient><linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#506C91"/><stop offset="1" stop-color="#A7C7DB"/></linearGradient></defs><rect x="0" y="0" width="1200" height="620" rx="24" fill="#F6FAFD" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#167A99" stroke="none" stroke-width="2"/><rect x="20" y="23" width="544" height="434" rx="20" fill="#F9F4E7" stroke="#E7CC9F" stroke-width="4"/><rect x="581" y="23" width="599" height="434" rx="20" fill="url(#storm)" stroke="#6286A2" stroke-width="4"/><rect x="70" y="54" width="431" height="333" rx="10" fill="#F8F3E7" stroke="#A7B2B2" stroke-width="6"/><rect x="103" y="83" width="364" height="239" rx="3" fill="#E0F5FD" stroke="#517891" stroke-width="10"/><path d="M287 85 V321 M103 200 H467" fill="none" stroke="#517891" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="397" cy="133" r="31" fill="#FFF1B5" stroke="none" stroke-width="2"/><path d="M85 395 H502" fill="none" stroke="#C9AF86" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="228" cy="231" r="48" fill="#F0BD98" stroke="#A87053" stroke-width="4"/><path d="M180 219 Q179 165 224 174 Q256 170 272 208 L270 222 Q23