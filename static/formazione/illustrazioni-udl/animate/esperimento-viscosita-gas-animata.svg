<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><style>.fermo{display:none}.fb{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sale{0%{transform:translateY(0);opacity:0}8%{opacity:1}88%{transform:translate(-30px,-128px);opacity:1}100%{transform:translate(-32px,-136px);opacity:0}}.bl{animation:sale 2.4s linear infinite}@keyframes fatica{0%{transform:translateY(0) scale(.6);opacity:0}8%{opacity:1}70%{transform:translate(-40px,-112px) scale(1.2);opacity:1}82%{transform:translate(-44px,-122px) scale(1.35);opacity:1}86%{transform:translate(-44px,-126px) scale(1.6);opacity:0}100%{transform:translate(-44px,-126px) scale(1.6);opacity:0}}.bd{animation:fatica 7.5s ease-in infinite;transform-origin:50% 50%}@keyframes schizzo{0%,81%{opacity:0;transform:translateY(0)}84%{opacity:1}94%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}.sz{animation:schizzo 7.5s linear infinite}</style><title id="tit">Animazione: bolle nel liquido fluido e nella miscela densa</title><desc id="desc">Nel bicchiere con il liquido fluido le bolle salgono in fretta e arrivano in superficie. Nella miscela densa le bolle salgono piano, si gonfiano restando intrappolate e poi escono di colpo con uno schizzo. È un modello didattico, non un'eruzione.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2f5ff"/><stop offset=".47" stop-color="#fff"/><stop offset="1" stop-color="#cce9f7"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123957">Esperimento: fluidità, viscosità e bolle di gas</text><g font-family="Arial,sans-serif"><rect 