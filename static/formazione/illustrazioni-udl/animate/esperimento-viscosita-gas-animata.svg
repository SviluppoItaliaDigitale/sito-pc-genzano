689b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1053 402 V325 l-16 18 M1053 325 l16 18" stroke="#a36531" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="309" y="519" font-size="20" font-weight="700" text-anchor="middle" fill="#145b82">Le bolle risalgono più facilmente</text><text x="888" y="519" font-size="20" font-weight="700" text-anchor="middle" fill="#834d20">Le bolle possono restare intrappolate</text><text x="600" y="591" font-size="17" text-anchor="middle" fill="#415b6a">Modello semplificato: la viscosità influenza il movimento dei gas; non riproduce un'eruzione reale.</text></g><g fill="#f8ffff" stroke="#367eac" stroke-width="3"><circle class="bl" style="animation-delay:-0.0s" cx="350" cy="442" r="9"/><circle class="bl" style="animation-delay:-0.4s" cx="338" cy="442" r="12"/><circle class="bl" style="animation-delay:-0.8s" cx="362" cy="442" r="7"/><circle class="bl" style="animation-delay:-1.2s" cx="344" cy="442" r="11"/><circle class="bl" style="animation-delay:-1.6s" cx="356" cy="442" r="8"/><circle class="bl" style="animation-delay:-2.0s" cx="348" cy="442" r="6"/></g><g fill="#ffe9cb" stroke="#86481e" stroke-width="4"><circle class="bd fb" style="animation-delay:-0.0s" cx="930" cy="440" r="16"/><circle class="bd fb" style="animation-delay:-2.5s" cx="930" cy="440" r="16"/><circle class="bd fb" style="animation-delay:-5.0s" cx="930" cy="440" r="16"/></g><g fill="none" stroke="#a8622c" stroke-width="5" stroke-linecap="round"><path class="sz" style="animation-delay:-0.0s" d="M868 282 l-10 -16 M886 276 V254 M904 282 l10 -16"/><path class="sz" style="animation-delay:-2.5s" d="M868 282 l-10 -16 M886 276 V254 M904 282 l10 -16"/><path class="sz" style="animation-delay:-5.0s" d="M868 282 l-10 -16 M886 276 V254 M904 282 l10 -16"/></g></svg>
