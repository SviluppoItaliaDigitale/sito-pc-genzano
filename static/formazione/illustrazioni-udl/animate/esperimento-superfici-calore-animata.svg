<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><style>.fermo{display:none}.fb{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes rg{to{stroke-dashoffset:-52}}.rg{animation:rg 1s linear infinite}@keyframes tf{0%,6%{transform:scaleY(.18)}75%,92%{transform:scaleY(1)}100%{transform:scaleY(.18)}}.tf{transform-origin:50% 100%;animation:tf 10s ease-out infinite}@keyframes tc{0%,6%{transform:scaleY(.085)}75%,92%{transform:scaleY(1)}100%{transform:scaleY(.085)}}.tc{transform-origin:50% 100%;animation:tc 10s ease-out infinite}@keyframes rf{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(34px,-46px);opacity:0}}.rf{animation:rf 1.6s linear infinite}@keyframes cs{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-40px);opacity:0}}.cs{animation:cs 2.2s linear infinite}</style><title id="title">Animazione: superficie chiara e superficie scura sotto lo stesso sole</title><desc id="desc">Lo stesso sole illumina le due superfici. Quella chiara rimanda indietro più luce e il suo termometro sale poco; quella scura assorbe più luce, si scalda di più e il suo termometro sale di più. Non sono temperature reali.</desc><defs><linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e7f2f8"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e2f6"/><stop offset="1" stop-color="#388bb9"/></linearGradient><linearGradient id="plastic" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d0e4ed" stop-opacity=".7"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#b0d2e1" stop-opacity=".8"/></linearGradient><linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fae5bc"/><stop offset="1" stop-color="#d58a57"/></linearGradient></defs><rect width="1200" height="620"