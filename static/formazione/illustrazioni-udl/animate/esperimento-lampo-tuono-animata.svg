<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><style>.fermo{display:none}.fb{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sa{0%{opacity:.35}2.08%{opacity:1}8.33%{opacity:1}13.33%,100%{opacity:.35}}.saetta{animation:sa 12s linear infinite}@keyframes lu{0%,1.67%{opacity:0}2.92%,95.00%{opacity:1}100%{opacity:0}}.luce{animation:lu 12s linear infinite}@keyframes so{0%,2.50%{opacity:.3}77.50%{opacity:.3}79.17%,95.00%{opacity:1}100%{opacity:.3}}.suono{animation:so 12s linear infinite}@keyframes fr{0%,2.50%{transform:translateX(0);opacity:0}5.00%{opacity:1}77.50%{transform:translateX(-650px);opacity:1}80.00%,100%{transform:translateX(-650px);opacity:0}}.fronte{animation:fr 12s linear infinite}@keyframes cf{0%{opacity:1}8.33%{opacity:1}8.42%,100%{opacity:0}}.cifra{opacity:0;animation:cf 12s linear infinite}@keyframes eti{0%,10.00%{opacity:0}10.83%,85.83%{opacity:1}86.67%,100%{opacity:0}}.eti{opacity:0;animation:eti 12s linear infinite}@keyframes cc{0%,78.33%{transform:scale(1)}81.67%{transform:scale(1.05)}86.67%,100%{transform:scale(1)}}.calcolo{transform-origin:50% 50%;animation:cc 12s ease-in-out infinite}</style><title id="tit">Animazione: dal lampo al tuono contando i secondi</title><desc id="desc">Il lampo si vede subito e il bambino comincia a contare i secondi, da 1 a 9. Il suono del tuono viaggia più lento e arriva quando il conteggio è a 9: 9 secondi diviso 3 fa circa 3 chilometri. Al primo tuono entra al chiuso ed esci 30 minuti dopo l'ultimo tuono.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C4F4FA"/><stop offset="1" stop-color="#4A9DCC"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EBF9FD"/><stop offset="1" stop-color="#D8EFFA"/></linearGradient><linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#506C91"/><stop offset="1" st