>2</text><text class="cifra" style="animation-delay:3.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">3</text><text class="cifra" style="animation-delay:4.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">4</text><text class="cifra" style="animation-delay:5.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">5</text><text class="cifra" style="animation-delay:6.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">6</text><text class="cifra" style="animation-delay:7.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">7</text><text class="cifra" style="animation-delay:8.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">8</text><text class="cifra" style="animation-delay:9.3s" x="188" y="136" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#173C57" text-anchor="middle">9</text></svg>
