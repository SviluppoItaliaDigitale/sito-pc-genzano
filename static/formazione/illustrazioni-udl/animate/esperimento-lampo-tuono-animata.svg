nd" stroke-linejoin="round"/><path d="M201 237 Q214 244 227 239 M242 237 Q251 234 258 239" fill="none" stroke="#74524A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 262 Q237 275 249 258" fill="none" stroke="#995E55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M658 166 Q624 134 657 103 Q681 78 714 95 Q734 60 779 70 Q829 33 864 77 Q928 64 948 112 Q1000 106 1011 146 Q1020 180 958 183Z" fill="#738AA6" stroke="#47677F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="saetta" d="M706 159 L659 256 H695 L652 356 L758 223 H712 L739 159Z" fill="#FFE181" stroke="#DFA53A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M624 198 l-10 22 M792 262 l-10 22 M1150 196 l-10 22 M1160 262 l-10 22 M748 372 l-10 22 M1100 362 l-10 22" fill="none" stroke="#DCEFF9" stroke-width="5" stroke-linecap="round"/><rect x="780" y="202" width="351" height="50" rx="13" fill="#FFFFFF" stroke="#D4DFE8" stroke-width="3"/><text x="955" y="236" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173C57" text-anchor="middle">Lampo: lo vedi subito</text><g class="luce"><path d="M685 274 L376 274" fill="none" stroke="#254960" stroke-opacity=".38" stroke-width="15" stroke-linecap="round"/><path d="M685 274 L376 274" fill="none" stroke="#FFE171" stroke-width="9" stroke-linecap="round"/><path d="M380 274 L408 258 L408 290Z" fill="#FFE171" stroke="#254960" stroke-width="2"/></g><rect x="776" y="296" width="359" height="50" rx="13" fill="#FFFFFF" stroke="#D4DFE8" stroke-width="3"/><text x="955" y="330" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173C57" text-anchor="middle">Tuono: lo senti dopo</text><g class="suono"><path d="M1050 372 Q995 337 938 373 T826 373 T714 373 T602 373 T490 373 L379 373" fill="none" stroke="#16364D" stroke-opacity=".32" stroke-width="13" stroke-linecap="round"/><path d="M1050 372 Q995 337 938 373 T826 373 T