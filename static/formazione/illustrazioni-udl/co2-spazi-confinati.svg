<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Anidride carbonica vulcanica: attenzione agli spazi confinati</title><desc id="desc">Sezione di edificio con cantina sottostante. Il gas CO2 dal terreno può accumularsi negli spazi bassi e poco ventilati. Un simbolo di divieto accanto alla cantina indica di non scendere.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2f5ff"/><stop offset=".47" stop-color="#fff"/><stop offset="1" stop-color="#cce9f7"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123957">Anidride carbonica vulcanica: attenzione agli spazi confinati</text><rect x="43" y="107" width="721" height="441" rx="18" fill="#eef6f9" stroke="#b3cddd" stroke-width="3"/><rect x="789" y="107" width="368" height="441" rx="18" fill="#fff5e8" stroke="#e5c49b" stroke-width="3"/><text x="58" y="157" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#1a5a7e">SEZIONE DI UN EDIFICIO</text><path d="M85 338 L375 181 L681 338" stroke="#8b4d3d" stroke-width="19" stroke-linejoin="round" fill="none"/><rect x="123" y="338" width="510" height="85" fill="#f0e6d5" stroke="#657c88" stroke-width="7"/><rect x="123" y="426" width="510" height="100" fill="#cfd9da" stroke="#657c88" stroke-width="7"/><rect x="230" y="362" width="74" height="58" fill="#b8dce9" stroke="#769aaa" stroke-width="5"/><path d="M266 362 V420 M230 392 H304" stroke="#769aaa" stroke-width="3"/><path d="M123 466 Q211 433 282 466 T437 461 T633 462 V522 H123Z" fill="#5a9da9" opacity=".5"/><g fill="#216b81" opacity=".85"><circle cx="184" cy="490" r="10"/><circle cx="226" cy="474" r="12"/><circle cx="285" cy="501" r="9"/><circle cx="353" cy="481" r="11"/><circle cx="424" cy="499" r="10"/><circle cx="483" cy="473" r="13"/><circle cx="564" cy="495" r="11"/></g><path d="M222 567 V524 M345 568 V524 M471 568 V524" stroke="#ca7e47" stroke-width="9" stroke-dasharray="8 10"/><path d="M140 552 Q371 591 626 549" stroke="#b27a54" stroke-width="7" fill="none"/><path d="M636 476 H670" stroke="#b6382d" stroke-width="7" stroke-dasharray="12 7" fill="none"/><circle cx="704" cy="476" r="29" fill="#fff" stroke="#ba3c30" stroke-width="6"/><path d="M691 463 L717 489 M717 463 L691 489" stroke="#ba3c30" stroke-width="7"/><rect x="633" y="509" width="128" height="35" rx="9" fill="#FFFFFF" stroke="#C66D5E" stroke-width="3"/><text x="697" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#922B21">NON SCENDERE</text><text x="971" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#853e26">CO₂ INVISIBILE</text><text x="973" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#714936">E SENZA ODORE</text><g font-family="Arial,sans-serif" fill="#4b3c36" font-size="22"><text x="824" y="267">• Può accumularsi</text><text x="843" y="297">in luoghi bassi.</text><text x="824" y="353">• Non entrare in</text><text x="843" y="383">spazi sospetti.</text><text x="824" y="440">• Allontanati.</text><text x="824" y="475">• Chiama il 112.</text></g><text x="600" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365365">Schema didattico non in scala: il rischio varia secondo le condizioni del luogo e le concentrazioni misurate.</text></svg>