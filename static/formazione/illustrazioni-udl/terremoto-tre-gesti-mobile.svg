<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="tit desc"><title id="tit">Terremoto: tre gesti di protezione, versione verticale</title><desc id="desc">Tre scene in colonna mostrano, in ordine, una persona che si abbassa al suolo, si ripara sotto un tavolo proteggendo testa e collo e afferra una gamba del tavolo, finché la scossa non finisce.</desc><rect width="720" height="1180" rx="23" fill="#f3f9fc"/><rect width="720" height="10" fill="#136585"/><text x="30" y="55" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#143d59">Terremoto: tre gesti</text><g aria-hidden="true"><rect x="22" y="84" width="676" height="335" rx="20" fill="#ffffff" stroke="#aac5d4" stroke-width="3"/><rect x="23" y="85" width="673" height="74" rx="19" fill="#edf5fc"/><circle cx="61" cy="124" r="27" fill="#17678e"/><text x="53" y="135" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="30" fill="#ffffff">1</text><text x="115" y="135" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="29" fill="#143d59">ABBASSATI</text><g transform="translate(24 -123)"><path d="M24 480 H333" stroke="#a4b5bb" stroke-width="5"/><ellipse cx="176" cy="482" rx="152" ry="18" fill="#bdc8c9" opacity=".35"/><path d="M45 307 L303 307 L319 325 L55 325 Z" fill="#b67841" stroke="#745238" stroke-width="4"/><path d="M55 325 L315 325 L315 339 L55 339 Z" fill="#8b542d"/><rect x="66" y="335" width="22" height="146" rx="4" fill="#96633c" stroke="#674327" stroke-width="3"/><rect x="281" y="335" width="22" height="146" rx="4" fill="#96633c" stroke="#674327" stroke-width="3"/><path d="M68 337 L86 342 L86 480 L68 480" fill="#ba8658"/><path d="M283 338 L299 337 L299 475" stroke="#c69765" stroke-width="5" fill="none"/><path d="M113 453 Q83 428 85 400 Q93 369 124 369 L165 386 Q185 402 179 436 L160 461Z" fill="#237f9c" stroke="#174f68" stroke-width="4"/><path d="M120 454 Q146 475 168 475 L212 475" stroke="#263f59" stroke-width="23" fill="none" stroke-linecap="round"/><circle cx="148" cy="353" r="35" fill="#ecc09a" stroke="#9a664d" stroke-width="3"/><path d="M116 352 Q113 317 145 315 Q170 314 180 339 Q157 326 131 344Z" fill="#533d34"/><path d="M178 400 Q203 420 228 418" fill="none" stroke="#ecc09a" stroke-width="17" stroke-linecap="round"/><circle cx="233" cy="418" r="11" fill="#ecc09a"/></g><path d="M365 180 V378" stroke="#d1dfe5" stroke-width="3"/><text x="387" y="221" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#143d59">Mettiti subito</text><text x="387" y="255" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#143d59">in posizione bassa.</text><text x="387" y="326" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#4a6677">Subito, senza correre.</text></g><g aria-hidden="true"><rect x="22" y="439" width="676" height="335" rx="20" fill="#ffffff" stroke="#aac5d4" stroke-width="3"/><rect x="23" y="440" width="673" height="74" rx="19" fill="#e9f7f1"/><circle cx="61" cy="479" r="27" fill="#0d756b"/><text x="53" y="490" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="30" fill="#ffffff">2</text><text x="115" y="490" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="29" fill="#143d59">RIPARATI</text><g transform="translate(24 232)"><path d="M24 480 H333" stroke="#a4b5bb" stroke-width="5"/><ellipse cx="176" cy="482" rx="152" ry="18" fill="#bdc8c9" opacity=".35"/><path d="M45 307 L303 307 L319 325 L55 325 Z" fill="#b67841" stroke="#745238" stroke-width="4"/><path d="M55 325 L315 325 L315 339 L55 339 Z" fill="#8b542d"/><rect x="66" y="335" width="22" height="146" rx="4" fill="#96633c" stroke="#674327" stroke-width="3"/><rect x="281" y="335" width="22" height="146" rx="4" fill="#96633c" stroke="#674327" stroke-width="3"/><path d="M68 337 L86 342 L86 480 L68 480" fill="#ba8658"/><path d="M283 338 L299 337 L299 475" stroke="#c69765" stroke-width="5" fill="none"/><path d="M153 435 Q131 385 163 374 Q194 363 226 392 L244 426 L225 456 L173 464Z" fill="#247b9b" stroke="#144f6f" stroke-width="4"/><path d="M194 448 Q167 478 131 472" stroke="#334e69" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M228 449 Q250 470 265 470" stroke="#334e69" stroke-width="22" stroke-linecap="round" fill="none"/><circle cx="190" cy="383" r="31" fill="#edbf9c" stroke="#9f704e" stroke-width="3"/><path d="M160 378 Q161 345 192 349 Q218 350 222 373 Q201 362 182 374Z" fill="#563b31"/><path d="M154 390 Q173 365 208 361" stroke="#edbf9c" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M216 397 Q234 394 244 383" stroke="#edbf9c" stroke-width="12" fill="none" stroke-linecap="round"/></g><path d="M365 535 V733" stroke="#d1dfe5" stroke-width="3"/><text x="387" y="576" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#143d59">Proteggi testa e collo</text><text x="387" y="610" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#143d59">sotto un tavolo robusto.</text><text x="387" y="681" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#4a6677">Mantieni il riparo.</text></g><g aria-hidden="true"><rect x="22" y="794" width="676" height="335" rx="20" fill="#ffffff" stroke="#aac5d4" stroke-width="3"/><rect x="23" y="795" width="673" height="74" rx="19" fill="#fff5e7"/><circle cx="61" cy="834" r="27" fill="#ac6019"/><text x="53" y="845" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="30" fill="#ffffff">3</text><text x="115" y="845" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="29" fill="#143d59">TIENITI</text><g transform="translate(24 587)"><path d="M24 480 H333" stroke="#a4b5bb" stroke-width="5"/><ellipse cx="176" cy="482" rx="152" ry="18" fill="#bdc8c9" opacity=".35"/><path d="M45 307 L303 307 L319 325 L55 325 Z" fill="#b67841" stroke="#745238" stroke-width="4"/><path d="M55 325 L315 325 L315 339 L55 339 Z" fill="#8b542d"/><rect x="66" y="335" width="22" height="146" rx="4" fill="#96633c" stroke="#674327" stroke-width="3"/><rect x="281" y="335" width="22" height="146" rx="4" fill="#96633c" stroke="#674327" stroke-width="3"/><path d="M68 337 L86 342 L86 480 L68 480" fill="#ba8658"/><path d="M283 338 L299 337 L299 475" stroke="#c69765" stroke-width="5" fill="none"/><path d="M153 435 Q131 385 163 374 Q194 363 226 392 L244 426 L225 456 L173 464Z" fill="#247b9b" stroke="#144f6f" stroke-width="4"/><path d="M194 448 Q167 478 131 472" stroke="#334e69" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M228 449 Q250 470 265 470" stroke="#334e69" stroke-width="22" stroke-linecap="round" fill="none"/><circle cx="190" cy="383" r="31" fill="#edbf9c" stroke="#9f704e" stroke-width="3"/><path d="M160 378 Q161 345 192 349 Q218 350 222 373 Q201 362 182 374Z" fill="#563b31"/><path d="M154 390 Q173 365 208 361" stroke="#edbf9c" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M234 420 Q255 428 281 426" stroke="#edbf9c" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M281 418 Q292 413 300 421 L302 449" fill="none" stroke="#edbf9c" stroke-width="10" stroke-linecap="round"/></g><path d="M365 890 V1088" stroke="#d1dfe5" stroke-width="3"/><text x="387" y="931" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#143d59">Afferra una gamba</text><text x="387" y="965" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#143d59">del tavolo.</text><text x="387" y="1036" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#4a6677">Finché la scossa non finisce.</text></g></svg>