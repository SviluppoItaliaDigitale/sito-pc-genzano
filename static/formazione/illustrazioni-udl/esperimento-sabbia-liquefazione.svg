<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Sabbia asciutta e satura: confronto delle vibrazioni</title><desc id="desc">Due vaschette trasparenti con la stessa sabbia e biglie uguali. In una sabbia asciutta la biglia resta in superficie, nella sabbia satura può affondare durante le vibrazioni. Il risultato del modello non è garantito.</desc><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#e8f2f7"/></linearGradient><linearGradient id="gel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a8dbe6"/><stop offset="1" stop-color="#4ea2b6"/></linearGradient><linearGradient id="sand" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e6c497"/><stop offset="1" stop-color="#bb9462"/></linearGradient></defs><rect width="1200" height="620" rx="22" fill="url(#bg)"/><rect y="0" width="1200" height="13" fill="#176d8d"/><text x="40" y="67" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#153d59" text-anchor="start">Sabbia asciutta e satura: confronto delle vibrazioni</text>
