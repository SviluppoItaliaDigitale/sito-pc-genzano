<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Dopo l'emergenza: il rientro deve essere sicuro</title><desc id="desc">Sequenza in tre vignette: non entrare in edificio visibilmente danneggiato, attendere la verifica delle autorità o personale qualificato, rientrare e controllare utenze solo quando autorizzato.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#e7f2f7"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#91d3e7"/><stop offset="1" stop-color="#1f749d"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3eff6"/><stop offset="1" stop-color="#72b7d0"/></linearGradient></defs><rect width="1200" height="620" rx="16" fill="url(#wash)"/><rect width="1200" height="12" fill="#166181"/><text x="42" y="62" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#173f58" text-anchor="start">Dopo l'emergenza: il rientro deve essere sicuro</text>
