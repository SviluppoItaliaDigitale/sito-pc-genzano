<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">La scatola che galleggia</title><desc id="desc">Una vaschetta con una scatoletta chiusa e due monete dentro, e un righello accanto. A sinistra c'è poca acqua e la scatoletta resta appoggiata sul fondo. A destra c'è più acqua che si muove: la scatoletta galleggia e la corrente la sposta.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="sand" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e6c497"/><stop offset="1" stop-color="#bb9462"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e2f6"/><stop offset="1" stop-color="#4a9dc9"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123957">La scatola che galleggia: l'acqua che solleva e trascina</text><rect x="42" y="99" width="535" height="458" rx="22" fill="#f3faff" stroke="#b7d5e8" stroke-width="2"/><rect x="622" y="99" width="535" height="458" rx="22" fill="#eaf6fa" stroke="#a9d3e1" stroke-width="2"/><text x="309" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#145b82">POCA ACQUA</text><text x="888" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#185e81">PIÙ ACQUA CHE SI MUOVE</text><rect x="60" y="230" width="380" height="250" rx="14" fill="#ffffff" stroke="#60869a" stroke-width="7"/><g><rect x="64" y="440" width="372" height="36" fill="url(#water)" opacity=".85"/><path d="M64 440 H436" stroke="#e6fbff" stroke-width="5"/></g><g><rect x="130" y="410" width="120" height="66" rx="12" fill="#f4f8fb" fill-opacity=".85" stroke="#2f5d77" stroke-width="6"/><path d="M130 426 H250" stroke="#2f5d77" stroke-width="4"/><circle cx="172" cy="460" r="10" fill="#e8b84a" stroke="#a37a1c" stroke-width="3"/><circle cx="204" cy="460" r="10" fill="#e8b84a" stroke="#a37a1c" stroke-width="3"/></g><rect x="470" y="250" width="34" height="226" rx="4" fill="#fff8eb" stroke="#bd9d72" stroke-width="4"/><path d="M470 270 H482" stroke="#886e50" stroke-width="3"/><path d="M470 290 H488" stroke="#886e50" stroke-width="3"/><path d="M470 310 H482" stroke="#886e50" stroke-width="3"/><path d="M470 330 H488" stroke="#886e50" stroke-width="3"/><path d="M470 350 H482" stroke="#886e50" stroke-width="3"/><path d="M470 370 H488" stroke="#886e50" stroke-width="3"/><path d="M470 390 H482" stroke="#886e50" stroke-width="3"/><path d="M470 410 H488" stroke="#886e50" stroke-width="3"/><path d="M470 430 H482" stroke="#886e50" stroke-width="3"/><path d="M470 450 H488" stroke="#886e50" stroke-width="3"/><rect x="640" y="230" width="380" height="250" rx="14" fill="#ffffff" stroke="#60869a" stroke-width="7"/><g class="acquaR"><rect x="644" y="330" width="372" height="146" fill="url(#water)" opacity=".85"/><path d="M644 330 H1016" stroke="#e6fbff" stroke-width="5"/></g><g class="scatolaR"><rect x="830" y="300" width="120" height="66" rx="12" fill="#f4f8fb" fill-opacity=".85" stroke="#2f5d77" stroke-width="6"/><path d="M830 316 H950" stroke="#2f5d77" stroke-width="4"/><circle cx="872" cy="350" r="10" fill="#e8b84a" stroke="#a37a1c" stroke-width="3"/><circle cx="904" cy="350" r="10" fill="#e8b84a" stroke="#a37a1c" stroke-width="3"/></g><rect x="1050" y="250" width="34" height="226" rx="4" fill="#fff8eb" stroke="#bd9d72" stroke-width="4"/><path d="M1050 270 H1062" stroke="#886e50" stroke-width="3"/><path d="M1050 290 H1068" stroke="#886e50" stroke-width="3"/><path d="M1050 310 H1062" stroke="#886e50" stroke-width="3"/><path d="M1050 330 H1068" stroke="#886e50" stroke-width="3"/><path d="M1050 350 H1062" stroke="#886e50" stroke-width="3"/><path d="M1050 370 H1068" stroke="#886e50" stroke-width="3"/><path d="M1050 390 H1062" stroke="#886e50" stroke-width="3"/><path d="M1050 410 H1068" stroke="#886e50" stroke-width="3"/><path d="M1050 430 H1062" stroke="#886e50" stroke-width="3"/><path d="M1050 450 H1068" stroke="#886e50" stroke-width="3"/><g class="corrente" fill="none" stroke="#1f6f9e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M670 400 H780 M766 390 L780 400 L766 410"/><path d="M670 446 H780 M766 436 L780 446 L766 456"/></g><text x="309" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#145b82">Resta appoggiata sul fondo</text><text x="888" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1a6687">Galleggia e la corrente la sposta</text><text x="600" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#415b6a">Mai in auto su una strada allagata o in un sottopasso pieno d'acqua.</text></svg>
