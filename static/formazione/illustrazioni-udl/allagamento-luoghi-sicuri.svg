<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Allagamento: cerca un luogo alto e non attraversare l'acqua</title><desc id="desc">Sinistra: casa con cantina allagata in basso e una persona salita al piano superiore, sopra il livello dell'acqua. Destra: strada allagata e auto e persona sbarrate: non attraversare a piedi o in auto.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2f5ff"/><stop offset=".47" stop-color="#fff"/><stop offset="1" stop-color="#cce9f7"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123957">Allagamento: cerca un luogo alto e non attraversare l'acqua</text><rect x="37" y="103" width="543" height="453" rx="19" fill="#eff8fc" stroke="#b2cbdc" stroke-width="3"/><rect x="619" y="103" width="543" height="453" rx="19" fill="#fff5ee" stroke="#e7bdac" stroke-width="3"/><text x="307" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#12634e">IN CASA: SPOSTATI IN ALTO</text><text x="888" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#a4362a">FUORI: NON ATTRAVERSARE</text><path d="M82 302 L306 192 L518 302 L486 302 V503 H122 V302Z" fill="#f7e9d9" stroke="#6f746f" stroke-width="7"/><path d="M77 304 L307 183 L524 304" fill="none" stroke="#8d4a34" stroke-width="19" stroke-linejoin="round"/><path d="M122 372 H486" stroke="#897967" stroke-width="10"/><path d="M122 503 H486" stroke="#897967" stroke-width="10"/><path d="M130 423 Q160 405 185 423 T243 423 T306 423 T366 423 T430 423 T483 423 V495 H130Z" fill="#65b9df" opac