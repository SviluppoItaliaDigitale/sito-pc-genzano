<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Maremoto: fondale e altezza dell’onda</title><desc id="desc">Sezione dal mare profondo alla riva: al largo un’imbarcazione sopra un’onda bassa; sott’acqua frecce indicano il movimento della colonna d’acqua. Il fondale risale verso costa, l’onda rallenta e cresce. A terra una persona percorre il sentiero verso un’altura.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C4F4FA"/><stop offset="1" stop-color="#4A9DCC"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EBF9FD"/><stop offset="1" stop-color="#D8EFFA"/></linearGradient><linearGradient id="storm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#506C91"/><stop offset="1" stop-color="#A7C7DB"/></linearGradient></defs><rect x="0" y="0" width="1200" height="620" rx="24" fill="#F6FAFD" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#167A99" stroke="none" stroke-width="2"/><rect x="18" y="20" width="1164" height="575" rx="18" fill="url(#sky)" stroke="#B3D8E5" stroke-width="3"/><circle cx="1081" cy="80" r="36" fill="#FFF0B3" stroke="#E0B763" stroke-width="3"/><path d="M26 244 Q168 232 323 248 Q482 232 634 239 Q793 244 898 227 Q965 220 999 238 L998 559 H26Z" fill="url(#sea)" stroke="#4B95BB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 538 L302 538 Q521 520 690 479 Q831 434 902 354 Q947 298 998 264 L1008 587 H26Z" fill="#D2C2A5" stroke="#A69378" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1022 275 Q1081 271 1166 237 L1166 587 H1008Z" fill="#C8D9AF" stroke="#8FAB8D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 248 Q168 233 323 248 Q482 229 634 239 Q793 244 892 228" fill="none" stroke="#E6FBFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M891