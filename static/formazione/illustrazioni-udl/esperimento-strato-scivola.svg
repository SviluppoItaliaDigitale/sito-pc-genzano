<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Lo strato che scivola</title><desc id="desc">Due vaschette inclinate uguali: sul fondo uno strato di pongo, che non lascia passare l'acqua, e sopra sabbia. A sinistra la sabbia asciutta resta ferma. A destra, dopo tanta acqua spruzzata dall'alto, l'acqua si ferma sopra il pongo e lo strato di sabbia scivola verso il basso.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="sand" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e6c497"/><stop offset="1" stop-color="#bb9462"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e2f6"/><stop offset="1" stop-color="#4a9dc9"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#123957">Lo strato che scivola: acqua sopra uno strato che non la fa passare</text><rect x="42" y="99" width="535" height="458" rx="22" fill="#fff8ea" stroke="#dccbaa" stroke-width="2"/><rect x="622" y="99" width="535" height="458" rx="22" fill="#eaf6fa" stroke="#a9d3e1" stroke-width="2"/><text x="309" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#86603f">TERRENO ASCIUTTO</text><text x="888" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#185e81">DOPO TANTA ACQUA</text><g fill="#efe4cf" stroke="#9a8466" stroke-width="4"><rect x="73" y="318" width="80" height="40" rx="4"/><rect x="67" y="358" width="92" height="40" rx="4"/><rect x="73" y="398" width="80" height="40" rx="4"/></g><path d="M55 441 H535" stroke="#8f9a9e" stroke-width="7" stroke-linecap="round"/><g fill="#efe4cf" stroke="#9a8466" stroke-width="4"><rect x="653" y="318" width="80" height="40" rx="4"/><rect x="647" y="358" width="92" height="40" rx="4"/><rect x="653" y="398" width="80" height="40" rx="4"/></g><path d="M635 441 H1115" stroke="#8f9a9e" stroke-width="7" stroke-linecap="round"/><g transform="translate(95 250) rotate(18)"><rect x="0" y="52" width="400" height="18" fill="#9c7a5c"/><g class="blocco"><rect x="0" y="16" width="400" height="36" fill="url(#sand)"/><circle cx="129" cy="40" r="3" fill="#a67d4a"/><circle cx="197" cy="41" r="4" fill="#a67d4a"/><circle cx="328" cy="40" r="2" fill="#a67d4a"/><circle cx="318" cy="22" r="4" fill="#a67d4a"/><circle cx="140" cy="39" r="3" fill="#a67d4a"/><circle cx="106" cy="44" r="4" fill="#a67d4a"/><circle cx="284" cy="48" r="4" fill="#a67d4a"/><circle cx="211" cy="42" r="3" fill="#a67d4a"/><circle cx="126" cy="42" r="3" fill="#a67d4a"/><circle cx="275" cy="34" r="2" fill="#a67d4a"/><circle cx="351" cy="46" r="2" fill="#a67d4a"/><circle cx="89" cy="46" r="2" fill="#a67d4a"/><circle cx="162" cy="46" r="2" fill="#a67d4a"/><circle cx="145" cy="37" r="4" fill="#a67d4a"/><circle cx="373" cy="47" r="4" fill="#a67d4a"/><circle cx="210" cy="45" r="4" fill="#a67d4a"/><circle cx="76" cy="33" r="2" fill="#a67d4a"/><circle cx="26" cy="26" r="4" fill="#a67d4a"/><circle cx="119" cy="30" r="4" fill="#a67d4a"/><circle cx="328" cy="31" r="4" fill="#a67d4a"/><circle cx="267" cy="48" r="4" fill="#a67d4a"/><circle cx="301" cy="33" r="4" fill="#a67d4a"/><circle cx="307" cy="29" r="3" fill="#a67d4a"/><circle cx="357" cy="22" r="3" fill="#a67d4a"/><circle cx="318" cy="43" r="3" fill="#a67d4a"/><circle cx="365" cy="32" r="2" fill="#a67d4a"/><path d="M0 16 H400" stroke="#d9b98c" stroke-width="5"/></g><path d="M0 0 V70 H400 V52" fill="none" stroke="#60869a" stroke-width="7" stroke-linejoin="round"/></g><g transform="translate(675 250) rotate(18)"><rect x="0" y="52" width="400" height="18" fill="#9c7a5c"/><rect class="velo" x="0" y="46" width="400" height="7" fill=