2" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#6a4f37">pongo</text><path d="M360 238 L360 388" stroke="#8a7056" stroke-width="3"/><text x="1000" y="236" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a6687">acqua sul pongo</text><path d="M1040 242 L1014 402" stroke="#5b8ea6" stroke-width="3"/><text x="309" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#86603f">Resta ferma</text><text x="888" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1a6687">Lo strato sopra scivola</text><text x="600" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#415b6a">Modello da tavolo: non dice dove o quando avverrà una frana.</text></svg>
