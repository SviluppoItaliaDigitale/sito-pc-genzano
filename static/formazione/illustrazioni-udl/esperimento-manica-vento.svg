<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Manica a vento: osserva direzione e intensità</title><desc id="desc">Due maniche a vento su supporto. Con vento debole il tessuto ricade e si gonfia poco. Con vento più forte si distende e punta verso la direzione in cui l'aria scorre. Non è un anemometro calibrato.</desc><defs><linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e7f2f8"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e2f6"/><stop offset="1" stop-color="#388bb9"/></linearGradient><linearGradient id="plastic" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d0e4ed" stop-opacity=".7"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#b0d2e1" stop-opacity=".8"/></linearGradient><linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fae5bc"/><stop offset="1" stop-color="#d58a57"/></linearGradient></defs><rect width="1200" height="620" rx="23" fill="url(#back)"/><rect width="1200" height="12" fill="#136585"/><text x="40" y="66" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123c59" text-anchor="start">Manica a vento: osserva direzione e intensità</text>
<rect x="34" y="105" width="535" height="451" rx="19" fill="#f0f7f7" stroke="#b3d2d4" stroke-width="3"/><text x="301" y="159" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24516c" text-anchor="middle">VENTO DEBOLE</text><rect x="623" y="105" width="535" height="451" rx="19" fill="#eef5fb" stroke="#b1c9db" stroke-width="3"/><text x="890" y="159" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24516c" text-anchor="middle">VENTO PIÙ FORTE</text>
