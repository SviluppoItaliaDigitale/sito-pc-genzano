<text x="600" y="584" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#3a5b6d" text-anchor="middle">La punta segue il flusso dell'aria. Osserva da un posto sicuro, mai durante un temporale.</text></svg>