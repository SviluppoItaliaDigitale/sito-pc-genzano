<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="tit desc"><title id="tit">Esperimento: fluidità, viscosità e bolle di gas</title><desc id="desc">Due bicchieri: a sinistra liquido poco viscoso con bolle che salgono facilmente; a destra miscela densa con bolle trattenute. È un modello didattico, non un'eruzione.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2f5ff"/><stop offset=".47" stop-color="#fff"/><stop offset="1" stop-color="#cce9f7"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#paper)"/><rect width="1200" height="14" fill="#126084"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123957">Esperimento: fluidità, viscosità e bolle di gas</text><g font-family="Arial,sans-serif"><rect x="42" y="99" width="535" height="458" rx="22" fill="#f3faff" stroke="#b7d5e8" stroke-width="2"/><rect x="622" y="99" width="535" height="458" rx="22" fill="#fff7ed" stroke="#e7c5a1" stroke-width="2"/><text x="309" y="149" text-anchor="middle" font-size="26" font-weight="700" fill="#145b82">LIQUIDO PIÙ FLUIDO</text><text x="888" y="149" text-anchor="middle" font-size="26" font-weight="700" fill="#834d20">MISCELA PIÙ DENSA</text><path d="M176 222 L187 455 Q199 479 227 479 H390 Q420 479 430 452 L443 222Z" fill="url(#glass)" stroke="#477b91" stroke-width="7"/><path d="M200 303 H421 L412 447 Q407 457 389 457 H229 Q212 457 209 445Z" fill="#75c2e8" opacity=".88"/><path d="M184 222 H441" stroke="#477b91" stroke-width="11" stroke-linecap="round"/><path d="M743 222 L752 455 Q765 479 795 479 H958 Q991 479 1002 454 L1011 222Z" fill="url(#glass)" stroke="#8e683b" stroke-width="7"/><path d="M764 289 H992 L982 450 Q975 460 950 460 H800 Q776 460 774 450Z" fill="#cd8952" opacity=".92"/><path d="M744 222 H1010" stroke="#8e683b" stroke-width="11" stroke-linecap="round"/><g fill="#f8ffff" stroke="#367eac" stroke-width="3"><circle cx="248" cy="421" r="10"/><circle cx="329" cy="378" r="14"/><circle cx="269" cy="338" r="9"/><circle cx="352" cy="310" r="8"/><circle cx="288" cy="278" r="7"/><circle cx="360" cy="246" r="5"/></g><g fill="#ffe9cb" stroke="#86481e" stroke-width="4"><circle cx="819" cy="405" r="18"/><circle cx="901" cy="378" r="25"/><circle cx="866" cy="315" r="14"/><circle cx="941" cy="427" r="14"/></g><path d="M487 402 V263 l-16 18 M487 263 l16 18" stroke="#14689b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1053 402 V325 l-16 18 M1053 325 l16 18" stroke="#a36531" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="309" y="519" font-size="20" font-weight="700" text-anchor="middle" fill="#145b82">Le bolle risalgono più facilmente</text><text x="888" y="519" font-size="20" font-weight="700" text-anchor="middle" fill="#834d20">Le bolle possono restare intrappolate</text><text x="600" y="591" font-size="17" text-anchor="middle" fill="#415b6a">Modello semplificato: la viscosità influenza il movimento dei gas; non riproduce un'eruzione reale.</text></g></svg>