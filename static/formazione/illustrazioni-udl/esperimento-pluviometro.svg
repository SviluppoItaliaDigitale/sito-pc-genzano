<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Come funziona un pluviometro didattico</title><desc id="desc">Sezione di un raccoglitore di pioggia formato da imbuto e contenitore trasparente, con acqua raccolta, scala graduata a lato e indicazione del punto iniziale. La scala in millimetri va calibrata sull'area di raccolta.</desc><defs><linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e7f2f8"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e2f6"/><stop offset="1" stop-color="#388bb9"/></linearGradient><linearGradient id="plastic" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d0e4ed" stop-opacity=".7"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#b0d2e1" stop-opacity=".8"/></linearGradient><linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fae5bc"/><stop offset="1" stop-color="#d58a57"/></linearGradient></defs><rect width="1200" height="620" rx="23" fill="url(#back)"/><rect width="1200" height="12" fill="#136585"/><text x="40" y="66" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123c59" text-anchor="start">Come funziona un pluviometro didattico</text>
