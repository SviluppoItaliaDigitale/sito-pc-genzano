<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" role="img" aria-labelledby="title desc"><title id="title">Vento forte: prima e durante</title><desc id="desc">Confronto in due grandi scene: prima dell'allerta oggetti del balcone messi al riparo; durante le raffiche un vaso non fissato può precipitare. Entrambe contengono simboli testuali oltre ai colori.</desc><defs><linearGradient id="bg" x1="0" x2="0.2" y1="0" y2="1"><stop stop-color="#f5fbfe"/><stop offset="1" stop-color="#e9f2f6"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8d9f0"/><stop offset="1" stop-color="#ecf8fa"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3495b5"/><stop offset="1" stop-color="#236889"/></linearGradient></defs><rect width="720" height="1180" fill="url(#bg)"/><rect width="720" height="16" fill="#15658b"/><text x="32" y="68" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="#123f5c" text-anchor="start">Vento forte: prima e durante</text>
<rect x="23" y="106" width="674" height="476" rx="22" fill="#ffffff" stroke="#b7cdd8" stroke-width="3"/><path d="M44 106 H675 Q697 106 697 128 V182 H23 V128 Q23 106 44 106Z" fill="#1d7f6b"/><circle cx="65" cy="145" r="27" fill="#fff"/><text x="65" y="155" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#1d7f6b" text-anchor="middle">1</text><text x="113" y="158" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="start">PRIMA DELL’ALLERTA</text>
