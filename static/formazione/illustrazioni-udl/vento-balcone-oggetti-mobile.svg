<text x="357" y="1039" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#a24e3a" text-anchor="middle">Non uscire per recuperare oggetti.</text>
<text x="358" y="1138" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#436578" text-anchor="middle">Allontanati da alberi e strutture instabili.</text>
