<text x="355" y="533" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#216e61" text-anchor="middle">Fissa o ritira vasi, sedie e oggetti.</text>
<rect x="23" y="602" width="674" height="477" rx="22" fill="#ffffff" stroke="#b7cdd8" stroke-width="3"/><path d="M44 602 H675 Q697 602 697 624 V678 H23 V624 Q23 602 44 602Z" fill="#b34f3d"/><circle cx="65" cy="641" r="27" fill="#fff"/><text x="65" y="651" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#b34f3d" text-anchor="middle">2</text><text x="113" y="654" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="start">DURANTE IL VENTO</text>
