# Coda delle puntate del podcast automatico (dal 15/11/2026).
# Una puntata per giro, due giri a settimana (martedì e venerdì). Si prende
# la prima voce con stato «da-fare». Le fonti sono SOLO pagine verificate del
# sito: la puntata non può dire niente che queste pagine non dicano.
# «escludi»: pezzi di percorso da non usare come fonte (fuori tema).
# «ufficiali»: pagine di fonti istituzionali (indirizzi verificati, mai
# indovinati), aggiunte quando il sito ha poco materiale su quel tema.
# Stati: da-fare | scartata (con motivo) | programmata (con file e data di uscita).
# Ordine: si rifanno i temi sospesi il 05/11/2026, poi la stagione.

puntate:
