    pochissimi minuti» (le pagine dicono «pochi»), chiusura «le cantine e i piani
    interrati sono i primi luoghi ad allagarsi» (non nelle pagine, che li chiamano
    «i punti più pericolosi»), enfasi «da seguire alla lettera». Il resto combaciava
