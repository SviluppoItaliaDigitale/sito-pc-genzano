# Coda delle puntate del podcast automatico (dal 15/11/2026).
# Una puntata per giro, due giri a settimana (martedì e venerdì). Si prende
# la prima voce con stato «da-fare». Le fonti sono SOLO pagine verificate del
# sito: la puntata non può dire niente che queste pagine non dicano.
# «escludi»: pezzi di percorso da non usare come fonte (fuori tema).
# «ufficiali»: pagine di fonti istituzionali (indirizzi verificati, mai
# indovinati), aggiunte quando il sito ha poco materiale su quel tema.
# Stati: da-fare | scartata (con motivo) | programmata (con file e data di uscita)
# | rimandata (fuori stagione: non si prende finché non torna da-fare).
# Ordine: si rifanno i temi sospesi il 05/11/2026, poi la stagione.

puntate:
- id: neve-gelo
  titolo: 'Neve e gelo: come prepararsi'
  fonti:
  - content/dossier/neve-e-gelo.md
  - content/conoscere/catalogo-dei-rischi/rischio-neve-gelo.md
  parole: []
  stato: programmata
  istruzioni_extra: 'ATTENZIONE, regole aggiuntive. Queste istruzioni non si leggono
    e non si ripetono a voce: non dire a chi è dedicata la puntata e non dire come
    si pronuncia un numero. Per il 26 febbraio 2018 di'' solo che la neve imbiancò
    i Colli Albani e che in alcune zone gli accumuli superarono i 20 centimetri: non
    dire che caddero oltre 20 centimetri su tutti i Colli Albani. Elenca gli effetti
    di neve e ghiaccio uno dopo l''altro, senza dire che uno porta all''altro. Dopo
    un dato o un numero non aggiungere commenti e non usare aggettivi che la pagina
    non usa. Sul Gruppo comunale di'' solo che in emergenza si chiama il 112, senza
    la parola mai e senza la parola sempre. Non dire la parola fonti, tranne che per
    la fonte di calore alternativa da tenere in casa. Riporta numeri e tempi come
    sono scritti nelle pagine.'
  tentativi: 2
  nota: '25/11/2026, primo tentativo (2 fonti, Breve, audio 2:59) non superato: «Mai
    chiamare direttamente» (assoluto aggiunto); «il Burian ha portato oltre 20 centimetri
    di neve sui Colli Albani» (la pagina dice che in alcune zone gli accumuli superarono
    i 20 centimetri); commenti aggiunti («notevole quantità», «molto insidioso», «numeri
    che fanno riflettere»); «questo porta di conseguenza all''isolamento di case e
    frazioni» (nesso che la pagina non fa); istruzioni lette a voce («un tema dedicato
    ai cittadini di Genzano...», «pronunciato esattamente uno, uno, due»). Comportamenti
    e avvisi combaciavano con le pagine. Al prossimo errore la puntata va in scartata.
    Secondo tentativo (stesse 2 fonti, Breve, istruzioni rafforzate; audio 2:13) superato
    dopo un taglio: tolto dall''audio il passaggio sulla tempesta di ghiaccio del
    Quebec del 1998 (da 65,60 a 86,15 s dell''originale, nelle pause), dove le voci
    dicevano «3,5 milioni di persone al buio» senza il «circa» della pagina; ricontrollato
    con una nuova trascrizione, ogni frase confrontata con le due pagine. Durata finale
    1:53.'
  file: content/podcast/2026-12-22-neve-gelo.md
  data: '2026-12-22'
