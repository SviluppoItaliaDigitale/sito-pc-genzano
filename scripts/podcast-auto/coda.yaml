  stato: scartata
  motivo: '15/11/2026, due tentativi (1 e 37 fonti, formato Approfondimento, lunghezza
    predefinita): spiegazioni tecniche aggiunte, scosse dei Colli Albani rese più
    gravi; Norcia 2016 raccontata con un salvataggio del centro storico che le fonti
