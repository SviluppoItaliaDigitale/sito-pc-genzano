    e piani terra sono i punti più pericolosi» (nesso di causa che le pagine non fanno),
    commenti aggiunti («da non sottovalutare affatto», «la situazione possa mutare
    drasticamente», «dinamica naturale complessa»). Comportamenti e numeri combaciavano
    con le pagine.'
