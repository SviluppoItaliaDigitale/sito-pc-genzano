# Coda delle puntate del podcast automatico (dal 15/11/2026).
# Una puntata per giro, due giri a settimana (martedì e venerdì). Si prende
# la prima voce con stato «da-fare». Le fonti sono SOLO pagine verificate del
# sito: la puntata non può dire niente che queste pagine non dicano.
# «escludi»: pezzi di percorso da non usare come fonte (fuori tema).
# «ufficiali»: pagine di fonti istituzionali (indirizzi verificati, mai
# indovinati), aggiunte quando il sito ha poco materiale su quel tema.
# Stati: da-fare | scartata (con motivo) | programmata (con file e data di uscita).
# Ordine: si rifanno i temi sospesi il 05/11/2026, poi la stagione.

puntate:
  - id: rischio-sismico
    titolo: "Il terremoto: cosa fare prima, durante e dopo"
    fonti:
      - content/rischi-prevenzione/rischio-sismico.md
    parole: ["terremot", "sism", "scossa", "INGV", "Io non rischio"]
    ufficiali:
      - https://iononrischio.protezionecivile.gov.it/it/preparati/terremoto/cosa-sapere/
      - https://iononrischio.protezionecivile.gov.it/it/preparati/terremoto/cosa-fare/
    stato: scartata
    motivo: "15/11/2026, due tentativi (1 e 37 fonti, formato Approfondimento, lunghezza predefinita): spiegazioni tecniche aggiunte, scosse dei Colli Albani rese più gravi; Norcia 2016 raccontata con un salvataggio del centro storico che le fonti non dicono; numero 803 555 non nelle fonti. Da rifare con lunghezza «Più breve» e le istruzioni nuove."

