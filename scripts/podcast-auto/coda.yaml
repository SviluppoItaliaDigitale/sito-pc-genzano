  stato: programmata
  tentativi: 1
  nota: '18/11/2026, primo tentativo (17 fonti, Breve, audio 3:07) non superato: «fondamentale»
    due volte, «serve per non creare confusione» (motivo non nelle fonti), «non si
    chiama direttamente. Mai» (assoluto aggiunto), esempio del telefono partito dalla
    tasca o dalla borsa (non nelle fonti). Il resto combaciava con le fonti. Al prossimo
    errore la puntata va in scartata.'
  istruzioni_extra: 'ATTENZIONE, regole aggiuntive: non usare "fondamentale", "molto
    importante", "assolutamente". Non dire a che cosa serve una regola (niente "serve
    per non creare confusione"). Sul Gruppo comunale di'' solo: "in emergenza non
    si chiama il Gruppo comunale: si chiama il 112", senza "mai". Per la chiamata
    partita per errore di'' solo quello che dicono le fonti (non riagganciare, spiegalo
    all''operatore), senza esempi su come succede. Non aggiungere esempi o situazioni
    che non sono nelle fonti.'
  file: content/podcast/2026-11-20-numero-112.md
  data: '2026-11-20'
