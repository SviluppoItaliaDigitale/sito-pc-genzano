<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Serie «windows-mac»: un computer con caratteri di sistema più larghi di Arial, come
     Windows e Mac. Quelli veri non si installano su Linux: qui Inter (circa il 7% più
     largo di Arial) per i caratteri senza grazie e Gelasio al posto di Georgia, con le
     sue stesse misure. Vale per le schede e per le storie. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">gelasio</dir>
  <!-- Chromium accetta un carattere al posto di quello chiesto solo se ha lo stesso nome
       o è nella sua tabella di sostituti con le stesse misure, dove Gelasio non c'è:
       qui, solo per la prova, Gelasio si presenta con il nome di Georgia. La regola
       vale al momento della scansione e finisce nella cache di fontconfig della
       cartella gelasio: se la si cambia, la cache va rifatta (vedi LEGGIMI.md). -->
  <match target="scan">
    <test name="family"><string>Gelasio</string></test>
    <edit name="family" mode="assign" binding="same"><string>Georgia</string></edit>
  </match>
  <selectfont>
    <rejectfont>
      <!-- I caratteri Microsoft, se la macchina li ha: la prova usa i suoi. -->
      <glob>/usr/share/fonts/truetype/msttcorefonts/*</glob>
      <!-- Caratteri che le pagine chiedono per nome: esclusi, perché la prova non
           dipenda da ciò che la macchina ha installato. -->
      <pattern><patelt name="family"><string>Arial</string></patelt></pattern>
      <pattern><patelt name="family"><string>Helvetica</string></patelt></pattern>
      <pattern><patelt name="family"><string>Helvetica Neue</string></patelt></pattern>
      <pattern><patelt name="family"><string>Times New Roman</string></patelt></pattern>
      <pattern><patelt name="family"><string>Times</string></patelt></pattern>
      <pattern><patelt name="family"><string>Courier New</string></patelt></pattern>
      <pattern><patelt name="family"><string>Verdana</string></patelt></pattern>
      <pattern><patelt name="family"><string>Trebuchet MS</string></patelt></pattern>
      <pattern><patelt name="family"><string>Comic Sans MS</string></patelt></pattern>
      <pattern><patelt name="family"><string>Arial Rounded MT Bold</string></patelt></pattern>
      <pattern><patelt name="family"><string>Segoe UI</string></patelt></pattern>
      <pattern><patelt name="family"><string>Segoe Script</string></patelt></pattern>
      <pattern><patelt name="family"><string>Roboto</string></patelt></pattern>
      <pattern><patelt name="family"><string>Oxygen</string></patelt></pattern>
      <pattern><patelt name="family"><string>Cantarell</string></patelt></pattern>
      <pattern><patelt name="family"><string>Century Gothic</string></patelt></pattern>
      <pattern><patelt name="family"><string>URW Gothic</string></patelt></pattern>
      <pattern><patelt name="family"><string>URW Gothic L</string></patelt></pattern>
      <pattern><patelt name="family"><string>Avant Garde</string></patelt></pattern>
      <pattern><patelt name="family"><string>Avant Garde Gothic</string></patelt></pattern>
      <pattern><patelt name="family"><string>ITC Avant Garde Gothic</string></patelt></pattern>
      <pattern><patelt name="family"><string>PC Corsivo</string></patelt></pattern>
      <!-- Le altre serie di prova. -->
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Sans Narrow</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Heros</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Heros Cn</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Termes</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Cursor</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Adventor</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Pagella</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Bonum</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Schola</string></patelt></pattern>
      <pattern><patelt name="family"><string>TeX Gyre Chorus</string></patelt></pattern>
      <pattern><patelt name="family"><string>Arimo</string></patelt></pattern>
      <pattern><patelt name="family"><string>Tinos</string></patelt></pattern>
      <pattern><patelt name="family"><string>Cousine</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
