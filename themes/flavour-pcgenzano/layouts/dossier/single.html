{{ define "main" }}
<link rel="stylesheet" href="{{ "css/dossier.css" | relURL }}?v={{ readFile "static/css/dossier.css" | hash.FNV32a }}">
<article class="dossier">
  <div class="dossier-progress" aria-hidden="true"><span></span></div>
  {{ with .Params.sezioni }}
  <nav class="dossier-dots" aria-label="Sezioni del dossier">
    {{ range . }}<a href="#{{ .id }}" data-label="{{ .label }}" aria-label="Vai alla sezione: {{ .label }}"></a>{{ end }}
  </nav>
  {{ end }}
  {{ .Content }}

  {{- $u := .Permalink -}}{{- $t := .Title -}}
  <section class="dossier-share" aria-label="Condividi questo dossier">
    <p class="dossier-share__t">Ti è piaciuto? <strong>Condividilo.</strong></p>
    <div class="dossier-share__row">
      <a href="https://wa.me/?text={{ printf "%s %s" $t $u | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="Condividi su WhatsApp"><i class="bi bi-whatsapp" aria-hidden="true"></i></a>
      <a href="https://t.me/share/url?url={{ $u | urlquery }}&text={{ $t | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="Condividi su Telegram"><i class="bi bi-telegram" aria-hidden="true"></i></a>
      <a href="https://www.facebook.com/sharer/sharer.php?u={{ $u | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="Condividi su Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
      <a href="https://twitter.com/intent/tweet?url={{ $u | urlquery }}&text={{ $t | urlquery }}" target="_blank" rel="noopener noreferrer" aria-label="Condividi su X"><i class="bi bi-twitter-x" aria-hidden="true"></i></a>
      <a href="mailto:?subject={{ $t | urlquery }}&body={{ printf "%s\n%s" $t $u | urlquery }}" aria-label="Condividi via email"><i class="bi bi-envelope-fill" aria-hidden="true"></i></a>
      <button type="button" data-dossier-copy="{{ $u }}" aria-label="Copia il link"><i class="bi bi-link-45deg" aria-hidden="true"></i><span class="dossier-share__copied">Copiato!</span></button>
      <button type="button" data-dossier-share aria-label="Condividi con altre app"><i class="bi bi-three-dots" aria-hidden="true"></i></button>
    </div>
  </section>
</article>
<script src="{{ "js/dossier.js" | relURL }}?v={{ readFile "static/js/dossier.js" | hash.FNV32a }}" defer></script>
{{ end }}
