{{ define "main" }}
<div class="page-hero">
  <div class="container">
    {{ partial "breadcrumb.html" . }}
    <h1>{{ .Title }}</h1>
  </div>
</div>
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="list-intro-content">{{ .Content }}</div>

      <div class="dossier-list-grid">
        {{ range .Pages.ByDate.Reverse }}
        <a class="dossier-card" href="{{ .RelPermalink }}">
          <div class="dossier-card__media">
            {{ with .Params.image }}<img src="{{ . | strings.TrimPrefix "/" | relURL }}" alt="{{ $.Title | default "Dossier interattivo" }}" loading="lazy">{{ end }}
            <span class="dossier-card__tag"><i class="bi bi-collection-play" aria-hidden="true"></i> Dossier interattivo</span>
          </div>
          <div class="dossier-card__body">
            <h2 class="dossier-card__title">{{ .Title }}</h2>
            <p class="dossier-card__desc">{{ .Description }}</p>
            <span class="dossier-card__cta">Apri il dossier <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
          </div>
        </a>
        {{ end }}
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="{{ "css/dossier-list.css" | relURL }}?v={{ readFile "static/css/dossier-list.css" | hash.FNV32a }}">
{{ end }}
