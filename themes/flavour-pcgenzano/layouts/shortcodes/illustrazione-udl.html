{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $caption := .Get "caption" -}}
{{- if or (not $src) (not $alt) -}}
  {{- errorf "illustrazione-udl: src e alt obbligatori in %s" .Page.File.Path -}}
{{- end -}}
{{- $href := $src | strings.TrimPrefix "/" | relURL -}}
<figure class="figure my-4 w-100 text-center">
  <a href="{{ $href }}" target="_blank" rel="noopener noreferrer" class="d-block w-100" aria-label="Apri l'illustrazione a grandezza naturale in una nuova scheda: {{ $alt }}">
    <img src="{{ $href }}" width="1200" height="620" alt="{{ $alt }}" loading="lazy" decoding="async" class="figure-img img-fluid rounded border" style="display:block;width:100%;height:auto;">
  </a>
  {{- with $caption }}
  <figcaption class="figure-caption mt-2">{{ . | markdownify }}</figcaption>
  {{- end }}
  <p class="small mt-2 mb-0 d-print-none"><a href="{{ $href }}" target="_blank" rel="noopener noreferrer">Apri l'illustrazione per ingrandirla</a></p>
</figure>
